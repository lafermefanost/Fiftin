# Règles Firestore (firestore.rules).
#
# Automatique à chaque mise à jour de main qui touche les règles : déploie
# UNIQUEMENT si les règles actuellement en production sont exactement la
# version précédente connue (firestore.rules.baseline s'il existe, sinon la
# version précédente de firestore.rules dans git). Si quelqu'un a modifié les
# règles directement dans la console Firebase entre-temps, rien n'est déployé :
# le job échoue et affiche les différences. Un déploiement remplace TOUTES les
# règles (outil compris), d'où cette garde.
#
# À la main (Actions → Règles Firestore → Run workflow) :
#   mode "verifier" : affiche le diff production ↔ dépôt, sans rien changer ;
#   mode "deployer" : remplace les règles en production par firestore.rules.
#
# Secret requis : FIREBASE_SERVICE_ACCOUNT (le même que pour les fonctions).
name: Règles Firestore

on:
  push:
    branches: [main]
    paths: ["firestore.rules", "firestore.rules.baseline", ".github/workflows/deploy-rules.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "verifier (comparaison seule) ou deployer"
        required: true
        default: verifier
        type: choice
        options: [verifier, deployer]

concurrency:
  group: deploy-rules
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Règles en production
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          API=https://firebaserules.googleapis.com/v1
          NAME=$(curl -sSf -H "Authorization: Bearer $TOKEN" "$API/projects/fiftin-e30c2/releases/cloud.firestore" | jq -r .rulesetName)
          echo "Règles en production : $NAME"
          curl -sSf -H "Authorization: Bearer $TOKEN" "$API/$NAME" | jq -r '.source.files[0].content' > live.rules
          echo "=== Différences production (-) / dépôt (+) ==="
          diff -u -w -B live.rules firestore.rules || true
      - name: Décision (mise à jour de main)
        id: decide
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if diff -q -w -B live.rules firestore.rules >/dev/null; then
            echo "Production déjà à jour : rien à déployer."; echo "deploy=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -f firestore.rules.baseline ]; then cp firestore.rules.baseline previous.rules; echo "Référence : firestore.rules.baseline"
          elif git show "$BEFORE:firestore.rules" > previous.rules 2>/dev/null; then echo "Référence : firestore.rules avant ce push"
          else echo "Aucune version précédente connue : déploiement refusé."; exit 1; fi
          if diff -q -w -B live.rules previous.rules >/dev/null; then
            echo "Production = version précédente connue : déploiement."; echo "deploy=yes" >> "$GITHUB_OUTPUT"
          else
            echo "=== La production diffère de la version précédente connue (modifiée dans la console ?) — AUCUN déploiement ==="
            diff -u -w -B previous.rules live.rules || true
            exit 1
          fi
      - name: Déploiement
        if: (github.event_name == 'push' && steps.decide.outputs.deploy == 'yes') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deployer')
        run: npx --yes firebase-tools@13.29.1 deploy --only firestore:rules --project fiftin-e30c2 --non-interactive
