# Déploie les Cloud Functions (functions/) à chaque mise à jour de main qui
# les touche — remplace le "firebase deploy --only functions" à lancer à la
# main. Le site (HTML) reste servi par GitHub Pages, indépendamment.
#
# Secret requis (GitHub → Settings → Secrets and variables → Actions) :
#   FIREBASE_SERVICE_ACCOUNT : contenu JSON complet de la clé du compte de
#   service github-deploy (projet fiftin-e30c2). Ne jamais le mettre ailleurs.
#
# Pas de --force : si le déploiement devait SUPPRIMER une fonction présente
# en production mais absente du code, il échoue au lieu de la supprimer.
name: Déploiement des fonctions Firebase

on:
  push:
    branches: [main]
    paths: ["functions/**", "firebase.json", ".firebaserc", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dépendances des fonctions
        run: npm ci
        working-directory: functions
      - name: Tests iCal
        run: node functions/ical.test.js
      # Prix Séjours calculés depuis Planning : parité avec les fonctions de
      # l'outil (app/index.html), jour par jour sur 12 mois.
      - name: Tests des prix (parité avec l'outil)
        run: node functions/pricing.test.js
      # Action officielle Google : écrit la clé dans un fichier temporaire
      # du runner, positionne GOOGLE_APPLICATION_CREDENTIALS, et l'efface en
      # fin de job. La clé n'est jamais affichée dans les journaux (GitHub
      # masque les secrets). Ne se déclenche que sur main ou à la main,
      # jamais sur une pull request venue d'un fork (aucun accès au secret).
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Déploiement
        run: npx --yes firebase-tools@13.29.1 deploy --only functions --project fiftin-e30c2 --non-interactive
