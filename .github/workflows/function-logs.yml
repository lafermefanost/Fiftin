# Journaux des fonctions — LECTURE SEULE (diagnostic).
#
# Affiche les dernières entrées de journal (erreurs et avertissements) des
# fonctions listées dans FUNCS. Ne crée, ne modifie et ne supprime rien.
# Se lance quand ce fichier change sur main, ou à la main.
#
# Secret requis : FIREBASE_SERVICE_ACCOUNT (le même que pour les fonctions).
name: Journaux des fonctions

on:
  push:
    branches: [main]
    paths: [".github/workflows/function-logs.yml"]
  workflow_dispatch:

env:
  FUNCS: "availsharegeturl availshare icalgetexporturl"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Journaux
        run: |
          for f in $FUNCS; do
            echo "=== $f ==="
            gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$f\"" \
              --project=fiftin-e30c2 --freshness=1d --limit=15 \
              --format="value(timestamp,severity,logName.basename(),httpRequest.status,httpRequest.requestMethod,textPayload,jsonPayload.message)" || true
          done
          echo "=== Rôle IAM invoker des deux fonctions ==="
          for f in availsharegeturl availshare icalgetexporturl; do
            echo "--- $f"; gcloud run services get-iam-policy $f --region=us-central1 --project=fiftin-e30c2 --format="value(bindings)" || true
          done
      - name: En-têtes CORS (sans connexion, aucune donnée)
        run: |
          for f in availShareGetUrl icalGetExportUrl; do
            echo "=== $f : OPTIONS ==="
            curl -s -o /dev/null -D - -X OPTIONS -H "Origin: https://fiftin.fr" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,authorization" "https://us-central1-fiftin-e30c2.cloudfunctions.net/$f" | grep -i "^HTTP\|access-control" || true
            echo "=== $f : POST sans connexion ==="
            curl -s -D - -X POST -H "Origin: https://fiftin.fr" -H "Content-Type: application/json" --data '{"data":{}}' "https://us-central1-fiftin-e30c2.cloudfunctions.net/$f" | grep -i "^HTTP\|access-control\|error" || true
          done
