<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&family=Fraunces:ital,wght@1,400;1,500&display=swap');

:root{
  --cream:#EFEEEA; --cream-deep:#E4E1D9; --ink:#2E2B22;
  --sauge:#354B38; --sauge-deep:#1D2820; --sauge-light:#8B9D86; --sauge-mid:#4E6F53;
  --lavender:#7B94E8; --lavender-bg:#E7E9F1; --lavender-soft:#B2BBDA; --lavender-deep:#4E67BC; --lavender-icon:#829AD0;
  --yellow:#DEEB82; --yellow-deep:#C7D65E;
  --line:rgba(46,43,34,0.14);
  --danger:#B2543B;
  --gray-mid:#9A9789;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'Jost',-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
  padding-left:max(0px, env(safe-area-inset-left)); padding-right:max(0px, env(safe-area-inset-right));
  display:flex; justify-content:center;
}
#app{width:100%; max-width:520px; min-height:100%; position:relative; background:var(--cream);
  box-shadow:0 0 60px rgba(29,40,32,0.08);}
img{max-width:100%;}
[hidden]{display:none!important;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}

.claim{font-family:'Fraunces',serif; font-style:italic; font-weight:400;}

/* ---------- hero (écran d'accueil, avant le fil) ----------
   Même fond et mesh gradient animé que #siteGate/#lockScreen dans
   app/index.html (blobs lavande/jaune/sauge qui dérivent sur une base
   claire --sauge-light), repris à l'identique pour la cohérence de
   marque. .brand-mesh/.brand-logo sont partagés avec #siteGate plus
   bas, pour que les deux grands écrans de marque matchent vraiment.
   Élément de flux normal (pas position:fixed) : le scroll classique
   du navigateur le fait défiler et découvrir le fil en dessous, sans
   JS de "scroll-hijack". */
#hero{position:relative; min-height:100dvh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; overflow:hidden; background:var(--sauge-light);
  padding:32px 28px; text-align:center;}
.brand-mesh{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
.brand-mesh .blob{position:absolute; border-radius:50%; filter:blur(60px);}
.brand-mesh .b1{width:63vh; height:63vh; background:var(--lavender);
  top:-18%; left:-12%; animation:brandDrift1 18s ease-in-out infinite;}
.brand-mesh .b2{width:57vh; height:57vh;
  background:radial-gradient(circle at 50% 45%,#fff 0%,var(--yellow) 42%,transparent 76%);
  filter:blur(38px); top:6%; right:-16%; animation:brandDrift2 21s ease-in-out infinite -6s;}
.brand-mesh .b3{width:72vh; height:72vh; background:var(--sauge-deep); filter:blur(54px) saturate(1.2);
  bottom:-24%; left:7%; animation:brandDrift3 19s ease-in-out infinite -11s;}
@keyframes brandDrift1{
  0%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.58;}
  25%{transform:translate(16%,9%) scale(1.35,.68) rotate(18deg); opacity:.7;}
  50%{transform:translate(21%,14%) scale(1.1,1.3) rotate(-10deg); opacity:.78;}
  75%{transform:translate(-9%,17%) scale(.7,.92) rotate(6deg); opacity:.38;}
  100%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.58;}}
@keyframes brandDrift2{
  0%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.62;}
  20%{transform:translate(-12%,9%) scale(1.35,.6) rotate(-20deg); opacity:.5;}
  40%{transform:translate(-18%,15%) scale(.68,.72) rotate(0deg); opacity:.4;}
  58%{transform:translate(3%,-4%) scale(.62,1.55) rotate(16deg); opacity:.6;}
  75%{transform:translate(13%,-12%) scale(1.35,1.3) rotate(0deg); opacity:.88;}
  100%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.62;}}
@keyframes brandDrift3{
  0%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.76;}
  28%{transform:translate(13%,-9%) scale(1.4,.75) rotate(12deg); opacity:.8;}
  50%{transform:translate(16%,-17%) scale(1.05,1.3) rotate(-8deg); opacity:.85;}
  75%{transform:translate(-11%,11%) scale(.78,.92) rotate(0deg); opacity:.58;}
  100%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.76;}}
.brand-grain{position:absolute; inset:0; opacity:.12; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
.brand-logo{position:relative; z-index:2; border-radius:26px; border:1.5px solid rgba(255,255,255,.38);
  display:flex; align-items:center; justify-content:center; overflow:hidden;}
.brand-logo img{width:59%; height:auto; display:block;}
#hero .hero-content{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:16px;}
#hero .hero-logo{width:96px; height:96px;}
#hero .hero-brand{font-family:'Jost',sans-serif; font-weight:700; font-size:30px; letter-spacing:-0.01em;
  color:var(--cream); margin:0;}
#hero .hero-tagline{font-family:'Jost',sans-serif; font-weight:700; font-size:27px; line-height:1.25;
  letter-spacing:-0.01em; color:var(--cream); max-width:320px; margin:0;}
#hero .hero-tagline em{font-style:italic; font-weight:700;}
#hero .hero-scroll{position:absolute; bottom:calc(28px + env(safe-area-inset-bottom,0px)); left:0; right:0; z-index:2;
  display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none;
  color:rgba(239,238,234,.8); font-family:'Jost',sans-serif; font-size:11px; text-transform:uppercase;
  letter-spacing:.08em; font-weight:600; animation:heroBounce 2.2s ease-in-out infinite;}
#hero .hero-scroll svg{width:18px; height:18px;}
@keyframes heroBounce{0%,100%{transform:translateY(0);} 50%{transform:translateY(7px);}}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:80;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;
  background:rgba(239,238,234,0.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand{display:flex; align-items:center; gap:12px;}
.logo-tile{width:56px; height:56px; border-radius:14px; flex-shrink:0; overflow:hidden;}
.logo-tile img{width:100%; height:100%; display:block; object-fit:cover;}
.hdr-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); background:var(--cream);
  display:flex; align-items:center; justify-content:center; position:relative; color:var(--ink);}
.icon-btn svg{width:18px; height:18px;}
.badge-count{position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; font-size:10px;
  font-weight:700; border-radius:50%; width:17px; height:17px; display:flex; align-items:center; justify-content:center;}

/* ---------- filter bar ---------- */
.filters{position:sticky; top:calc(64px + env(safe-area-inset-top,0px)); z-index:70;
  background:var(--cream); border-bottom:1px solid var(--line);
  padding:10px 18px 12px; display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
.chip{flex-shrink:0; padding:8px 15px; border-radius:20px; border:1.5px solid var(--line);
  background:var(--cream); font-size:12.5px; font-weight:600; color:var(--ink);
  display:flex; align-items:center; gap:6px; white-space:nowrap; transition:all .15s;}
.chip svg{width:13px; height:13px; opacity:.65;}
.chip.active{background:var(--sauge-deep); color:var(--cream); border-color:var(--sauge-deep);}
.chip .n{background:var(--yellow); color:var(--sauge-deep); border-radius:10px; padding:1px 6px; font-size:10.5px; font-weight:800;}

.result-line{padding:14px 18px 4px; font-size:12.5px; color:var(--sauge); font-weight:600; letter-spacing:.02em;}

/* ---------- feed ---------- */
#feed{padding:10px 11px 100px; display:flex; flex-direction:column; gap:18px;}
.card{border-radius:26px; overflow:hidden; background:var(--sauge-deep); position:relative;}
.cover{position:relative; aspect-ratio:4/5; overflow:hidden;}
.cover .grad{position:absolute; inset:0;}
.cover .cover-carousel{position:absolute; inset:0; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; z-index:1;}
.cover .cover-carousel .cc-slide{min-width:100%; height:100%; object-fit:cover; scroll-snap-align:start; flex-shrink:0;}
.cover .cover-dots{position:absolute; top:58px; left:0; right:0; z-index:5; display:flex; justify-content:center; gap:5px;}
.cover .cover-dots span{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.5);}
.cover .cover-dots span.on{background:#fff; width:16px; border-radius:3px;}
.cover .grain{position:absolute; inset:0; opacity:.5; mix-blend-mode:overlay; z-index:2; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
.cover .scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(29,40,32,0) 38%, rgba(20,26,20,.86) 100%); z-index:2; pointer-events:none;}
.cover .motif{position:absolute; opacity:.16; color:#fff; z-index:1;}
.cover .motif svg{width:100%; height:100%;}
.save-btn{position:absolute; top:14px; right:14px; z-index:5; width:38px; height:38px; border-radius:50%;
  background:rgba(20,26,20,0.35); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.25);
  display:flex; align-items:center; justify-content:center;}
.save-btn svg{width:18px; height:18px; stroke:#fff; fill:none; stroke-width:1.8; transition:all .15s;}
.save-btn.liked svg{fill:var(--danger); stroke:var(--danger);}
.top-badges{position:absolute; top:14px; left:14px; z-index:5; display:flex; gap:6px;}
.pill-badge{background:rgba(20,26,20,0.4); backdrop-filter:blur(6px); color:#fff; font-size:11px; font-weight:600;
  padding:5px 10px; border-radius:14px; border:1px solid rgba(255,255,255,.2);}
.cover-info{position:absolute; left:0; right:0; bottom:0; z-index:4; padding:18px 18px 16px; color:var(--cream);}
.cover-info .region{font-size:11px; text-transform:uppercase; letter-spacing:.12em; font-weight:600; color:var(--yellow); margin-bottom:6px;}
.cover-info h2{font-family:'Jost',sans-serif; font-weight:700; font-size:26px; line-height:1.08; margin:0 0 6px; letter-spacing:-0.01em;}
.cover-info .tagline{font-size:14.5px; color:rgba(245,240,229,.88); margin:0 0 14px; max-width:88%;}
.cover-cta{display:flex; gap:8px;}
.btn{border:none; border-radius:16px; font-family:'Jost',sans-serif; font-weight:700; font-size:13.5px;
  padding:11px 16px; display:flex; align-items:center; justify-content:center; gap:6px;}
.btn.primary{background:var(--yellow); color:var(--sauge-deep); flex:1;}
.btn.ghost-dark{background:rgba(245,240,229,0.14); color:var(--cream); border:1.5px solid rgba(245,240,229,.4);}
.price-tag b{font-size:15px;}

/* ---------- quick request inline panel ---------- */
.qr-panel{background:var(--cream-deep); padding:16px; display:flex; flex-direction:column; gap:12px;}
.cal{background:var(--cream); border:1.5px solid var(--line); border-radius:14px; padding:12px;}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.cal-title{font-size:13.5px; font-weight:700; text-transform:capitalize;}
.cal-nav{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line); background:var(--cream);
  font-size:17px; color:var(--sauge-deep); display:flex; align-items:center; justify-content:center; line-height:1; padding:0;}
.cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px;}
.cal-weekdays span{text-align:center; font-size:10px; font-weight:700; color:var(--gray-mid); text-transform:uppercase;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
.cal-cell{aspect-ratio:1; border:none; border-radius:8px; background:none; font-family:'Jost',sans-serif;
  font-size:12px; font-weight:600; color:rgba(46,43,34,.28); display:flex; align-items:center; justify-content:center;}
.cal-cell.empty{visibility:hidden;}
.cal-cell.avail{background:var(--yellow); color:var(--sauge-deep); cursor:pointer;}
.cal-cell.avail.selected{background:var(--sauge-deep); color:var(--cream);}
.cal-legend{display:flex; align-items:center; gap:6px; margin-top:10px; font-size:10.5px; color:var(--gray-mid);}
.cal-dot{width:8px; height:8px; border-radius:50%; background:rgba(46,43,34,.15); display:inline-block;}
.cal-dot.avail{background:var(--yellow);}
.qr-row{display:flex; gap:10px;}
.qr-field{flex:1; display:flex; flex-direction:column; gap:4px;}
.qr-field label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--sauge);}
.qr-field input{border:1.5px solid var(--line); border-radius:12px; padding:9px 10px; font-family:'Jost',sans-serif;
  font-size:13.5px; background:var(--cream); color:var(--ink);}
.stepper{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:12px; background:var(--cream); overflow:hidden;}
.stepper button{background:none; border:none; width:32px; height:36px; font-size:16px; font-weight:700; color:var(--sauge);}
.stepper span{flex:1; text-align:center; font-weight:700; font-size:13.5px;}
.msg-preview{background:var(--cream); border:1.5px dashed var(--line); border-radius:12px; padding:10px 12px;
  font-size:12px; line-height:1.5; color:var(--ink); opacity:.85;}
.send-row{display:flex; gap:8px;}
.send-btn{flex:1; flex-direction:column; gap:4px; padding:10px 6px; border-radius:14px; font-size:11px; font-weight:700;}
.send-btn svg{width:17px; height:17px;}
.send-btn.wa{background:#e9f3ea; color:#2f5c33;}
.send-btn.sms{background:var(--lavender-bg); color:#3c4c99;}
.send-btn.call{background:#fbe9e2; color:#8a3d24;}

/* ---------- filter sheet ---------- */
.sheet-backdrop{position:fixed; inset:0; background:rgba(20,26,20,.5); z-index:150;
  display:flex; align-items:flex-end; justify-content:center;}
.sheet-backdrop > .frame{width:100%; max-width:520px;}
.sheet{background:var(--cream); border-radius:26px 26px 0 0; padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:82vh; overflow-y:auto; box-shadow:0 -20px 50px rgba(0,0,0,.25);}
.sheet-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:10px auto 16px;}
.sheet h3{font-size:19px; font-weight:700; margin:4px 0 16px;}
.sheet-close{position:absolute; top:16px; right:20px; width:32px; height:32px; border-radius:50%; background:var(--cream-deep);
  display:flex; align-items:center; justify-content:center;}
.field-block{margin-bottom:22px;}
.field-block > label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--sauge); display:block; margin-bottom:10px;}
.range-value{display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:6px;}
input[type=range]{width:100%; accent-color:var(--sauge-deep);}
.amenity-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.amenity-chip{border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; font-size:12.5px; font-weight:600;
  display:flex; align-items:center; gap:8px;}
.amenity-chip.active{background:var(--sauge-deep); color:var(--cream); border-color:var(--sauge-deep);}
.amenity-chip svg{width:15px; height:15px; flex-shrink:0;}
.text-input{width:100%; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; font-family:'Jost',sans-serif;
  font-size:14px; background:var(--cream-deep); color:var(--ink);}
.sort-row{display:flex; flex-direction:column; gap:8px;}
.radio-row{display:flex; align-items:center; gap:10px; padding:11px 14px; border:1.5px solid var(--line); border-radius:14px; font-size:13.5px; font-weight:600;}
.radio-row.active{border-color:var(--sauge-deep); background:var(--sauge-deep); color:var(--cream);}
.sheet-apply{position:sticky; bottom:0; background:var(--cream); padding-top:10px;}
.btn-apply{width:100%; background:var(--sauge-deep); color:var(--cream); padding:15px; border-radius:16px; font-weight:700; font-size:14.5px; border:none;}

/* ---------- detail sheet ---------- */
.detail{position:fixed; inset:0; z-index:200; background:var(--cream); overflow-y:auto; max-width:520px; margin:0 auto;}
.detail-gallery{position:relative; height:340px; overflow-x:auto; display:flex; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;}
.detail-gallery .slide{min-width:100%; height:100%; scroll-snap-align:start; position:relative; overflow:hidden;}
.detail-back{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); left:14px; z-index:10; width:38px; height:38px;
  border-radius:50%; background:rgba(20,26,20,0.4); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;}
.detail-back svg{width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2;}
.detail-save{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; z-index:10;}
.dots{position:absolute; bottom:14px; left:0; right:0; display:flex; justify-content:center; gap:5px; z-index:5;}
.dots span{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.5);}
.dots span.on{background:#fff; width:16px; border-radius:3px;}
.detail-body{padding:22px 20px 140px;}
.detail-body .region{font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--sauge);}
.detail-body h1{font-size:28px; font-weight:700; margin:6px 0 8px; letter-spacing:-0.01em;}
.detail-body .tagline{font-size:16px; margin:0 0 18px; color:var(--sauge-deep);}
.meta-row{display:flex; gap:18px; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:18px;}
.meta-item{display:flex; flex-direction:column; gap:2px;}
.meta-item b{font-size:15px;}
.meta-item span{font-size:11px; color:var(--sauge); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
.google-link{display:inline-flex; align-items:center; gap:7px; padding:9px 14px; margin:-6px 0 18px; border-radius:20px;
  border:1.5px solid var(--line); font-size:13px; font-weight:600; color:var(--ink);}
.google-link svg{width:15px; height:15px; color:var(--yellow-deep); flex-shrink:0;}
.google-link svg.ext{width:12px; height:12px; color:var(--gray-mid); margin-left:2px;}
.detail-body p.desc{font-size:14.5px; line-height:1.65; color:#4a4636; margin:0 0 24px;}
.section-title{font-size:15px; font-weight:700; margin:0 0 14px;}
.amenity-list{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-bottom:26px;}
.amenity-list li{list-style:none; display:flex; align-items:center; gap:8px; font-size:13.5px;}
.amenity-list svg{width:16px; height:16px; color:var(--sauge); flex-shrink:0;}
.host-card{display:flex; align-items:center; gap:12px; background:var(--cream-deep); border-radius:18px; padding:14px; margin-bottom:26px;}
.host-avatar{width:46px; height:46px; border-radius:50%; background:var(--lavender); color:#fff; display:flex;
  align-items:center; justify-content:center; font-weight:700; font-size:17px; flex-shrink:0;}
.host-info b{display:block; font-size:14.5px;}
.host-info span{font-size:12px; color:var(--sauge); font-weight:600;}
.avail-row{display:flex; gap:7px; overflow-x:auto; margin-bottom:8px;}
.avail-chip{flex-shrink:0; font-size:11.5px; font-weight:700; padding:7px 11px; border-radius:12px; background:var(--yellow); color:var(--sauge-deep);}

.detail-contact-bar{position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; z-index:210;
  background:var(--cream); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 24px rgba(0,0,0,.08);}

/* ---------- bottom nav ---------- */
nav.tabbar{position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; z-index:90;
  background:rgba(239,238,234,0.94); backdrop-filter:blur(10px); border-top:1px solid var(--line);
  display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; background:none; border:none; color:var(--sauge-light); position:relative;}
.tab svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7;}
.tab span{font-size:10px; font-weight:700;}
.tab.active{color:var(--sauge-deep);}
.tab.active svg{fill:var(--sauge-deep); stroke:var(--sauge-deep);}
.tab .badge{position:absolute; top:2px; right:22%; background:var(--danger); color:#fff; font-size:9px; font-weight:800;
  border-radius:50%; width:15px; height:15px; display:flex; align-items:center; justify-content:center;}

/* ---------- map view ---------- */
.map-view{padding:16px 18px 110px;}
.map-canvas{position:relative; aspect-ratio:3/4; border-radius:24px; overflow:hidden; background:
  radial-gradient(circle at 20% 25%, #a9c0a3 0%, transparent 45%),
  radial-gradient(circle at 80% 20%, var(--lavender-bg) 0%, transparent 50%),
  radial-gradient(circle at 50% 80%, #d8cba6 0%, transparent 45%), var(--cream-deep);
  margin-bottom:18px;}
.map-pin{position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; gap:2px;}
.map-pin .dot{width:30px; height:30px; border-radius:50% 50% 50% 0; background:var(--sauge-deep); transform:rotate(-45deg);
  display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,.25);}
.map-pin .dot span{transform:rotate(45deg); color:var(--yellow); font-size:11px; font-weight:800;}
.map-pin.liked .dot{background:var(--danger);}
.map-list{display:flex; flex-direction:column; gap:10px;}
.map-list-item{display:flex; align-items:center; gap:12px; background:var(--cream-deep); border-radius:16px; padding:10px 12px;}
.map-list-item .sw{width:44px; height:44px; border-radius:12px; flex-shrink:0;}
.map-list-item b{font-size:13.5px; display:block;}
.map-list-item span{font-size:11.5px; color:var(--sauge); font-weight:600;}

/* ---------- profile ---------- */
.profile-view{padding:24px 20px 110px;}
.profile-head{display:flex; align-items:center; gap:14px; margin-bottom:26px;}
.profile-avatar{width:60px; height:60px; border-radius:50%; background:var(--sauge-deep); color:var(--cream);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:22px;}
.profile-stats{display:flex; gap:10px; margin-bottom:26px;}
.stat-tile{flex:1; background:var(--cream-deep); border-radius:16px; padding:14px; text-align:center;}
.stat-tile b{display:block; font-size:22px; font-weight:800; color:var(--sauge-deep);}
.stat-tile span{font-size:11px; color:var(--sauge); font-weight:600;}
.profile-list{display:flex; flex-direction:column; gap:2px; border-top:1px solid var(--line);}
.profile-row{display:flex; align-items:center; justify-content:space-between; padding:15px 2px; border-bottom:1px solid var(--line); font-size:14px; font-weight:600;}
.profile-row svg{width:16px; height:16px; opacity:.5;}

.empty-state{text-align:center; padding:60px 30px; color:var(--sauge);}
.empty-state svg{width:44px; height:44px; margin-bottom:14px; opacity:.4;}
.empty-state p{font-size:14px; font-weight:600; margin:0;}

  if(saved.liked) state.liked = saved.liked;

function persist(){ try{ localStorage.setItem("fiftin_state", JSON.stringify({filters:state.filters, sort:state.sort, liked:state.liked})); }catch(e){} }

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function filteredListings(){
  var f = state.filters;
  var list = LISTINGS.filter(function(l){
    if(f.q && (l.region.toLowerCase().indexOf(f.q.toLowerCase())===-1 && l.name.toLowerCase().indexOf(f.q.toLowerCase())===-1)) return false;
    if(l.distance > f.distance) return false;
    if(l.price > f.price) return false;
    if(f.amen.length && !f.amen.every(function(a){ return l.amen.indexOf(a)!==-1; })) return false;
    return true;
  });
  if(state.tab==="likes") list = list.filter(function(l){ return state.liked.indexOf(l.id)!==-1; });
  if(state.sort==="price_asc") list = list.slice().sort(function(a,b){ return a.price-b.price; });
  else if(state.sort==="distance") list = list.slice().sort(function(a,b){ return a.distance-b.distance; });
  else if(state.sort==="price_desc") list = list.slice().sort(function(a,b){ return b.price-a.price; });
  return list;
}

/* ---------------- calendrier de disponibilité ----------------
   Démo uniquement : dates lues depuis l.avail (chaînes statiques du
   jeu de données mock), pas de connexion au vrai planning. Voir la
   note dans CLAUDE.md sur le lien avec app/ — pas encore construit. */
var MONTH_ABBR = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var MONTH_LONG = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var DEMO_YEAR = 2026;

function parseAvailStr(str){
  var m = str.match(/^(\d+)(?:\s+([a-zéû.]+))?-(\d+)\s+([a-zéû.]+)$/i);
  if(!m) return null;
  var startMonth = MONTH_ABBR.indexOf(m[2] || m[4]);
  var endMonth = MONTH_ABBR.indexOf(m[4]);
  if(startMonth===-1 || endMonth===-1) return null;
  return {start:new Date(DEMO_YEAR,startMonth,Number(m[1])), end:new Date(DEMO_YEAR,endMonth,Number(m[3]))};
}
function getAvailRanges(l){
  return (l.avail||[]).map(parseAvailStr).filter(Boolean);
}
function isDateAvailable(l, date){
  return getAvailRanges(l).some(function(r){ return date>=r.start && date<=r.end; });
}
function defaultMonthFor(l){
  var ranges = getAvailRanges(l);
  if(!ranges.length) return new Date().getMonth();
  return ranges.reduce(function(min,r){ return r.start.getMonth()<min ? r.start.getMonth() : min; }, 11);
}
function calendarGridHtml(l, monthIndex){
  var first = new Date(DEMO_YEAR, monthIndex, 1);
  var startWeekday = (first.getDay()+6)%7;
  var daysInMonth = new Date(DEMO_YEAR, monthIndex+1, 0).getDate();
  var cells = "";
  for(var i=0;i<startWeekday;i++) cells += '<span class="cal-cell empty"></span>';
  for(var d=1; d<=daysInMonth; d++){
    var avail = isDateAvailable(l, new Date(DEMO_YEAR, monthIndex, d));
    cells += '<button type="button" class="cal-cell'+(avail?' avail':'')+'"'+(avail?' data-day="'+d+'"':' disabled')+'>'+d+'</button>';
  }
  return cells;
}
function calendarHtml(l, monthIndex, uid){
  return '<div class="cal" data-cal-listing="'+uid+'" data-cal-month="'+monthIndex+'">'+
    '<div class="cal-head">'+
      '<button type="button" class="cal-nav" data-cal-nav="-1" aria-label="Mois précédent">&#8249;</button>'+
      '<span class="cal-title">'+MONTH_LONG[monthIndex]+' '+DEMO_YEAR+'</span>'+
      '<button type="button" class="cal-nav" data-cal-nav="1" aria-label="Mois suivant">&#8250;</button>'+
    '</div>'+
    '<div class="cal-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>'+
    '<div class="cal-grid">'+calendarGridHtml(l, monthIndex)+'</div>'+
    '<div class="cal-legend"><span class="cal-dot avail"></span>Disponible<span class="cal-dot"></span>Indisponible</div>'+
  '</div>';
}

  '</div>';
}

function buildMessage(l, din, dout, guests){
  return "Bonjour "+l.host.name+", je suis intéressé·e par \""+l.name+"\" ("+l.region+") du "+fmtDate(din)+" au "+fmtDate(dout)+" pour "+guests+" voyageur"+(guests>1?"s":"")+". Ce logement est-il disponible sur ces dates ? Merci ! — via Fiftin";
}
function fmtDate(iso){
  var d = new Date(iso+"T00:00:00");
  var mois = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  return d.getDate()+" "+mois[d.getMonth()];
}

function wireQuickReq(id, uid){
  var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
  var qid = uid;
  var $in = document.getElementById(qid+"-in"), $out = document.getElementById(qid+"-out"), $g = document.getElementById(qid+"-g");
  var $prev = document.getElementById(qid+"-preview");
  var $waBtn = document.querySelector('[data-send="wa"][data-id="'+qid+'"]');
  var $smsBtn = document.querySelector('[data-send="sms"][data-id="'+qid+'"]');
  var $callBtn = document.querySelector('[data-send="call"][data-id="'+qid+'"]');

  function update(){
    var guests = Number($g.textContent);
    var msg = buildMessage(l, $in.value, $out.value, guests);
    $prev.textContent = msg;
    var phone = l.host.phone.replace("+","");
    $waBtn.href = "https://wa.me/"+phone+"?text="+encodeURIComponent(msg);
    $smsBtn.href = "sms:"+l.host.phone+(/iPhone|iPad|iPod/.test(navigator.userAgent)? "&":"?") +"body="+encodeURIComponent(msg);
    $callBtn.href = "tel:"+l.host.phone;
  }
  $in.addEventListener("change", update);
  $out.addEventListener("change", update);
  Array.prototype.forEach.call(document.querySelectorAll('.stepper button[data-target="'+qid+'-g"]'), function(btn){
    btn.addEventListener("click", function(){
      var v = Number($g.textContent) + Number(btn.getAttribute("data-step"));
      if(v<1) v=1; if(v>12) v=12;
      $g.textContent = v; update();
    });
  });

  var $cal = document.querySelector('[data-cal-listing="'+qid+'"]');
  function wireCalDays(){
    Array.prototype.forEach.call($cal.querySelectorAll(".cal-cell.avail"), function(cell){
      cell.addEventListener("click", function(){
        var monthIndex = Number($cal.getAttribute("data-cal-month"));
        var day = Number(cell.getAttribute("data-day"));
        var start = new Date(DEMO_YEAR, monthIndex, day);
        var end = new Date(start.getTime()); end.setDate(end.getDate()+7);
        $in.value = start.toISOString().slice(0,10);
        $out.value = end.toISOString().slice(0,10);
        Array.prototype.forEach.call($cal.querySelectorAll(".cal-cell.selected"), function(c){ c.classList.remove("selected"); });
        cell.classList.add("selected");
        update();
      });
    });
  }
  function renderCal(monthIndex){
    $cal.setAttribute("data-cal-month", monthIndex);
    $cal.querySelector(".cal-title").textContent = MONTH_LONG[monthIndex]+" "+DEMO_YEAR;
    $cal.querySelector(".cal-grid").innerHTML = calendarGridHtml(l, monthIndex);
    wireCalDays();
  }
  if($cal){
    Array.prototype.forEach.call($cal.querySelectorAll("[data-cal-nav]"), function(btn){
      btn.addEventListener("click", function(){
        var cur = Number($cal.getAttribute("data-cal-month"));
        var next = cur + Number(btn.getAttribute("data-cal-nav"));
        if(next<0) next = 11; if(next>11) next = 0;
        renderCal(next);
      });
    });
    wireCalDays();
  }
  update();
}

/* ---------------- detail sheet ---------------- */
function openDetail(id){
  var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
  var root = document.getElementById("detail-root");
  var gallery = l.gallery || [];
  var total = Math.max(l.photos, gallery.length);
  var slides = "";
  for(var i=0;i<total;i++){
    if(gallery[i]){
      slides += '<div class="slide"><img src="'+gallery[i]+'" alt="'+esc(l.name)+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"></div>';
      continue;
    }
    slides += '<div class="slide"><div class="grad" style="position:absolute;inset:0;background:'+GRADIENTS[l.grad]+';filter:hue-rotate('+(i*6)+'deg) brightness('+(0.85+i*0.05)+')"></div>'+
      '<div class="grain" style="position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\'><filter id=\'n\'><feTurbulence type=\'fractalNoise\' baseFrequency=\'0.85\' numOctaves=\'2\'/></filter><rect width=\'100%25\' height=\'100%25\' filter=\'url(%23n)\'/></svg>&quot;)"></div></div>';
  }
  var dots = "";
  for(var j=0;j<total;j++) dots += '<span class="'+(j===0?"on":"")+'"></span>';

  root.innerHTML = '<div class="detail" id="detail-panel">'+
    '<div class="detail-gallery" id="detail-gallery">'+slides+
      '<button class="detail-back" id="detail-back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>'+
      '<button class="save-btn detail-save'+(state.liked.indexOf(l.id)!==-1?' liked':'')+'" data-like="'+l.id+'"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 000-7.8z"/></svg></button>'+
      '<div class="dots">'+dots+'</div>'+
    '</div>'+
    '<div class="detail-body">'+
      '<div class="region">'+esc(l.region)+'</div>'+
      '<h1>'+esc(l.name)+'</h1>'+
      '<p class="tagline claim">'+esc(l.claim)+'</p>'+
      '<div class="meta-row"><div class="meta-item"><b>'+l.price+'€</b><span>par nuit</span></div><div class="meta-item"><b>'+l.distance+' km</b><span>de vous</span></div><div class="meta-item"><b>'+l.host.response+'</b><span>de l\'hôte</span></div></div>'+
      (l.googleUrl ? '<a class="google-link" href="'+l.googleUrl+'" target="_blank" rel="noopener">'+
        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6L22 9.3l-5 4.8 1.4 7L12 17.8 5.6 21.1 7 14.1 2 9.3l7.1-.7z"/></svg>'+
        '<span>Voir les avis sur Google</span>'+
        '<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>'+
      '</a>' : '')+
      '<p class="desc">'+esc(l.desc)+'</p>'+
      '<div class="section-title">Prestations</div>'+
      '<ul class="amenity-list">'+l.amen.map(function(a){ return '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">'+AMEN_ICONS[a]+'</svg>'+esc(a)+'</li>'; }).join("")+'</ul>'+
      '<div class="section-title">Créneaux libres (aperçu)</div>'+
      '<div class="avail-row">'+l.avail.map(function(d){ return '<span class="avail-chip">'+d+'</span>'; }).join("")+'</div>'+
      '<div class="section-title" style="margin-top:18px;">Votre hôte</div>'+
      '<div class="host-card"><div class="host-avatar">'+l.host.initial+'</div><div class="host-info"><b>'+l.host.name+'</b><span>'+l.host.response+'</span></div></div>'+
      '<div class="qr-panel" style="border-radius:18px;" id="qr-detail-'+l.id+'">'+quickReqHtml(l, "qrd"+l.id)+'</div>'+
    '</div>'+
    '<div class="detail-contact-bar">'+
      '<div class="send-row">'+
        '<a class="btn send-btn wa" href="https://wa.me/'+l.host.phone.replace("+","")+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm5.8 14.3c-.2.6-1.4 1.2-1.9 1.2-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-5-4.3-5.1-4.5-.2-.2-1.2-1.6-1.2-3.1 0-1.5.8-2.2 1-2.5.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.2.1.3 0 .5-.1.2-.1.3-.3.5-.1.2-.3.3-.4.5-.2.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1.1 2.2 1.4 2.5 1.6.3.2.5.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.8.8.3.1.5.2.5.3.1.2.1.6-.1 1.2z"/></svg><span>WhatsApp</span></a>'+
        '<a class="btn send-btn sms" href="sms:'+l.host.phone+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M7 9h10M7 13h6"/></svg><span>SMS</span></a>'+
        '<a class="btn send-btn call" href="tel:'+l.host.phone+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h3l2 5-2.5 1.5a11 11 0 005 5L15 12l5 2v3a2 2 0 01-2 2A16 16 0 016 5a2 2 0 012-2z"/></svg><span>Appeler</span></a>'+
      '</div>'+
    '</div>'+
  '</div>';

  document.getElementById("detail-back").addEventListener("click", closeDetail);
  root.querySelector("[data-like]").addEventListener("click", function(){
    var idx = state.liked.indexOf(l.id);
    if(idx===-1) state.liked.push(l.id); else state.liked.splice(idx,1);
    persist(); renderLikeBadge(); openDetail(id);
  });
  var gal = document.getElementById("detail-gallery");
  gal.addEventListener("scroll", function(){
    var idx = Math.round(gal.scrollLeft / gal.clientWidth);
    Array.prototype.forEach.call(root.querySelectorAll(".dots span"), function(s,i){ s.classList.toggle("on", i===idx); });
  });
  wireQuickReq(l.id, "qrd"+l.id);
  document.body.style.overflow = "hidden";
}
function closeDetail(){
  document.getElementById("detail-root").innerHTML = "";
  document.body.style.overflow = "";
}

/* ---------------- filter sheet ---------------- */
function openSheet(kind){
  var root = document.getElementById("sheet-root");
  var f = state.filters;
  var inner = "";
  if(kind==="loc"){
    inner = '<h3>Lieu</h3><div class="field-block"><input class="text-input" id="s-loc" placeholder="Région, ville…" value="'+esc(f.q)+'"></div>';
  } else if(kind==="distance"){
    inner = '<h3>Distance</h3><div class="field-block"><div class="range-value"><span>Rayon autour de vous</span><span>'+f.distance+' km</span></div>'+
      '<input type="range" id="s-distance" min="1" max="100" value="'+f.distance+'"></div>';
  } else if(kind==="price"){
    inner = '<h3>Prix</h3><div class="field-block"><div class="range-value"><span>Jusqu\'à</span><span>'+f.price+' € / nuit</span></div>'+
      '<input type="range" id="s-price" min="20" max="300" step="5" value="'+f.price+'"></div>';
  } else if(kind==="amen"){
    inner = '<h3>Prestations</h3><div class="field-block"><div class="amenity-grid">'+ALL_AMENITIES.map(function(a){
      return '<button class="amenity-chip'+(f.amen.indexOf(a)!==-1?' active':'')+'" data-a="'+esc(a)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">'+AMEN_ICONS[a]+'</svg>'+esc(a)+'</button>';
    }).join("")+'</div></div>';
  } else if(kind==="sort"){
    var opts = [["reco","Recommandés"],["distance","Distance croissante"],["price_asc","Prix croissant"],["price_desc","Prix décroissant"]];
    inner = '<h3>Trier</h3><div class="field-block sort-row">'+opts.map(function(o){
      return '<button class="radio-row'+(state.sort===o[0]?' active':'')+'" data-sort="'+o[0]+'">'+o[1]+'</button>';
    }).join("")+'</div>';
  }

  root.innerHTML = '<div class="sheet-backdrop" id="sheet-backdrop"><div class="frame"><div class="sheet" style="position:relative;">'+
    '<button class="sheet-close" id="sheet-close">&times;</button><div class="sheet-handle"></div>'+
    inner+
    '<div class="sheet-apply"><button class="btn-apply" id="sheet-apply">Voir les résultats</button></div>'+
  '</div></div></div>';

  document.getElementById("sheet-backdrop").addEventListener("click", function(e){ if(e.target.id==="sheet-backdrop") closeSheet(); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  document.getElementById("sheet-apply").addEventListener("click", function(){ closeSheet(); persist(); renderFilterBar(); renderFeed(); renderResultLine(); });

  if(kind==="loc"){
    document.getElementById("s-loc").addEventListener("input", function(e){ f.q = e.target.value; });
  } else if(kind==="distance"){
    var $r = document.getElementById("s-distance");
    $r.addEventListener("input", function(){ f.distance = Number($r.value); root.querySelector(".range-value span:last-child").textContent = f.distance+" km"; });
  } else if(kind==="price"){
    var $p = document.getElementById("s-price");
    $p.addEventListener("input", function(){ f.price = Number($p.value); root.querySelector(".range-value span:last-child").textContent = f.price+" € / nuit"; });
  } else if(kind==="amen"){
    Array.prototype.forEach.call(root.querySelectorAll(".amenity-chip"), function(el){
      el.addEventListener("click", function(){
        var a = el.getAttribute("data-a");
        var idx = f.amen.indexOf(a);
        if(idx===-1) f.amen.push(a); else f.amen.splice(idx,1);
        el.classList.toggle("active");
      });
    });
  } else if(kind==="sort"){
    Array.prototype.forEach.call(root.querySelectorAll("[data-sort]"), function(el){
      el.addEventListener("click", function(){ state.sort = el.getAttribute("data-sort"); closeSheet(); persist(); renderFilterBar(); renderFeed(); });
    });
  }
}
function closeSheet(){ document.getElementById("sheet-root").innerHTML = ""; }

/* ---------------- tabs ---------------- */
function renderLikeBadge(){
  var b = document.getElementById("like-badge");
  if(state.liked.length){ b.hidden=false; b.textContent = state.liked.length; } else b.hidden = true;
}

function renderMap(){
  var positions = [[22,20],[62,15],[80,42],[38,38],[55,60],[18,55],[72,72],[40,80]];
  var feed = document.getElementById("feed");
  feed.innerHTML = '<div class="map-view"><div class="map-canvas" id="map-canvas"></div><div class="map-list" id="map-list"></div></div>';
  var canvas = document.getElementById("map-canvas");
  canvas.innerHTML = LISTINGS.map(function(l,i){
    var p = positions[i];
    return '<div class="map-pin'+(state.liked.indexOf(l.id)!==-1?' liked':'')+'" style="left:'+p[0]+'%;top:'+p[1]+'%;" data-pin="'+l.id+'"><div class="dot"><span>'+l.price+'</span></div></div>';
  }).join("");
  document.getElementById("map-list").innerHTML = LISTINGS.map(function(l){
    return '<div class="map-list-item" data-pin-item="'+l.id+'"><div class="sw" style="background:'+GRADIENTS[l.grad]+'"></div><div><b>'+esc(l.name)+'</b><span>'+l.region+' · '+l.price+'€/nuit</span></div></div>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-pin],[data-pin-item]"), function(el){
    el.addEventListener("click", function(){ openDetail(Number(el.getAttribute("data-pin")||el.getAttribute("data-pin-item"))); });
  });
}

function renderProfile(){
  var feed = document.getElementById("feed");
  feed.innerHTML = '<div class="profile-view">'+
    '<div class="profile-head"><div class="profile-avatar">C</div><div><b style="font-size:17px;">Voyageur Fiftin</b><div style="font-size:12.5px;color:var(--sauge);font-weight:600;">Membre depuis 2026</div></div></div>'+
    '<div class="profile-stats"><div class="stat-tile"><b>'+state.liked.length+'</b><span>Envies</span></div><div class="stat-tile"><b>0</b><span>Séjours</span></div><div class="stat-tile"><b>0</b><span>Demandes envoyées</span></div></div>'+
    '<div class="profile-list">'+
      '<div class="profile-row">Mes demandes de disponibilité<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>'+
      '<div class="profile-row">Moyens de contact préférés<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>'+
      '<div class="profile-row">Notifications<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>'+
      '<div class="profile-row">Aide &amp; contact Fiftin<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>'+
    '</div></div>';
}

function switchTab(tab){
  state.tab = tab;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(el){
    el.classList.toggle("active", el.getAttribute("data-tab")===tab);
  });
  var filterBar = document.getElementById("filter-bar");
  var resultLine = document.getElementById("result-line");
  if(tab==="explore" || tab==="likes"){
    filterBar.hidden=false; resultLine.hidden=false;
    renderFilterBar(); renderFeed(); renderResultLine();
  } else {
    filterBar.hidden=true; resultLine.hidden=true;
    if(tab==="map") renderMap(); else renderProfile();
  }
}

Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(el){
  el.addEventListener("click", function(){ switchTab(el.getAttribute("data-tab")); });
});
document.getElementById("btn-search").addEventListener("click", function(){ openSheet("loc"); });
document.getElementById("hero-scroll-btn").addEventListener("click", function(){
  document.querySelector("header.top").scrollIntoView({behavior:"smooth", block:"start"});
});

/* La barre d'onglets (fixed) reste masquée tant que le hero est à l'écran,
   sinon elle se superpose au texte "Scroller pour découvrir" en bas du hero. */
(function(){
  var heroEl = document.getElementById("hero");
  var tabbarEl = document.getElementById("tabbar");
  if(!heroEl || !tabbarEl || !window.IntersectionObserver) return;
  new IntersectionObserver(function(entries){
    tabbarEl.hidden = entries[0].isIntersecting;
  }, {threshold:0.1}).observe(heroEl);
})();

/* ---------------- init ---------------- */
renderFilterBar();
renderFeed();
renderResultLine();
renderLikeBadge();

})();
</script>
</body>
