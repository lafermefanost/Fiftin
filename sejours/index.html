<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&family=Fraunces:ital,wght@1,400;1,500&display=swap');

:root{
  --cream:#EFEEEA; --cream-deep:#E4E1D9; --cream-light:#F7F6F4; --ink:#2E2B22;
  --sauge:#354B38; --sauge-deep:#1D2820; --sauge-light:#8B9D86; --sauge-mid:#4E6F53; --sauge-bg:#E5E9E4;
  --lavender:#7B94E8; --lavender-bg:#E7E9F1; --lavender-soft:#B2BBDA; --lavender-deep:#4E67BC; --lavender-icon:#829AD0;
  --yellow:#DEEB82; --yellow-deep:#C7D65E; --yellow-light:#EFF5C1;
  --line:rgba(46,43,34,0.14);
  --danger:#B2543B;
  --gray-mid:#9A9789;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'Jost',-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
  padding-left:max(0px, env(safe-area-inset-left)); padding-right:max(0px, env(safe-area-inset-right));
  display:flex; justify-content:center; align-items:flex-start;
}
#app{width:100%; max-width:520px; min-height:100%; position:relative; background:var(--cream);
  box-shadow:0 0 60px rgba(29,40,32,0.08);}
img{max-width:100%;}
[hidden]{display:none!important;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}

.claim{font-family:'Fraunces',serif; font-style:italic; font-weight:400;}

/* ---------- hero (écran d'accueil, avant le fil) ----------
   Même fond et mesh gradient animé que #siteGate/#lockScreen dans
   app/index.html (blobs lavande/jaune/sauge qui dérivent sur une base
   claire --sauge-light), repris à l'identique pour la cohérence de
   marque. .brand-mesh/.brand-logo sont partagés avec #siteGate plus
   bas, pour que les deux grands écrans de marque matchent vraiment.
   Élément de flux normal (pas position:fixed) : le scroll classique
   du navigateur le fait défiler et découvrir le fil en dessous, sans
   JS de "scroll-hijack". */
#hero{position:relative; z-index:100; min-height:100dvh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; overflow:hidden; background:var(--sauge-light);
  padding:32px 28px; text-align:center;}
.brand-mesh{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
.brand-mesh .blob{position:absolute; border-radius:50%; filter:blur(60px);}
.brand-mesh .b1{width:63vh; height:63vh; background:var(--lavender);
  top:-18%; left:-12%; animation:brandDrift1 18s ease-in-out infinite;}
.brand-mesh .b2{width:57vh; height:57vh;
  background:radial-gradient(circle at 50% 45%,#fff 0%,var(--yellow) 42%,transparent 76%);
  filter:blur(38px); top:6%; right:-16%; animation:brandDrift2 21s ease-in-out infinite -6s;}
.brand-mesh .b3{width:72vh; height:72vh; background:var(--sauge-deep); filter:blur(54px) saturate(1.2);
  bottom:-24%; left:7%; animation:brandDrift3 19s ease-in-out infinite -11s;}
@keyframes brandDrift1{
  0%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.58;}
  25%{transform:translate(16%,9%) scale(1.35,.68) rotate(18deg); opacity:.7;}
  50%{transform:translate(21%,14%) scale(1.1,1.3) rotate(-10deg); opacity:.78;}
  75%{transform:translate(-9%,17%) scale(.7,.92) rotate(6deg); opacity:.38;}
  100%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.58;}}
@keyframes brandDrift2{
  0%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.62;}
  20%{transform:translate(-12%,9%) scale(1.35,.6) rotate(-20deg); opacity:.5;}
  40%{transform:translate(-18%,15%) scale(.68,.72) rotate(0deg); opacity:.4;}
  58%{transform:translate(3%,-4%) scale(.62,1.55) rotate(16deg); opacity:.6;}
  75%{transform:translate(13%,-12%) scale(1.35,1.3) rotate(0deg); opacity:.88;}
  100%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.62;}}
@keyframes brandDrift3{
  0%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.76;}
  28%{transform:translate(13%,-9%) scale(1.4,.75) rotate(12deg); opacity:.8;}
  50%{transform:translate(16%,-17%) scale(1.05,1.3) rotate(-8deg); opacity:.85;}
  75%{transform:translate(-11%,11%) scale(.78,.92) rotate(0deg); opacity:.58;}
  100%{transform:translate(0,0) scale(1,1) rotate(0deg); opacity:.76;}}
.brand-grain{position:absolute; inset:0; opacity:.12; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
.brand-logo{position:relative; z-index:2; border-radius:26px; border:1.5px solid rgba(255,255,255,.38);
  display:flex; align-items:center; justify-content:center; overflow:hidden;}
.brand-logo img{width:59%; height:auto; display:block;}
#hero .hero-content{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:16px;}
#hero .hero-logo{width:96px; height:96px;}
#hero .hero-brand{font-family:'Jost',sans-serif; font-weight:700; font-size:30px; letter-spacing:-0.01em;
  color:var(--cream); margin:0;}
#hero .hero-tagline{font-family:'Jost',sans-serif; font-weight:700; font-size:27px; line-height:1.25;
  letter-spacing:-0.01em; color:var(--cream); max-width:320px; margin:0;}
#hero .hero-tagline em{font-style:italic; font-weight:700;}
#hero .hero-scroll{position:absolute; bottom:calc(28px + env(safe-area-inset-bottom,0px)); left:0; right:0; z-index:2;
  display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none;
  color:rgba(239,238,234,.8); font-family:'Jost',sans-serif; font-size:11px; text-transform:uppercase;
  letter-spacing:.08em; font-weight:600; animation:heroBounce 2.2s ease-in-out infinite;}
#hero .hero-scroll svg{width:18px; height:18px;}
@keyframes heroBounce{0%,100%{transform:translateY(0);} 50%{transform:translateY(7px);}}
.hero-topbar{position:absolute; top:calc(18px + env(safe-area-inset-top,0px)); left:0; right:0; z-index:3;
  display:flex; justify-content:flex-end; align-items:center; gap:10px; padding:0 20px;}
.hero-menu-link{display:flex; align-items:center; gap:6px; background:rgba(239,238,234,.14);
  border:1.5px solid rgba(239,238,234,.4); border-radius:20px; padding:7px 13px 7px 9px;
  font-family:'Jost',sans-serif; font-size:12px; font-weight:700; letter-spacing:.02em; color:var(--cream);}
.hero-menu-link svg{width:15px; height:15px; flex-shrink:0;}
.hero-menu-link span{text-decoration:underline; text-underline-offset:3px;}

/* ---------- filter bar ---------- */
/* .chrome-collapsed (voir switchTab()) remplace hidden=true/false sur
   .filters et .result-line : hidden bascule en display:none, donc
   #feed (juste en dessous, réutilisé pour Explorer/Carte/Envies/Profil)
   saute instantanément de sa hauteur (~87px) chaque fois qu'on quitte ou
   revient sur Profil — visible et gênant, signalé par l'hôte ("la page
   saute"). max-height+opacity animés à la place : même résultat final,
   mais la réapparition/disparition se voit glisser plutôt que sauter. */
.filters{position:sticky; top:0; z-index:70;
  background:var(--cream); border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 18px 12px; display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  max-height:80px; opacity:1; transition:max-height .22s ease, opacity .18s ease, padding .22s ease, border-color .22s ease;}
.filters.chrome-collapsed{max-height:0; opacity:0; padding-top:0; padding-bottom:0; border-color:transparent;}
/* Fond blanc plutôt que --cream (même couleur que la barre elle-même,
   les cartouches ne se détachaient que par leur contour) — retour
   utilisateur. */
.chip{flex-shrink:0; display:flex; align-items:center; border-radius:16px; border:1.5px solid var(--line);
  background:#fff; white-space:nowrap; transition:all .15s;}
.chip.active{background:var(--sauge-deep); border-color:var(--sauge-deep);}
.chip-tap{display:flex; align-items:center; gap:6px; padding:8px 14px; background:none; border:none;
  font-family:'Jost',sans-serif; font-size:12.5px; font-weight:600; color:var(--ink);}
.chip.active .chip-tap{color:var(--cream);}
.chip-tap svg{width:14px; height:14px; opacity:.7; flex-shrink:0;}
.chip.active .chip-tap svg{opacity:1;}
.chip .n{background:var(--yellow); color:var(--sauge-deep); border-radius:12px; padding:1px 6px; font-size:10.5px; font-weight:800;}
.chip-x{display:flex; align-items:center; justify-content:center; width:24px; height:24px; margin:0 6px 0 -4px;
  border-radius:50%; background:rgba(239,238,234,.25); border:none; color:var(--cream); font-size:15px; line-height:1;
  font-family:'Jost',sans-serif;}
.chip-reset-all{flex-shrink:0; background:none; border:none; padding:8px 4px; font-family:'Jost',sans-serif;
  font-size:12.5px; font-weight:700; color:var(--danger); white-space:nowrap; text-decoration:underline;}

/* text-align:center (retour utilisateur, "pas centré") pour centrer le
   texte du compteur. background:var(--cream) par défaut (= #app, pour les
   vues sans traitement particulier de #feed) posé ICI, sur #result-line
   lui-même — PAS seulement sur .result-pill comme avant : ce dernier
   laissait #result-line transparent (donc le --cream de la page visible
   tout autour), pendant que seul le texte avait le bon fond, créant deux
   zones de couleurs différentes bien visibles ("on dirait une div
   différente du fond" — retour utilisateur). #result-line est un frère
   AVANT #feed dans le DOM (voir plus haut le balisage) : un sélecteur ~ ne
   peut pas lire l'état de #feed depuis ici, #result-line reçoit donc les
   MÊMES classes feed-explore/feed-map que #feed (posées au même endroit,
   switchTab() et le tout premier rendu au boot) pour afficher le même
   fond que #feed sur la vue en cours. feed-explore repasse aussi le
   padding latéral à 0 (comme #feed.feed-explore) : sans ça, le fond blanc
   de #result-line n'aurait couvert que sa largeur intérieure, pas toute
   la largeur de l'écran comme #feed juste en dessous — même souci de
   "div différente" en plus étroit. */
.result-line{padding:14px 18px 4px; max-height:40px; opacity:1; overflow:hidden; text-align:center; background:var(--cream);
  transition:max-height .22s ease, opacity .18s ease, padding .22s ease, background .18s ease;}
.result-line.chrome-collapsed{max-height:0; opacity:0; padding-top:0; padding-bottom:0;}
.result-line.feed-explore{background:#fff; padding-left:0; padding-right:0;}
.result-line.feed-map{background:var(--cream-light);}
/* Retour utilisateur : la pillule (fond + contour) est retirée — simple
   texte souligné, plus discret. */
.result-pill{font-size:12.5px; color:var(--gray-mid); font-weight:600; letter-spacing:.02em; text-decoration:underline;}

/* ---------- feed ---------- */
/* Marge latérale unique pour TOUTES les vues (Explorer/Envies via #feed
   directement, Profil/Espace hôtes via leur propre wrapper à l'intérieur —
   voir .profile-view/.admin-queue/.host-view plus bas, qui n'ajoutent
   volontairement plus de padding latéral à eux : avant, il s'additionnait
   à celui-ci, rendant leurs vignettes/contenus visiblement plus étroits que
   sur Explorer). 11px -> 14px -> 18px : ajustements successifs très légers
   demandés, pour une vision un peu plus aérée — qui se propage donc à
   l'identique partout. La vue "plein écran" Explorer
   (#feed.feed-explore) remet ce padding latéral à 0 volontairement, elle
   reste donc inchangée par ce réglage (sa carte embarquée en tête de fil,
   .explore-map-block, réintroduit sa propre marge — voir plus bas). */
#feed{padding:10px 18px 100px; display:flex; flex-direction:column; gap:18px;}
/* Fil Explorer uniquement (retour utilisateur, "façon feed Instagram") :
   cartes pleine largeur, coins droits, fond blanc pur derrière (pas
   #app/--cream, qui reste tel quel pour la barre de filtres et la barre
   d'onglets — seul #feed change ici) et un espacement resserré entre les
   annonces (18px -> 10px -> 6px, ajustements successifs demandés).
   .cover garde son aspect-ratio 4:5 inchangé, rien d'autre ne bouge
   (typos, dégradé, boutons). Classe posée/retirée sur #feed par
   switchTab() (et le tout premier rendu, au boot) — jamais sur Favoris ni
   la grande vignette de Mes séjours, qui réutilisent .card sans hériter de
   ce style. */
/* padding-top/bottom resserrés (retour utilisateur, "trop de blanc en haut
   et en bas du feed, juste avant les menus") — les 10px/100px hérités de
   #feed de base créaient un vide plat, disproportionné à côté du gap de
   6px entre cartes. padding-bottom recalculé plutôt qu'une valeur fixe
   plus petite : nav.tabbar (fixe, en bas) mesure exactement
   34px (.tab-icon) + 3px (gap) + ~12px (.tab span, 10px/1.2) + 12px
   (.tab, padding 6+6) + 16px (nav.tabbar, padding 8+8) = 77px, plus
   l'encoche de l'appareil (env(safe-area-inset-bottom)) que nav.tabbar
   absorbe déjà dans son propre padding. En dessous de cette valeur, le
   bas de la dernière carte se retrouverait masqué en permanence par la
   barre, même une fois complètement défilé — jamais vérifié avant
   puisque le 100px fixe d'origine ne comptait pas la marge de sécurité
   côté appareil. 85px (77 + 8px de respiration) + l'encoche : réduit le
   vide sur la plupart des appareils, sans jamais recouvrir la carte. */
#feed.feed-explore{padding-left:0; padding-right:0; padding-top:4px; padding-bottom:calc(85px + env(safe-area-inset-bottom, 0px)); gap:6px; background:#fff;}
#feed.feed-explore .card{border-radius:0;}
/* Onglet Carte uniquement (retour utilisateur) : fond derrière la carte/
   la liste distinct de #app/--cream (qui reste tel quel pour la barre de
   filtres et la barre d'onglets — seule la légère différence de gris
   compte ici), padding/gap de #feed inchangés (pas de fil "pleine
   largeur" ici, juste la couleur de fond). D'abord passé en blanc pur
   (#fff, comme #feed.feed-explore), puis ramené à --cream-light sur
   retour utilisateur : un gris très léger, plus clair que --cream des
   menus fixes pour rester distinct, mais pas blanc pur. Classe posée/
   retirée sur #feed par switchTab() (et le tout premier rendu, au boot).
   Les .map-list-item (fond blanc, #fff) gardent leur ombre légère
   ajoutée pour l'étape "fond blanc" — toujours utile ici pour les
   détacher de --cream-light, même principe que .detail-card. */
/* Retour utilisateur : "l'arrière-plan blanc s'arrête à mi-écran
   lorsqu'il n'y a pas beaucoup de collections". #feed n'a pas de hauteur
   propre, juste celle de son contenu — sur cet onglet, rien d'autre n'a
   de hauteur de flux au-dessus (filter-bar/result-line réduits à 0 via
   .chrome-collapsed, #hero déjà démonté), donc peu de contenu = #feed
   court = --cream-light qui s'arrête avant le bas de l'écran, --cream
   d'#app qui prend le relais en dessous, visible comme un changement de
   teinte. min-height:100dvh (même convention que #hero) : jamais moins
   d'un écran plein, quel que soit le contenu. */
#feed.feed-map{background:var(--cream-light); min-height:100dvh;}
#feed.feed-map .map-list-item{box-shadow:0 2px 10px rgba(46,43,34,.1);}
.card{border-radius:26px; overflow:hidden; background:var(--sauge-deep); position:relative;}
/* "Charger plus d'hébergements" (pagination du fil, voir README
   « Performance ») — même esprit que .btn-photo-add (pleine largeur,
   discret) mais bordure pleine plutôt que pointillée : "pointillé" est
   déjà réservé au geste "ajouter" ailleurs dans le site, alors qu'ici
   c'est une continuation, pas un ajout. */
.load-more-btn{width:100%; padding:14px; border:1.5px solid var(--line); border-radius:16px; background:var(--cream-deep);
  font-family:'Jost',sans-serif; font-size:13.5px; font-weight:700; color:var(--sauge-deep);}
.load-more-btn:disabled{opacity:.6;}
/* Bref clignotement au clic sur une punaise de la carte embarquée
   d'Explorer (voir scrollToFeedCard()) — repère visuellement, une fois le
   défilement terminé, LA carte visée parmi toutes celles du fil. outline
   plutôt que box-shadow : pas affecté par le overflow:hidden de .card
   (qui, lui, rognerait un box-shadow porté vers l'intérieur). */
.card.card-pulse{animation:cardPulse 1.1s ease;}
@keyframes cardPulse{0%{outline:3px solid var(--sauge-deep); outline-offset:-3px;} 100%{outline:3px solid transparent; outline-offset:-3px;}}
.cover{position:relative; aspect-ratio:4/5; overflow:hidden;}
.cover .grad{position:absolute; inset:0;}
.cover .cover-carousel{position:absolute; inset:0; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; z-index:1;}
.cover .cover-carousel .cc-slide{min-width:100%; height:100%; object-fit:cover; scroll-snap-align:start; flex-shrink:0;}
.cover .cover-dots{position:absolute; top:58px; left:0; right:0; z-index:5; display:flex; justify-content:center; gap:5px;}
.cover .cover-dots span{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.5);}
.cover .cover-dots span.on{background:#fff; width:16px; border-radius:3px;}
.cover .grain{position:absolute; inset:0; opacity:.5; mix-blend-mode:overlay; z-index:2; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
.cover .scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(29,40,32,0) 38%, rgba(20,26,20,.93) 100%); z-index:2; pointer-events:none;}
.cover .motif{position:absolute; opacity:.16; color:#fff; z-index:1;}
.cover .motif svg{width:100%; height:100%;}
.save-btn{position:absolute; top:14px; right:14px; z-index:5; width:38px; height:38px; border-radius:50%;
  background:rgba(20,26,20,0.35); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.25);
  display:flex; align-items:center; justify-content:center;}
.save-btn svg{width:18px; height:18px; stroke:#fff; fill:none; stroke-width:1.8; transition:all .15s;}
.save-btn.liked svg{fill:var(--yellow); stroke:var(--yellow);}
/* Même style que .save-btn (cœur), juste en dessous — 38+8=46px d'offset. */
.share-btn{position:absolute; top:60px; right:14px; z-index:5; width:38px; height:38px; border-radius:50%;
  background:rgba(20,26,20,0.35); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.25);
  display:flex; align-items:center; justify-content:center;}
.share-btn svg{width:17px; height:17px; stroke:#fff; fill:none; stroke-width:1.8;}
.top-badges{position:absolute; top:14px; left:14px; z-index:5; display:flex; gap:6px;}
.pill-badge{background:rgba(20,26,20,0.4); backdrop-filter:blur(6px); color:#fff; font-size:11px; font-weight:600;
  padding:5px 10px; border-radius:12px; border:1px solid rgba(255,255,255,.2);}
/* text-shadow légère (retour utilisateur : "presque invisible", juste pour
   la lisibilité sur les fonds photo) — posée ici plutôt que sur chaque
   enfant : hérite naturellement sur .region/h2/.tagline en dessous
   (propriété héritée par défaut en CSS), sans devoir la répéter trois
   fois. Volontairement pas sur .top-badges/.pill-badge, plus haut sur la
   photo : ces pastilles ont déjà leur propre fond semi-opaque flouté,
   une ombre de texte n'y ajouterait rien. */
.cover-info{position:absolute; left:0; right:0; bottom:0; z-index:4; padding:18px 18px 16px; color:var(--cream); text-shadow:0 1px 3px rgba(0,0,0,.25);}
.cover-info .region{font-size:11px; text-transform:uppercase; letter-spacing:.12em; font-weight:600; color:var(--yellow); margin-bottom:4px;}
.cover-info h2{font-family:'Jost',sans-serif; font-weight:700; font-size:26px; line-height:1.08; margin:0 0 4px; letter-spacing:-0.01em;}
.cover-info .type-label{color:var(--cream);}
/* Retour utilisateur : "grossir légèrement le corps de cette typo" — 14.5
   -> 16px, line-height ajusté en conséquence (même rapport approximatif
   qu'avant, pas juste la taille qui grandit sans le reste). */
.cover-info .tagline{font-size:16px; line-height:1.3; color:rgba(245,240,229,.88); margin:0 0 12px; max-width:88%;}
.cover-cta{display:flex; gap:8px;}
.btn{border:none; border-radius:16px; font-family:'Jost',sans-serif; font-weight:700; font-size:13.5px;
  padding:8px 16px; display:flex; align-items:center; justify-content:center; gap:6px;}
.btn.primary{background:var(--yellow); color:var(--sauge-deep); flex:1;}
.btn.ghost-dark{background:rgba(245,240,229,0.14); color:var(--cream); border:1.5px solid rgba(245,240,229,.4);}
.price-tag b{font-size:15px;}

/* ---------- quick request inline panel ---------- */
.qr-panel{background:var(--cream-light); padding:16px; display:flex; flex-direction:column; gap:12px;}
.cal{background:#fff; border-radius:16px; padding:16px 12px;}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.cal-title{font-size:13.5px; font-weight:700; text-transform:capitalize;}
.cal-nav{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line); background:var(--cream);
  font-size:17px; color:var(--sauge-deep); display:flex; align-items:center; justify-content:center; line-height:1; padding:0;}
.cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px;}
.cal-weekdays span{text-align:center; font-size:10px; font-weight:700; color:var(--gray-mid); text-transform:uppercase;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
/* Même langage visuel que le calendrier hôte (Mon calendrier) : case grise
   par défaut (#E2DFD8, valeur --light de app/), case "disponible" (ici :
   sélectionnable pour une demande) en vert sauge --sauge plutôt que jaune —
   sémantique propre à ce widget (choisir des dates), mais mêmes couleurs. */
.cal-cell{aspect-ratio:1; border:none; border-radius:8px; background:#E2DFD8; font-family:'Jost',sans-serif;
  font-size:12px; font-weight:600; color:rgba(46,43,34,.28); display:flex; align-items:center; justify-content:center;}
.cal-cell.empty{visibility:hidden; background:none;}
/* Barre diagonale en plus du gris habituel sur les cases indisponibles —
   même case, même couleur, juste plus explicite au premier coup d'œil.
   Pas sur .avail (disponible) ni .cal-nodata (pas "indisponible", on ne
   sait juste pas : voir calendarHtml/le commentaire plus bas). */
.cal:not(.cal-nodata) .cal-cell:not(.avail):not(.empty){
  background-image:linear-gradient(135deg, transparent calc(50% - 0.5px), rgba(46,43,34,.3) calc(50% - 0.5px), rgba(46,43,34,.3) calc(50% + 0.5px), transparent calc(50% + 0.5px));}
/* Disponible : retour utilisateur, "dans le calendrier passe les cases
   disponibles plutôt en vert moyen" — --sauge-mid, texte clair dessus
   (--sauge-deep n'y serait plus assez lisible, cette teinte est plus
   sombre que l'ancien jaune). */
.cal-cell.avail{background:var(--sauge-mid); color:var(--cream); cursor:pointer;}
.cal-cell.avail.selected{background:var(--sauge-deep); color:var(--cream);}
/* Jours strictement entre l'arrivée et le départ choisis en cliquant deux
   fois (voir wireCalDays()/paintRangeSelection()) — teinte intermédiaire
   pour montrer la période entière, sans confondre ces cases avec le début/
   fin (.selected, plus foncé) ni avec une case simplement disponible.
   --sauge-bg essayé d'abord (du temps où "disponible" était en jaune) :
   bien trop proche du gris "indisponible" (#E2DFD8) sur une petite case
   de calendrier, illisible en pratique — repris ici en --sauge-light,
   nettement distincte à la fois du gris et du vert moyen plein. */
.cal-cell.avail.range-mid{background:var(--sauge-light); color:var(--cream);}
.cal-legend{display:flex; align-items:center; gap:6px; margin-top:10px; font-size:10.5px; color:var(--gray-mid);}
.cal-dot{width:8px; height:8px; border-radius:50%; background:#E2DFD8; display:inline-block;}
.cal-dot.avail{background:var(--sauge-mid);}
/* Calendrier sans données (voir calendarHtml) : cases en gris très clair
   plutôt que la même teinte que "réservé/indisponible" habituelle, pour ne
   pas laisser croire que tout est pris. */
.cal-nodata .cal-cell{background:var(--cream); color:rgba(46,43,34,.22);}
.cal-legend-nodata{font-style:italic;}
.qr-row{display:flex; gap:10px;}
.qr-field{flex:1; display:flex; flex-direction:column; gap:4px;}
.qr-field label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--sauge);}
.qr-field input{border:1.5px solid var(--line); border-radius:12px; padding:9px 10px; font-family:'Jost',sans-serif;
  font-size:13.5px; background:var(--cream); color:var(--ink);}
.stepper{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:12px; background:var(--cream); overflow:hidden;}
.stepper button{background:none; border:none; width:32px; height:36px; font-size:16px; font-weight:700; color:var(--sauge);}
.stepper span{flex:1; text-align:center; font-weight:700; font-size:13.5px;}
.msg-preview{background:var(--cream); border:1.5px dashed var(--line); border-radius:12px; padding:10px 12px;
  font-size:12px; line-height:1.5; color:var(--ink); opacity:.85;}
.send-row{display:flex; gap:8px;}
/* Cartouches carrées façon icône d'appli iPhone : même principe que
   .tab-icon de la barre d'onglets (voir plus bas) — un carré coloré à
   bords arrondis pour le pictogramme seul, le libellé en dehors, non
   coloré. Avant, le libellé était DANS le bouton coloré (rectangle,
   padding 10px 6px) : rapproché ici de l'esthétique app mobile demandée. */
.send-btn{flex:1; flex-direction:column; gap:6px; padding:0; background:none; font-size:10.5px; font-weight:700; color:var(--sauge-deep);}
.send-icon{width:100%; max-width:60px; aspect-ratio:1/1; margin:0 auto; border-radius:16px;
  display:flex; align-items:center; justify-content:center;}
.send-btn svg{width:21px; height:21px;}
/* Mail en premier des 4, vert sauge --sauge (le vert "propriétaire", pas
   --sauge-mid déjà pris par WhatsApp ci-dessous) — demande explicite. */
.send-btn.mail .send-icon{background:var(--sauge); color:var(--cream);}
.send-btn.wa .send-icon{background:var(--sauge-mid); color:#fff;}
.send-btn.sms .send-icon{background:var(--lavender); color:#fff;}
/* Fond --yellow abandonné (retour utilisateur : picto blanc "comme tous
   les autres") — --yellow est trop clair pour un picto blanc (contraste
   ~1.3:1, illisible, d'où le texte foncé posé jusqu'ici en compromis).
   --sauge-deep reprend la même famille verte que .send-btn.mail
   (--sauge), en plus soutenu, avec un vrai contraste pour le blanc. */
.send-btn.call .send-icon{background:var(--sauge-deep); color:#fff;}

/* ---------- filter sheet ---------- */
.sheet-backdrop{position:fixed; inset:0; background:rgba(20,26,20,.5); z-index:150;
  display:flex; align-items:flex-end; justify-content:center;}
.sheet-backdrop > .frame{width:100%; max-width:520px;}
.sheet{background:var(--cream); border-radius:26px 26px 0 0; padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:82vh; overflow-y:auto; box-shadow:0 -20px 50px rgba(0,0,0,.25);}
.sheet-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:10px auto 16px;}
.sheet h3{font-size:19px; font-weight:700; margin:4px 0 16px;}
.sheet-close{position:absolute; top:16px; right:20px; width:32px; height:32px; border-radius:50%; background:var(--cream-deep);
  display:flex; align-items:center; justify-content:center;}
.field-block{margin-bottom:22px;}
.field-block > label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--sauge); display:block; margin-bottom:10px;}
.field-hint{font-size:11.5px; color:var(--gray-mid); margin:6px 0 0;}
/* Suggestions d'adresse (Nominatim), sous le champ adresse du dépôt d'annonce. */
.hf-address-suggestions{position:absolute; left:0; right:0; top:100%; z-index:20; margin-top:4px;
  background:var(--cream); border:1.5px solid var(--line); border-radius:16px; overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.14); max-height:220px; overflow-y:auto;}
.hf-address-suggestion{display:block; width:100%; text-align:left; background:none; border:none;
  padding:10px 14px; font-family:'Jost',sans-serif; font-size:12.5px; color:var(--ink); border-bottom:1px solid var(--line);}
.hf-address-suggestion:last-child{border-bottom:none;}
.hf-address-suggestion:hover, .hf-address-suggestion:active{background:var(--cream-deep);}
.range-value{display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:6px;}
input[type=range]{width:100%; accent-color:var(--sauge-deep);}
.amen-group{margin-bottom:16px;}
.amen-group:last-child{margin-bottom:0;}
.amen-group-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--sauge); margin-bottom:8px;}
.amenity-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
/* Retour utilisateur : "utilise plus les couleurs" pour les prestations —
   texte lavande foncé (au lieu du gris/encre neutre d'avant) à l'état
   inactif, encart plein lavande foncé + texte blanc une fois coché.
   .amenity-grid/.amenity-chip sont réutilisées telles quelles en fiche
   détail (voir detailAmenitiesHtml()) pour un style "à l'identique" entre
   filtre et fiche, sans dupliquer la règle CSS à deux endroits. */
.amenity-chip{border:1.5px solid var(--line); border-radius:16px; padding:10px 12px; font-size:12.5px; font-weight:600;
  color:var(--lavender-deep); display:flex; align-items:center; gap:8px;}
.amenity-chip.active{background:var(--lavender-deep); color:#fff; border-color:var(--lavender-deep);}
.amenity-chip svg{width:15px; height:15px; flex-shrink:0;}
.region-chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.region-chip{border:1.5px solid var(--line); border-radius:16px; padding:9px 14px; font-size:12.5px; font-weight:600;
  font-family:'Jost',sans-serif; background:var(--cream);}
.region-chip.active{background:var(--sauge-deep); color:var(--cream); border-color:var(--sauge-deep);}
.text-input{width:100%; border:1.5px solid var(--line); border-radius:16px; padding:12px 14px; font-family:'Jost',sans-serif;
  font-size:14px; background:var(--cream-deep); color:var(--ink);}
textarea.text-input{resize:vertical; min-height:80px;}
.sort-row{display:flex; flex-direction:column; gap:8px;}
.radio-row{display:flex; align-items:center; gap:10px; padding:11px 14px; border:1.5px solid var(--line); border-radius:16px; font-size:13.5px; font-weight:600;}
.radio-row.active{border-color:var(--sauge-deep); background:var(--sauge-deep); color:var(--cream);}
/* Volet "Ajouter à une collection" (kind==="collPicker") : mêmes lignes que
   .radio-row, mais à choix MULTIPLE — un rond à cocher plutôt qu'un simple
   changement de fond, pour ne jamais laisser croire qu'une seule case peut
   être active à la fois (contrairement à .radio-row, réutilisé ailleurs
   pour du choix unique). */
.coll-pick-row{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; padding:11px 14px;
  border:1.5px solid var(--line); border-radius:16px; font-family:'Jost',sans-serif; font-size:13.5px; font-weight:600; text-align:left; background:none; color:var(--ink);}
.coll-pick-row.active{border-color:var(--sauge-deep); background:var(--sauge-bg);}
.coll-pick-row .check{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff;}
.coll-pick-row.active .check{background:var(--sauge-deep); border-color:var(--sauge-deep);}
.coll-pick-row .check svg{width:12px; height:12px; opacity:0;}
.coll-pick-row.active .check svg{opacity:1;}
.sheet-apply{position:sticky; bottom:0; background:var(--cream); padding-top:10px;}
.sheet-sub{font-size:13px; color:var(--sauge); font-weight:600; margin:-10px 0 18px; line-height:1.4;}
.auth-err{font-size:12.5px; font-weight:600; color:var(--danger); min-height:16px; margin-bottom:8px;}
.link-btn{display:block; background:none; border:none; padding:0; font-family:inherit; font-size:12.5px; font-weight:700;
  color:var(--sauge-deep); text-decoration:underline; margin-bottom:14px;}
.host-app-link{display:block; font-size:12.5px; font-weight:600; color:var(--lavender-deep); text-decoration:underline; margin:-6px 0 18px;}
.btn-photo-add{width:100%; padding:12px; border:1.5px dashed var(--line); border-radius:16px; background:var(--cream-deep);
  font-family:'Jost',sans-serif; font-size:13px; font-weight:700; color:var(--sauge-deep);}
.hf-photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
.hf-photo-grid:empty{margin-top:0;}
.hf-photo-thumb{position:relative; aspect-ratio:1/1; border-radius:12px; overflow:hidden;}
.hf-photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.hf-photo-remove{position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(20,26,20,.65);
  color:#fff; border:none; font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center;}
.hf-unit-card{background:var(--cream-deep); border-radius:16px; padding:14px; margin-bottom:12px;}
.hf-unit-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.hf-unit-head span{font-size:12.5px; font-weight:800; color:var(--sauge-deep); text-transform:uppercase; letter-spacing:.02em;}
.hf-unit-remove{background:none; border:none; color:var(--danger); font-size:20px; line-height:1; padding:2px 4px;}
.hf-unit-card .field-block{margin-bottom:14px;}
.field-block-row{display:flex; gap:10px;}
.field-block-row .field-block{flex:1;}
.btn-apply{width:100%; background:var(--sauge-deep); color:var(--cream); padding:15px; border-radius:16px; font-weight:700; font-size:14.5px; border:none;}

/* ---------- crop overlay (recadrage manuel des photos, cadre 4:5 unique) ---------- */
.crop-overlay{position:fixed; inset:0; z-index:400; background:rgba(20,26,20,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:16px;}
.crop-head{width:100%; max-width:340px; display:flex; align-items:center; justify-content:space-between;}
.crop-head button{background:none; border:none; font-family:'Jost',sans-serif; font-size:13px; font-weight:700; color:var(--cream); padding:6px 4px;}
.crop-head .crop-ok{color:var(--yellow);}
.crop-progress{font-size:12px; font-weight:600; color:rgba(239,238,234,.6);}
.crop-viewport{position:relative; width:min(78vw,300px); aspect-ratio:4/5; border-radius:16px; overflow:hidden; touch-action:none; background:var(--sauge-deep); cursor:grab;}
.crop-viewport.dragging{cursor:grabbing;}
.crop-viewport img{position:absolute; top:0; left:0; max-width:none; user-select:none; -webkit-user-drag:none; pointer-events:none;}
.crop-zoom-row{width:100%; max-width:340px; display:flex; align-items:center; gap:10px;}
.crop-zoom-row span{font-size:15px; color:var(--cream); flex-shrink:0;}
.crop-hint{font-size:12px; color:rgba(239,238,234,.55); text-align:center; margin:0; max-width:300px;}

/* ---------- detail sheet ---------- */
.detail{position:fixed; inset:0; z-index:200; background:var(--cream); overflow-y:auto; max-width:520px; margin:0 auto;}
.detail-gallery{position:relative; aspect-ratio:4/5; overflow-x:auto; display:flex; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;}
.detail-gallery .slide{min-width:100%; height:100%; scroll-snap-align:start; position:relative; overflow:hidden;}
.detail-back{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); left:14px; z-index:10; width:38px; height:38px;
  border-radius:50%; background:rgba(20,26,20,0.4); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;}
.detail-back svg{width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2;}
.detail-save{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; z-index:10;}
.detail-share{position:absolute; top:calc(14px + env(safe-area-inset-top,0px) + 46px); right:14px; z-index:10;}
.dots{position:absolute; bottom:14px; left:0; right:0; display:flex; justify-content:center; gap:5px; z-index:5;}
.dots span{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.5);}
.dots span.on{background:#fff; width:16px; border-radius:3px;}
.detail-body{padding:16px 11px 90px;}
.detail-body .region{font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--sauge);}
.detail-body h1{font-size:28px; font-weight:700; line-height:1.1; margin:3px 0 5px; letter-spacing:-0.01em;}
.detail-body .tagline{font-size:16px; line-height:1.2; margin:0 0 10px; color:var(--sauge-deep);}
/* Carte blanche séparant chaque section de la fiche détail — même principe
   que app/ (vue Année : chaque bloc, chiffres/seuils/graphique, est sa
   propre carte blanche posée sur le fond crème de la page) plutôt que du
   texte qui s'enchaîne à plat. Voir la règle de DA en tête du README.
   Posées directement sur le fond --cream de .detail (retour utilisateur :
   "sortir toutes les petites cartes de la carte principale") — il y avait
   avant une grande carte blanche .detail-group qui englobait toutes les
   .detail-card ci-dessous, deux blancs superposés (la grande carte, puis
   chaque petite carte dessus) qui ne se distinguaient plus qu'à l'ombre
   portée. .detail-cards ne reste qu'un conteneur de mise en page (pas de
   fond/ombre) : juste la marge du dessus, pour respirer par rapport au
   titre (ou aux onglets de chambre) juste au-dessus. */
.detail-cards{margin-top:14px;}
.detail-card{background:#fff; border-radius:16px; padding:14px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,.12); overflow:hidden;}
.detail-card>*:last-child{margin-bottom:0;}
/* Ligne de stats (prix/distance/conversion) — retour utilisateur :
   "graphiquement plus clair et attractif, pictogrammes ou lignes de
   séparation". Les deux : un picto par item (voir les constantes
   META_ICON_… et metaItemHtml()) au-dessus de la valeur, et un filet
   vertical entre deux
   items plutôt qu'un simple espace — :not(:first-child) pour ne jamais en
   poser un avant le tout premier (2 items sur la vue d'une chambre sans
   taux de conversion, 3 sinon : le filet doit s'adapter à ce nombre
   variable, pas être câblé en dur sur "toujours 3"). */
.meta-row{display:flex; gap:0;}
.meta-item{display:flex; flex-direction:column; align-items:flex-start; gap:8px; flex:1; padding:0 16px;}
.meta-item:first-child{padding-left:0;}
.meta-item:not(:first-child){border-left:1px solid var(--line);}
/* Retour utilisateur : "mettre les 3 pictos dans un petit encart carré de
   couleur", puis "passe le fond de l'encart en vert moyen" — --sauge-mid,
   texte/picto en clair dessus (trop sombre pour rester lisible en sauge
   foncé comme avant). */
.meta-icon{width:34px; height:34px; border-radius:11px; background:var(--sauge-mid); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.meta-item svg{width:18px; height:18px; color:var(--cream);}
/* .meta-text regroupe valeur + libellé pour leur donner un interlignage
   propre à eux (retour utilisateur : "réduit un peu l'interlignage entre
   les deux styles de ligne"), plus serré que l'espace badge->texte porté
   par .meta-item lui-même. */
.meta-text{display:flex; flex-direction:column; gap:1px;}
.meta-item b{font-size:15px;}
.meta-item span{font-size:11px; color:var(--sauge); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
/* .ext-links : conteneur pour le(s) lien(s) externes de l'annonce (site
   personnel, avis Google) — 0, 1 ou 2 selon ce que l'hôte a renseigné au
   dépôt de l'annonce (voir le hostform, champs optionnels hf-website/
   hf-google). Un flex-wrap plutôt qu'un empilement d'ancres à marge
   négative individuelle : propre à N liens, pas juste 1. Posé juste sous
   .tagline (voir extLinksHtml()) — plus de marge négative de compensation
   ici, elle datait de l'ancienne position en tout premier élément d'une
   carte fraîche ; .tagline porte déjà sa propre marge basse (10px, voir sa
   règle), suffisante comme espacement. */
.ext-links{display:flex; flex-wrap:wrap; gap:8px; margin:0;}
/* Retour utilisateur : "Site web/Avis Google : passe les deux encarts en
   vert moyen typo blanche" — --sauge-mid plein, texte et pictos blancs,
   plus de bordure (elle ne servait qu'à délimiter le fond crème d'avant). */
.google-link{display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:16px;
  background:var(--sauge-mid); font-size:13px; font-weight:600; color:#fff;}
.google-link svg{width:15px; height:15px; color:#fff; flex-shrink:0;}
.google-link svg.ext{width:12px; height:12px; color:rgba(255,255,255,.75); margin-left:2px;}
/* Type d'hébergement, sur la même ligne que l'accroche (claim), séparés par
   "•" (voir taglineHtml()) — visible dès le début (fil et fiche détail),
   pas noyé plus bas dans la description, et sans bloc à part qui prenait
   sa propre ligne (retour utilisateur). Le span hérite la taille/couleur
   de .tagline.claim (serif italique) mais reste gras, sans-serif et droit
   grâce à une déclaration explicite ici, qui l'emporte sur l'héritage
   quelle que soit la spécificité de la règle du parent. Couleur adaptée au
   fond : clair sur la photo du fil (.cover-info), foncé sur le fond crème
   de la fiche détail (.detail-body). */
.type-label{font-family:'Jost',sans-serif; font-style:normal; font-weight:700;}
.detail-body .type-label{color:var(--ink);}
.type-sep{opacity:.55; font-weight:400;}
.detail-body p.desc{font-size:14.5px; line-height:1.4; color:#4a4636; margin:0 0 14px;}
.section-title{font-size:15px; font-weight:700; margin:0 0 10px;}
/* Prestations groupées (voir detailAmenitiesHtml()) : un sous-titre par
   catégorie au-dessus de sa propre grille — retour utilisateur, "moderne,
   originale et claire". .detail-amen-group porte l'espacement ENTRE
   groupes ; la grille elle-même (.amenity-grid/.amenity-chip.active,
   règles plus haut) est la MÊME que le volet filtre — retour utilisateur,
   "reprendre exactement le style graphique que pour le filtre, à
   l'identique" — donc rien de spécifique à redéfinir ici pour l'affichage
   des pastilles/pictos, seul l'espacement entre groupes est propre à la
   fiche détail. Ancienne mise en page (.amenity-list à plat, .amen-badge
   en pastille sauge) abandonnée à cette occasion, remplacée par les
   mêmes chips lavande que le filtre. */
.detail-amen-group{margin-bottom:16px;}
.detail-amen-group:last-child{margin-bottom:0;}
.detail-amen-group-title{font-size:11px; font-weight:800; color:var(--sauge); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;}
.detail-amen-group .amenity-grid{margin-bottom:0;}
.unit-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
.unit-card{display:flex; align-items:center; gap:12px; background:var(--cream-deep); border-radius:16px; padding:10px; overflow:hidden; width:100%; border:none; text-align:left; font-family:inherit; cursor:pointer;}
/* Onglets façon navigateur plutôt que des pilules isolées ("boudins") : coins
   arrondis seulement en haut, chaque onglet porte sa propre ligne de base
   (border-bottom) — grise et visible pour un onglet inactif ("fermé", séparé
   du contenu). L'onglet actif, lui, passe en couleur pleine — même
   convention que app/ pour signaler "l'élément sélectionné" dans une rangée
   d'onglets/boutons de vue (.mbnav-btn.on / .vtab.on, toutes deux
   background:var(--green) + texte blanc ; --green et --sauge sont la même
   couleur, #354B38, juste nommée différemment par produit) — sa ligne de
   base disparaît (même couleur que son propre fond) pour se fondre
   directement dans le contenu juste en dessous. */
.detail-tabs{display:flex; gap:2px; margin:14px 0 0;}
.detail-tab{flex:1; min-width:0; padding:9px 8px; border-radius:10px 10px 0 0; border:none; border-bottom:2px solid var(--line); background:var(--cream-deep); font-family:'Jost',sans-serif; font-size:12.5px; font-weight:700; color:var(--sauge); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center;}
.detail-tab.active{background:var(--sauge); border-bottom-color:var(--sauge); color:var(--cream);}
.unit-thumb{width:56px; height:56px; border-radius:12px; overflow:hidden; flex-shrink:0; background:var(--line);}
.unit-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.unit-thumb-empty{width:100%; height:100%; background:var(--line);}
.unit-info b{display:block; font-size:14px;}
.unit-info span{font-size:12px; color:var(--sauge); font-weight:600;}
/* align-items:flex-start (pas center) depuis l'ajout de la présentation :
   avec un simple nom sur une ligne l'avatar restait déjà bien aligné,
   mais un paragraphe de présentation sur plusieurs lignes ferait dériver
   l'avatar vers le bas du bloc si on le gardait centré verticalement. */
.host-card{display:flex; align-items:flex-start; gap:12px; background:transparent; border-radius:16px; padding:0; margin-bottom:0;}
.host-avatar{width:46px; height:46px; border-radius:50%; background:var(--lavender); color:#fff; display:flex;
  align-items:center; justify-content:center; font-weight:700; font-size:17px; flex-shrink:0;}
.host-info{display:flex; flex-direction:column; gap:5px; flex:1; min-width:0;}
.host-info b{display:block; font-size:14.5px;}
.host-info p{margin:0; font-size:13px; line-height:1.4; color:#4a4636;}

/* ---------- bottom nav ----------
   Pas d'apparition animée : la barre est installée à sa place fixe dès
   le départ, immobile. Ce qui la rend "invisible" au début, c'est
   uniquement l'empilement des calques (z-index) — le hero (z-index
   supérieur) la recouvre tant qu'il occupe l'écran ; une fois défilé
   (flux normal, plus dans le viewport), il n'y a plus rien au-dessus
   d'elle. Le contenu (fil, carte, profil) reste sous la barre en
   permanence (z-index inférieur), donc elle ne se fait jamais recouvrir
   en scrollant dans les annonces. Hiérarchie normale : hero > sheet/modal
   (.sheet-backdrop, z-index 150) > fiche détail (.detail, 200) >
   nav.tabbar (50) > #feed. */
nav.tabbar{position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; z-index:50;
  background:rgba(239,238,234,0.94); backdrop-filter:blur(10px); border-top:1px solid var(--line);
  display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));}
/* Exception, seulement pendant que la fiche détail est ouverte
   (body.detail-open, posé par openDetail()/retiré par closeDetail()) :
   nav.tabbar remonte au-dessus de .detail pour qu'Explorer/Carte/Envies/
   Profil restent cliquables sans passer par la flèche retour tout en
   haut de la fiche — cliquer un onglet referme la fiche au passage (voir
   switchTab()). Ciblée à ce seul état pour ne pas passer devant les
   sheets/modales (.sheet-backdrop, 150) sur les autres écrans (espace
   hôte notamment), où nav.tabbar doit rester en dessous comme avant. */
body.detail-open nav.tabbar{z-index:220;}
/* Bouton "revenir à la carte" (retour utilisateur : "il y aurait un p'tit
   bouton permanent pour y revenir") — la carte est désormais en tête du
   fil Explorer (voir .explore-map-block), potentiellement loin au-dessus
   une fois qu'on a défilé dans les annonces ; ce bouton fixe, toujours
   affiché tant qu'on est sur Explorer (masqué sinon, voir switchTab()),
   ramène directement à elle. z-index sous nav.tabbar (50) : les deux ne se
   chevauchent jamais à l'écran (positionné juste au-dessus de la barre),
   pas besoin de rivaliser avec elle.
   78px de marge basse, retour utilisateur ensuite : trop juste sur un
   appareil avec indicateur d'accueil (nav.tabbar ~112px de haut une fois
   son propre safe-area-inset-bottom ajouté), le bouton touchait
   pratiquement la barre au lieu de rester nettement au-dessus — remonté
   à 104px, avec une vraie marge visible cette fois. */
.map-back-btn{position:fixed; right:14px; bottom:calc(104px + env(safe-area-inset-bottom, 0px)); z-index:40;
  width:44px; height:44px; border-radius:50%; background:var(--sauge-deep); color:var(--cream);
  border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.25); cursor:pointer;}
.map-back-btn[hidden]{display:none;}
.map-back-btn svg{width:20px; height:20px;}
/* Essai léger (retour utilisateur, demandé explicitement comme un
   essai à juger sur pièce) : dégradé fixe en haut/bas du fil Explorer,
   pour fondre un peu les annonces en périphérie du regard et recentrer
   l'attention sur celle du milieu de l'écran. #feed.feed-explore ~
   .fade-edge (combinateur de frères suivants, .fade-edge est APRÈS
   #feed dans le HTML) : visible seulement quand le fil Explorer est la
   vue active, sans câblage JS séparé à synchroniser avec switchTab().
   pointer-events:none partout : ne doit jamais intercepter un tap sur
   une carte en dessous. z-index sous nav.tabbar (50)/.map-back-btn (40)
   pour ne jamais passer devant eux. */
.fade-edge{position:fixed; left:0; right:0; max-width:520px; margin:0 auto; z-index:15; pointer-events:none; opacity:0;}
/* top décalé sous .filters (barre sticky, z-index:70, opaque — mesurée à
   55px de haut) : posé à top:0 comme .map-back-btn, le dégradé restait
   invisible, entièrement caché sous cette barre à chaque instant.
   Retour utilisateur, après un premier essai clair : "plutôt foncé, comme
   un vignettage" — même teinte sombre que les autres scrims du site
   (rgba(20,26,20,…), voir .cover .scrim/.collection-tile-scrim), pas une
   couleur réinventée pour l'occasion. */
.fade-edge-top{top:calc(55px + env(safe-area-inset-top,0px)); height:70px; background:linear-gradient(to bottom, rgba(20,26,20,.55), transparent);}
/* bottom:0 posait tout le dégradé DERRIÈRE nav.tabbar (opaque, ~77px de
   haut sans zone de sécurité) : vérifié au pixel près (screenshot avec/
   sans l'encart), la vraie différence de couleur visible au-dessus de la
   barre restait minime — la partie la plus sombre du dégradé (proche de
   bottom:0) était justement celle entièrement masquée. Décalé pour tenir
   tout entier dans la bande visible juste au-dessus de la barre. */
.fade-edge-bottom{bottom:calc(77px + env(safe-area-inset-bottom,0px)); height:90px; background:linear-gradient(to top, rgba(20,26,20,.65), transparent);}
#feed.feed-explore ~ .fade-edge{opacity:1;}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; background:none; border:none; color:var(--sauge-light); position:relative;}
/* Encart de sélection carré façon icône d'appli mobile (contrairement à
   app/ où .mbnav-btn.on colore tout le bouton, rectangle qui suit la
   largeur flex du bouton) : seul un carré fixe autour du pictogramme
   passe en vert sauge --sauge (propriétaire, pas --sauge-mid qui sert
   ailleurs de "vert moyen"), le libellé reste en dehors, coloré seul. */
.tab-icon{width:34px; height:34px; border-radius:12px; display:flex; align-items:center; justify-content:center; transition:background .15s;}
.tab svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7;}
.tab span{font-size:10px; font-weight:700;}
.tab.active{color:var(--sauge-deep);}
.tab.active .tab-icon{background:var(--sauge);}
.tab.active .tab-icon svg{fill:var(--cream); stroke:var(--cream);}
.tab .badge{position:absolute; top:2px; right:22%; background:var(--danger); color:#fff; font-size:9px; font-weight:800;
  border-radius:50%; width:15px; height:15px; display:flex; align-items:center; justify-content:center;}

/* ---------- carte embarquée en tête du fil Explorer ---------- */
/* Fusion de l'ancien onglet "Carte" dans Explorer (retour utilisateur :
   "j'aimerais que sur le mode visiteur explorer intègre finalement
   directement la vue carte, menu qui disparaîtrait (...) la carte serait en
   haut des annonces"). .explore-map-block encadre la carte + ses contrôles
   de zone avec un peu de marge latérale, DANS #feed.feed-explore — qui,
   lui, est en padding 0 (cartes plein bord façon fil Instagram, voir plus
   bas) : sans cette marge propre au bloc, la carte irait aussi bord à bord,
   perdant ses coins arrondis à l'écran. */
.explore-map-block{margin:10px 16px 18px;}
/* z-index:0 en plus de position:relative : ouvre un nouveau contexte
   d'empilement propre à .map-canvas, qui CONTIENT tous les z-index internes
   élevés (les tuiles/punaises Leaflet vont jusqu'à ~700, .map-zone-btn est
   à 1000) — sans lui, ces valeurs se comparaient directement à celles du
   reste de la page et passaient au-dessus du volet de filtres
   (.sheet-backdrop, z-index 150 seulement), le rendant invisible/inutilisable
   derrière la carte pendant qu'on ajustait Lieu/Distance/Prestations/Trier.
   Avec le contexte d'empilement, .map-canvas dans son ensemble ne vaut que
   0 pour le reste de la page : il ne peut plus jamais repasser au-dessus
   d'un sheet, quels que soient les z-index internes de Leaflet.
   Hauteur fixe plutôt que l'ancien aspect-ratio:1/1 (carré, ~390px de haut
   sur mobile) : en tête du fil désormais, la carte doit laisser voir qu'il
   y a des annonces à faire défiler juste en dessous, pas remplir tout
   l'écran à elle seule comme quand elle avait son propre onglet plein
   écran. */
.map-canvas{position:relative; z-index:0; height:240px; border-radius:26px; overflow:hidden; background:var(--cream-deep);
  transition:height .25s ease, aspect-ratio .25s ease;}
/* Format photo unique 4:5 du reste du site (retour utilisateur, voir
   .cover/.detail-gallery) — pas un pourcentage arbitraire de l'écran :
   même ratio que les cartes/la fiche détail, agrandir la carte suit la
   même cohérence visuelle que le reste. height:auto nécessaire pour que
   aspect-ratio prenne le dessus sur la hauteur fixe ci-dessus. */
.map-canvas.expanded{height:auto; aspect-ratio:4/5;}
.map-canvas .leaflet-container{width:100%; height:100%; background:var(--cream-deep); font-family:'Jost',sans-serif;}
.map-canvas .leaflet-control-attribution{font-size:9.5px; background:rgba(239,238,234,.85);}
.map-pin-icon{background:none; border:none;}
.map-pin{transform:translate(0,-6px); display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;}
.map-pin .dot{width:30px; height:30px; border-radius:50% 50% 50% 0; background:var(--sauge-deep); transform:rotate(-45deg);
  display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,.25);}
.map-pin .dot span{transform:rotate(45deg); color:var(--yellow); font-size:9.5px; font-weight:800; letter-spacing:-.02em;}
.map-pin.liked .dot{background:var(--danger);}
.map-cluster-icon{background:none; border:none;}
.map-cluster{width:38px; height:38px; border-radius:50%; background:var(--lavender-deep); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
  box-shadow:0 4px 10px rgba(0,0,0,.25); border:2px solid var(--cream);}
.map-expand-btn{position:absolute; top:12px; left:12px; z-index:1000; width:34px; height:34px; border-radius:50%;
  background:var(--cream); border:1.5px solid var(--line); box-shadow:0 3px 8px rgba(0,0,0,.18);
  display:flex; align-items:center; justify-content:center; color:var(--ink);}
.map-expand-btn svg{width:16px; height:16px;}
.map-zone-btn{position:absolute; top:12px; right:12px; z-index:1000; background:var(--cream); border:1.5px solid var(--line);
  border-radius:16px; padding:9px 14px; font-family:'Jost',sans-serif; font-size:12.5px; font-weight:700; color:var(--ink);
  box-shadow:0 3px 8px rgba(0,0,0,.18);}
.map-zone-btn.armed{background:var(--sauge-deep); color:var(--cream); border-color:var(--sauge-deep);}
.map-zone-controls{display:flex; flex-direction:column; gap:10px; background:var(--cream-deep); border-radius:16px;
  padding:10px 14px; margin:12px 0; font-size:12.5px; font-weight:600;}
.map-zone-controls-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.map-zone-controls-head button{background:none; border:none; padding:0; font-family:inherit; font-size:12px; font-weight:700;
  color:var(--danger); text-decoration:underline; flex-shrink:0;}
/* Même curseur, même amplitude (1 à MAX_DISTANCE_KM) que le volet Distance
   du bandeau du haut (retour utilisateur : "je resterais sur la même
   jauge que celle de distance, exactement le même outil") — un seul
   <input type=range> suffit, sans classe dédiée : le style global
   input[type=range]{...} (voir plus haut) s'applique déjà identiquement
   ici et dans le volet, la cohérence visuelle vient gratuitement. */
.map-list{display:flex; flex-direction:column; gap:10px;}
.map-list-item{display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px; padding:10px 12px;}
.map-list-item .sw{width:68px; height:68px; border-radius:12px; flex-shrink:0; object-fit:cover; display:block;}
.map-list-item b{font-size:13.5px; display:block;}
/* display:block (pas inline, par défaut pour un <span>) : dans Envies →
   Demandes, contactLogRowHtml() empile désormais DEUX span (région/prix,
   puis moyen de contact + date/heure) sous le nom — sans ce display:block
   elles se suivraient côte à côte au lieu de former deux lignes. Sans
   effet ailleurs (la carte n'a qu'un seul span par item). */
.map-list-item span{font-size:11.5px; color:var(--sauge); font-weight:600; display:block;}
/* En-tête d'un groupe de demandes portant sur les mêmes dates de séjour
   (voir groupedDemandesHtml()/stayPeriodLabel()) — même rôle que
   .profile-section-label (étiquette au-dessus d'une liste) mais un cran
   plus discret : c'est un sous-groupe, pas une section de premier niveau. */
.log-period-label{font-size:12.5px; font-weight:700; color:var(--ink); margin:14px 0 6px 2px;}
/* Onglet Envies → Demandes uniquement : .log-body porte le clic "dérouler
   l'annonce" (comme avant), désormais distinct de .log-actions (à droite,
   voir plus bas) puisque la ligne entière n'est plus cliquable une fois
   les deux boutons d'action ajoutés. */
.log-body{display:flex; align-items:center; gap:12px; flex:1; min-width:0;}
.log-body[data-open-log],.log-body[data-open-coll]{cursor:pointer;}
.log-actions{display:flex; gap:6px; flex-shrink:0;}
.log-action{width:32px; height:32px; border-radius:10px; border:none; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.log-action svg{width:16px; height:16px;}
.log-action.confirm{background:var(--sauge); color:var(--cream);}
.log-action.decline{background:var(--cream-deep); color:var(--danger);}

/* ---------- Mes séjours : Favoris / Demandes / Séjours ----------
   .stat-tile (défini plus bas, historiquement pour profile-stats)
   réutilisé tel quel comme bouton d'onglet — demande explicite : "dans
   le style de la vue profil... des onglets avec des gros chiffres".
   Les 3 tuiles profile-stats d'origine (Favoris/Séjours/Demandes
   envoyées) ont depuis été retirées du Profil, devenues redondantes
   avec ce bandeau-ci — .stat-tile ne sert donc plus qu'ici. */
/* Retour utilisateur : la tuile active doit "aller jusqu'à la ligne" (le
   border-bottom de .profile-stats, voir plus bas) pour bien montrer quel
   onglet est ouvert — comme un onglet de dossier qui rejoint le contenu en
   dessous, les deux autres restant visiblement "fermés" au-dessus de la
   ligne. padding-bottom +14px (28px au lieu de 14px) fait grandir la
   tuile active de 14px ; margin-bottom:-14px annule cette même valeur
   côté mise en page (la ligne de tuiles ne grandit pas, les deux autres
   ne bougent pas) — seul le fond de la tuile active "déborde" dans le
   padding bas de .profile-stats (14px, exactement la même valeur) pour
   affleurer pile sur la ligne. Coins bas carrés (border-radius) : elle ne
   doit pas s'arrondir juste avant de toucher la ligne. */
.stat-tile.active{background:var(--sauge); border-radius:16px 16px 0 0; padding-bottom:28px; margin-bottom:-14px;}
.stat-tile.active b, .stat-tile.active span{color:var(--cream);}

/* ---------- profile ---------- */
.profile-view{padding:24px 0 110px;}
.profile-head{display:flex; align-items:center; gap:14px; margin-bottom:26px;}
.profile-avatar{width:60px; height:60px; border-radius:50%; background:var(--sauge-deep); color:var(--cream);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:22px;}
/* Sticky en haut de #feed, comme .filters — retour utilisateur : les
   onglets Favoris/Demandes/Séjours ne doivent pas défiler avec les
   annonces/lignes en dessous. .profile-stats ne sert plus qu'au bandeau
   Mes séjours (voir commentaire plus haut) : sticky sans risque sur un
   autre usage. Marges négatives pour annuler le padding haut+latéral de
   #feed (dont ce bandeau est toujours le premier enfant, voir
   renderFeed()/renderContactLog()) et redevenir pleine largeur ; padding
   repris à l'identique en interne. Fond crème repeint par-dessus les
   cartes qui défilent dessous, bordure basse comme .filters. Pas de
   margin-bottom : le gap:18px de #feed espace déjà du contenu suivant. */
.profile-stats{display:flex; gap:10px; margin:-10px -14px 0; padding:10px 14px 14px; position:sticky; top:0; z-index:60; background:var(--cream); border-bottom:1px solid var(--line);}
.stat-tile{flex:1; background:var(--cream-deep); border:none; border-radius:16px; padding:14px; text-align:center; font-family:'Jost',sans-serif;}
.stat-tile b{display:block; font-size:22px; font-weight:800; color:var(--sauge-deep);}
.stat-tile span{font-size:13px; color:var(--sauge); font-weight:600;}
/* ---------- Favoris : grille de collections ---------- */
/* Tuiles carrées à 2 colonnes, mosaïque photo + dégradé + nom en overlay —
   adapté de l'écran Collections de Photos iOS (retour utilisateur,
   capture d'écran fournie en référence), avec notre style graphique
   propre (coins 20px cohérents avec .card/.admin-card, typo Jost). */
/* Bascule grille/liste (retour utilisateur) — même paire active/inactive
   que .stat-tile.active (fond sauge foncé + crème), en plus compact et à
   droite, juste au-dessus de la grille/liste elle-même. */
.layout-toggle{display:flex; justify-content:flex-end; gap:6px; margin:10px 0 4px;}
.layout-toggle-btn{width:34px; height:34px; border-radius:10px; border:none; background:var(--cream-deep); color:var(--sauge); display:flex; align-items:center; justify-content:center;}
.layout-toggle-btn svg{width:17px; height:17px;}
.layout-toggle-btn.active{background:var(--sauge-deep); color:var(--cream);}
.collections-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px;}
.collection-tile{position:relative; aspect-ratio:1/1; border-radius:20px; overflow:hidden; background:var(--cream-deep);}
/* .collection-tile-open porte tout ce que .collection-tile portait avant
   l'ajout du bouton supprimer (voir collectionTileHtml()) : lui-même un
   <button>, il ne peut pas être imbriqué dans un autre <button> — d'où
   .collection-tile qui n'est plus QUE le conteneur positionné, plus le
   déclencheur cliquable. */
.collection-tile-open{position:absolute; inset:0; width:100%; border:none; padding:0; text-align:left; cursor:pointer; background:none; font:inherit; color:inherit;}
.collection-tile-delete{position:absolute; top:8px; right:8px; z-index:2; width:28px; height:28px; border-radius:50%; border:none; background:rgba(20,26,20,.55); color:#fff; display:flex; align-items:center; justify-content:center;}
.collection-tile-delete svg{width:14px; height:14px;}
/* Tuile "Ajouter une collection" (retour utilisateur : "mettre une
   collection grise/vide avec la mention ajouter une collection") —
   contour pointillé plutôt que le fond plein des autres tuiles, pour
   qu'elle se lise tout de suite comme une action et non comme une
   collection existante parmi d'autres. */
.collection-tile-add{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  border:1.5px dashed var(--sauge-light); background:none; color:var(--sauge); font-family:'Jost',sans-serif; font-size:12.5px; font-weight:700; text-align:center; padding:12px;}
.collection-tile-add svg{width:26px; height:26px;}
/* Même logique en vue liste, sur la base de .map-list-item (voir plus
   bas) — fond transparent + contour pointillé au lieu du fond blanc plein
   des autres lignes, même raison qu'en grille ci-dessus. */
.coll-list-add{width:100%; border:1.5px dashed var(--sauge-light); background:none; color:var(--sauge); font-family:'Jost',sans-serif; font-weight:700; font-size:13.5px;}
.coll-list-add-icon{width:44px; height:44px; border-radius:12px; background:var(--cream-deep); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.coll-list-add-icon svg{width:20px; height:20px;}
.collection-tile-photos{position:absolute; inset:0; display:grid; gap:1.5px;}
.collection-tile-photos.n1{grid-template-columns:1fr;}
.collection-tile-photos.n2{grid-template-columns:1fr 1fr;}
.collection-tile-photos.n3{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;}
.collection-tile-photos.n3 img:first-child, .collection-tile-photos.n3 .collection-tile-empty:first-child{grid-row:1/3;}
.collection-tile-photos img{width:100%; height:100%; object-fit:cover; display:block;}
.collection-tile-empty{width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:var(--cream-deep); color:var(--sauge);}
.collection-tile-empty svg{width:30%; height:30%; opacity:.35;}
.collection-tile-scrim{position:absolute; inset:0; background:linear-gradient(to top, rgba(20,26,20,.65), transparent 55%); pointer-events:none;}
.collection-tile-info{position:absolute; left:12px; right:12px; bottom:10px; color:#fff;}
.collection-tile-info b{display:block; font-size:14px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.collection-tile-info span{font-size:11px; font-weight:600; opacity:.9;}
/* En-tête du détail d'une collection (retour aux collections + nom +
   renommer/supprimer) — même hauteur/esprit que .detail-back, mais en
   ligne plutôt qu'en superposition sur une galerie photo. */
.collection-detail-head{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
.collection-detail-back{background:var(--cream-deep); border:none; border-radius:50%; width:34px; height:34px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--ink);}
.collection-detail-back svg{width:18px; height:18px;}
.collection-detail-title{flex:1; font-size:18px; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.collection-detail-actions{display:flex; gap:6px; flex-shrink:0;}
.collection-detail-actions button{background:var(--cream-deep); border:none; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--ink);}
.collection-detail-actions button svg{width:16px; height:16px;}
#coll-detail-delete{color:var(--danger);}
.profile-list{display:flex; flex-direction:column; gap:2px; border-top:1px solid var(--line);}
.profile-row{display:flex; align-items:center; justify-content:space-between; padding:15px 2px; border-bottom:1px solid var(--line); font-size:14px; font-weight:600;}
.profile-row svg{width:16px; height:16px; opacity:.5;}
.profile-switch{display:flex; gap:10px; margin-bottom:26px;}
/* Fond plein pour les deux tuiles, quelle que soit l'active — décision
   prise puis inversée : essayé d'abord sans bordure ("la légende suffit
   à distinguer laquelle est active"), puis avec fond plein des deux
   côtés (ci-dessous, historique). Retour utilisateur ensuite : l'espace
   actif ne se détachait pas assez au premier coup d'œil du non-actif —
   voir les règles :not(.current) plus bas, qui remettent un fond clair +
   contour sur la tuile qui N'EST PAS l'espace actuel. */
.switch-tile{flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:14px; border-radius:16px;
  border:1.5px solid transparent; text-align:left; font-family:inherit; cursor:pointer;}
/* Profil hôte (renderHostProfile()) : la tuile "vous y êtes" (Espace
   hôtes) y est disabled plutôt que cliquable, rien à y faire — sans
   cette règle, le style disabled par défaut du navigateur l'aurait
   ternie, alors qu'elle doit rester aussi nette que l'autre tuile. */
.switch-tile:disabled{cursor:default; opacity:1;}
.switch-tile.voyageur{background:var(--sauge);}
.switch-tile.hotes{background:var(--lavender-deep);}
.switch-tile .switch-icon{width:34px; height:34px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.2); color:#fff;}
.switch-tile .switch-icon svg{width:17px; height:17px;}
.switch-tile .switch-label{display:flex; align-items:center; gap:5px; width:100%;}
.switch-tile b{font-size:13.5px; font-weight:700; color:#fff;}
.switch-tile span{font-size:11px; color:rgba(255,255,255,.8); font-weight:600; display:block; margin-top:1px;}
/* Tuile qui n'est PAS l'espace actuel (marqueur .current posé par
   renderProfile()/renderHostProfile() sur l'autre tuile) : fond clair de
   la même famille de couleur + contour assorti, plutôt que le même fond
   plein que l'espace actif. Spécificité (3 classes) l'emporte sur les
   règles .voyageur/.hotes/b/span ci-dessus sans dépendre de l'ordre.
   --sauge-bg (pas --sauge-light, essayé d'abord) : --sauge-light est un
   vert moyen, pas un vert pâle — à côté du --lavender-bg très clair de
   l'autre tuile, le duo paraissait déséquilibré/terne (retour
   utilisateur). --sauge-bg mélange --sauge à ~13% sur blanc, même
   dérivation que --lavender-bg à partir de --lavender-deep. */
.switch-tile.voyageur:not(.current){background:var(--sauge-bg); border-color:var(--sauge);}
.switch-tile.voyageur:not(.current) b{color:var(--sauge-deep);}
.switch-tile.voyageur:not(.current) span{color:var(--sauge-mid);}
.switch-tile.voyageur:not(.current) .switch-icon{background:rgba(53,75,56,.14); color:var(--sauge-deep);}
.switch-tile.hotes:not(.current){background:var(--lavender-bg); border-color:var(--lavender-deep);}
.switch-tile.hotes:not(.current) b{color:var(--lavender-deep);}
.switch-tile.hotes:not(.current) span{color:var(--lavender-icon);}
.switch-tile.hotes:not(.current) .switch-icon{background:rgba(78,103,188,.14); color:var(--lavender-deep);}
.profile-section-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--gray-mid); margin:24px 0 4px 2px;}
.profile-list.legal .profile-row{font-weight:500; color:var(--sauge);}
/* Cartes blanches séparant les groupes de menu du Profil (retour
   utilisateur, "comme sur d'autres vues") — même recette que
   .detail-card (fond blanc, coins arrondis, ombre légère).
   .profile-list garde son border-top (inutile en haut de carte, mais
   sans incidence visuelle vu le padding) ; seul le dernier .profile-row
   perd son border-bottom, redondant avec le bord bas de la carte. */
.profile-card{background:#fff; border-radius:16px; padding:0 14px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.12); overflow:hidden;}
.profile-card .profile-list{border-top:none;}
.profile-card .profile-row:last-child{border-bottom:none;}
/* Titre À L'INTÉRIEUR de la bulle (retour utilisateur, capture d'écran à
   l'appui) plutôt qu'au-dessus, en .profile-section-label — même typo,
   simplement replacée avec le padding latéral de la carte et un peu d'air
   au-dessus pour respirer par rapport au bord haut arrondi. */
.profile-card-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--gray-mid); padding:16px 0 6px;}

/* ---------- validation des annonces (admin) ---------- */
.admin-queue{padding:24px 0 110px;}
.admin-back{background:none; border:none; padding:0; font-family:inherit; font-size:13px; font-weight:700; color:var(--sauge-deep); margin-bottom:16px;}
.admin-queue h2{font-size:19px; font-weight:700; margin:0 0 18px;}
/* .admin-card : conteneur de la carte (fond/coins/marge basse uniquement) ;
   .admin-card-row porte la mise en page horizontale couverture+infos —
   séparées pour que .admin-card puisse aussi contenir, dans l'espace hôtes,
   une ligne "volet" pleine largeur sous cette rangée (voir .cal-disclose
   plus bas) sans que la file d'admin (seule utilisatrice de la rangée
   simple) n'en soit affectée. */
.admin-card{background:var(--cream-deep); border-radius:16px; padding:12px; margin-bottom:12px;}
.admin-card-row{display:flex; gap:12px;}
.admin-thumb{width:64px; height:64px; border-radius:12px; object-fit:cover; flex-shrink:0; background:var(--line);}
.admin-thumb-empty{background:var(--line);}
.admin-card-body{display:flex; flex-direction:column; gap:3px; min-width:0;}
.admin-card-body b{font-size:14px;}
.admin-card-body span{font-size:12px; color:var(--sauge); font-weight:600;}
.admin-owner{color:var(--gray-mid)!important; font-weight:500!important;}
.admin-actions{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;}
.admin-actions .btn-apply{padding:8px 14px; font-size:12.5px; width:auto;}
.admin-reject{background:none; border:1.5px solid var(--line); border-radius:16px; padding:8px 14px; font-size:12.5px; font-weight:700; color:var(--danger);}
/* .host-listing-card : variante de .admin-card réservée à "Mes annonces"
   (retour utilisateur, capture d'écran) — fond blanc plutôt que --cream-deep
   (même convention que .map-list-item, déjà en #fff ailleurs sur le site).
   Scopée en modificateur plutôt qu'appliquée à .admin-card directement :
   la file d'admin (Annonces à valider) réutilise la même classe de base
   avec sa mise en page compacte d'origine, inchangée. Nom distinct de
   .host-card (déjà pris ailleurs — mini-ligne avatar+nom de l'hôte dans le
   panneau de demande rapide, display:flex en ligne — les deux
   collisionnaient et écrasaient la mise en page en colonne voulue ici
   avant ce renommage).
   Vignette : un premier essai la faisait remplir tout le bord gauche de la
   carte (bord à bord, coins carrés) — retour utilisateur ensuite :
   « j'aimerais que l'image aperçu reste quand même dans un picto style
   application carré, bords arrondis, mais plus gros qu'avant ». Revenu à
   la mise en page carrée d'origine (héritée de .admin-card, padding/gap
   inchangés), juste agrandie : 64px -> 96px. Rayon 16px, PAS 20px comme
   un premier essai l'avait mis (retour utilisateur : « les coins ont un
   rayon d'arrondi différent du reste du site ») — 16px est le palier
   standard du site (voir README, « Détail visuel » : .admin-card lui-même,
   .stat-tile, .map-list-item… tous à 16px), 20px cassait cette cohérence
   sans raison. */
.admin-card.host-listing-card{background:#fff;}
.admin-card.host-listing-card .admin-thumb{width:96px; height:96px; border-radius:16px;}
/* Bouton pause/reprise, à côté du badge de statut (retour utilisateur :
   "au niveau de l'info sur le statut de l'annonce, mettre aussi un bouton
   mettre en pause qui retire temporairement l'annonce du fil"). Même
   gabarit pilule que .host-status-badge, posé juste à côté, pour lire les
   deux comme une seule ligne d'état + action plutôt que deux éléments sans
   rapport. Voir toggleListingPause() : bascule status published<->paused,
   jamais proposé sur une annonce encore "pending" (rien à mettre en pause
   avant une première publication). */
.host-status-line{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.host-pause-btn{display:inline-flex; align-items:center; gap:5px; background:none; border:1.5px solid var(--line);
  border-radius:16px; padding:4px 10px 4px 8px; font-family:'Jost',sans-serif; font-size:10.5px; font-weight:700; color:var(--sauge-mid);}
.host-pause-btn svg{width:12px; height:12px; flex-shrink:0;}
/* Modifier/Supprimer avec pictogramme (retour utilisateur : "dans l'esprit
   des autres pages avec picto clair et moderne") — mêmes tracés que
   #coll-detail-rename/#coll-detail-delete (favoris), rien de réinventé.
   Supprimer distinct de Modifier par la couleur seulement (danger, contour
   discret) plutôt qu'un remplissage plein : une carte de liste n'a pas
   besoin d'un bouton rouge plein qui saute aux yeux à chaque scroll, le
   picto poubelle suffit à signaler l'intention. */
.host-edit-btn, .host-delete-btn{display:inline-flex; align-items:center; gap:6px; background:none; border-radius:16px;
  padding:8px 14px; font-family:'Jost',sans-serif; font-size:12.5px; font-weight:700;}
.host-edit-btn{border:1.5px solid var(--line); color:var(--ink);}
.host-delete-btn{border:1.5px solid rgba(178,84,59,.35); color:var(--danger);}
.host-edit-btn svg, .host-delete-btn svg{width:14px; height:14px; flex-shrink:0;}

.empty-state{text-align:center; padding:60px 30px; color:var(--sauge);}
.empty-state svg{width:44px; height:44px; margin-bottom:14px; opacity:.4;}
.empty-state p{font-size:14px; font-weight:600; margin:0;}

/* ---------- espace hôtes : annonces + calendrier simplifié ---------- */
.host-view{padding:24px 0 110px;}
/* Statut du compte (géré depuis Fiftin app / calendrier simplifié) — sa
   propre ligne, alignée à droite, en tête du volet calendrier déplié d'une
   annonce : c'est une propriété du COMPTE, pas de cette annonce en
   particulier, mais elle n'a de sens qu'une fois le volet ouvert. */
.host-status-row{display:flex; justify-content:flex-end; margin-bottom:10px;}
.host-status-badge{font-size:10px; font-weight:800; padding:4px 10px; border-radius:16px; white-space:nowrap;}
.host-status-badge.published, .host-status-badge.linked{background:var(--sauge-light); color:var(--sauge-deep);}
.host-status-badge.pending, .host-status-badge.standalone{background:var(--lavender-bg); color:var(--lavender-deep);}
.host-status-badge.paused{background:var(--cream-deep); color:var(--gray-mid);}
/* Encart "volet" pleine largeur, à l'intérieur de la carte d'annonce
   (.admin-card) — retour utilisateur d'origine : "j'aimerais que le
   calendrier soit sur la même carte que l'annonce (...) le bouton
   calendrier devrait plutôt être un encart volet et déplier le calendrier
   quand on clique dessus". D'abord une simple ligne séparée par un filet
   (même idiome que .cal-mini-head, l'accordéon des mois) ; retour
   utilisateur suivant : "j'aimerais que tu passes l'encart calendrier en
   jaune acide sur le fond avec typo centrée et flèche en dessous" — plus
   un filet discret, un vrai encart plein (même paire fond/texte que
   .btn.primary/.cal-add-pill, --yellow + --sauge-deep, déjà utilisée
   ailleurs sur le site pour une action qui doit se voir), texte centré,
   colonne plutôt que ligne (flèche sous le texte, pas à côté). Le chevron
   pointe vers le bas au repos (son tracé de base) et se retourne vers le
   haut une fois déplié — inversé par rapport à l'ancienne variante en
   ligne (qui partait tournée à -90°, vers la droite) : posée sous un
   texte centré, une flèche vers le bas se lit naturellement comme
   "dérouler en dessous". */
.cal-disclose{display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%;
  background:var(--yellow); border:none; border-radius:16px; margin-top:10px; padding:12px 10px; gap:4px;
  font-family:'Jost',sans-serif; font-size:12.5px; font-weight:800; color:var(--sauge-deep); text-align:center; cursor:pointer;}
.cal-disclose-chevron{width:16px; height:16px; color:var(--sauge-deep); flex-shrink:0; transition:transform .18s ease; transform:rotate(0deg);}
.cal-disclose.expanded .cal-disclose-chevron{transform:rotate(180deg);}
/* Contenu du calendrier déplié — toujours DANS .admin-card désormais (une
   seule carte, retour utilisateur), juste un peu d'espace sous la ligne
   .cal-disclose qui l'ouvre. */
.host-cal-panel{margin-top:10px;}
/* Choix de la chambre en onglets (retour utilisateur, remplace l'ancien
   va-et-vient "1/2 < Chambre Bleue >"). .detail-tabs/.detail-tab réutilisés
   tels quels (mêmes classes que la fiche détail d'une annonce à plusieurs
   chambres). Affichés uniquement s'il y a un vrai choix à faire (plusieurs
