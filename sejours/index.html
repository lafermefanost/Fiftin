/* Patche juste la classe .liked des cœurs déjà présents dans le DOM (fil
   Explorer, fiche détail) une fois les collections chargées/rechargées —
   jamais un re-rendu complet (voir bootFirebaseAuth()), qui détruirait
   inutilement l'instance Leaflet d'Explorer pour une simple connexion. Les
   punaises de la carte gardent leur limite déjà documentée (couleur "aimée"
   mise à jour seulement au prochain rendu complet). */
function refreshSavedHeartsInDom(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-like]"), function(el){
    var id = Number(el.getAttribute("data-like"));
    var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
    if(l) el.classList.toggle("liked", isListingSaved(l));
  });
}

var mapInstance = null;
var mapMarkerLayer = null;
var mapZoneArmed = false; // en attente d'un clic sur la carte pour poser/déplacer le repère — jamais persisté, juste un état d'interaction en cours
var mapZoneCircleLayer = null;
/* Carte agrandie (retour utilisateur : "une petite flèche qui permet
   d'agrandir la carte pour pouvoir travailler un peu plus dessus") — juste
   plus de hauteur à la même instance Leaflet déjà montée, jamais un
   renderFeed() complet (voir wireExploreMap()) : agrandir ne doit ni
   reconstruire les cartes d'annonces en dessous ni recadrer le zoom/pan
   déjà choisi par le voyageur. Jamais persisté : repart toujours repliée
   à l'ouverture. */
var mapExpanded = false;

/* Repère posé à la main sur la carte (centre + rayon, filters.zoneOrigin/
   filters.distance), pas un polygone libre — plus simple à poser et
   ajuster d'un doigt sur mobile qu'un tracé à main levée, pour un résultat
   tout aussi utile ici (chercher "autour de ce point"). */
function haversineKm(lat1, lng1, lat2, lng2){
  var R = 6371;
  var dLat = (lat2-lat1) * Math.PI/180, dLng = (lng2-lng1) * Math.PI/180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* Source des PINS de la carte embarquée — toujours listingIndexCache
   (via matchingIndexListings()), jamais LISTINGS : la carte montre tous
   les emplacements correspondant aux filtres actifs, y compris une
   annonce dont la fiche complète (photos) n'est pas encore chargée par
   la pagination du fil de cartes juste en dessous (voir PAGE_SIZE/
   renderFeed() et README, « Performance ») — sans ce découplage, la
   carte aurait été incomplète tant que le voyageur n'a pas cliqué
   "Charger plus" assez de fois pour tout voir. */
function mapPinsFromIndex(){
  return matchingIndexListings().filter(function(l){ return l.lat && l.lng; });
}

/* Même repli que coverHtml() pour la première photo disponible : la
   galerie de l'établissement, sinon celle de sa première chambre (annonce
   sans photo commune, seulement des photos par chambre). Aucune photo nulle
   part (annonce statique de démo, ou pas encore de photo envoyée) : null,
   la vignette retombe sur le dégradé de secours comme avant.
   Seul endroit qui affiche une photo en tout petit (tuile de collection
   ~250px, ligne "Demandes" ~50px) — préfère donc systématiquement
   galleryThumb[0]/unit.galleryThumb[0] (~480px, voir makeThumbFile()) à
   gallery[0] (jusqu'à 2048px, prévu pour la fiche détail) : une annonce
   créée/réenregistrée avant ce chantier n'a pas encore de galleryThumb
   et retombe naturellement sur le plein format, jamais d'image cassée. */
function listingThumbUrl(l){
  if(l.galleryThumb && l.galleryThumb.length && l.galleryThumb[0]) return l.galleryThumb[0];
  if(l.gallery && l.gallery.length) return l.gallery[0];
  if(l.units){
    for(var i=0;i<l.units.length;i++){
      var u = l.units[i];
      if(u.galleryThumb && u.galleryThumb.length && u.galleryThumb[0]) return u.galleryThumb[0];
      if(u.gallery && u.gallery.length) return u.gallery[0];
    }
  }
  return null;
}
/* Fait défiler le fil jusqu'à la carte (.card) de cette annonce et la fait
   brièvement clignoter (retour utilisateur, fusion de la carte dans
   Explorer) — remplace l'ancien mini-aperçu affiché sous la carte
   (.map-selected/renderMapSelectedCard/selectMapListing) : inutile
   maintenant que la carte complète (contact, "Voir plus"...) est déjà là,
   juste plus bas dans le même fil, pas besoin de la dupliquer. */
function scrollToFeedCard(id){
  var card = document.getElementById("card-"+id);
  if(!card){
    // La punaise cliquée peut référencer une annonce au-delà de la page
    // actuellement chargée (pagination, voir mapPinsFromIndex()) — sa
    // carte n'existe alors pas encore dans le fil : ouvrir sa fiche
    // détail directement plutôt que de ne rien faire (silencieux, avant
    // ce correctif) est le geste le plus proche de l'intention du clic.
    resolveListingById(id, function(l){ if(l) openDetail(id); });
    return;
  }
  card.scrollIntoView({behavior:"smooth", block:"start"});
  card.classList.add("card-pulse");
  setTimeout(function(){ card.classList.remove("card-pulse"); }, 1200);
}

/* Ré-affiche juste les punaises + le cercle de zone sans recréer la carte
   ni recadrer la vue — utilisé pendant le glissement du curseur de rayon,
   pour que la carte ne saute pas à chaque tick. */
function refreshExploreMapMarkers(){
  var located = mapPinsFromIndex();
  if(!mapInstance) return;
  if(mapMarkerLayer){ mapInstance.removeLayer(mapMarkerLayer); mapMarkerLayer = null; }
  var useCluster = !!window.L.markerClusterGroup;
  var clusterGroup = useCluster ? L.markerClusterGroup({
    maxClusterRadius:50,
    iconCreateFunction:function(cluster){
      return L.divIcon({
        className:"map-cluster-icon",
        html:'<div class="map-cluster"><span>'+cluster.getChildCount()+'</span></div>',
        iconSize:[38,38]
      });
    }
  }) : L.layerGroup();
  located.forEach(function(l){
    var icon = L.divIcon({
      className:"map-pin-icon",
      html:'<div class="map-pin'+(isListingSaved(l)?' liked':'')+'"><div class="dot"><span>'+l.price+'€</span></div></div>',
      iconSize:[30,30], iconAnchor:[15,36]
    });
    var marker = L.marker([l.lat, l.lng], {icon:icon});
    marker.on("click", function(){ scrollToFeedCard(l.id); });
    clusterGroup.addLayer(marker);
  });
  mapMarkerLayer = clusterGroup;
  mapInstance.addLayer(mapMarkerLayer);
  if(mapZoneCircleLayer && state.filters.distance!=null) mapZoneCircleLayer.setRadius(state.filters.distance*1000);
}

/* Squelette de la carte embarquée en tête du fil Explorer (retour
   utilisateur, fusion de l'ancien onglet "Carte") — inséré par renderFeed()
   AVANT les cartes d'annonces. L'instance Leaflet elle-même est montée
   ensuite par wireExploreMap(), une fois ce HTML posé dans le DOM (Leaflet
   a besoin que #map-canvas existe déjà). */
function exploreMapBlockHtml(){
  var f = state.filters;
  var hasZone = !!f.zoneOrigin;
  return '<div class="explore-map-block">'+
    '<div class="map-canvas'+(mapExpanded?' expanded':'')+'" id="map-canvas">'+
      '<button type="button" class="map-expand-btn" id="map-expand-btn" aria-label="'+(mapExpanded?"Réduire la carte":"Agrandir la carte")+'">'+MAP_EXPAND_ICON(mapExpanded)+'</button>'+
      '<button type="button" class="map-zone-btn'+(mapZoneArmed?' armed':'')+'" id="map-zone-btn">'+
        (mapZoneArmed ? "Touchez la carte pour choisir un lieu…" : (hasZone ? "Déplacer le repère" : "Choisir un lieu sur la carte"))+
      '</button>'+
    '</div>'+
    (hasZone ? '<div class="map-zone-controls">'+
      '<div class="map-zone-controls-head"><span>Rayon : <b id="map-zone-radius-label">'+f.distance+' km</b></span><button type="button" id="map-zone-clear">Effacer le repère</button></div>'+
      '<input type="range" id="map-zone-radius" min="1" max="'+MAX_DISTANCE_KM+'" value="'+f.distance+'">'+
    '</div>' : '')+
  '</div>';
}
/* Deux flèches diagonales, sens inversé selon l'état — même geste visuel
   qu'un "plein écran"/"réduire" classique, sans les faux-airs de vidéo qui
   viendraient d'une icône plein écran toute faite. Fonction plutôt que
   deux constantes : réutilisée à l'identique par wireExploreMap() pour
   rafraîchir juste l'icône au clic, sans reconstruire tout le bloc carte. */
function MAP_EXPAND_ICON(expanded){
  return expanded
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H3v6M21 9V3h-6M3 15v6h6M15 21h6v-6"/></svg>';
}

/* Monte/remonte l'instance Leaflet dans #map-canvas et câble les contrôles
   de zone — appelée par renderFeed() juste après avoir posé
   exploreMapBlockHtml() dans le DOM. Détruit et recrée systématiquement
   l'instance précédente (même limite qu'avant la fusion, sur l'ex-onglet
   Carte : perte du zoom/pan à chaque renderFeed() complet — filtre changé,
   tri, etc. — mais PAS sur un simple cœur cliqué sur Explorer, voir
   wireFeedEvents()/data-like, qui évite précisément cet appel, NI sur
   agrandir/réduire la carte, voir #map-expand-btn plus bas, qui évite
   spécifiquement un renderFeed() pour ne jamais faire sauter le zoom/pan
   en cours juste pour donner plus de place à la même vue). */
function wireExploreMap(){
  var f = state.filters;

  document.getElementById("map-expand-btn").addEventListener("click", function(){
    mapExpanded = !mapExpanded;
    document.getElementById("map-canvas").classList.toggle("expanded", mapExpanded);
    this.setAttribute("aria-label", mapExpanded ? "Réduire la carte" : "Agrandir la carte");
    this.innerHTML = MAP_EXPAND_ICON(mapExpanded);
    // setTimeout : le conteneur grandit/rétrécit avec une transition CSS
    // (voir .map-canvas), Leaflet doit attendre qu'elle soit terminée pour
    // mesurer la bonne taille — appeler invalidateSize() trop tôt le
    // laisserait dessiner sur l'ancienne taille jusqu'au prochain geste
    // (zoom, pan...) qui le forcerait à se corriger.
    setTimeout(function(){ if(mapInstance) mapInstance.invalidateSize(); }, 260);
  });

  document.getElementById("map-zone-btn").addEventListener("click", function(){
    mapZoneArmed = !f.zoneOrigin || !mapZoneArmed;
    renderFeed();
  });
  var clearBtn = document.getElementById("map-zone-clear");
  if(clearBtn) clearBtn.addEventListener("click", function(){
    f.zoneOrigin = null; f.distance = null; mapZoneArmed = false;
    persist(); renderFilterBar(); renderFeed(); renderResultLine();
  });
  // Même curseur, même amplitude que le volet Distance du bandeau du haut
  // (retour utilisateur : "je resterais sur la même jauge que celle de
  // distance, exactement le même outil") — id différent (#s-distance
  // n'existe que dans le volet, jamais affiché en même temps que la carte),
  // mais même type d'élément, même style global input[type=range], même
  // champ filters.distance derrière. "input" (à chaque cran du glissement)
  // ne fait que le strict nécessaire pour rester fluide : label + cercle +
  // punaises (refreshExploreMapMarkers(), qui relit déjà filters.distance
  // via matchingIndexListings()) + puce Distance du bandeau, jamais de
  // renderFeed() complet à chaque cran (démonterait/remonterait Leaflet en
  // continu). Les cartes du fil en dessous, elles, se resynchronisent une
  // seule fois au relâchement ("change"), comme une puce de filtre validée.
  var radiusInput = document.getElementById("map-zone-radius");
  if(radiusInput){
    radiusInput.addEventListener("input", function(){
      f.distance = Number(radiusInput.value);
      document.getElementById("map-zone-radius-label").textContent = f.distance+" km";
      if(mapZoneCircleLayer) mapZoneCircleLayer.setRadius(f.distance*1000);
      refreshExploreMapMarkers();
      renderFilterBar();
    });
    radiusInput.addEventListener("change", function(){
      persist(); renderFeed(); renderResultLine();
    });
  }

  if(mapInstance){ mapInstance.remove(); mapInstance = null; mapMarkerLayer = null; mapZoneCircleLayer = null; }
  if(!window.L) return;
  var located = mapPinsFromIndex();
  if(!located.length && !f.zoneOrigin) return;

  // zoomControl:false puis L.control.zoom() posé en bas à gauche à la main
  // (retour utilisateur : "il y'a le + et - de la carte qui passe dessus")
  // — Leaflet pose son +/- par défaut en haut à gauche, exactement sous
  // #map-expand-btn (même coin, voir sa CSS) : les deux se chevauchaient.
  // Aucun autre contrôle en bas, coin libre.
  mapInstance = L.map("map-canvas", {attributionControl:true, zoomControl:false});
  L.control.zoom({position:"bottomleft"}).addTo(mapInstance);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }).addTo(mapInstance);

  mapInstance.on("click", function(e){
    if(!mapZoneArmed) return;
    f.zoneOrigin = {lat:e.latlng.lat, lng:e.latlng.lng};
    // Rayon de départ raisonnable au tout premier repère posé (l'ancien
    // défaut, 5 km, était pensé pour un curseur qu'on affine ensuite à la
    // main — trop court pour un des presets ci-dessus qu'on ne fait plus
    // que cliquer) ; un repère déplacé garde le rayon déjà choisi.
    if(f.distance==null) f.distance = 25;
    mapZoneArmed = false;
    persist();
    /* setTimeout : renderFeed() détruit puis recrée mapInstance. Le faire
       de façon synchrone ici casse Leaflet, qui n'a pas fini de traiter
       cet événement "click" sur l'instance qu'on vient de supprimer. */
    setTimeout(function(){ renderFilterBar(); renderFeed(); renderResultLine(); }, 0);
  });

  if(f.zoneOrigin){
    /* Circle.getBounds() a besoin que la carte ait déjà une vue (centre +
       zoom) pour projeter son rayon en pixels — sans ça, Leaflet plante
       en interne. setView ici, avant fitBounds plus bas qui affine le
       cadrage sur le cercle réel. */
    mapInstance.setView([f.zoneOrigin.lat, f.zoneOrigin.lng], 12);
    mapZoneCircleLayer = L.circle([f.zoneOrigin.lat, f.zoneOrigin.lng], {
      radius:(f.distance||25)*1000, color:"#1D2820", weight:2, fillOpacity:.08
    }).addTo(mapInstance);
  }

  refreshExploreMapMarkers();

  if(f.zoneOrigin){
    mapInstance.fitBounds(mapZoneCircleLayer.getBounds(), {padding:[20,20]});
  } else if(located.length===1){
    mapInstance.setView([located[0].lat, located[0].lng], 12);
  } else if(located.length>1){
    mapInstance.fitBounds(L.featureGroup(located.map(function(l){ return L.marker([l.lat,l.lng]); })).getBounds(), {padding:[32,32]});
  }
  if(mapExpanded) mapInstance.invalidateSize();
}

function renderAdminQueue(){
  var feed = document.getElementById("feed");
  feed.innerHTML = '<div class="admin-queue">'+
    '<button type="button" class="admin-back" id="admin-back">&larr; Retour au profil</button>'+
    '<h2>Annonces à valider</h2>'+
    '<div id="admin-list"><p class="sheet-sub">Chargement…</p></div>'+
  '</div>';
  document.getElementById("admin-back").addEventListener("click", renderProfile);

  firebase.firestore().collection("listings").where("status","==","pending").orderBy("createdAt","desc").get().then(function(snap){
    var list = document.getElementById("admin-list");
    if(snap.empty){ list.innerHTML = '<p class="sheet-sub">Aucune annonce en attente pour le moment.</p>'; return; }
    list.innerHTML = snap.docs.map(function(doc){
      var l = doc.data();
      var coverUrl = listingCoverUrl(l);
      var cover = coverUrl
        ? '<img class="admin-thumb" src="'+coverUrl+'" alt="">'
        : '<div class="admin-thumb admin-thumb-empty"></div>';
      return '<div class="admin-card"><div class="admin-card-row">'+cover+
        '<div class="admin-card-body">'+
          '<b>'+esc(l.name||"(sans nom)")+'</b>'+
          '<span>'+esc(l.region||"")+' · '+listingPriceLabel(l)+' · '+listingDistanceKm(l)+' km'+(l.units?' · '+l.units.length+' chambre'+(l.units.length>1?'s':''):'')+'</span>'+
          '<span class="admin-owner">Déposée par '+esc(l.hostName||"")+' — '+esc(l.ownerEmail||"")+'</span>'+
          '<div class="admin-actions">'+
            '<button type="button" class="btn-apply admin-approve" data-id="'+doc.id+'">Publier</button>'+
            '<button type="button" class="admin-reject" data-id="'+doc.id+'">Refuser</button>'+
          '</div>'+
        '</div>'+
      '</div></div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll(".admin-approve"), function(btn){
      btn.addEventListener("click", function(){
        btn.disabled = true; btn.textContent = "Publication…";
        firebase.firestore().collection("listings").doc(btn.getAttribute("data-id")).update({
          status:"published", publishedAt:firebase.firestore.FieldValue.serverTimestamp()
        }).then(function(){
          fetchPublishedListings();
          fetchListingIndex(); // la carte doit refléter tout de suite la nouvelle annonce publiée, pas seulement le fil de cartes
          renderAdminQueue();
        }).catch(function(err){ alert("Erreur : "+(err.message||err.code)); btn.disabled = false; btn.textContent = "Publier"; });
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll(".admin-reject"), function(btn){
      btn.addEventListener("click", function(){
        if(!confirm("Supprimer définitivement cette annonce ?")) return;
        btn.disabled = true;
        firebase.firestore().collection("listings").doc(btn.getAttribute("data-id")).delete()
          .then(renderAdminQueue)
          .catch(function(err){ alert("Erreur : "+(err.message||err.code)); btn.disabled = false; });
      });
    });
  }).catch(function(err){
    document.getElementById("admin-list").innerHTML = '<p class="sheet-sub">Erreur de chargement : '+esc(err.message||err.code||"inconnue")+'</p>';
  });
}

function switchTab(tab){
  // Retour utilisateur : changer d'onglet laissait la page à la position
  // de défilement de l'onglet précédent, ce qui pouvait retomber tout en
  // bas d'un onglet plus court que le précédent (page blanche, contenu
  // hors écran au-dessus). Repartie du haut à chaque changement.
  window.scrollTo(0,0);
  // Cliquer un onglet de la barre du bas pendant qu'une fiche détail est
  // ouverte doit ramener naturellement au fil (ou à l'onglet visé) plutôt
  // que de laisser la fiche ouverte par-dessus le nouvel onglet — nav.tabbar
  // reste cliquable même fiche ouverte (voir sa règle CSS) précisément
  // pour permettre ça sans repasser par la flèche retour.
  if(state.detailListingId!=null) closeDetail();
  // Quitter Mes séjours invalide le cache de contactLog (voir
  // loadContactLogEntries()) : une prochaine visite doit relire l'état
  // réel plutôt que de re-servir des nombres/demandes potentiellement
  // périmés (confirmées/déclinées depuis un autre appareil, par exemple).
  if(state.tab==="likes" && tab!=="likes") contactLogCache = null;
  state.tab = tab;
  /* Fil Explorer uniquement (retour utilisateur, "façon feed Instagram") :
     cartes pleine largeur, coins droits — voir #feed.feed-explore en CSS.
     Basculé ici plutôt que dans renderFeed() (qui gère aussi Favoris, à
     ne pas toucher) pour ne jamais laisser la classe traîner sur #feed
     quand on part vers Carte/Profil, qui réutilisent .card ailleurs
     (carte sélectionnée, grande vignette Mes séjours) sans devoir hériter
     de ce style. */
  document.getElementById("feed").classList.toggle("feed-explore", tab==="explore");
  // Fond gris très léger (--cream-light) — Carte (fusionnée dans Explorer
  // depuis, voir plus haut) était la référence (retour utilisateur), repris
  // ici aussi pour Mes séjours et Profil. Le nom de classe "feed-map" reste
  // tel quel (réutilisé, pas renommé) pour limiter le diff : voir
  // #feed.feed-map en CSS. N'inclut plus "explore" : la carte, désormais
  // dans ce fil, garde le fond blanc de #feed.feed-explore.
  document.getElementById("feed").classList.toggle("feed-map", tab==="likes" || tab==="profile");
  // #result-line reçoit les mêmes classes que #feed, pour que .result-pill
  // affiche le même fond que le feed en dessous (voir commentaire CSS de
  // .result-pill — retour utilisateur, la pillule devait suivre ce fond,
  // pas rester figée en --cream).
  document.getElementById("result-line").classList.toggle("feed-explore", tab==="explore");
  document.getElementById("result-line").classList.toggle("feed-map", tab==="likes" || tab==="profile");
  /* Le hero (écran d'accueil plein écran) ne doit apparaître qu'une fois,
     au chargement initial — pas se répéter à chaque retour sur Explorer.
     Dès qu'on change d'onglet, il est masqué définitivement. La barre
     d'onglets, elle, n'a plus besoin d'être pilotée ici : elle est
     toujours à sa place (voir la hiérarchie de calques en CSS, plus bas). */
  if(!heroDismissed){
    heroDismissed = true;
    var heroEl = document.getElementById("hero");
    if(heroEl) heroEl.hidden = true;
  }
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(el){
    el.classList.toggle("active", el.getAttribute("data-tab")===tab);
  });
  // Bouton permanent "revenir à la carte" (retour utilisateur) — visible
  // uniquement sur Explorer, seul onglet où la carte existe désormais.
  var mapBackBtn = document.getElementById("map-back-btn");
  if(mapBackBtn) mapBackBtn.hidden = tab!=="explore";
  if(tab==="explore" || tab==="likes"){
    renderFilterBar();
    refreshLikesChrome();
  } else {
    document.getElementById("filter-bar").classList.add("chrome-collapsed");
    document.getElementById("result-line").classList.add("chrome-collapsed");
    renderProfile();
  }
}

/* ---------------- barre d'onglets : voyageur / hôte ---------------- */
/* La nav est reconstruite (innerHTML) à chaque bascule de mode plutôt que

var TRAVELER_TABS_HTML =

  '<button class="tab" data-tab="explore">'+

    '<span>Mes séjours</span>'+

  '<button class="tab" data-tab="profile">'+

var HOST_TABS_HTML =
  /* "Mon calendrier" fusionné dans "Mes annonces" (retour utilisateur :

     désormais directement dans sa propre carte (voir hostListingCardHtml/

  '<button class="tab" data-host-tab="listings">'+

    '<span>Mes annonces</span>'+
  '</button>'+

     "Espace voyageur" séparé (retour utilisateur) : redondant avec la
     tuile "Espace voyageur" du profil hôte lui-même (renderHostProfile(),
     bouton #btn-exit-host) — un seul chemin pour en sortir. */
  '<button class="tab" data-host-tab="profile">'+

function renderTabbar(){

      el.classList.toggle("active", el.getAttribute("data-host-tab")===state.hostTab);

    });

      el.classList.toggle("active", el.getAttribute("data-tab")===state.tab);

    });

/* ---------------- espace hôtes ---------------- */
/* Bascule déclenchée depuis Profil → Espace hôtes (connecté) : remplace la
   barre d'onglets et le contenu de #feed, masque le bandeau de filtres
   (qui n'a pas de sens ici) — sans toucher au reste de la mécanique
   voyageur (state.tab reste tel quel, on y revient via exitHostMode).
   Atterrit sur l'onglet Profil (retour utilisateur : atterrir sur "Mes
   annonces" surprenait, "on devrait rester sur la vue profil") — c'est
   aussi depuis ce Profil hôte qu'on ressort vers l'espace voyageur (voir
   HOST_TABS_HTML, plus de 3e onglet séparé pour ça). */
function enterHostMode(){
  if(!authState.uid){ authContext = "host"; openSheet("auth"); return; }
  // Même correctif que switchTab() : repartir du haut à chaque changement
  // de menu, pour ne pas atterrir en espace hôtes à la position de
  // défilement laissée côté voyageur.
  window.scrollTo(0,0);
  /* Jusqu'ici, enterHostMode() n'était atteignable qu'après un clic sur
     l'onglet Profil, qui masque déjà le hero (voir switchTab). Depuis que
     "Devenir hôte" peut inscrire puis entrer directement en mode hôte sans
     jamais passer par un onglet voyageur, il faut le faire ici aussi —
     sinon le hero (z-index au-dessus de la barre d'onglets) reste affiché
     par-dessus la nouvelle barre d'onglets hôte, qui devient invisible et
     inaccessible tant qu'on n'a pas scrollé au moins une fois. */
  if(!heroDismissed){
    heroDismissed = true;
    var heroEl = document.getElementById("hero");
    if(heroEl) heroEl.hidden = true;
  }
  state.hostMode = true;
  state.hostTab = "profile";
  state.hostListingId = null;
  state.hostUnitId = null;
  hostListingsCache = [];
  hostAccountCache = undefined;
  document.getElementById("filter-bar").classList.add("chrome-collapsed");
  document.getElementById("result-line").classList.add("chrome-collapsed");
  persist();
  renderTabbar();
  renderHostTabContent();
}
function exitHostMode(){
  state.hostMode = false;
  persist();
  renderTabbar();
  switchTab("profile");
}
function switchHostTab(tab){
  // Même correctif que switchTab() : repartir du haut à chaque changement
  // d'onglet côté hôte (Mes annonces / Profil — "Mon calendrier" fusionné
  // dans "Mes annonces", voir HOST_TABS_HTML).
  window.scrollTo(0,0);
  state.hostTab = tab;
  persist();
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(el){
    el.classList.toggle("active", el.getAttribute("data-host-tab")===tab);
  });
  renderHostTabContent();
}
function renderHostTabContent(){
  // Même fond gris très léger que Carte/Mes séjours/Profil côté voyageur
  // (retour utilisateur, "pareil pour la vue profil côté hôtes") — posé ici
  // plutôt que dans enterHostMode()/switchHostTab() séparément : ce sont les
  // deux seuls chemins qui mènent ici, inutile de dupliquer. "Mes annonces"
  // n'est pas concerné (déjà le cas avant la fusion du calendrier dedans) :
  // ses propres cartes (.admin-card) et, une fois dépliée, la carte blanche
  // du calendrier (.cal-card) se détachent très bien du fond crème normal.
  document.getElementById("feed").classList.toggle("feed-map", state.hostTab==="profile");
  if(state.hostTab==="profile") renderHostProfile();
  else renderHostListings();
}
/* Profil côté hôte — même en-tête/bascule voyageur⇄hôtes que renderProfile()
   (data-switch="voyageur" y mène désormais à exitHostMode() plutôt qu'à
   switchTab("explore"), seule différence de câblage), mais des lignes
   différentes en dessous : les formules hôte (HOST_FORMULAS) plutôt que
   les réglages voyageur, qui n'ont pas de sens ici. Formules affichées en
   LECTURE SEULE (formulaCardReadOnlyHtml()) : la vraie formule vient de
   accounts/{uid}.settings.plan côté Fiftin app (resolveHostAccount(), déjà
   utilisé ailleurs pour le calendrier) — "simple" par défaut si aucun
   compte de gestion n'existe (hôte "compte simple annonce"). Ce fichier
   n'écrivant jamais sur un accounts/{uid} existant (voir le commentaire
   de resolveHostAccount()), changer de formule reste à faire depuis
   Fiftin app (Réglages → Compte), pas d'ici. */
function renderHostProfile(){

    '</div></div>'+
    '<div class="profile-card"><div class="profile-card-title">Votre formule</div>'+
    '<div class="formula-picker" id="host-formulas">'+
      HOST_FORMULAS.map(function(f){ return formulaCardReadOnlyHtml(f, f.value==="simple"); }).join("")+
    '</div>'+

    '</div>'+

/* Annonces du compte connecté (ownerUid == authState.uid), quel que soit
   leur statut (pending/published) — contrairement au fil public, un hôte
   doit voir ses propres annonces même avant validation. Mis en cache pour
   la durée de la session hôte (voir enterHostMode). */
function ensureHostListingsLoaded(cb){
  if(hostListingsCache && hostListingsCache._loaded){ cb(hostListingsCache); return; }
  if(!authState.uid || typeof firebase==="undefined"){ cb([]); return; }
  firebase.firestore().collection("listings").where("ownerUid","==",authState.uid).get().then(function(snap){
    var list = snap.docs.map(function(doc){ var d = doc.data(); d.id = doc.id; return d; });
    list._loaded = true;
    hostListingsCache = list;
    cb(list);
  }).catch(function(){ cb([]); });
}

/* Compte Fiftin app (outil de planning) du même utilisateur, s'il existe —
   même Firebase, même uid (voir commentaire plus haut sur FIFTIN_FIREBASE_CONFIG).
   Sa seule existence qualifie l'hôte de « compte gestion » (voir le grand
   commentaire au-dessus de fetchHostBookings) : lu uniquement, jamais
   modifié — aucune écriture vers accounts/{uid} n'existe dans ce fichier. */
function resolveHostAccount(cb){
  if(hostAccountCache !== undefined){ cb(hostAccountCache); return; }
  if(!authState.uid || typeof firebase==="undefined"){ hostAccountCache = null; cb(null); return; }
  firebase.firestore().collection("accounts").doc(authState.uid).get().then(function(doc){
    hostAccountCache = doc.exists ? doc.data() : null;
    cb(hostAccountCache);
  }).catch(function(){ hostAccountCache = null; cb(null); });
}
function hostGuestName(guestId){
  var guests = (hostAccountCache && hostAccountCache.guests) || [];
  var g = guests.filter(function(x){ return x.id===guestId; })[0];
  return g ? g.name : "Client";
}

function renderHostListings(){
  var feed = document.getElementById("feed");
  feed.innerHTML = '<div class="host-view"><p class="sheet-sub" style="margin-top:0;">Chargement…</p></div>';
  ensureHostListingsLoaded(function(listings){
    if(state.hostTab!=="listings") return; /* l'hôte a changé d'onglet pendant le chargement */
    if(!listings.length){ feed.innerHTML = hostEmptyHtml(); wireHostEmpty(); return; }
    // L'annonce dépliée peut avoir disparu (supprimée ailleurs) — filet de
    // sécurité, sinon loadHostListingCalendar() plus bas ne trouverait rien.
    if(state.hostListingId && !listings.some(function(l){ return l.id===state.hostListingId; })){
      state.hostListingId = null; state.hostUnitId = null;
    }
    feed.innerHTML = '<div class="host-view">'+
      '<button type="button" class="btn-apply" id="host-new-listing" style="margin-bottom:18px;">+ Nouvelle annonce</button>'+
      listings.map(hostListingCardHtml).join("")+
    '</div>';
    document.getElementById("host-new-listing").addEventListener("click", function(){ hostFormEditListing = null; openSheet("hostform"); });
    // "Voir les calendriers" — déplie/replie le calendrier de CETTE annonce
    // directement sous sa carte (retour utilisateur : "2 menus ne sont pas
    // nécessaires", fusion de l'ancien onglet "Mon calendrier" ici). Un seul
    // volet ouvert à la fois (state.hostListingId), comme l'ancien onglet ne
    // montrait qu'une seule annonce à la fois lui aussi.
    Array.prototype.forEach.call(document.querySelectorAll("[data-cal-expand]"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-cal-expand");
        state.hostListingId = (state.hostListingId===id) ? null : id;
        state.hostUnitId = null;
        renderHostListings();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-host-edit]"), function(btn){
      btn.addEventListener("click", function(){
        var listingId = btn.getAttribute("data-host-edit");
        hostFormEditListing = listings.filter(function(l){ return l.id===listingId; })[0];
        openSheet("hostform");
      });
    });
    // Pause/reprise (voir toggleListingPause()) et suppression (voir
    // deleteListing()) — retour utilisateur, "Mes annonces". stopPropagation
    // même s'il n'y a aujourd'hui aucun clic parent sur .admin-card-row à
    // court-circuiter : ces deux boutons restent, comme .log-actions
    // ailleurs, dans une carte qui pourrait un jour devenir elle-même
    // cliquable (ouvrir un détail, par ex.) sans qu'on ait à s'en souvenir
    // ici.
    Array.prototype.forEach.call(document.querySelectorAll("[data-host-pause]"), function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        toggleListingPause(btn.getAttribute("data-host-pause"), btn.getAttribute("data-pause-to"));
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-host-delete]"), function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var listingId = btn.getAttribute("data-host-delete");
        var l = listings.filter(function(x){ return x.id===listingId; })[0];
        if(l) deleteListing(l);
      });
    });
    if(state.hostListingId){
      var expandedListing = listings.filter(function(l){ return l.id===state.hostListingId; })[0];
      if(expandedListing) loadHostListingCalendar(expandedListing);
    }
  });
}
/* Bascule published<->paused (retour utilisateur : "un bouton mettre en
   pause qui retire temporairement l'annonce du fil") — jamais proposé sur
   une annonce encore "pending" (voir hostListingCardHtml(), rien à mettre
   en pause avant une première publication par un admin). Nécessite une
   règle Firestore dédiée (README, « Règles Firestore à appliquer ») qui
   autorise le propriétaire à alterner UNIQUEMENT entre published et
   paused — la règle d'origine figeait status à sa valeur courante pour
   tout le monde sauf un admin, pour empêcher un hôte de s'auto-publier
   depuis "pending" ; sans cette mise à jour de règle, cet appel échoue en
   production avec permission-denied (fonctionne quand même dans les tests
   Playwright, dont le mock ne connaît pas les règles réelles).
   syncPublicListingIndex (functions/index.js) retire déjà l'annonce de
   listingIndex dès que status n'est plus "published", quelle que soit la
   nouvelle valeur — rien à changer côté Cloud Function pour ce nouveau
   statut. */
function toggleListingPause(id, toStatus){
  firebase.firestore().collection("listings").doc(id).update({status: toStatus})
    .then(function(){
      hostListingsCache = [];
      if(state.hostMode && state.hostTab==="listings") renderHostListings();
    })
    .catch(function(err){ alert("Erreur : "+(err.message||err.code)); });
}
/* Suppression définitive — déjà permise par la règle Firestore existante
   (propriétaire ou admin), aucune mise à jour de règle nécessaire ici,
   contrairement à toggleListingPause() ci-dessus. syncPublicListingIndex
   retire aussi l'entrée listingIndex correspondante (onDocumentWritten
   couvre les suppressions : before rempli, after vide). */
function deleteListing(l){
  openConfirmSheet('Supprimer "'+(l.name||"cette annonce")+'" ? Cette action est définitive.', "Oui, supprimer", "Non, garder l'annonce", function(){
    firebase.firestore().collection("listings").doc(l.id).delete()
      .then(function(){
        hostListingsCache = [];
        if(state.hostListingId===l.id){ state.hostListingId = null; state.hostUnitId = null; }
        if(state.hostMode && state.hostTab==="listings") renderHostListings();
      })
      .catch(function(err){ alert("Erreur : "+(err.message||err.code)); });
  });
}

  return '<div class="admin-card host-listing-card">'+

/* ---------------- calendrier simplifié (année, mini-mois) ---------------- */
var CAL_MONTH_NAMES = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var CAL_DOW = ["L","M","M","J","V","S","D"];
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoDate(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function mondayIndex(jsDay){ return (jsDay+6)%7; }
function isoWeekNumber(y,m,d){
  var date = new Date(Date.UTC(y, m, d));
  var dayNum = (date.getUTCDay()+6)%7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  var firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  var diff = date - firstThursday;
  return 1 + Math.round(diff/(7*24*3600*1000));
}
/* Étale chaque réservation sur ses jours occupés (checkOut exclusif, comme
   dans Fiftin app — voir activeOn() de app/index.html) pour construire une
   table date -> réservation directement consultable par le rendu des
   mini-mois. Les réservations "no" (annulées, côté Fiftin app) ne comptent
   pas comme occupées. */
function occupiedDatesFromBookings(bookings){
  var map = {};
  bookings.forEach(function(b){
    if(b.status==="no") return;
    if(!b.checkIn || !b.checkOut) return;
    var d = new Date(b.checkIn+"T00:00:00");
    var end = new Date(b.checkOut+"T00:00:00");
    while(d < end){
      map[isoDate(d.getFullYear(), d.getMonth(), d.getDate())] = b;
      d.setDate(d.getDate()+1);
    }
  });
  return map;
}
function monthMiniHtml(year, monthIdx, occMap, todayStr){
  var nDays = daysInMonth(year, monthIdx);
  var firstDow = mondayIndex(new Date(year, monthIdx, 1).getDay());
  var head = '<div class="cal-mini-wn"></div>' + CAL_DOW.map(function(l){ return '<div class="cal-mini-dow">'+l+'</div>'; }).join("");
  var totalCells = firstDow + nDays;
  var rows = Math.ceil(totalCells/7);
  var body = "";
  var dayCounter = 1 - firstDow;
  for(var r=0;r<rows;r++){
    var wnDay = dayCounter<1 ? 1 : (dayCounter>nDays?nDays:dayCounter);
    body += '<div class="cal-mini-wn">'+isoWeekNumber(year,monthIdx,wnDay)+'</div>';
    for(var c=0;c<7;c++){
      if(dayCounter<1 || dayCounter>nDays){
        body += '<div class="cal-mini-day empty"></div>';
      } else {
        var ds = isoDate(year, monthIdx, dayCounter);
        var occ = occMap[ds];
        body += '<div class="cal-mini-day'+(occ?' occ':'')+(ds===todayStr?' today':'')+'" data-date="'+ds+'">'+dayCounter+'</div>';
      }
      dayCounter++;
    }
  }
  /* Comparé à la vraie date du jour (todayStr), pas à l'année affichée :
     un mois passé de l'année en cours est replié, mais aussi bien tout
     mois d'une année entièrement passée que, à l'inverse, tout mois d'une
     année future reste déplié — voir le commentaire CSS de .cal-mini. */
  var todayY = Number(todayStr.slice(0,4)), todayM = Number(todayStr.slice(5,7))-1;
  var isCurrent = (year===todayY && monthIdx===todayM);
  var isPast = (year<todayY) || (year===todayY && monthIdx<todayM);
  return '<div class="cal-mini'+(isPast?' collapsed':'')+(isCurrent?' current-month':'')+'">'+
    '<button type="button" class="cal-mini-head" data-cal-toggle>'+
      '<span>'+CAL_MONTH_NAMES[monthIdx]+(isCurrent ? '<span class="cal-mini-current-tag">Ce mois-ci</span>' : '')+'</span>'+
      '<svg class="cal-mini-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'+
    '</button>'+
    '<div class="cal-mini-grid">'+head+body+'</div></div>';
}

/* Deux catégories d'hôtes, jamais un choix par annonce :
   - compte simple annonce (pas de document accounts/{uid}, donc pas de
     compte Fiftin app) : le calendrier de Séjours EST leur seul outil —
     lecture/écriture complète, stockée dans listings/{id}/bookings.
   - compte gestion (accounts/{uid} existe — 'essentiel' ou 'pro' sont les
     deux seuls plans côté Fiftin app, il n'y a pas de palier gratuit, donc
     "le document existe" suffit à qualifier ce statut) : Séjours affiche
     en LECTURE SEULE les réservations déjà présentes dans accounts/{uid},
     pour éviter un double-emploi visuel, mais n'y écrit jamais rien —
     ajouter/modifier une réservation se fait exclusivement depuis Fiftin
     app. Aucune écriture dans accounts/{uid} n'existe nulle part dans ce
     fichier : c'est une garantie structurelle, pas une précaution au cas
     par cas. */
/* Nettoie les liens vers une chambre Fiftin app qui n'existe plus (compte
   gestion, unit.linkedRoomId) — par ex. après suppression de cette chambre
   côté app/ (delRoom). Un lien qui pointe dans le vide n'empêche rien de
   fonctionner (fetchHostBookings retombe juste sur une liste vide), mais
   reste affiché comme "relié" dans le sélecteur sans plus rien signifier ;
   ceci le réinitialise proprement dès qu'on le détecte. N'écrit rien
   lui-même : renvoie juste {units, changed} à l'appelant, qui décide quand
   persister (voir renderHostCalendar et openSheet 'hostform'). */
function pruneStaleLinkedRoomIds(units, rooms){
  var roomIds = {};
  (rooms||[]).forEach(function(r){ roomIds[r.id] = true; });
  var changed = false;
  var cleaned = (units||[]).map(function(u){
    if(u.linkedRoomId && !roomIds[u.linkedRoomId]){
      changed = true;
      return Object.assign({}, u, {linkedRoomId:""});
    }
    return u;
  });
  return {units:cleaned, changed:changed};
}

function fetchHostBookings(listing, unit, isGestion, linkedRoomId, account, cb){
  if(isGestion){
    var all = (account && account.bookings) || [];
    cb(linkedRoomId ? all.filter(function(b){ return b.roomId===linkedRoomId; }) : []);
  } else {
    firebase.firestore().collection("listings").doc(listing.id).collection("bookings").where("unitId","==",unit.id).get().then(function(snap){
      cb(snap.docs.map(function(doc){ var d = doc.data(); d.id = doc.id; return d; }));
    }).catch(function(){ cb([]); });
  }
}

// Remplace l'ancien renderHostCalendar()/renderHostCalendarBody() (page
// pleine, onglet "Mon calendrier" séparé) — fusion dans "Mes annonces"
// (retour utilisateur : "2 menus ne sont pas nécessaires") : chaque annonce
// se déplie directement dans sa propre carte, cible #host-cal-panel (posé
// par hostListingCardHtml() quand state.hostListingId===listing.id) plutôt
// que tout #feed. Plus besoin de tuiles de logement pour changer d'annonce
// (listingSwitchHtml, disparu) : ça se fait déjà en repliant/dépliant la
// bonne carte dans la liste.
function loadHostListingCalendar(listing){
  var panel = document.getElementById("host-cal-panel");
  if(!panel) return; /* volet fermé entre-temps */
  var units = listing.units || [];
  if(!units.length){
    panel.innerHTML = '<p class="sheet-sub" style="margin:0 0 12px;">Cette annonce n\'a pas encore de chambre.</p>'+
      '<button type="button" class="btn-apply" id="cal-edit-listing">Modifier l\'annonce pour en ajouter une</button>';
    document.getElementById("cal-edit-listing").addEventListener("click", function(){
      hostFormEditListing = listing;
      openSheet("hostform");
    });
    return;
  }
  if(!state.hostUnitId || !units.some(function(u){ return u.id===state.hostUnitId; })){
    state.hostUnitId = units[0].id;
  }
  var unit = units.filter(function(u){ return u.id===state.hostUnitId; })[0];
  resolveHostAccount(function(account){
    if(state.hostListingId!==listing.id) return; /* volet refermé/changé pendant la lecture */
    var isGestion = !!account;
    var rooms = (account && account.settings && account.settings.rooms) || [];
    var pruned = pruneStaleLinkedRoomIds(units, rooms);
    var afterPrune = function(){
      var linkedRoomId = unit.linkedRoomId || "";
      fetchHostBookings(listing, unit, isGestion, linkedRoomId, account, function(bookings){
        if(state.hostListingId!==listing.id) return;
        renderHostCalendarPanel(listing, unit, rooms, linkedRoomId, isGestion, bookings);
      });
    };
    if(pruned.changed){
      listing.units = pruned.units;
      unit = pruned.units.filter(function(u){ return u.id===unit.id; })[0];
      firebase.firestore().collection("listings").doc(listing.id).update({units:pruned.units}).then(afterPrune).catch(afterPrune);
    } else {
      afterPrune();
    }
  });
}


function renderHostCalendarPanel(listing, unit, rooms, linkedRoomId, isGestion, bookings){
  var panel = document.getElementById("host-cal-panel");
  if(!panel) return;
  var units = listing.units || [];
  var occ = occupiedDatesFromBookings(bookings);
  var year = state.hostCalYear;
  var now = new Date();
  var todayStr = isoDate(now.getFullYear(), now.getMonth(), now.getDate());
  var months = "";
  for(var m=0;m<12;m++) months += monthMiniHtml(year, m, occ, todayStr);

  // Onglets pour choisir la chambre — uniquement s'il y en a plusieurs
  // (retour utilisateur, fusion des deux anciens onglets : "tu vois les
  // onglets chambres si il y en a plusieurs ou tu vois le calendrier
  // unique"). Revient sur cette condition plutôt que "toujours affichés,
  // même un seul" (choix d'une passe précédente, quand ce volet vivait
  // seul dans son propre onglet "Mon calendrier" et avait besoin de son
  // propre chrome constant) : une fois qu'on est déjà DANS la carte de
  // l'annonce voulue, il ne reste plus qu'à choisir la chambre s'il y a un
  // choix réel à faire.
  var hasTabs = units.length>1;
  var unitPagerHtml = hasTabs ? '<div class="detail-tabs cal-unit-tabs">'+
    units.map(function(u){ return '<button type="button" class="detail-tab'+(u.id===unit.id?' active':'')+'" data-unit-tab="'+esc(u.id)+'">'+esc(u.name||"(sans nom)")+'</button>'; }).join("")+
  '</div>' : '';

  // "Planning associé" : le SEUL endroit où une chambre Fiftin app (rooms)
  // apparaît — un cartouche d'état (pas une navigation) qui ouvre un volet
  // de choix au clic (voir kind==="roomlink"). Retour utilisateur : "juste
  // un lien possible entre les deux si besoin", jamais une chambre Fiftin
  // app ne doit se voir proposée en onglet de premier plan comme celles
  // du dessus.
  var curRoomName = linkedRoomId ? (rooms.filter(function(r){ return r.id===linkedRoomId; })[0] || {}).name : "";
  var roomLinkHtml = (isGestion && rooms.length) ?
    '<button type="button" class="planning-chip" id="planning-chip-btn">'+
      '<span class="planning-chip-text"><span class="planning-chip-label">Planning associé</span>'+
        '<span class="planning-chip-value">'+(curRoomName ? esc(curRoomName)+" (en lecture seule, géré depuis fiftin.app)" : "Aucun — associer un planning")+'</span></span>'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>'+
    '</button>' : '';

  // Texte + picto "lien externe" (retour utilisateur) — même tracé que les
  // liens Site/Avis Google de la fiche détail (svg.ext), déjà le pictogramme
  // "on quitte ce site" établi ailleurs dans l'app plutôt qu'un nouveau.
  var actionPillHtml = isGestion
    ? '<a class="cal-add-pill" href="../app/" target="_blank" rel="noopener">Ajouter/modifier réservation depuis fiftin.app'+
        '<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg></a>'
    : '<button type="button" class="cal-add-pill" id="cal-add-btn">+ Réservation</button>';

  // Cartouche + bouton Ajouter/modifier DANS la carte blanche du calendrier
  // (retour utilisateur, passe précédente), soudée sans espace aux onglets
  // de chambre juste au-dessus quand il y en a (.cal-card sans le modifier
  // "solo" — coins hauts carrés) ; coins tous arrondis sinon (.cal-card.solo
  // — rien au-dessus à souder, une seule chambre).
  panel.innerHTML =
    (isGestion ? '' : '<div class="host-status-row"><span class="host-status-badge standalone">Calendrier simplifié</span></div>')+
    unitPagerHtml+
    '<div class="cal-card'+(hasTabs ? '' : ' solo')+'">'+
      roomLinkHtml+
      '<div class="cal-top-row">'+
        '<div class="cal-top-actions">'+
          actionPillHtml+
        '</div>'+
      '</div>'+
      '<div class="cal-year-nav">'+
        '<button type="button" id="cal-year-prev" aria-label="Année précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>'+
        '<b>'+year+'</b>'+
        '<button type="button" id="cal-year-next" aria-label="Année suivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>'+
      '</div>'+
      '<div class="cal-year-grid">'+months+'</div>'+
    '</div>';

  if(units.length>1){
    Array.prototype.forEach.call(panel.querySelectorAll("[data-unit-tab]"), function(btn){
      btn.addEventListener("click", function(){
        var newId = btn.getAttribute("data-unit-tab");
        if(newId===unit.id) return;
        state.hostUnitId = newId;
        loadHostListingCalendar(listing);
      });
    });
  }
  var planningChipBtn = document.getElementById("planning-chip-btn");
  if(planningChipBtn) planningChipBtn.addEventListener("click", function(){
    hostRoomLinkContext = {listing:listing, unit:unit, rooms:rooms, linkedRoomId:linkedRoomId};
    openSheet("roomlink");
  });
  document.getElementById("cal-year-prev").addEventListener("click", function(){ state.hostCalYear--; renderHostCalendarPanel(listing, unit, rooms, linkedRoomId, isGestion, bookings); });
  document.getElementById("cal-year-next").addEventListener("click", function(){ state.hostCalYear++; renderHostCalendarPanel(listing, unit, rooms, linkedRoomId, isGestion, bookings); });
  var addBtn = document.getElementById("cal-add-btn");
  if(addBtn) addBtn.addEventListener("click", function(){
    hostBookingContext = {mode:"add", listing:listing, unit:unit, isGestion:false, date:null};
    openSheet("hostbooking");
  });
  Array.prototype.forEach.call(panel.querySelectorAll(".cal-mini-day[data-date]"), function(el){
    var ds = el.getAttribute("data-date");
    var occBooking = occ[ds];
    if(isGestion && !occBooking) return; /* rien à afficher, rien à ajouter depuis ici */
    el.addEventListener("click", function(){
      if(occBooking){
        hostBookingContext = {mode:"view", listing:listing, unit:unit, isGestion:isGestion, booking:occBooking};
      } else {
        hostBookingContext = {mode:"add", listing:listing, unit:unit, isGestion:false, date:ds};
      }
      openSheet("hostbooking");
    });
  });
  Array.prototype.forEach.call(panel.querySelectorAll("[data-cal-toggle]"), function(btn){
    btn.addEventListener("click", function(){ btn.closest(".cal-mini").classList.toggle("collapsed"); });
  });
}

function submitAddBooking(){
  var ctx = hostBookingContext;
  var name = document.getElementById("hb-name").value.trim();
  var checkIn = document.getElementById("hb-checkin").value;
  var checkOut = document.getElementById("hb-checkout").value;
  var errEl = document.getElementById("hb-err");
  errEl.textContent = "";
  if(!name){ errEl.textContent = "Nom du client requis."; return; }
  if(!checkIn || !checkOut){ errEl.textContent = "Renseignez les deux dates."; return; }
  if(checkIn >= checkOut){ errEl.textContent = "Le départ doit être après l'arrivée."; return; }
  if(typeof firebase==="undefined"){ errEl.textContent = "Connexion indisponible — réessayez dans un instant."; return; }
  var btn = document.getElementById("sheet-apply");
  btn.disabled = true;
  /* Toujours listings/{id}/bookings, jamais accounts/{uid} — voir le
     commentaire au-dessus de fetchHostBookings. */
  firebase.firestore().collection("listings").doc(ctx.listing.id).collection("bookings").add({
    unitId:ctx.unit.id, name:name, checkIn:checkIn, checkOut:checkOut, createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    closeSheet();
    loadHostListingCalendar(ctx.listing);
  }).catch(function(err){ errEl.textContent = "Erreur : "+(err.message||err.code); btn.disabled = false; });
}
function submitDeleteBooking(){
  var ctx = hostBookingContext;
  if(ctx.isGestion) return; /* pas de bouton dans ce cas, filet de sécurité */
  if(!confirm("Supprimer cette réservation ?")) return;
  firebase.firestore().collection("listings").doc(ctx.listing.id).collection("bookings").doc(ctx.booking.id).delete()
    .then(function(){ closeSheet(); loadHostListingCalendar(ctx.listing); })
    .catch(function(err){ alert("Erreur : "+(err.message||err.code)); });
}

document.getElementById("hero-scroll-btn").addEventListener("click", function(){
  document.querySelector(".filters").scrollIntoView({behavior:"smooth", block:"start"});
});
/* Bouton fixe "revenir à la carte" (voir .map-back-btn en CSS) — élément
   statique du squelette HTML, câblé une seule fois ici plutôt que recâblé
   à chaque renderFeed() ; .map-canvas est toujours présent quand ce bouton
   est visible (uniquement affiché sur Explorer, voir switchTab()), sauf
   pendant le tout premier "Chargement…" avant que renderFeed() n'ait posé
   la carte — querySelector renvoie alors null, d'où la garde. */
document.getElementById("map-back-btn").addEventListener("click", function(){
  var mc = document.querySelector(".map-canvas");
  if(mc) mc.scrollIntoView({behavior:"smooth", block:"start"});
});


/* ---------------- init ---------------- */
/* Lien de partage (?listing=<id>, voir shareListing()) : ouvre directement
   la fiche détail de l'annonce visée si elle est déjà chargée. Appelée
   après CHAQUE source de données (listings.json, puis Firestore) plutôt
   qu'une seule fois, parce que l'annonce visée est presque toujours une
   annonce réelle (Firestore, qui répond après le fichier statique) —
   deepLinkHandled empêche de rouvrir la fiche une fois trouvée. */
var deepLinkHandled = false;
function maybeOpenDeepLink(){
  if(deepLinkHandled) return;
  var idParam = new URLSearchParams(location.search).get("listing");
  if(!idParam) return;
  var id = Number(idParam);
  // resolveListingById() va elle-même chercher l'annonce au-delà de la
  // page actuellement chargée si besoin (pagination, voir son
  // commentaire) — plusieurs appels avant résolution sont possibles
  // (fetchPublishedListings() puis maybeFinishInitialLoad(), l'index n'est
  // pas forcément encore chargé au premier), donc deepLinkHandled n'est
  // posé qu'au moment de vraiment ouvrir la fiche, pas à la tentative.
  resolveListingById(id, function(l){
    if(deepLinkHandled || !l) return;
    deepLinkHandled = true;
    if(!heroDismissed){
      heroDismissed = true;
      var heroEl = document.getElementById("hero");
      if(heroEl) heroEl.hidden = true;
    }
    openDetail(id);
  });
}

/* state.hostMode ici ne peut venir que de la restauration localStorage
   ci-dessus (jamais mis à true par défaut) — un rechargement pendant une
   session hôte doit rouvrir directement l'espace hôtes, hero compris
   (sinon il resterait affiché par-dessus la barre d'onglets hôte, voir
   le commentaire de enterHostMode()), pas revenir sur Explorer. */
if(state.hostMode){
  heroDismissed = true;
  var heroElBoot = document.getElementById("hero");
  if(heroElBoot) heroElBoot.hidden = true;
  document.getElementById("filter-bar").classList.add("chrome-collapsed");
  document.getElementById("result-line").classList.add("chrome-collapsed");
  renderTabbar();
  renderHostTabContent();
} else {
  renderTabbar();
  renderFilterBar();
  document.getElementById("feed").classList.toggle("feed-explore", state.tab==="explore"); // voir switchTab() : state.tab vaut "explore" par défaut ici, jamais passé par switchTab() au tout premier rendu
  document.getElementById("feed").classList.toggle("feed-map", state.tab==="likes" || state.tab==="profile");
  document.getElementById("result-line").classList.toggle("feed-explore", state.tab==="explore");
  document.getElementById("result-line").classList.toggle("feed-map", state.tab==="likes" || state.tab==="profile");
  var mapBackBtnBoot = document.getElementById("map-back-btn");
  if(mapBackBtnBoot) mapBackBtnBoot.hidden = state.tab!=="explore";
  renderFeed();
  renderResultLine();
}
updateHeroMenu();

/* Ne fait passer state.loading à false, et donc ne rend le tout premier
   fil, qu'une fois les DEUX sources revenues (listings.json ET l'index
   Firestore léger, voir fetchListingIndex() — qui inclut son propre
   filet de secours vers fetchPublishedListings() si besoin, réglé avant
   d'appeler maybeFinishInitialLoad() dans tous les cas) — sinon un
   visiteur assez rapide voyait "Aucun hébergement" pendant la fraction de
   seconde où seul listings.json (vide, voir README) avait déjà répondu,
   avant que Firestore (plus lent : SDK à charger puis requête réseau) ait
   eu le temps d'apporter les vraies annonces. */
var listingsJsonLoaded = false, listingsJsonFailed = false;
function maybeFinishInitialLoad(){
  if(!listingsJsonLoaded || !listingIndexSettled || !state.loading) return;
  state.loading = false;
  if(listingsJsonFailed && !LISTINGS.length){
    document.getElementById("feed").innerHTML = '<div class="empty-state"><p>Impossible de charger les hébergements pour le moment.<br>Vérifiez votre connexion et réessayez.</p></div>';
    return;
  }
  renderFilterBar(); renderFeed(); renderResultLine();
  renderLikeBadge(); // voir commentaire de savedListingsCount() : LISTINGS était vide au tout premier rendu du badge
  maybeOpenDeepLink();
}

fetch("listings.json").then(function(r){
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}).then(function(data){
  staticListings = data;
  rebuildListings();
}).catch(function(err){
  listingsJsonFailed = true;
}).then(function(){
  listingsJsonLoaded = true;
  maybeFinishInitialLoad();
});

bootFirebaseAuth();
fetchListingIndex();

})();
</script>
