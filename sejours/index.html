<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fiftin</title>
<!-- /sejours/ n'est plus la version canonique (voir le commentaire de
     #backToSejoursBtn dans app/index.html) : fiftin.fr/ est directement
     le site voyageur/hôte depuis le déménagement de ce fichier à la
     racine. Chemin conservé en pur redirect, pas supprimé, pour ne pas
     casser un signet ou un lien externe déjà partagé avant ce
     déménagement — query string et ancre (ex. ?listing=42) transmises
     telles quelles vers la racine, qui sait déjà les interpréter
     (voir maybeOpenDeepLink() dans index.html). -->
<meta http-equiv="refresh" content="0; url=../">
<script>location.replace("../" + location.search + location.hash);</script>
</head>
<body>
<p><a href="../">Fiftin</a></p>
</body>
</html>
