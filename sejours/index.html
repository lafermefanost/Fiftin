   chambres) — retour utilisateur explicite lors de la fusion des deux
   onglets : "tu vois les onglets chambres si il y en a plusieurs ou tu vois
   le calendrier unique" (revient sur le choix d'une passe précédente,
   "toujours affichés, même un seul onglet pour un gîte", pensé pour l'ex-
   onglet "Mon calendrier" qui vivait seul et avait besoin d'un chrome
   constant — plus nécessaire une fois DANS la carte de l'annonce voulue). */
.cal-unit-tabs{margin-bottom:0;}
/* "Planning associé" — retour utilisateur : remplace le menu déroulant
   (puis les onglets, eux aussi jugés encore trop "menu") par un cartouche
   qui affiche l'état actuel et ouvre un volet de choix au clic (voir
   kind==="roomlink" dans openSheet()) — même geste qu'un .profile-row qui
   ouvre quelque chose ailleurs dans l'app (chevron ›), pas une navigation
   de page comme les onglets au-dessus. */
.planning-chip{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
  background:var(--cream-deep); border:1.5px solid var(--line); border-radius:16px; padding:12px 14px;
  font-family:'Jost',sans-serif; text-align:left; cursor:pointer; margin-bottom:18px;}
.planning-chip-text{display:flex; flex-direction:column; gap:1px; min-width:0;}
.planning-chip-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--sauge);}
.planning-chip-value{font-size:14px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.planning-chip svg{width:16px; height:16px; color:var(--gray-mid); opacity:.6; flex-shrink:0;}
/* Rangée Ajouter/modifier — sa propre ligne, centrée (retour utilisateur ;
   le bouton "Aujourd'hui" qui la partageait avant, alignée à droite pour
   lui, a été retiré : l'accordéon des mois ouvre déjà le mois en cours par
   défaut, ce bouton ne servait plus qu'à revenir dessus après l'avoir
   replié à la main). */
.cal-top-row{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px;}
.cal-top-actions{display:flex; align-items:center; gap:8px;}
.cal-add-pill{background:var(--yellow); border:none; border-radius:16px; padding:8px 13px; font-family:'Jost',sans-serif; font-size:11.5px; font-weight:800; color:var(--sauge-deep); text-decoration:none; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;}
/* Picto "lien externe" (retour utilisateur : "montrer qu'on sort de ce
   site") — même tracé que .google-link svg.ext (fiche détail, liens
   Site/Avis Google), repris tel quel plutôt qu'un nouveau pictogramme ;
   currentColor pour suivre le texte du bouton (--sauge-deep), pas le gris
   discret de svg.ext sur fond blanc, illisible ici sur fond jaune. */
.cal-add-pill svg.ext{width:12px; height:12px; flex-shrink:0;}
/* Déplacée DANS .cal-card, au-dessus de la grille des mois — même
   emplacement que .rv-year-nav côté app/ (grid-column:1/-1 en haut de
   .rv-calendar) — plutôt que dans .cal-top-row où elle partageait la ligne
   avec Aujourd'hui/Ajouter-modifier : centrée sur toute la largeur de la
   carte blanche, elle est maintenant vraiment centrée sur la page. */
.cal-year-nav{display:flex; align-items:center; justify-content:center; gap:18px; margin:0 0 14px;}
/* Même bouton carré bordé que ci-dessus, gabarit un cran plus petit — reprend
   .rv-year-btn de l'app (année précédente/suivante de la vue Location). */
.cal-year-nav button{background:none; border:1.5px solid var(--line); border-radius:8px; width:28px; height:28px; color:var(--sauge-deep); display:flex; align-items:center; justify-content:center; padding:0;}
.cal-year-nav button svg{width:16px; height:16px;}
.cal-year-nav b{font-size:16px; min-width:46px; text-align:center;}
/* Carte blanche enveloppant planning associé + bouton Ajouter/modifier +
   grille des 12 mois — même principe que .rv-calendar côté app/
   (background:#fff, padding), pour que le calendrier se détache du fond
   crème de la page. Coins hauts carrés par défaut (retour utilisateur :
   "le blanc doit monter jusqu'à l'encart du logement et sembler être le
   prolongement de cet encart") — même principe que .detail-group/hasTabs
   sur la fiche détail : les onglets de chambre (.cal-unit-tabs, coins hauts
   arrondis) et cette carte se rejoignent sans espace ni rupture. Modificateur
   .solo (units.length===1, pas d'onglets au-dessus depuis la fusion Mes
   annonces/Mon calendrier — rien à souder) : coins tous arrondis. */
.cal-card{background:#fff; border-radius:0 0 16px 16px; padding:16px 12px;}
.cal-card.solo{border-radius:16px;}
/* Un seul mois par ligne (retour utilisateur : "2 calendriers par ligne"
   jusqu'ici, illisible) plutôt qu'une grille 2 colonnes — chaque mois est
   désormais un volet dépliable (voir .cal-mini.collapsed plus bas) : la
   liste, pas la grille, porte la mise en page verticale. */
.cal-year-grid{display:flex; flex-direction:column;}
/* Séparateur entre volets façon .profile-row (déjà établi ailleurs dans ce
   fichier pour des listes de lignes cliquables) — pas de trait avant le
   tout premier mois. */
.cal-mini{padding:2px 0; border-top:1px solid var(--line);}
.cal-mini:first-child{border-top:none;}
.cal-mini-head{display:flex; align-items:center; justify-content:space-between; width:100%;
  background:none; border:none; padding:10px 2px; font-family:'Jost',sans-serif;
  font-size:13px; font-weight:800; text-align:left; text-transform:uppercase; letter-spacing:.03em;
  color:var(--sauge-deep); cursor:pointer;}
/* Mois en cours (retour utilisateur : "savoir immédiatement quel est le
   mois actuel") — étiquette en plus du dépliage par défaut (voir plus bas),
   pour rester repérable même si l'hôte l'a refermé à la main. */
.cal-mini.current-month .cal-mini-head{color:var(--sauge);}
.cal-mini-current-tag{font-size:10px; font-weight:700; text-transform:none; letter-spacing:0;
  color:var(--sauge); background:var(--sauge-bg); border-radius:8px; padding:2px 7px; margin-left:8px;}
.cal-mini-chevron{width:16px; height:16px; color:var(--gray-mid); flex-shrink:0; transition:transform .18s ease;}
.cal-mini.collapsed .cal-mini-chevron{transform:rotate(-90deg);}
/* Mois passés repliés par défaut, mois en cours/à venir dépliés (retour
   utilisateur) — voir monthMiniHtml() pour le calcul, comparé à la vraie
   date du jour et non à l'année affichée (une année entièrement passée
   s'ouvre donc tout entière repliée, une année future tout entière
   dépliée). Le contenu reste dans le DOM (juste masqué) : le câblage des
   clics sur les jours (plus bas) n'a rien à savoir de cet état. */
.cal-mini.collapsed .cal-mini-grid{display:none;}
.cal-mini-grid{display:grid; grid-template-columns:14px repeat(7,1fr); gap:2px; margin-bottom:8px;}
.cal-mini-wn{font-size:7px; color:var(--gray-mid); opacity:.6; display:flex; align-items:center; justify-content:center;}
.cal-mini-dow{font-size:8px; font-weight:800; color:var(--gray-mid); opacity:.6; text-align:center; padding-bottom:2px; text-transform:uppercase;}
/* Case disponible = grise (comme .rv-day-cell/var(--light) côté app/, même
   valeur) ; case occupée = un seul vert sauge, mais --sauge (#354B38) et non
   --sauge-deep (#1D2820, en pratique quasi noir à cette taille — repéré en
   usage réel comme "les cases occupées sont noires, pas vertes"). Coins à
   4px, pas 8px : retour utilisateur explicite ("carré à bord un peu
   arrondi, comme sur Fiftin app") — 8px arrondissait visiblement plus que
   .rv-day-cell côté app/, qui utilise 4px sur un gabarit de case comparable. */
.cal-mini-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:8.5px; font-weight:600; color:var(--ink); border-radius:4px; cursor:pointer; background:#E2DFD8;}
.cal-mini-day.empty{visibility:hidden; cursor:default; background:none;}
.cal-mini-day.occ{background:var(--sauge); color:var(--cream); font-weight:800;}
.cal-mini-day.today{box-shadow:inset 0 0 0 1.3px var(--lavender-deep);}

/* ---------- choix de formule (inscription hôte) ---------- */
.formula-picker{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
.formula-card{text-align:left; background:var(--cream-deep); border:1.5px solid var(--line); border-radius:16px; padding:12px 14px; font-family:'Jost',sans-serif;}
.formula-card.active{border-color:var(--sauge-deep); background:var(--sauge-light);}
.formula-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:3px;}
.formula-card-head b{font-size:14px; color:var(--ink);}
.formula-card-head span{font-size:12.5px; font-weight:700; color:var(--sauge-deep);}
.formula-card p{font-size:11.5px; color:var(--sauge); font-weight:500; line-height:1.4; margin:0;}

/* ─── VERROU TEMPORAIRE DU SITE (page en construction) ───────────────
   Même mot de passe partagé et même clé sessionStorage que le verrou de
   app/index.html (#siteGate, SITE_GATE_PASSWORD) : déverrouiller l'un
   déverrouille l'autre dans le même onglet. Vérifié côté client — donc
   visible dans le code source et sans valeur face à quelqu'un de
   déterminé. Sert seulement à écarter un visiteur de passage tant que
   Séjours est en construction. À retirer, avec le noindex du <head>,
   quand la page sera prête à être publique. */
#siteGate{position:fixed; inset:0; z-index:6000; overflow:hidden; background:var(--sauge-light); color:var(--cream);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
  text-align:center;}
#siteGate.gate-hidden{display:none;}
#siteGate .gate-logo{width:92px; height:92px; margin:0 auto 22px;}
#siteGate .gate-sub{position:relative; z-index:2; font-size:16px; font-weight:500; color:rgba(245,240,229,.85); margin-bottom:24px; max-width:280px; line-height:1.5;}
#siteGate .gate-box{position:relative; z-index:2; width:100%; max-width:280px;}
#siteGate .gate-input{width:100%; margin-bottom:10px; padding:12px 16px; border-radius:999px; background:transparent;
  border:1.5px solid rgba(245,240,229,.5); color:var(--cream); text-align:center; font-family:'Jost',sans-serif;
  font-size:16px; box-sizing:border-box;}
#siteGate .gate-input::placeholder{color:rgba(245,240,229,.6);}
#siteGate .gate-input:focus{outline:none; border-color:var(--cream);}
#siteGate .gate-btn{width:100%; padding:12px; border-radius:999px; border:1.5px solid var(--cream); background:transparent;
  color:var(--cream); font-family:'Jost',sans-serif; font-weight:700; font-size:14.5px;}
#siteGate .gate-btn:active{background:rgba(245,240,229,.14);}
#siteGate .gate-err{color:#F2B8A8; font-size:12px; margin-top:10px; min-height:16px;}
</style>

var LISTINGS = [];

   arrivée (arrivait réellement : le fetch Firestore peut répondre avant
   listings.json et se faire effacer par lui juste après). */
var staticListings = [];
var hostFirestoreListings = [];

   LISTINGS peut désormais rester PARTIEL (seules les annonces déjà
   affichées y sont chargées en détail, photos comprises) ; l'index léger
   (listingIndexCache, voir fetchListingIndex()) reste la seule source
   TOUJOURS complète. PAGE_SIZE : nombre de fiches complètes chargées à la
   fois. visibleListingCount : combien de matchingIndexListings() sont
   actuellement demandées — remis à PAGE_SIZE à chaque changement de

   loadMoreListings() ("Charger plus", sans reset). */
var PAGE_SIZE = 12;

/* Va chercher en Firestore les documents COMPLETS des identifiants listés
   qui ne sont pas déjà dans LISTINGS (déjà chargés depuis une page
   précédente, un lien profond, une collection déjà ouverte…) — jamais de
   double téléchargement pour une annonce déjà en cache. cb() est appelé
   une fois les documents manquants récupérés (immédiatement si rien ne
   manquait — le cas normal une fois qu'une page a déjà été vue). */
function ensureListingDocsLoaded(docIds, cb){
  var known = {};
  LISTINGS.forEach(function(l){ known[listingKey(l)] = true; });
  var missing = docIds.filter(function(id){ return id && !known[id]; });
  if(!missing.length || typeof firebase==="undefined"){ cb(); return; }
  Promise.all(missing.map(function(id){
    return firebase.firestore().collection("listings").doc(id).get().catch(function(){ return null; });
  })).then(function(docs){
    docs.forEach(function(doc){
      if(doc && doc.exists) hostFirestoreListings.push(normalizeHostListing(doc));
    });
    rebuildListings();
    cb();
  });
}

/* Retrouve une annonce par son id numérique (idFromString(docId), voir
   normalizeHostListing()) même si sa fiche complète n'est pas encore
   chargée (pagination, voir ensureListingDocsLoaded() ci-dessus) —
   utilisé par les points d'entrée qui peuvent référencer N'IMPORTE
   QUELLE annonce publiée, pas seulement celles de la page actuellement
   affichée : une punaise de la carte (tous les pins viennent de l'index
   complet, voir mapPinsFromIndex()), un lien profond
   (maybeOpenDeepLink()), une annonce sauvegardée dans une collection.
   cb(null) si l'annonce n'existe pas/plus (ex. supprimée entre-temps). */
function resolveListingById(numericId, cb){
  var l = LISTINGS.filter(function(x){ return x.id===numericId; })[0];
  if(l){ cb(l); return; }
  var ix = listingIndexCache.filter(function(x){ return x.id===numericId; })[0];
  if(!ix){ cb(null); return; }
  ensureListingDocsLoaded([ix.docId], function(){
    cb(LISTINGS.filter(function(x){ return x.id===numericId; })[0] || null);
  });
}

function bootFirebaseAuth(){
  loadFirebaseSDK(function(){
    if(!firebase.apps.length) firebase.initializeApp(FIFTIN_FIREBASE_CONFIG);
    firebase.auth().onAuthStateChanged(function(user){
      authState.ready = true;
      authState.uid = user ? user.uid : null;
      authState.email = user ? user.email : null;
      // Collections propres au compte (voir plus haut) : jamais celles d'un
      // compte précédent après une déconnexion/reconnexion sous un autre
      // uid sur le même appareil. Rechargées tout de suite si connecté
      // (plutôt que d'attendre la première ouverture de Mes séjours) pour
      // que les cœurs déjà affichés sur Explorer reflètent le bon état dès
      // que possible — refreshSavedHeartsInDom() patche juste les cœurs déjà
      // dans le DOM, pas de re-rendu complet (voir son commentaire).
      collectionsCache = undefined;
      if(user) ensureCollectionsLoaded(function(){ refreshSavedHeartsInDom(); renderLikeBadge(); });
      if(!user && state.hostMode) exitHostMode();
      // Session hôte restaurée au boot (voir plus bas) avant que Firebase
      // Auth ait fini de résoudre : ré-affiche une fois authState.uid/email
      // vraiment connus (ex. la formule du profil hôte, lue via
      // resolveHostAccount(), dépendait d'un uid pas encore disponible).
      else if(state.hostMode) renderHostTabContent();
      if(state.tab==="profile") renderProfile();
      updateHeroMenu();
      // Retour utilisateur : proposer de se connecter, nulle part sur le
      // site un visiteur non connecté ne se le voyait proposer directement
      // (voir loginPrompt dans openSheet()). Une fois par chargement de
      // page (loginPromptShown). Délai de quelques secondes avant
      // affichage plutôt qu'immédiat : surgir dès la résolution de
      // Firebase Auth (souvent <1s) bloquait le tout premier geste du
      // visiteur (ouvrir une fiche, changer d'onglet…) avec un sheet-
      // backdrop par-dessus tout — repéré via la suite de tests, plusieurs
      // scripts qui interagissent avec Explorer juste après le chargement
      // se sont mis à échouer sur des clics interceptés par le popup.
      // Conditions revérifiées à l'échéance (pas seulement à la
      // programmation) : toujours pas connecté, pas en session hôte, pas
      // déjà un autre volet ouvert, pas de fiche détail ouverte, et surtout
      // aucune interaction entre-temps (userInteracted, voir sa
      // déclaration) — un visiteur déjà engagé avec un filtre/une fiche ne
      // doit jamais se le voir surgir en pleine action, quel que soit le
      // délai choisi ici.
      if(!user && !state.hostMode && !loginPromptShown){
        loginPromptShown = true;
        setTimeout(function(){
          if(!authState.uid && !state.hostMode && !userInteracted && state.detailListingId==null
            && document.getElementById("sheet-root").innerHTML===""){
            openSheet("loginPrompt");
          }
        }, 4000);
      }
    });
  });
}

function updateHeroMenu(){
  var loginBtn = document.getElementById("hero-btn-login");
  var hostBtn = document.getElementById("hero-btn-host");
  if(!loginBtn || !hostBtn) return;
  loginBtn.querySelector("span").textContent = authState.uid ? "Mon compte" : "Se connecter";
  loginBtn.onclick = function(){
    if(authState.uid){ switchTab("profile"); document.getElementById("feed").scrollIntoView({behavior:"smooth"}); }
    else { authContext = "traveler"; openSheet("auth"); }
  };
  hostBtn.querySelector("span").textContent = authState.uid ? "Déposer une annonce" : "Devenir hôte";
  hostBtn.onclick = function(){
    if(authState.uid){ hostFormEditListing = null; openSheet("hostform"); }
    else { authContext = "host"; openSheet("auth"); }
  };
}

function signOutUser(){
  if(typeof firebase!=="undefined") firebase.auth().signOut();
}

/* Fusionne dans LISTINGS les annonces d'hôtes publiées (Firestore,
   listings/{id} status=="published") avec le fil statique (listings.json).
   Lecture publique déjà autorisée par les règles Firestore pour les
   annonces publiées — pas besoin d'être connecté pour les voir. */
function normalizeHostListing(doc){
  var l = doc.data();
  var gallery = l.gallery && l.gallery.length ? l.gallery : null;
  var units = l.units || null;
  /* "price" reste un nombre unique pour tout le code existant (filtre,
     tri, badge de la carte) : pour une annonce à plusieurs chambres,
     c'est le prix de la moins chère ("à partir de"). Les annonces
     statiques de listings.json n'ont pas de units — elles gardent leur
     prix unique tel quel. */
  var price = units && units.length ? Math.min.apply(null, units.map(function(u){ return u.price; })) : l.price;
  return {
    id: idFromString(doc.id),
    docId: doc.id, // id Firestore réel (string) — le "id" ci-dessus n'est qu'un hash numérique pour homogénéité avec les annonces statiques (listings.json), qui elles n'ont pas de document Firestore. Nécessaire pour cibler le bon document (toggleLike, likeCount).
    ownerUid: l.ownerUid || "", // pour n'afficher le taux de conversion (voir conversionLabelFor()) qu'au propriétaire connecté, jamais aux autres voyageurs.
    stats: l.stats || null, // {demandeCount, confirmedCount} — écrit uniquement par la Cloud Function syncListingContactStats (functions/index.js), jamais par un client (voir la règle Firestore listings/{listingId}).
    name: l.name, region: l.region, claim: l.claim,
    price: price, distance: (typeof l.distance==="number") ? l.distance : 0,
    lat: (typeof l.lat==="number") ? l.lat : null, lng: (typeof l.lng==="number") ? l.lng : null, address: l.address || "",
    likeCount: (typeof l.likeCount==="number") ? l.likeCount : 0,
    grad: "clay", motif: "roof",
    gallery: gallery,
    galleryThumb: l.galleryThumb || null, // vignette légère de gallery[0] (voir listingThumbUrl()) — absente sur une annonce créée avant ce chantier, repli automatique sur gallery[0]
    units: units, // chaque chambre porte déjà son propre galleryThumb tel quel (même mécanisme, pas besoin de le remapper ici)
    amen: l.amen || [],
    desc: l.desc,
    websiteUrl: l.websiteUrl || "", googleUrl: l.googleUrl || "",
    regionName: l.regionName || "", deptName: l.deptName || "", city: l.city || "",
    accomType: l.accomType || "",
    host: {name: l.hostName || "Hôte Fiftin", initial: (l.hostName||"H").charAt(0).toUpperCase(), phone: l.phone, email: l.email || "", bio: l.hostBio || ""},
    photos: gallery ? gallery.length : 0,
    avail: []
  };
}
/* listings.json est désormais toujours vide (voir README, "Nettoyage").
   fetchPublishedListings() télécharge les documents COMPLETS (photos,
   chambres) de toutes les annonces publiées — volontairement PAS appelée
   au boot depuis ce chantier (voir fetchListingIndex()/PAGE_SIZE plus
   bas) : ce serait exactement le téléchargement massif que la pagination
   cherche à éviter. Ne reste appelée que (1) en filet de secours par
   fetchListingIndex() si l'index revient vide (voir son commentaire), et
   (2) après une action ponctuelle qui vient de changer le catalogue
   public (ex. un admin qui publie une annonce, "Annonces à valider").
   cb optionnel, appelé une fois réglé (succès, échec ou délai dépassé). */
function fetchPublishedListings(cb){
  var settled = false;
  function settle(){
    if(settled) return;
    settled = true;
    if(cb) cb();
  }
  // Filet de secours : si Firebase met vraiment trop de temps (SDK lent à
  // charger, requête qui traîne, script bloqué par un bloqueur de pub…),
  // ne bloque pas indéfiniment l'appelant — le fil se complètera quand
  // même au prochain rendu Firestore réussi, comme avant.
  setTimeout(settle, 6000);
  loadFirebaseSDK(function(){
    if(!firebase.apps.length) firebase.initializeApp(FIFTIN_FIREBASE_CONFIG);
    firebase.firestore().collection("listings").where("status","==","published").get().then(function(snap){
      if(!snap.empty){
        hostFirestoreListings = snap.docs.map(normalizeHostListing);
        rebuildListings();
      }
      if(state.tab==="explore"){ renderFeed(); renderResultLine(); }
      else if(state.tab==="likes") renderTabContent(); // Favoris (tuiles de collection) peut dépendre des photos de LISTINGS, tout juste arrivées
      // savedListingsCount() dépend de LISTINGS : au tout premier rendu du
      // badge (renderTabbar() au boot), LISTINGS est encore vide — sans
      // ce ré-appel, un favori valide resterait compté 0 jusqu'à la
      // prochaine interaction qui appelle renderLikeBadge() par ailleurs.
      renderLikeBadge();
      maybeOpenDeepLink();
      settle();
    }).catch(function(err){
      /* Silencieux : le fil statique (listings.json) reste affiché tel quel. */
      settle();
    });
  });
}

/* Index public léger (listingIndex/{id}, voir functions/index.js et
   README « Performance ») : TOUTES les annonces publiées, mais seulement
   leurs champs légers (position, prix, lieu, prestations, jamais les
   photos) — LA source chargée au boot, à la place de
   fetchPublishedListings() ci-dessus (voir son commentaire). Sert à la
   fois aux pins de la carte embarquée (mapPinsFromIndex(), toujours
   complets même quand le fil de cartes en dessous ne l'est pas) et à la
   pagination du fil (matchingIndexListings()/PAGE_SIZE, plus bas) : quelles
   annonces, dans quel ordre, charger en détail. Même garde-fou de premier
   chargement (settle() + maybeFinishInitialLoad()) que l'ancien montage :
   sans lui, un visiteur rapide verrait une carte à moitié vide le temps
   que Firestore réponde. */
var listingIndexCache = [];
var listingIndexSettled = false;
function fetchListingIndex(){
  var settled = false;
  function settle(){
    if(settled) return;
    settled = true;
    listingIndexSettled = true;
    maybeFinishInitialLoad();
  }
  setTimeout(settle, 6000);
  loadFirebaseSDK(function(){
    if(!firebase.apps.length) firebase.initializeApp(FIFTIN_FIREBASE_CONFIG);
    firebase.firestore().collection("listingIndex").get().then(function(snap){
      listingIndexCache = snap.docs.map(function(doc){
        var d = doc.data();
        d.id = idFromString(doc.id); // même id numérique que normalizeHostListing(), pour que scrollToFeedCard() retrouve la bonne carte
        d.docId = doc.id;
        d.amen = d.amen || [];
        return d;
      });
      if(mapInstance) refreshExploreMapMarkers(); // arrivé après le premier rendu de la carte (mapInstance déjà monté) : ne pas attendre la prochaine action pour afficher les vrais pins
      // Retour utilisateur : "parfois il affiche zéro annonces et puis
      // elles chargent enfin" — bug réel trouvé en lisant le code, pas
      // reproduit en direct : si le filet de 6s ci-dessus se déclenche
      // AVANT cette réponse Firestore (SDK Firebase lent à charger — 4
      // scripts en cascade, voir loadFirebaseSDK() — ou requête réseau
      // lente), settle() ci-dessous devient un no-op (settled déjà à true)
      // et maybeFinishInitialLoad() ne se relance jamais : listingIndexCache
      // vient pourtant d'être rempli juste au-dessus, mais rien ne
      // redessine le fil de cartes pour le montrer — contrairement à
      // fetchPublishedListings() plus haut, qui rend directement dans son
      // .then() sans jamais dépendre de ce genre de verrou. Le visiteur
      // restait bloqué sur "Aucun hébergement" jusqu'à une action sans
      // rapport (changer d'onglet, toucher un filtre) qui déclenche un
      // renderFeed() par un autre chemin — d'où l'impression que "ça finit
      // par charger", sans lien apparent avec l'action qui le débloquait
      // réellement. !state.loading ici veut dire soit ce cas (le filet a
      // déjà réglé le tout premier chargement avant cette réponse), soit
      // un second appel à fetchListingIndex() après le tout premier
      // chargement (ex. gérerAdminApprove() plus bas) : redessiner le fil
      // dans les deux cas, jamais en double avec le premier rendu normal
      // (là où state.loading est encore true, laissé à maybeFinishInitialLoad()
      // ci-dessous pour ne pas dessiner deux fois).
      if(!state.loading){
        if(state.tab==="explore"){ renderFeed(); renderResultLine(); }
        else if(state.tab==="likes") renderTabContent();
      }
      if(snap.empty){
        // Filet de secours — voir aussi matchingIndexListings() : un
        // index vide veut dire soit "vraiment aucune annonce publiée"
        // (fetchPublishedListings() reviendra vide aussi, sans dégât),
        // soit "Cloud Function/règle listingIndex pas encore déployée"
        // (voir README, « Important, ter ») alors que de vraies annonces
        // existent bien dans listings/ — impossible à distinguer les
        // deux sans interroger listings/ directement. Dans ce second cas,
        // ce filet est ce qui évite que le fil entier reste bloqué sur
        // "Aucun hébergement" alors que le catalogue ne l'est pas
        // vraiment : dégradé (plus de pagination tant que l'index reste
        // vide), mais fonctionnel.
        fetchPublishedListings(settle);
        return;
      }
      settle();
    }).catch(function(){ settle(); });
  });
}

/* Regroupement des prestations par catégorie (aucune liste à plat séparée
   à maintenir en double — AMEN_GROUPS EST la liste, ALL_AMENITIES a été
   retiré : plus rien ne le lisait, seul AMEN_GROUPS pilotait déjà
   réellement amenityGroupsHtml()/AMEN_ICONS).
   single:true (Séjours, Environnement) : groupe à choix UNIQUE — retour
   utilisateur explicite, contrairement aux autres groupes qui restent à
   choix multiples. Rien de neuf côté données : toujours des entrées de
   amen[] comme les autres prestations (même stockage, mêmes règles
   Firestore, amen n'étant validé sur aucune liste fermée côté règles) ;
   seule la sélection est contrainte à une seule valeur active à la fois
   dans ces deux groupes, imposée côté UI (voir wireSheet(), kind==="amen"
   et kind==="hostform") plutôt que par un nouveau champ dédié.
   Retour utilisateur (étoffer les prestations, catégorie par catégorie,
   pour mieux cibler les annonces) : "Spécialisation" -> "Séjours" (même
   items, juste le titre) ; "Vue" -> "Environnement", ses items perdent le
   préfixe "Vue " (redondant sous ce titre) et se précisent — "Vue
   campagne" devient "Champêtre" (terme demandé), "Vue eau" (trop vague)
   est remplacé par "Lac" (terme demandé, un vrai plan d'eau plutôt qu'une
   rivière/étang flous), nouveau "Urbain" ajouté (terme demandé). ATTENTION
   migration : ces trois renommages changent la VALEUR de chaîne stockée
   dans amen[] — une annonce déjà cochée "Vue campagne"/"Vue eau" avant ce
   chantier ne correspondra plus à "Champêtre"/"Lac" tant que son hôte ne
   rouvre pas le formulaire et ne recoche pas la nouvelle case (aucune
   migration Firestore possible depuis ce fichier, en lecture seule côté
   base — voir README). "Vue mer"/"Vue montagne" gardent leur sens, juste
   renommés "Mer"/"Montagne" pour la même raison de préfixe redondant :
   même impact de compatibilité, à re-cocher une fois par annonce déjà
   publiée qui les utilisait.
   Nouveau groupe "Intimité & tranquillité" : retour utilisateur, "il
   faudrait peut-être caler quelque part un truc intimiste ? Et aucun
   vis-à-vis." — "Intimiste" et "Aucun vis-à-vis" ajoutés tels quels, plus
   "Au calme" (même famille, déjà une notion qui revient dans les
   descriptions d'annonces). "Naturiste" proposé dans la même phrase,
   volontairement PAS repris : un tag de recherche filtrable expose
   publiquement un critère de nature différente (une pratique, pas un
   équipement) sur une plateforme généraliste chambres d'hôtes/gîtes,
   affichée à côté d'un tag "Familial" existant — un vrai choix de
   positionnement, pas un détail technique, qui mérite une décision
   déportée sur des annonces dédiées/vérifiées plutôt qu'une case à cocher
   glissée dans une liste générale. À rouvrir si la volonté reste la même
   après réflexion.
   Deuxième passe, retour utilisateur : "Forêt"/"Village" (termes choisis
   pour « en lien avec la forêt »/« vie de village ») ajoutés à
   Environnement ; "Désert" ajouté aussi, tel que demandé, malgré une
   réserve — très peu d'hébergements en France (hors DROM) correspondent
   réellement à ce critère, un item qui restera sans doute inutilisé sur
   l'écrasante majorité des annonces ; gardé quand même, la case est
   essentiellement sans coût (single:true, un choix parmi d'autres) et
   sert peut-être un cas réel visé par l'hôte. "Baby-foot" et "Jeux de
   plage à disposition" ajoutés à Loisirs & bien-être, tels quels. */
var AMEN_GROUPS = [
  {title:"Séjours", items:["Professionnels","Familial","Romantique"], single:true},
  {title:"Environnement", items:["Mer","Montagne","Champêtre","Urbain","Lac","Forêt","Village","Désert"], single:true},
  {title:"Loisirs & bien-être", items:["Piscine","Jacuzzi","Sauna","Hammam","Spa","Salle de sport","Vélos à disposition","Ping-pong","Billard","Pétanque","Baby-foot","Jeux de plage à disposition"]},
  {title:"Extérieur & ambiance", items:["Jardin","Terrasse","Cheminée","Poêle à bois","Barbecue","Plancha","Brasero","Enceintes connectées","Home cinéma","Grand écran TV"]},
  {title:"Équipement", items:["Cuisine équipée","Micro-ondes","Four","Lave-vaisselle","Lave-linge","Sèche-linge","Machine à café à capsules","Climatisation","Chauffage","Wifi","Parking privé","Accès PMR"]},
  {title:"Intimité & tranquillité", items:["Intimiste","Aucun vis-à-vis","Au calme"]},
  {title:"Accueil", items:["Accueil en personne","Installation autonome","Animaux acceptés"]}
];
/* Grille de prestations par groupe — utilisée à la fois par le volet
   filtre (kind==="amen") et par le formulaire de dépôt/édition d'annonce,
   pour ne pas dupliquer le découpage par catégorie à deux endroits.
   isActive(nomPrestation) -> bool décide qui porte la classe "active".
   data-group porte l'index du groupe (voir AMEN_GROUPS) : les handlers de
   clic s'en servent pour retrouver les autres cases du MÊME groupe et les
   désactiver quand ce groupe est single:true. */
function amenityGroupsHtml(isActive){
  return AMEN_GROUPS.map(function(g,gi){
    return '<div class="amen-group"><div class="amen-group-title">'+esc(g.title)+'</div><div class="amenity-grid">'+
      g.items.map(function(a){
        return '<button type="button" class="amenity-chip'+(isActive(a)?' active':'')+'" data-a="'+esc(a)+'" data-group="'+gi+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">'+AMEN_ICONS[a]+'</svg>'+esc(a)+'</button>';
      }).join("")+
    '</div></div>';
  }).join("");
}
/* Bascule une case de prestation — partagée entre le volet filtre
   (kind==="amen") et le formulaire de dépôt (kind==="hostform"), pour ne
   pas dupliquer la règle single:true à deux endroits. Groupe single:true
   (Spécialisation, Vue) : au plus une case active à la fois dans ce
   groupe — l'activation de l'une désactive automatiquement les autres du
   même groupe (retour utilisateur : "ne permettre de sélectionner qu'un
   seul choix"). Retourne le nouvel état de la case cliquée + les valeurs
   désactivées au passage, pour que l'appelant resynchronise son propre
   état si besoin (f.amen côté filtre ; le formulaire, lui, relit
   .amenity-chip.active au submit, rien d'autre à resynchroniser). */
function toggleAmenityChip(el){
  var groupIdx = el.getAttribute("data-group");
  var group = groupIdx!=null ? AMEN_GROUPS[groupIdx] : null;
  var wasActive = el.classList.contains("active");
  var deactivated = [];
  if(!wasActive && group && group.single){
    Array.prototype.forEach.call(document.querySelectorAll('.amenity-chip[data-group="'+groupIdx+'"].active'), function(sib){
      if(sib!==el){ sib.classList.remove("active"); deactivated.push(sib.getAttribute("data-a")); }
    });
  }
  el.classList.toggle("active", !wasActive);
  return {active: !wasActive, deactivated: deactivated};
}

/* ---------------- régions / départements (France) ----------------
   Référentiel statique (13 régions métropolitaines + 5 régions/DROM
   d'outre-mer, subdivisées en départements) pour le filtre Lieu à 3
   niveaux (région -> département -> recherche libre). Volontairement
   complet (toute la liste officielle), pas seulement les régions où il y
   a déjà des annonces — l'ancien comportement ("Régions avec des
   annonces", généré depuis LISTINGS) donnait un filtre pauvre tant que
   peu d'hôtes avaient déposé une annonce. Le matching contre une annonce
   reste tolérant : structuré (regionName/deptName, renseignés depuis ce
   référentiel dans le hostform) si disponible, sinon recherche du nom en
   sous-chaîne dans l'ancien champ libre `region` — voir matchesLocation(). */
var FR_REGIONS = [
  {name:"Auvergne-Rhône-Alpes", depts:["Ain","Allier","Ardèche","Cantal","Drôme","Isère","Loire","Haute-Loire","Puy-de-Dôme","Rhône","Savoie","Haute-Savoie"]},

  {name:"Bretagne", depts:["Côtes-d'Armor","Finistère","Ille-et-Vilaine","Morbihan"]},
  {name:"Centre-Val de Loire", depts:["Cher","Eure-et-Loir","Indre","Indre-et-Loire","Loir-et-Cher","Loiret"]},
  {name:"Corse", depts:["Corse-du-Sud","Haute-Corse"]},
  {name:"Grand Est", depts:["Ardennes","Aube","Marne","Haute-Marne","Meurthe-et-Moselle","Meuse","Moselle","Bas-Rhin","Haut-Rhin","Vosges"]},
  {name:"Hauts-de-France", depts:["Aisne","Nord","Oise","Pas-de-Calais","Somme"]},
  {name:"Île-de-France", depts:["Paris","Seine-et-Marne","Yvelines","Essonne","Hauts-de-Seine","Seine-Saint-Denis","Val-de-Marne","Val-d'Oise"]},
  {name:"Normandie", depts:["Calvados","Eure","Manche","Orne","Seine-Maritime"]},
  {name:"Nouvelle-Aquitaine", depts:["Charente","Charente-Maritime","Corrèze","Creuse","Dordogne","Gironde","Landes","Lot-et-Garonne","Pyrénées-Atlantiques","Deux-Sèvres","Vienne","Haute-Vienne"]},
  {name:"Occitanie", depts:["Ariège","Aude","Aveyron","Gard","Haute-Garonne","Gers","Hérault","Lot","Lozère","Hautes-Pyrénées","Pyrénées-Orientales","Tarn","Tarn-et-Garonne"]},
  {name:"Pays de la Loire", depts:["Loire-Atlantique","Maine-et-Loire","Mayenne","Sarthe","Vendée"]},
  {name:"Provence-Alpes-Côte d'Azur", depts:["Alpes-de-Haute-Provence","Hautes-Alpes","Alpes-Maritimes","Bouches-du-Rhône","Var","Vaucluse"]},
  {name:"Guadeloupe", depts:["Guadeloupe"]},
  {name:"Martinique", depts:["Martinique"]},
  {name:"Guyane", depts:["Guyane"]},
  {name:"La Réunion", depts:["La Réunion"]},
  {name:"Mayotte", depts:["Mayotte"]}
];
function deptsForRegion(regionName){
  var r = FR_REGIONS.filter(function(x){ return x.name===regionName; })[0];
  return r ? r.depts : [];
}
/* Options <option> du sélecteur Département du hostform, à partir d'une
   région choisie — vide (juste "Toute la région") tant qu'aucune région
   n'est sélectionnée. Réutilisé au premier rendu du formulaire ET quand
   la région change (voir le wiring de #hf-region-name). */
function deptOptionsHtml(regionName, selectedDept){
  var depts = deptsForRegion(regionName);
  if(!depts.length) return '<option value="">— Choisir une région d\'abord —</option>';
  return '<option value="">Toute la région</option>'+
    depts.map(function(d){ return '<option value="'+esc(d)+'"'+(selectedDept===d?' selected':'')+'>'+esc(d)+'</option>'; }).join("");
}
/* Une annonce matche une région/département choisis si regionName/deptName
   (nouveau champ structuré, voir hostform) correspond exactement, ou --
   pour les annonces plus anciennes qui n'ont que l'ancien champ libre
   `region` -- si le nom cherché apparaît dedans (sous-chaîne, insensible
   à la casse). Pour une RÉGION, l'ancien champ libre dit presque toujours
   son département ou sa ville ("Luberon, Vaucluse"), jamais le nom
   officiel de la région ("Provence-Alpes-Côte d'Azur") : le nom de
   n'IMPORTE LEQUEL des départements de cette région est donc aussi
   essayé, pas seulement le nom de la région elle-même — sinon aucune
   annonce plus ancienne ne matcherait jamais une région choisie. Un
   mot-clé libre (f.q) élargit la recherche à peu près partout où un lieu
   peut se lire sur une annonce : nom, région/département structurés,
   ancien champ libre, ville/adresse si un jour renseignée. */
function matchesLocation(l, f){
  if(f.regionName && l.regionName!==f.regionName){
    var legacyR = (l.region||"").toLowerCase();
    var okR = legacyR.indexOf(f.regionName.toLowerCase())!==-1 ||
      deptsForRegion(f.regionName).some(function(d){ return legacyR.indexOf(d.toLowerCase())!==-1; });
    if(!okR) return false;
  }
  if(f.deptName && l.deptName!==f.deptName && (l.region||"").toLowerCase().indexOf(f.deptName.toLowerCase())===-1) return false;
  if(f.q){
    var q = f.q.toLowerCase();
    var hay = [l.name, l.region, l.regionName, l.deptName, l.city].filter(Boolean).join(" ").toLowerCase();
    if(hay.indexOf(q)===-1) return false;
  }
  return true;
}

/* ---------------- distance réelle (géolocalisation) ----------------
   `distance` était jusqu'ici un nombre fixe saisi à la main par l'hôte
   ("distance depuis la Ferme Fanost"), pas une vraie distance — il n'y
   avait aucune coordonnée par annonce. Remplacé par un calcul dynamique :
   chaque annonce porte maintenant lat/lng (géocodées depuis son adresse
   au dépôt, voir geocodeAddress()/submitHostForm()), et la distance
   affichée/filtrée/triée se recalcule depuis un point de référence qui
   peut changer — soit la position réelle du voyageur (state.geoOrigin,
   posée par "Utiliser ma position" dans le volet Lieu), soit, par défaut
   tant qu'il ne l'a pas activée, DEFAULT_ORIGIN (les coordonnées de la
   Ferme Fanost elle-même — même point de référence implicite qu'avant ce
   chantier, pour ne pas changer l'expérience par défaut). Jamais stockée
   sur l'annonce : recalculée à chaque rendu, pour rester juste si le
   voyageur active/désactive sa position en cours de navigation. */
var DEFAULT_ORIGIN = {lat:48.7370, lng:2.3280}; // La Ferme Fanost (Essonne) — mêmes coordonnées que "Le Petit Fanost" dans listings.json
// haversineKm() existe déjà plus bas (matchingIndexListings(), la zone de
// recherche dessinée à la main sur la carte) — réutilisée telle quelle,
// pas redéclarée : une déclaration de fonction est hissée quelle que soit
// sa position dans le fichier, donc disponible ici sans avoir à la copier.
/* state.filters.zoneOrigin (repère posé sur la carte embarquée d'Explorer,
   voir exploreMapBlockHtml()/wireExploreMap() plus bas) prime sur
   geoOrigin : poser un repère est un choix explicite et plus récent que
   la géolocalisation, "je veux chercher autour du Mans", pas "autour de
   moi" — les deux n'ont pas de raison de rester actifs en même temps
   (voir "Utiliser ma position", qui efface le repère en retour). */
function currentOrigin(){ return state.filters.zoneOrigin || state.geoOrigin || DEFAULT_ORIGIN; }
/* Distance en km, arrondie (même format d'affichage qu'avant, "8 km").
   Annonce sans coordonnées (pas encore géocodée, ou créée avant ce
   chantier et jamais réenregistrée depuis) : repli sur son ancien nombre
   fixe `distance`, pour ne rien casser tant que l'hôte n'a pas remis à
   jour son adresse. */
function listingDistanceKm(l){
  if(l.lat==null || l.lng==null) return l.distance || 0;
  var o = currentOrigin();
  return Math.round(haversineKm(o.lat, o.lng, l.lat, l.lng));
}
/* Ligne de localisation au-dessus du titre (fil et fiche détail) :
   "Région, Département" à chaque fois qu'ils sont connus, plutôt que
   l'ancien champ libre l.region — trop hétérogène d'une annonce à l'autre
   (une ville seule, un département seul, une région seule, selon ce que
   l'hôte avait tapé). Repli sur l.region pour une annonce plus ancienne
   sans regionName/deptName renseignés, plutôt que de ne rien afficher. */
function locationLineFor(l){
  if(l.regionName && l.deptName) return l.regionName+", "+l.deptName;
  if(l.regionName) return l.regionName;
  if(l.deptName) return l.deptName;
  return l.region || "";
}
/* Même principe que locationLineFor(), mais Département, Ville plutôt que
   Région, Département — demandé pour la fiche détail spécifiquement (plus
   parlant une fois qu'on est déjà sur l'annonce), la carte du fil garde
   Région, Département (locationLineFor() ci-dessus, inchangée). */
function detailLocationLineFor(l){
  if(l.deptName && l.city) return l.deptName+", "+l.city;
  if(l.deptName) return l.deptName;
  if(l.city) return l.city;
  return l.region || "";
}

/* Bug réel signalé (retour utilisateur) : "les annonces que je poste ne
   sont visibles que par moi, idem pour Adel" — pas un problème de droits
   Firestore (vérifié : une requête anonyme renvoie bien les annonces
   publiées de tout le monde), mais un plafond de distance, jusqu'ici figé
   à 100 km ET intranchissable (le curseur du volet Distance allait aussi
   jusqu'à 100 au maximum, aucun moyen de voir plus loin). Une annonce
   distante de DEFAULT_ORIGIN (La Ferme Fanost, Essonne — voir plus bas)
   de plus de 100 km — Noirmoutier, ~395 km, en est l'exemple réel qui a
   révélé le bug — restait donc invisible EN PERMANENCE pour tout visiteur
   n'ayant pas activé "Utiliser ma position" pour se rapprocher d'elle,
   sans aucun recours possible dans l'interface.
   Retour utilisateur, suite directe : même un plafond large (1200 km,
   premier correctif) reste un plafond — "tant qu'on n'a pas mis de filtre
   de distance, toutes les annonces doivent rester visibles, c'est les
   filtres qui viennent ensuite réduire la sélection". `filters.distance`
   vaut donc `null` par défaut (AUCUN filtre de distance, quelle que soit
   la distance réelle — une annonce à l'autre bout du monde resterait
   visible) plutôt qu'un nombre, aussi grand soit-il ; voir matchesAllFilters()
   plus bas, qui ne compare que si `f.distance!=null`. MAX_DISTANCE_KM
   reste utile comme SOMMET du curseur du volet Distance (au-delà de toute
   distance réelle en France métropolitaine) : le voyageur qui veut filtrer
   par distance part de ce sommet et le redescend ; remonter le curseur
   jusqu'à ce sommet repasse `f.distance` à `null` (voir kind==="distance"
   plus bas), pas à une valeur numérique qui resterait, elle, un plafond. */
var MAX_DISTANCE_KM = 1200;
/* filters.zoneOrigin : repère {lat,lng} posé à la main sur la carte
   embarquée d'Explorer (voir exploreMapBlockHtml()/wireExploreMap() plus
   bas, "Choisir un lieu sur la carte") — remplace l'ancienne zone de
   recherche dessinée à la main (mapZone), qui appliquait un DEUXIÈME
   filtre de distance indépendant, cumulé au-dessus de filters.distance
   (déjà mesuré depuis la position du voyageur/DEFAULT_ORIGIN) : deux
   notions de distance qui pouvaient se contredire silencieusement, sans
   qu'il y ait de raison de les garder séparées. Fusionné : zoneOrigin
   devient simplement une autre origine possible pour currentOrigin()
   (voir plus bas), filters.distance en reste le rayon, unique — poser un
   repère sur la carte ET ajuster le volet Distance du bandeau du haut
   modifient donc exactement le même filtre, plutôt que deux qui se
   superposent. Persisté comme le reste de filters (voir persist()) :
   comme filters.distance, une distance choisie doit survivre à un
   rechargement de page. `null` par défaut (aucun repère posé, origine =
   position du voyageur ou DEFAULT_ORIGIN, comme avant ce chantier). */

  detailListingId:null, detailTab:"overview", likesView:"favoris", likesCollectionId:null, likesLayout:"grid",
  geoOrigin:null}; // position réelle du voyageur (lat/lng) une fois "Utiliser ma position" activée — jamais persistée (voir persist()), redemandée à chaque session pour rester respectueux de la vie privée.
// likesCollectionId : collection actuellement ouverte dans Mes séjours ->
// Favoris (voir renderFavorisView() plus bas) — null = grille des
// collections, un id = le détail d'UNE collection. Jamais persisté (comme
// geoOrigin) : rouvrir l'app doit toujours repartir de la grille, jamais
// se retrouver profondément dans une collection sans contexte.

try{

  if(saved.filters) state.filters = saved.filters;

  /* hostMode/hostTab : retour utilisateur — recharger la page pendant

     de l'espace hôtes se décide plus bas, au boot (voir la fin du
     fichier) — s'il s'avère que ce n'est plus un compte valide une fois
     Firebase Auth résolu, bootFirebaseAuth() corrige déjà tout seul
     (if(!user && state.hostMode) exitHostMode()), rien de plus à faire ici. */
  // "calendar" a disparu comme onglet (fusionné dans "listings" — voir
  // HOST_TABS_HTML) : un état sauvegardé par une session plus ancienne
  // avant cette fusion pourrait encore porter cette valeur, ramenée sur
  // "listings" plutôt que de planter sur un onglet qui n'existe plus.
  if(saved.hostMode){ state.hostMode = true; state.hostTab = (saved.hostTab==="calendar" ? "listings" : saved.hostTab) || "profile"; }

  // hostTab ci-dessus, un choix d'affichage plutôt qu'une position dans la

  // likesCollectionId/likesView qui repartent toujours de la grille.
  if(saved.likesLayout==="list") state.likesLayout = "list";
