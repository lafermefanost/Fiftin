function buildMessage(l, din, dout, guests, unitName){
  var label = unitName ? (l.name+" – "+unitName) : l.name;
  return "Bonjour "+l.host.name+", je suis intéressé·e par \""+label+"\" ("+l.region+") du "+fmtDate(din)+" au "+fmtDate(dout)+" pour "+guests+" voyageur"+(guests>1?"s":"")+". Ce logement est-il disponible sur ces dates ? Merci ! — via Fiftin";
}
/* wa.me exige un numéro en format international complet, chiffres purs
   (aucun espace/point/tiret/parenthèse, pas de "+") — contrairement à
   tel:/sms:, que l'appli Téléphone/Messages du système sait lire même mal
   formatés (espaces compris), donc jamais retouchés ici. hf-phone est un
   simple champ texte (placeholder "+33…"), rien n'empêche l'hôte de taper
   des espaces ("+33 6 12 34 56 78") ou le format local à 10 chiffres
   ("06 12 34 56 78") — les deux cassaient silencieusement le lien
   WhatsApp (retour utilisateur : "les liens ne fonctionnent pas"). Ne
   traite que le cas français (0X -> 33X) : seul pays couvert par l'appli
   aujourd'hui (FR_REGIONS, DEFAULT_ORIGIN). */
function waPhoneDigits(phone){
  var digits = String(phone||"").replace(/[^\d+]/g, "");
  if(digits.charAt(0)==="+") digits = digits.slice(1);
  else if(digits.charAt(0)==="0") digits = "33"+digits.slice(1);
  /* "+33 (0)6 12 34 56 78" (le "0" de liaison, écrit entre parenthèses pour
     rappeler comment composer depuis la France) ne laisse ici que les
     chiffres : 330612345678 — un "0" ne peut jamais légitimement suivre
     l'indicatif 33 dans un vrai numéro français (un numéro français
     commence toujours par 1-9 après le 0 initial), donc "330" en tête ne
     peut être que cet artefact à retirer. */
  if(digits.slice(0,3)==="330") digits = "33"+digits.slice(3);
  return digits;
}
function fmtDate(iso){
  var d = new Date(iso+"T00:00:00");
  var mois = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  return d.getDate()+" "+mois[d.getMonth()];
}

function wireQuickReq(id, uid, unit){
  var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
  var calSource = unit ? {avail: unit.avail||[]} : l;
  var qid = uid;
  var $in = document.getElementById(qid+"-in"), $out = document.getElementById(qid+"-out"), $g = document.getElementById(qid+"-g");
  var $prev = document.getElementById(qid+"-preview");
  var $mailBtn = document.querySelector('[data-send="mail"][data-id="'+qid+'"]');
  var $waBtn = document.querySelector('[data-send="wa"][data-id="'+qid+'"]');
  var $smsBtn = document.querySelector('[data-send="sms"][data-id="'+qid+'"]');
  var $callBtn = document.querySelector('[data-send="call"][data-id="'+qid+'"]');

  function update(){
    /* $out.value peut être vide entre le premier et le second clic sur le
       calendrier (arrivée posée, départ pas encore choisi — voir
       wireCalDays()) : buildMessage()/fmtDate() sur une date vide
       planterait le message et les liens d'envoi. On affiche une invite
       à la place, sans toucher aux liens (qui gardent leur dernière
       valeur valide jusqu'à ce que le départ soit choisi). */
    if(!$in.value || !$out.value){
      $prev.textContent = "Choisissez votre date de départ sur le calendrier ci-dessus.";
      return;
    }
    var guests = Number($g.textContent);
    var msg = buildMessage(l, $in.value, $out.value, guests, unit && unit.name);
    $prev.textContent = msg;
    var phone = waPhoneDigits(l.host.phone);
    /* $mailBtn absent si l.host.email n'existe pas (voir quickReqHtml()) :
       pas de bouton rendu, rien à câbler. */
    if($mailBtn) $mailBtn.href = "mailto:"+l.host.email+"?subject="+encodeURIComponent("Demande de séjour — "+l.name)+"&body="+encodeURIComponent(msg);
    $waBtn.href = "https://wa.me/"+phone+"?text="+encodeURIComponent(msg);
    $smsBtn.href = "sms:"+l.host.phone+(/iPhone|iPad|iPod/.test(navigator.userAgent)? "&":"?") +"body="+encodeURIComponent(msg);
    $callBtn.href = "tel:"+l.host.phone;
  }
  /* wireFeedEvents() rappelle wireQuickReq() à CHAQUE ouverture/fermeture
     du panneau (voir [data-quickreq] plus haut), pas seulement à son
     premier rendu — sans cette garde, les écouteurs ci-dessous (boutons
     d'envoi, dates, stepper, calendrier) s'empilaient à chaque
     réouverture : un panneau rouvert 3 fois écrivait alors 3 fois dans
     contactLog pour un seul clic sur WhatsApp. Latent depuis toujours
     (update() réécrit juste les mêmes liens, inoffensif), rendu réel par
     logContact(). $prev.dataset.wired marque un panneau déjà câblé —
     update() continue de tourner à chaque appel (gratuit, garde le
     message/les liens à jour), seuls les addEventListener ne le sont
     qu'une fois par panneau (réinitialisé automatiquement si le panneau
     est re-rendu ailleurs, ex. selectDemandeListing() : c'est alors un
     nouveau nœud DOM, sans le flag). */
  if($prev.dataset.wired){ update(); return; }
  $prev.dataset.wired = "1";
  /* Historique perso du voyageur (voir logContact()) : câblé sur le clic
     réel des boutons d'envoi, pas sur update() — un seul enregistrement
     par contact effectivement initié, pas à chaque frappe dans le
     formulaire (qui appelle update() en continu). */
  var unitName = unit && unit.name;
  /* datesTouched : distingue une date réellement choisie (champ modifié,
     ou jour du calendrier cliqué — voir wireCalDays() plus bas) d'une
     date simplement pré-remplie par défaut (todayISO(14)/todayISO(21),
     voir quickReqHtml()) que le voyageur n'a jamais regardée. Sans cette
     distinction, TOUT contact — même "j'appelle sans avoir touché aux
     dates" — se classait dans Demandes sous un intitulé de séjour
     précis mais fictif ("Séjour du 10 au 17 oct."), qui n'a jamais
     reflété une intention réelle. Non touché -> checkIn/checkOut null,
     et la ligne retombe sur "Dates non précisées" (déjà géré par
     stayPeriodLabel(), jusqu'ici du code mort puisque les champs étaient
     toujours renseignés). */
  var datesTouched = false;
  if($mailBtn) $mailBtn.addEventListener("click", function(){ logContact(l, "mail", unitName, datesTouched?$in.value:null, datesTouched?$out.value:null); });
  $waBtn.addEventListener("click", function(){ logContact(l, "wa", unitName, datesTouched?$in.value:null, datesTouched?$out.value:null); });
  $smsBtn.addEventListener("click", function(){ logContact(l, "sms", unitName, datesTouched?$in.value:null, datesTouched?$out.value:null); });
  $callBtn.addEventListener("click", function(){ logContact(l, "call", unitName, datesTouched?$in.value:null, datesTouched?$out.value:null); });
  $in.addEventListener("change", function(){ datesTouched = true; update(); });
  $out.addEventListener("change", function(){ datesTouched = true; update(); });
  Array.prototype.forEach.call(document.querySelectorAll('.stepper button[data-target="'+qid+'-g"]'), function(btn){
    btn.addEventListener("click", function(){
      var v = Number($g.textContent) + Number(btn.getAttribute("data-step"));
      if(v<1) v=1; if(v>12) v=12;
      $g.textContent = v; update();
    });
  });

  var $cal = document.querySelector('[data-cal-listing="'+qid+'"]');
  /* data-date (ISO complet) plutôt que reconstruire depuis data-day+mois :
     commun aux deux modes (démo comme réel, voir calendarGridHtml/
     realCalendarGridHtml), donc pas besoin de savoir dans lequel on est. */
  /* Peint la sélection en cours sur les cases DU MOIS ACTUELLEMENT AFFICHÉ,
     à partir de $in/$out (jamais de variable d'état séparée à resynchroniser :
     data-date de chaque case suffit à savoir si elle tombe dans la période).
     Fonctionne aussi bien sur un mois qui ne contient que le début, que la
     fin, ou aucun des deux (juste des jours "range-mid" traversés). Appelée
     après chaque clic et après chaque re-rendu du mois (renderCal/
     renderRealMonth), pour que la période choisie reste visible en
     naviguant d'un mois à l'autre. */
  function paintRangeSelection(){
    Array.prototype.forEach.call($cal.querySelectorAll(".cal-cell:not(.empty)"), function(cell){
      cell.classList.remove("selected", "range-mid");
      var d = cell.getAttribute("data-date");
      if(!d || !datesTouched || !$in.value) return;
      if(d===$in.value || (Boolean($out.value) && d===$out.value)){
        cell.classList.add("selected");
      } else if($out.value && d>$in.value && d<$out.value){
        cell.classList.add("range-mid");
      }
    });
  }
  function wireCalDays(){
    Array.prototype.forEach.call($cal.querySelectorAll(".cal-cell.avail"), function(cell){
      cell.addEventListener("click", function(){
        var clicked = cell.getAttribute("data-date");
        /* Sélection en deux clics façon "additionner les jours" (retour
           utilisateur) : le premier clic après une période déjà complète
           (ou au tout premier chargement, avant tout clic réel — voir
           datesTouched) repart d'une arrivée neuve, départ vidé. Tant que
           seule l'arrivée est posée, le clic suivant fixe le départ (ou
           redéfinit l'arrivée si le jour cliqué est antérieur) — jamais de
           +7 nuits deviné automatiquement comme avant. */
        var pendingStartOnly = datesTouched && $in.value && !$out.value;
        if(pendingStartOnly){
          if(clicked > $in.value) $out.value = clicked;
          else if(clicked < $in.value) $in.value = clicked;
          // clicked === $in.value : reclique sur l'arrivée déjà posée, rien à faire
        } else {
          $in.value = clicked;
          $out.value = "";
        }
        datesTouched = true;
        update();
        paintRangeSelection();
      });
    });
    // Appelé aussi bien au premier montage qu'après chaque re-rendu du mois
    // (renderCal/renderRealMonth) : repeint la période déjà choisie sur les
    // cases du mois nouvellement affiché.
    paintRangeSelection();
  }
  function renderCal(monthIndex){
    $cal.setAttribute("data-cal-month", monthIndex);
    $cal.querySelector(".cal-title").textContent = MONTH_LONG[monthIndex]+" "+DEMO_YEAR;
    $cal.querySelector(".cal-grid").innerHTML = calendarGridHtml(calSource, monthIndex);
    wireCalDays();
  }
  if($cal){
    Array.prototype.forEach.call($cal.querySelectorAll("[data-cal-nav]"), function(btn){
      btn.addEventListener("click", function(){
        var cur = Number($cal.getAttribute("data-cal-month"));
        var next = cur + Number(btn.getAttribute("data-cal-nav"));
        if(next<0) next = 11; if(next>11) next = 0;
        renderCal(next);
      });
    });
    wireCalDays();

    /* Bascule vers le mode réel dès qu'une projection publique existe pour
       CETTE chambre (listings/{id}/publicAvail/{unitId}, voir plus haut et
       functions/index.js) — lecture publique, aucune connexion requise.
       Si le document n'existe pas encore (jamais synchronisé), on reste
       simplement en mode démo/"pas de données" tel quel : dégradation
       propre, rien ne casse pour les annonces pas encore concernées. */
    if(unit && unit.id && l.docId && typeof firebase!=="undefined" && firebase.apps && firebase.apps.length){
      firebase.firestore().collection("listings").doc(l.docId).collection("publicAvail").doc(unit.id).get().then(function(doc){
        if(!doc.exists) return;
        var ranges = doc.data().ranges || [];
        var today = new Date();
        var realYear = today.getFullYear(), realMonth = today.getMonth();

        function renderRealMonth(y, m){
          $cal.classList.remove("cal-nodata");
          $cal.setAttribute("data-cal-year", y);
          $cal.setAttribute("data-cal-month", m);
          $cal.querySelector(".cal-title").textContent = MONTH_LONG[m]+" "+y;
          $cal.querySelector(".cal-grid").innerHTML = realCalendarGridHtml(y, m, ranges);
          $cal.querySelector(".cal-legend").outerHTML =
            '<div class="cal-legend"><span class="cal-dot avail"></span>Disponible<span class="cal-dot"></span>Indisponible</div>';
          wireCalDays();
        }
        // Remplace la navigation démo (bouclée sur DEMO_YEAR) par une
        // navigation temporelle réelle — cloner/remplacer les boutons
        // détache proprement les anciens écouteurs (mode démo) pour ne
        // pas les cumuler avec les nouveaux.
        Array.prototype.forEach.call($cal.querySelectorAll("[data-cal-nav]"), function(btn){
          btn.parentNode.replaceChild(btn.cloneNode(true), btn);
        });
        Array.prototype.forEach.call($cal.querySelectorAll("[data-cal-nav]"), function(btn){
          btn.addEventListener("click", function(){
            var y = Number($cal.getAttribute("data-cal-year")), m = Number($cal.getAttribute("data-cal-month"));
            m += Number(btn.getAttribute("data-cal-nav"));
            if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
            renderRealMonth(y, m);
          });
        });
        renderRealMonth(realYear, realMonth);
      }).catch(function(){ /* silencieux : reste en mode démo/"pas de données" */ });
    }
  }
  update();
}

function unitCardHtml(u, selectable){
  var img = (u.gallery && u.gallery[0]) ? '<img src="'+u.gallery[0]+'" alt="'+esc(u.name)+'" loading="lazy">' : '<div class="unit-thumb-empty"></div>';
  var tag = selectable ? 'button type="button" data-select-unit="'+esc(u.id)+'"' : 'div';
  var closeTag = selectable ? 'button' : 'div';
  return '<'+tag+' class="unit-card">'+
    '<div class="unit-thumb">'+img+'</div>'+
    '<div class="unit-info"><b>'+esc(u.name)+'</b><span>'+u.price+' € / nuit · '+u.maxPersons+' voyageur'+(u.maxPersons>1?'s':'')+' max</span></div>'+
  '</'+closeTag+'>';
}

/* ---------------- detail sheet ---------------- */
/* Annonce à plusieurs chambres (hasTabs) : sous-onglets au niveau du titre
   ("Vue d'ensemble" + une par chambre) — 1 clic pour voir les photos, les
   infos et le calendrier propres à une chambre, ou pour revenir à la vue
   d'ensemble. state.detailTab retient l'onglet actif tant qu'on reste sur
   la même annonce (state.detailListingId) ; ouvrir une AUTRE annonce
   retombe sur "Vue d'ensemble". Comportement strictement inchangé pour une
   annonce sans plusieurs chambres (0 ou 1) : même code qu'avant. */
function openDetail(id){
  userInteracted = true; // voir sa déclaration : annule le popup de connexion programmé au boot
  var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
  var root = document.getElementById("detail-root");
  var hasTabs = !!(l.units && l.units.length > 1);

  if(state.detailListingId !== id){ state.detailListingId = id; state.detailTab = "overview"; }
  var activeUnit = null;
  if(hasTabs && state.detailTab!=="overview"){
    activeUnit = l.units.filter(function(u){ return u.id===state.detailTab; })[0] || null;
    if(!activeUnit) state.detailTab = "overview"; // chambre retirée entre-temps -> retombe sur la vue d'ensemble
  }

  /* Bug réel repéré en usage (retour utilisateur, capture à l'appui) : une
     annonce à une seule location (!hasTabs) n'affichait QUE l.gallery
     (les photos "maison"), sans jamais retomber sur les photos de son
     unique chambre — contrairement à coverHtml() (carte du fil), qui a
     déjà ce repli, et contrairement à la "vue d'ensemble" d'une annonce à
     PLUSIEURS chambres, qui concatène déjà maison + chambres. Résultat
     concret : une annonce dont les photos "maison" manquent (jamais
     renseignées, ou perdues) mais dont la chambre a bien des photos
     montrait sa carte normalement (via le repli de coverHtml()) mais une
     fiche détail vide — la carte et la fiche se contredisaient. Corrigé
     en unifiant : plus de cas particulier !hasTabs, la vue "pas de
     chambre précise sélectionnée" (établissement entier, qu'il ait 1 ou
     plusieurs chambres) concatène toujours maison + chambre(s). */
  var gallery;
  if(activeUnit){
    gallery = (activeUnit.gallery && activeUnit.gallery.length) ? activeUnit.gallery : (l.gallery || []);
  } else {
    gallery = (l.gallery || []).slice();
    (l.units || []).forEach(function(u){ gallery = gallery.concat(u.gallery || []); });
  }
  var galleryAlt = activeUnit ? activeUnit.name : l.name;
  var total = Math.max(l.photos, gallery.length);
  var slides = "";
  for(var i=0;i<total;i++){
    if(gallery[i]){
      slides += '<div class="slide"><img src="'+gallery[i]+'" alt="'+esc(galleryAlt)+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"></div>';
      continue;
    }
    slides += '<div class="slide"><div class="grad" style="position:absolute;inset:0;background:'+GRADIENTS[l.grad]+';filter:hue-rotate('+(i*6)+'deg) brightness('+(0.85+i*0.05)+')"></div>'+
      '<div class="grain" style="position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\'><filter id=\'n\'><feTurbulence type=\'fractalNoise\' baseFrequency=\'0.85\' numOctaves=\'2\'/></filter><rect width=\'100%25\' height=\'100%25\' filter=\'url(%23n)\'/></svg>&quot;)"></div></div>';
  }
  var dots = "";
  for(var j=0;j<total;j++) dots += '<span class="'+(j===0?"on":"")+'"></span>';

  var tabsHtml = !hasTabs ? "" : '<div class="detail-tabs">'+
      '<button type="button" class="detail-tab'+(!activeUnit?' active':'')+'" data-detail-tab="overview">Vue d\'ensemble</button>'+
      l.units.map(function(u){ return '<button type="button" class="detail-tab'+(activeUnit&&activeUnit.id===u.id?' active':'')+'" data-detail-tab="'+esc(u.id)+'">'+esc(u.name)+'</button>'; }).join("")+
    '</div>';

  var metaRowHtml, bodyExtraHtml;
  if(!activeUnit){
    // vue d'ensemble (ou annonce sans plusieurs chambres) : comportement identique à avant, sauf que
    // le planning ne s'affiche jamais ici quand il y a plusieurs chambres (voir plus bas) — chaque
    // chambre a le sien, propre à elle, un établissement entier n'a pas UN planning unique.
    var convLabel = (authState.uid && l.ownerUid && l.ownerUid===authState.uid) ? conversionLabelFor(l) : null;
    metaRowHtml = '<div class="detail-card"><div class="meta-row">'+
      metaItemHtml(META_ICON_PRICE, (hasTabs ? "dès "+l.price : l.price)+"€", "par nuit")+
      metaItemHtml(META_ICON_DISTANCE, listingDistanceKm(l)+" km", "de vous")+
      (convLabel ? metaItemHtml(META_ICON_CONVERSION, convLabel, "demandes &rarr; séjours") : "")+
    '</div></div>';
    bodyExtraHtml =
      '<div class="detail-card">'+
      '<p class="desc">'+esc(l.desc)+'</p>'+
      '</div>'+
      '<div class="detail-card"><div class="section-title">Prestations</div>'+
      detailAmenitiesHtml(l)+'</div>'+
      /* hasTabs (units.length>1), pas juste "une unité existe" : avec une
         seule unité (typiquement un gîte, où le formulaire n'en pousse
         jamais qu'une, voir renderHostUnits()/isGite), cette carte ne
         faisait que répéter en double le nom/prix déjà sur la carte
         méta juste au-dessus — retour utilisateur, capture d'écran à
         l'appui ("il y a toujours le menu chambre alors que c'est un
         gîte"). Utile seulement pour prévisualiser plusieurs chambres
         avant de choisir un onglet, ce qui n'existe que si hasTabs. */
      (hasTabs ? '<div class="detail-card"><div class="section-title">Chambres</div><div class="unit-list">'+l.units.map(function(u){ return unitCardHtml(u, hasTabs); }).join("")+'</div></div>' : '');
  } else {
    // chambre sélectionnée : ses propres infos, photos (déjà gérées ci-dessus) et son propre planning —
    // pas la description/liste des chambres de l'établissement, déjà sur la vue d'ensemble (le site/
    // Google, eux, sont désormais dans la carte nom+accroche tout en haut, commune aux deux vues).
    metaRowHtml = '<div class="detail-card"><h2 class="section-title" style="margin-top:0">'+esc(activeUnit.name)+'</h2>'+
      '<div class="meta-row">'+
      metaItemHtml(META_ICON_PRICE, activeUnit.price+"€", "par nuit")+
      metaItemHtml(META_ICON_GUESTS, activeUnit.maxPersons, "voyageurs max")+
      metaItemHtml(META_ICON_DISTANCE, listingDistanceKm(l)+" km", "de vous")+
      '</div></div>';
    bodyExtraHtml =
      '<div class="detail-card"><div class="section-title">Prestations</div>'+
      detailAmenitiesHtml(l)+'</div>';
  }

  var qrUid = "qrd"+l.id+(activeUnit ? "-"+activeUnit.id : "");

  root.innerHTML = '<div class="detail" id="detail-panel">'+
    '<div class="detail-gallery" id="detail-gallery">'+slides+
      '<button class="detail-back" id="detail-back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>'+
      '<button class="save-btn detail-save'+(isListingSaved(l)?' liked':'')+'" data-like="'+l.id+'" aria-label="Ajouter à une collection"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 000-7.8z"/></svg></button>'+
      '<button class="share-btn detail-share" data-share="'+l.id+'" aria-label="Partager">'+SHARE_ICON_SVG+'</button>'+
      '<div class="dots">'+dots+'</div>'+
    '</div>'+
    '<div class="detail-body">'+
      // Nom de l'annonce dans sa propre carte (retour utilisateur : "une
      // carte pour quasiment tout") — auparavant du texte nu, posé à même
      // le fond --cream, seule section sans carte de toute la fiche.
      '<div class="detail-card"><div class="region">'+esc(detailLocationLineFor(l))+'</div>'+
      '<h1>'+esc(l.name)+'</h1>'+
      taglineHtml(l)+
      extLinksHtml(l)+
      '</div>'+
      tabsHtml+
      '<div class="detail-cards">'+
        metaRowHtml+
        bodyExtraHtml+
        '<div class="detail-card"><div class="section-title" style="margin-top:0">Votre hôte</div>'+
        '<div class="host-card"><div class="host-avatar">'+l.host.initial+'</div><div class="host-info"><b>'+esc(l.host.name)+'</b>'+(l.host.bio ? '<p>'+esc(l.host.bio)+'</p>' : '')+'</div></div></div>'+
        // Vue d'ensemble d'une annonce à plusieurs chambres : pas de calendrier
        // ici, il n'y a pas de planning général — seulement dans l'onglet de
        // chaque chambre (voir plus bas, activeUnit).
        (!hasTabs || activeUnit ? '<div class="qr-panel" style="border-radius:16px;" id="qr-'+qrUid+'">'+quickReqHtml(l, qrUid, activeUnit ? {avail: activeUnit.avail||[]} : null)+'</div>' : '')+
      '</div>'+
    '</div>'+
  '</div>';

  document.getElementById("detail-back").addEventListener("click", closeDetail);
  root.querySelector("[data-like]").addEventListener("click", function(){
    openCollectionPicker(l, function(){ renderLikeBadge(); openDetail(id); });
  });
  root.querySelector("[data-share]").addEventListener("click", function(){ shareListing(l); });
  if(hasTabs){
    // Changer d'onglet ou choisir une chambre depuis la vue d'ensemble tient en 1 clic — la position
    // de scroll est reprise telle quelle pour un changement d'onglet (pas besoin de rescroller à
    // chaque fois), remise en haut seulement en entrant fraîchement dans une chambre depuis sa carte.
    Array.prototype.forEach.call(root.querySelectorAll("[data-detail-tab]"), function(btn){
      btn.addEventListener("click", function(){
        var panel = document.getElementById("detail-panel");
        var scrollY = panel ? panel.scrollTop : 0;
        state.detailTab = btn.getAttribute("data-detail-tab");
        openDetail(id);
        var newPanel = document.getElementById("detail-panel");
        if(newPanel) newPanel.scrollTop = scrollY;
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-select-unit]"), function(btn){
      btn.addEventListener("click", function(){
        state.detailTab = btn.getAttribute("data-select-unit");
        openDetail(id);
      });
    });
  }
  var gal = document.getElementById("detail-gallery");
  gal.addEventListener("scroll", function(){
    var idx = Math.round(gal.scrollLeft / gal.clientWidth);
    Array.prototype.forEach.call(root.querySelectorAll(".dots span"), function(s,i){ s.classList.toggle("on", i===idx); });
  });
  if(!hasTabs || activeUnit) wireQuickReq(l.id, qrUid, activeUnit || soleUnitOf(l));
  document.body.style.overflow = "hidden";
  document.body.classList.add("detail-open");
}
function closeDetail(){
  document.getElementById("detail-root").innerHTML = "";
  document.body.style.overflow = "";
  document.body.classList.remove("detail-open");
  state.detailListingId = null; state.detailTab = "overview";
}

function formulaCardHtml(value,name,price,desc){
  return '<button type="button" class="formula-card'+(chosenHostPlan===value?' active':'')+'" data-plan="'+value+'">'+
    '<div class="formula-card-head"><b>'+name+'</b><span>'+price+'</span></div>'+
    '<p>'+desc+'</p>'+
  '</button>';
}
/* Même carte, mais un <div>, jamais un <button> : affichage en LECTURE
   SEULE de la formule courante dans le profil hôte (renderHostProfile())
   — contrairement au sélecteur à l'inscription, ce fichier n'écrit
   jamais dans un accounts/{uid} déjà existant (voir resolveHostAccount()),
   donc pas question de la rendre cliquable ici sans un vrai mécanisme de
   changement de formule à construire côté serveur. */

  return '<div class="formula-card'+(active?' active':'')+'">'+

    '<p>'+f.desc+'</p>'+

}

    $r.addEventListener("input", function(){

        result.deactivated.forEach(function(v){

        var newUnits = (rlCtx.listing.units||[]).map(function(u){ return u.id===rlCtx.unit.id ? Object.assign({}, u, {linkedRoomId:newRoomId}) : u; });

function closeSheet(){ document.getElementById("sheet-root").innerHTML = ""; }

/* Confirmation à deux vrais boutons "Oui"/"Non" — volontairement séparée
   du dispatch par "kind" d'openSheet() ci-dessus (spécifique aux volets
   filtres/formulaires, pas adapté à un message + un callback arbitraire).
   Remplace window.confirm() pour les actions Envies → Demandes : un
   confirm() natif n'affiche que "OK"/"Annuler" (aucune API pour
   relabelliser ces boutons), ce qui ne correspondait pas au texte "Oui/
   Non" affiché — undéfini pour l'utilisateur ce que "Annuler" voulait
   dire face à une question formulée en oui/non. */
function openConfirmSheet(title, yesLabel, noLabel, onYes){
  var root = document.getElementById("sheet-root");
  root.innerHTML = '<div class="sheet-backdrop" id="sheet-backdrop"><div class="frame"><div class="sheet" style="position:relative;">'+
    '<button class="sheet-close" id="sheet-close">&times;</button><div class="sheet-handle"></div>'+
    '<h3>'+esc(title)+'</h3>'+
    '<div class="sheet-apply">'+
      '<button type="button" class="btn-apply" id="sheet-confirm-yes">'+esc(yesLabel)+'</button>'+
      '<button type="button" class="link-btn" id="sheet-confirm-no" style="width:100%; text-align:center; margin:12px 0 0;">'+esc(noLabel)+'</button>'+
    '</div>'+
  '</div></div></div>';
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  document.getElementById("sheet-backdrop").addEventListener("click", function(e){ if(e.target.id==="sheet-backdrop") closeSheet(); });
  document.getElementById("sheet-confirm-no").addEventListener("click", closeSheet);
  document.getElementById("sheet-confirm-yes").addEventListener("click", function(){ closeSheet(); onYes(); });
}

/* ---------------- comptes : connexion / inscription / dépôt d'annonce ---------------- */
/* Écrit accounts/{uid} pour la toute première fois, juste après la
   création du compte Firebase Auth dans ce même appel (Espace hôtes →
   créer un compte + choisir une formule de gestion) : uid tout neuf que
   Firebase Auth vient de générer, document garanti inexistant avant cet
   instant — un .set() ici ne peut écraser aucune donnée réelle,
   contrairement à une écriture sur un compte déjà utilisé (voir les
   commentaires plus haut sur le calendrier simplifié / compte gestion).
   Formule purement déclarative pour l'instant, comme S.settings.plan
   dans app/ (aucun paiement branché) — juste positionnée dès
   l'inscription pour ne pas avoir à la ressaisir dans app/. */
function bootstrapHostAccount(uid, plan){
  return firebase.firestore().collection("accounts").doc(uid).set({
    settings: {plan: plan},
    bookings: [], guests: [],
    createdVia: "sejours-signup",
    updated: new Date().toISOString()
  });
}
function submitAuthSheet(){
  var email = document.getElementById("auth-email").value.trim();
  var password = document.getElementById("auth-password").value;
  var errEl = document.getElementById("auth-err");
  errEl.style.color = "var(--danger)";
  errEl.textContent = "";
  if(!email || !password){ errEl.textContent = "Renseignez e-mail et mot de passe."; return; }
  if(typeof firebase==="undefined"){ errEl.textContent = "Connexion indisponible pour le moment — réessayez dans un instant."; return; }
  var btn = document.getElementById("sheet-apply");
  btn.disabled = true;
  var afterAuth = function(){
    closeSheet();
    // switchTab("profile"), pas renderProfile() directement : renderProfile()
    // ne fait que réécrire #feed, sans jamais toucher #filter-bar/#result-line
    // (seul switchTab() les masque, voir son else) ni state.tab/le surlignage
    // de l'onglet actif. Se connecter depuis Explorer/Carte/Mes séjours (où
    // la barre de filtres est visible) laissait donc ces chrome-là affichés
    // par-dessus le Profil fraîchement rendu — mise en page cassée signalée
    // par l'hôte, capture d'écran à l'appui. enterHostMode() gérait déjà
    // correctement son propre chrome, d'où ce bug invisible tant que seul
    // "Devenir hôte" déclenchait cette connexion.
    if(authContext==="host") enterHostMode(); else switchTab("profile");
  };
  if(authMode==="signup"){
    var pw2 = document.getElementById("auth-password2").value;
    if(password!==pw2){ errEl.textContent = "Les deux mots de passe ne correspondent pas."; btn.disabled = false; return; }
    var planToBootstrap = (authContext==="host" && (chosenHostPlan==="essentiel" || chosenHostPlan==="pro")) ? chosenHostPlan : null;
    firebase.auth().createUserWithEmailAndPassword(email, password)
      .then(function(cred){
        if(!planToBootstrap) return;
        return bootstrapHostAccount(cred.user.uid, planToBootstrap);
      })
      .then(afterAuth)
      .catch(function(err){ errEl.textContent = authErrorMessage(err); btn.disabled = false; });
  } else {
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(afterAuth)
      .catch(function(err){ errEl.textContent = authErrorMessage(err); btn.disabled = false; });
  }
}
function submitForgotPassword(){
  var email = document.getElementById("auth-email").value.trim();
  var errEl = document.getElementById("auth-err");
  if(!email){ errEl.style.color = "var(--danger)"; errEl.textContent = "Entrez d'abord votre e-mail ci-dessus."; return; }
  firebase.auth().sendPasswordResetEmail(email)
    .then(function(){ errEl.style.color = "var(--sauge-deep)"; errEl.textContent = "E-mail envoyé — vérifiez votre boîte de réception."; })
    .catch(function(err){ errEl.style.color = "var(--danger)"; errEl.textContent = authErrorMessage(err); });
}
function renderHostPhotoGrid(){
  var grid = document.getElementById("hf-photo-grid");
  if(!grid) return;
  grid.innerHTML = hfSelectedFiles.map(function(entry, i){
    return '<div class="hf-photo-thumb"><img src="'+photoEntryUrl(entry)+'" alt=""><button type="button" class="hf-photo-remove" data-i="'+i+'">&times;</button></div>';
  }).join("");
  Array.prototype.forEach.call(grid.querySelectorAll(".hf-photo-remove"), function(el){
    el.addEventListener("click", function(){
      hfSelectedFiles.splice(Number(el.getAttribute("data-i")), 1);
      renderHostPhotoGrid();
    });
  });
}

function findHfUnit(unitId){ return hfUnits.filter(function(u){ return u.id===unitId; })[0]; }
/* Tarif actuel d'une chambre Fiftin app pour une capacité donnée — dernière
   entrée de tariffHistory (triée par date de départ), même logique que
   addRoomTariff() côté app/. Sert à préremplir le prix/nuit d'une chambre
   Séjours quand on la relie à cette chambre app (voir .hf-unit-room ci-dessous). */
function roomCurrentPrice(room, pax){
  var hist = room && room.tariffHistory;
  if(!hist || !hist.length) return null;
  var last = hist.slice().sort(function(a,b){ return a.from<b.from?-1:a.from>b.from?1:0; }).pop();
  if(!last || !last.prices) return null;
  return last.prices[pax] != null ? last.prices[pax] : null;
}

/* Une carte par chambre du formulaire de dépôt, reconstruite entièrement
   à chaque ajout/retrait de chambre ; les champs texte mettent à jour
   hfUnits directement sur "input" (pas de re-rendu de toute la liste à
   chaque frappe, sinon le focus/curseur saute). Seule la grille de
   photos d'une chambre se re-rend isolément (renderHostUnitPhotoGrid). */
/* Structure identique quel que soit le type d'hébergement (retour
   utilisateur : "je veux que la structure soit identique sur les deux, que
   ce soit chambre d'hôte ou gîte") — le bouton "+ Ajouter une location" et
   le comportement d'ajout/retrait ne dépendent plus jamais de accomType,
   seulement du NOMBRE de locations déjà présentes (voir renderHostUnits()).
   Ne fait plus que garantir qu'il existe toujours au moins une location. */
function updateUnitsFraming(){
  if(!hfUnits.length){
    hfUnits.push({id:newHfUnitId(), name:"", price:"", maxPersons:2, photos:[], linkedRoomId:""});
  }
  renderHostUnits();
}
/* Retour utilisateur explicite, avec capture d'écran à l'appui : "tu ne
   devrais pas voir cette partie Chambre 1 tant que tu n'as pas cliqué sur
   l'option plusieurs locations disponibles" — et, plus largement, "il y a
   un doublon, le nom de l'annonce répété dans une chambre, comme une
   poupée russe (...) quand on a qu'une seule location, un seul bloc, pas
   besoin de poupées russes. Uniquement quand on ajoute une location, là on
   a ce principe de poupée russe." Tant qu'il n'y a qu'UNE SEULE location
   (hfUnits.length===1, le cas par défaut au dépôt comme à l'édition — voir
   son initialisation à l'ouverture du volet), pas de carte "Chambre N"/
   "Location N" ni de champ Nom séparé (redondant avec le "Nom du logement"
   déjà rempli plus haut dans ce même formulaire) : juste prix, capacité,
   lien Fiftin app et photos, à plat. La carte nommée façon poupée russe
   n'apparaît qu'à partir de la 2e location, ajoutée via "+ Ajouter une
   location" (jamais masqué par accomType désormais, voir updateUnitsFraming()) —
   c'est CE geste, pas le type d'hébergement, qui fait exister la notion de
   "plusieurs locations distinctes à nommer". */
function renderHostUnits(){
  var wrap = document.getElementById("hf-units");
  if(!wrap) return;
  var multi = hfUnits.length>1;
  var label = document.getElementById("hf-units-label");
  if(label) label.textContent = multi ? "Locations — chacune avec son prix, sa capacité et ses photos" : "Capacité et tarif";
  wrap.innerHTML = hfUnits.map(function(u, i){
    return '<div class="hf-unit-card" data-unit-id="'+u.id+'">'+
      (multi ? '<div class="hf-unit-head"><span>Location '+(i+1)+'</span>'+
        '<button type="button" class="hf-unit-remove" data-unit-id="'+u.id+'" aria-label="Retirer cette location">&times;</button>'+
      '</div>'+
      '<div class="field-block"><label>Nom</label><input class="text-input hf-unit-name" data-unit-id="'+u.id+'" value="'+esc(u.name)+'" placeholder="Ex. Chambre Bleue"></div>' : '')+
      '<div class="field-block-row">'+
        '<div class="field-block"><label>Prix / nuit (€)</label><input class="text-input hf-unit-price" type="number" min="1" data-unit-id="'+u.id+'" value="'+esc(u.price)+'"></div>'+
        '<div class="field-block"><label>Capacité</label><input class="text-input hf-unit-capacity" type="number" min="1" data-unit-id="'+u.id+'" value="'+u.maxPersons+'"></div>'+
      '</div>'+
      (hfAvailableRooms.length ? '<div class="host-link-row"><label>Relier à une chambre de votre Fiftin app (optionnel)</label><select class="hf-unit-room" data-unit-id="'+u.id+'">'+
        '<option value="">— Aucun lien —</option>'+
        hfAvailableRooms.map(function(r){ return '<option value="'+esc(r.id)+'"'+(r.id===u.linkedRoomId?' selected':'')+'>'+esc(r.name)+'</option>'; }).join("")+
      '</select></div>' : '')+
      '<div class="field-block"><label>Photos de cette location</label>'+
        '<input type="file" class="hf-unit-photos-input" data-unit-id="'+u.id+'" accept="image/*" multiple style="display:none">'+
        '<button type="button" class="btn-photo-add hf-unit-photos-btn" data-unit-id="'+u.id+'">+ Ajouter des photos</button>'+
        '<div class="hf-photo-grid hf-unit-photo-grid" data-unit-id="'+u.id+'"></div>'+
      '</div>'+
    '</div>';
  }).join("");

  hfUnits.forEach(function(u){ renderHostUnitPhotoGrid(u.id); });

  Array.prototype.forEach.call(wrap.querySelectorAll(".hf-unit-name"), function(el){
    el.addEventListener("input", function(){ findHfUnit(el.getAttribute("data-unit-id")).name = el.value; });
  });
  Array.prototype.forEach.call(wrap.querySelectorAll(".hf-unit-price"), function(el){
    el.addEventListener("input", function(){ findHfUnit(el.getAttribute("data-unit-id")).price = el.value; });
  });
  Array.prototype.forEach.call(wrap.querySelectorAll(".hf-unit-capacity"), function(el){
    el.addEventListener("input", function(){ findHfUnit(el.getAttribute("data-unit-id")).maxPersons = el.value; });
  });
  Array.prototype.forEach.call(wrap.querySelectorAll(".hf-unit-room"), function(el){
    el.addEventListener("change", function(){
      var unit = findHfUnit(el.getAttribute("data-unit-id"));
      unit.linkedRoomId = el.value;
      if(!el.value) return;
      // Relier à une chambre app existante reprend son prix/capacité actuels
      // comme point de départ (l'hôte reste libre de les retoucher ensuite) —
      // évite de ressaisir deux fois la même info.
      var room = hfAvailableRooms.filter(function(r){ return r.id===el.value; })[0];
      if(!room) return;
      var card = el.closest(".hf-unit-card");
      if(room.maxPersons){
        unit.maxPersons = room.maxPersons;
        var capInput = card && card.querySelector(".hf-unit-capacity");
        if(capInput) capInput.value = room.maxPersons;
      }
      var price = roomCurrentPrice(room, unit.maxPersons||room.maxPersons||2);
      if(price != null){
        unit.price = String(price);
        var priceInput = card && card.querySelector(".hf-unit-price");
        if(priceInput) priceInput.value = unit.price;
      }
    });
  });
  Array.prototype.forEach.call(wrap.querySelectorAll(".hf-unit-remove"), function(el){
    el.addEventListener("click", function(){
      var unitId = el.getAttribute("data-unit-id");
      hfUnits = hfUnits.filter(function(u){ return u.id!==unitId; });
      renderHostUnits();
    });
  });
  Array.prototype.forEach.call(wrap.querySelectorAll(".hf-unit-photos-btn"), function(el){
    el.addEventListener("click", function(){
      wrap.querySelector('.hf-unit-photos-input[data-unit-id="'+el.getAttribute("data-unit-id")+'"]').click();
    });
  });
  Array.prototype.forEach.call(wrap.querySelectorAll(".hf-unit-photos-input"), function(el){
    el.addEventListener("change", function(e){
      var unitId = el.getAttribute("data-unit-id");
      var unit = findHfUnit(unitId);
      var errEl = document.getElementById("hf-err");
      errEl.textContent = "";
      var accepted = [];
      Array.prototype.forEach.call(e.target.files, function(file){
        if(unit.photos.length+accepted.length>=6){ errEl.textContent = "6 photos maximum par chambre."; return; }
        if(!/^image\//.test(file.type)){ errEl.textContent = "Seules les images sont acceptées."; return; }
        accepted.push(file);
      });
      e.target.value = "";
      if(!accepted.length) return;
      cropAndCompressFiles(accepted).then(function(files){
        files.forEach(function(file){
          if(file.size > 8*1024*1024){ errEl.textContent = "Photo trop lourde (8 Mo maximum) : "+file.name; return; }
          unit.photos.push({type:"new", file:file});
        });
        renderHostUnitPhotoGrid(unitId);
      });
    });
  });
}
/* Redimensionne et recompresse une photo côté client avant envoi — les
   photos de smartphone pèsent souvent 3 à 8 Mo pour une résolution bien
   supérieure à ce qu'un écran affiche jamais dans cette galerie. Réduit le
   poids des pages (chargement du fil, des fiches détail) et le coût de
   stockage/bande passante Firebase, sans perte visible à l'écran : la plus
   grande dimension est plafonnée à 1920px (au-delà, inutile même en rétina
   pour cet usage) et recompressée en JPEG qualité 0.85. En cas d'échec
   (format non décodable par <img>, navigateur sans support canvas…), on
   renvoie le fichier original tel quel plutôt que de bloquer l'envoi. */
var PHOTO_MAX_DIM = 1920;
var PHOTO_JPEG_QUALITY = 0.85;
function compressImageFile(file){
  return new Promise(function(resolve){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h){ resolve(file); return; }
      var scale = Math.min(1, PHOTO_MAX_DIM / Math.max(w, h));
      var tw = Math.max(1, Math.round(w*scale)), th = Math.max(1, Math.round(h*scale));
      var canvas = document.createElement("canvas");
      canvas.width = tw; canvas.height = th;
      var ctx = canvas.getContext("2d");
      if(!ctx){ resolve(file); return; }
      ctx.drawImage(img, 0, 0, tw, th);
      canvas.toBlob(function(blob){
        if(!blob || blob.size >= file.size){ resolve(file); return; } // garde l'original si la compression n'a pas aidé
        var name = file.name.replace(/\.[^.\/]+$/, "")+".jpg";
        resolve(new File([blob], name, {type:"image/jpeg"}));
      }, "image/jpeg", PHOTO_JPEG_QUALITY);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

/* Recadrage manuel avant envoi, cadre 4:5 (retour utilisateur : « rester
   sur un format photo unique 4:5 comme celui du fil, ça éviterait des
   problèmes de cadrage » — avant ce chantier, le cadre était un CARRÉ,
   compromis entre la carte du fil en 4:5 et la fiche détail en ~5:4,
   deux ratios différents recadrés séparément par CSS depuis ce même
   carré, avec deux petits aperçus pour aider l'hôte à deviner le
   résultat sur chacun). Un seul ratio partout désormais — la fiche
   détail passe aussi en 4:5 (voir .detail-gallery) — donc un seul cadre
   4:5, ce qu'on y voit EST exactement ce qui sera affiché partout,
   aucun aperçu séparé à deviner. Le cadre démarre centré (même cadrage
   que le comportement automatique d'avant, pour ne rien changer par
   défaut), et l'hôte peut glisser/zoomer avant de valider. "Garder telle
   quelle" saute le recadrage et retombe sur compressImageFile() (ratio
   d'origine conservé). cropAndCompressFiles() est désormais l'unique
   point d'entrée utilisé par les deux sélecteurs de photos (maison et
   chambre) pour transformer les File bruts choisis en entrées prêtes
   pour hfSelectedFiles/unit.photos — traite les fichiers un par un
   (queue), jamais en parallèle, pour ne montrer qu'un cadrage à la fois.
   Les photos déjà en ligne avant ce chantier restent des carrés en
   Storage — rien à migrer, un carré contient déjà assez d'image pour
   être recadré en 4:5 par le même mécanisme CSS object-fit:cover qui le
   recadrait déjà à deux ratios différents jusqu'ici (voir README,
   « Format photo unique »). */
/* 2048 plutôt que l'ancien 1600 : calculé, pas choisi au hasard — le site
   entier est plafonné à 520px de large, `#app{max-width:520px}`, jamais
   plus, même sur ordinateur (voir README, « Performance »). 520×4 couvre
   une densité d'écran de 4x, au-delà de ce qui existe couramment
   aujourd'hui (le maximum courant est 3x) — une vraie marge pour
   l'évolution des écrans dans les années à venir, sans viser un chiffre
   arbitrairement énorme. S'applique à la LARGEUR de l'export (jamais plus
   large que ça n'a de sens à l'écran) ; la hauteur suit le ratio 4:5.
   CROP_OUTPUT_H_RATIO = 5/4 : hauteur = largeur × ce facteur. */
var CROP_OUTPUT_SIZE = 2048;
var CROP_OUTPUT_H_RATIO = 5/4;
var CROP_ZOOM_MAX_MULT = 3;

/* Vignette légère générée EN PLUS du fichier plein format, pour les
   contextes qui n'affichent jamais une photo en grand (tuile de
   collection ~250px, ligne "Demandes" ~50px — voir listingThumbUrl()) :
   sans elle, ces petits contextes téléchargeaient le même fichier
   2048px que la fiche détail pour n'en afficher qu'une fraction. 480px
   est largement suffisant même au double de la plus grande de ces
   tailles à densité d'écran élevée (250×2 = 500). Prend le fichier DÉJÀ
   recadré/compressé (cropOneFile()/compressImageFile()) et le rétrécit
   encore une fois — jamais l'image source brute, pour rester cohérent
   avec le cadrage déjà choisi par l'hôte. null si le canvas échoue
   (repli sur le fichier plein format côté affichage, voir
   listingThumbUrl()), jamais bloquant pour l'envoi. */
var THUMB_MAX_DIM = 480;
function makeThumbFile(file){
  return new Promise(function(resolve){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h){ resolve(null); return; }
      var scale = Math.min(1, THUMB_MAX_DIM / Math.max(w, h));
      var tw = Math.max(1, Math.round(w*scale)), th = Math.max(1, Math.round(h*scale));
      var canvas = document.createElement("canvas");
      canvas.width = tw; canvas.height = th;
      var ctx = canvas.getContext("2d");
      if(!ctx){ resolve(null); return; }
      ctx.drawImage(img, 0, 0, tw, th);
      canvas.toBlob(function(blob){
        if(!blob){ resolve(null); return; }
        var name = file.name.replace(/\.[^.\/]+$/, "")+"-thumb.jpg";
        resolve(new File([blob], name, {type:"image/jpeg"}));
      }, "image/jpeg", PHOTO_JPEG_QUALITY);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

function cropAndCompressFiles(files){
  var results = [];
  var runNext = function(i){
    if(i>=files.length) return Promise.resolve(results);
    return cropOneFile(files[i], i, files.length).then(function(file){
      results.push(file);
      return runNext(i+1);
    });
  };
  return runNext(0);
}

function cropOneFile(file, index, total){
  return new Promise(function(resolve){
    var overlay = document.getElementById("crop-overlay");
    var imgEl = document.getElementById("crop-img");
    var viewport = document.getElementById("crop-viewport");
    var zoomInput = document.getElementById("crop-zoom");
    var okBtn = document.getElementById("crop-ok");
    var skipBtn = document.getElementById("crop-skip");
    document.getElementById("crop-progress").textContent = total>1 ? ((index+1)+"/"+total) : "";

    var url = URL.createObjectURL(file);
    var st = null; // {naturalW,naturalH,baseScale,scale,offsetX,offsetY,vpW,vpH}
    var dragging = false, dragStartX=0, dragStartY=0, startOffX=0, startOffY=0;

    var cleanup = function(){
      overlay.style.display = "none";
      URL.revokeObjectURL(url);
      viewport.removeEventListener("pointerdown", onPointerDown);
      viewport.removeEventListener("pointermove", onPointerMove);
      viewport.removeEventListener("pointerup", onPointerUp);
      viewport.removeEventListener("pointercancel", onPointerUp);
      zoomInput.oninput = null;
      okBtn.onclick = null;
      skipBtn.onclick = null;
    };
    var fallback = function(){ cleanup(); compressImageFile(file).then(resolve); };

    var clamp = function(){
      var minX = st.vpW - st.naturalW*st.scale, minY = st.vpH - st.naturalH*st.scale;
      st.offsetX = Math.min(0, Math.max(minX, st.offsetX));
      st.offsetY = Math.min(0, Math.max(minY, st.offsetY));
    };
    var applyTransform = function(){
      imgEl.style.width = (st.naturalW*st.scale)+"px";
      imgEl.style.height = (st.naturalH*st.scale)+"px";
      imgEl.style.transform = "translate("+st.offsetX+"px,"+st.offsetY+"px)";
    };

    var onPointerDown = function(e){
      dragging = true;
      viewport.classList.add("dragging");
      dragStartX = e.clientX; dragStartY = e.clientY;
      startOffX = st.offsetX; startOffY = st.offsetY;
      viewport.setPointerCapture(e.pointerId);
    };
    var onPointerMove = function(e){
      if(!dragging) return;
      st.offsetX = startOffX + (e.clientX-dragStartX);
      st.offsetY = startOffY + (e.clientY-dragStartY);
      clamp();
      applyTransform();
    };
    var onPointerUp = function(){ dragging = false; viewport.classList.remove("dragging"); };
    viewport.addEventListener("pointerdown", onPointerDown);
    viewport.addEventListener("pointermove", onPointerMove);
    viewport.addEventListener("pointerup", onPointerUp);
    viewport.addEventListener("pointercancel", onPointerUp);

    zoomInput.value = 0;
    zoomInput.oninput = function(){
      var t = Number(zoomInput.value)/100;
      var newScale = st.baseScale * (1 + t*(CROP_ZOOM_MAX_MULT-1));
      // garde le même point image au centre du cadre pendant le zoom, plutôt que de recentrer au hasard
      var cx = st.vpW/2, cy = st.vpH/2;
      var imgCx = (cx - st.offsetX)/st.scale, imgCy = (cy - st.offsetY)/st.scale;
      st.scale = newScale;
      st.offsetX = cx - imgCx*st.scale;
      st.offsetY = cy - imgCy*st.scale;
      clamp();
      applyTransform();
    };

    okBtn.onclick = function(){
      var canvas = document.createElement("canvas");
      var srcW = st.vpW / st.scale, srcH = st.vpH / st.scale; // toujours dans le ratio 4:5, le cadre l'impose déjà
      var srcX = -st.offsetX / st.scale, srcY = -st.offsetY / st.scale;
      var outW = Math.max(1, Math.round(Math.min(CROP_OUTPUT_SIZE, srcW)));
      var outH = Math.round(outW * CROP_OUTPUT_H_RATIO);
      canvas.width = outW; canvas.height = outH;
      var ctx = canvas.getContext("2d");
      if(!ctx){ fallback(); return; }
      ctx.drawImage(imgEl, srcX, srcY, srcW, srcH, 0, 0, outW, outH);
      canvas.toBlob(function(blob){
        cleanup();
        if(!blob){ resolve(file); return; }
        var name = file.name.replace(/\.[^.\/]+$/, "")+".jpg";
        resolve(new File([blob], name, {type:"image/jpeg"}));
      }, "image/jpeg", PHOTO_JPEG_QUALITY);
    };
    skipBtn.onclick = fallback;

    imgEl.onload = function(){
      // clientWidth/clientHeight (pas un seul "vpSize") : le cadre est
      // maintenant un rectangle 4:5 (voir .crop-viewport, aspect-ratio:4/5),
      // plus un carré — clientHeight reflète la hauteur réellement calculée
      // par le navigateur depuis ce ratio CSS.
      var vpW = viewport.clientWidth, vpH = viewport.clientHeight;
      var nw = imgEl.naturalWidth, nh = imgEl.naturalHeight;
      if(!nw || !nh || !vpW || !vpH){ fallback(); return; }
      // "cover" sur un cadre rectangulaire : le plus grand des deux ratios
      // largeur/hauteur, pour que l'image recouvre toujours tout le cadre
      // sur ses deux axes (même principe que CSS object-fit:cover).
      var baseScale = Math.max(vpW/nw, vpH/nh);
      st = {naturalW:nw, naturalH:nh, baseScale:baseScale, scale:baseScale, vpW:vpW, vpH:vpH,
        offsetX:(vpW-nw*baseScale)/2, offsetY:(vpH-nh*baseScale)/2};
      applyTransform();
    };
    imgEl.onerror = function(){ fallback(); };
    overlay.style.display = "flex"; // avant de charger l'image : le viewport doit avoir sa vraie taille (clientWidth/clientHeight) au moment du onload
    imgEl.src = url;
  });
}

function renderHostUnitPhotoGrid(unitId){
  var grid = document.querySelector('.hf-unit-photo-grid[data-unit-id="'+unitId+'"]');
  if(!grid) return;
  var unit = findHfUnit(unitId);
  grid.innerHTML = unit.photos.map(function(entry, i){
    return '<div class="hf-photo-thumb"><img src="'+photoEntryUrl(entry)+'" alt=""><button type="button" class="hf-photo-remove" data-i="'+i+'">&times;</button></div>';
  }).join("");
  Array.prototype.forEach.call(grid.querySelectorAll(".hf-photo-remove"), function(el){
    el.addEventListener("click", function(){
      unit.photos.splice(Number(el.getAttribute("data-i")), 1);
      renderHostUnitPhotoGrid(unitId);
    });
  });
}

/* Envoie le fichier plein format ET sa vignette (makeThumbFile(), voir
   plus haut) en parallèle pour chaque photo — deux fichiers, un seul
   round-trip de plus par photo (pas deux fois plus lent : les deux
   uploads d'une même photo tournent en même temps, pas l'un après
   l'autre). thumbUrls[i] vaut null si la vignette n'a pas pu être
   générée (canvas indisponible…) — jamais bloquant, listingThumbUrl()
   retombe alors sur le plein format. */
function uploadPhotoFiles(files, uid, pathPrefix, progressLabel){
  var btn = document.getElementById("sheet-apply");
  if(!files.length) return Promise.resolve({urls:[], thumbUrls:[]});
  var urls = [], thumbUrls = [];
  var uploadOne = function(i){
    if(i>=files.length) return Promise.resolve();
    btn.textContent = progressLabel+" ("+(i+1)+"/"+files.length+")";
    var file = files[i];
    var safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    var ts = Date.now();
    var fullPromise = firebase.storage().ref().child("listings/"+uid+"/"+pathPrefix+"-"+ts+"-"+i+"-"+safeName)
      .put(file).then(function(snap){ return snap.ref.getDownloadURL(); });
    var thumbPromise = makeThumbFile(file).then(function(thumbFile){
      if(!thumbFile) return null;
      return firebase.storage().ref().child("listings/"+uid+"/"+pathPrefix+"-thumb-"+ts+"-"+i+"-"+safeName)
        .put(thumbFile).then(function(snap){ return snap.ref.getDownloadURL(); });
    });
    return Promise.all([fullPromise, thumbPromise]).then(function(results){
      urls.push(results[0]);
      thumbUrls.push(results[1]);
      return uploadOne(i+1);
    });
  };
  return uploadOne(0).then(function(){ return {urls:urls, thumbUrls:thumbUrls}; });
}
/* Sépare les entrées déjà en ligne (juste réutilisées telles quelles, rien
   à envoyer) des nouveaux fichiers à uploader, puis recombine dans l'ordre
   d'origine — utilisé pour la maison et pour chaque chambre, en création
   comme en modification. Une entrée "existing" porte déjà son thumbUrl
   (repris depuis le document Firestore au chargement du formulaire
   d'édition, voir openSheet(kind==="hostform")) — jamais régénéré pour
   une photo qui n'a pas changé. */
function resolvePhotoEntries(entries, uid, pathPrefix, progressLabel){
  var newFiles = entries.filter(function(e){ return e.type==="new"; }).map(function(e){ return e.file; });
  return uploadPhotoFiles(newFiles, uid, pathPrefix, progressLabel).then(function(res){
    var urlsQueue = res.urls.slice(), thumbQueue = res.thumbUrls.slice();
    var urls = [], thumbs = [];
    entries.forEach(function(e){
      if(e.type==="existing"){ urls.push(e.url); thumbs.push(e.thumbUrl || null); }
      else { urls.push(urlsQueue.shift()); thumbs.push(thumbQueue.shift()); }
    });
    return {urls:urls, thumbs:thumbs};
  });
}

/* Géocodage adresse -> lat/lng + détail (région/département/ville) via
   Nominatim (OpenStreetMap) : API publique et gratuite, pas de clé ni de
   coût contrairement à un service comme l'API Géocodage Google. Utilisé
   au dépôt/à la modification d'une annonce (un hôte à la fois, usage
   occasionnel) et pour les suggestions d'adresse pendant la saisie —
   jamais côté recherche voyageur, où la distance se recalcule localement
   depuis les coordonnées déjà stockées (voir listingDistanceKm()) : reste
   largement dans les limites d'usage raisonnable de l'API publique.
   addressdetails=1 renvoie state/county/city, exploités par
   matchRegionDept() pour pré-remplir Région/Département/Ville sans que
   l'hôte ait à les choisir à la main (voir wireHfAddressAutocomplete()). */
function geocodeAddress(address){
  var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&countrycodes=fr&q="+encodeURIComponent(address);
  return fetch(url, {headers:{"Accept":"application/json"}}).then(function(r){
    if(!r.ok) throw new Error("geocode-http-"+r.status);
    return r.json();
  }).then(function(results){
    if(!results || !results.length) throw new Error("geocode-not-found");
    return {lat:Number(results[0].lat), lng:Number(results[0].lon), address:results[0].address||{}};
  });
}
function searchAddressSuggestions(query){
  var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=fr&q="+encodeURIComponent(query);
  return fetch(url, {headers:{"Accept":"application/json"}}).then(function(r){
    if(!r.ok) throw new Error("suggest-http-"+r.status);
    return r.json();
  }).then(function(results){ return results || []; }).catch(function(){ return []; });
}
/* Fait correspondre les state/county renvoyés par Nominatim aux noms
   officiels de FR_REGIONS/deptsForRegion() — comparaison par inclusion
   plutôt qu'égalité stricte (Nominatim écrit parfois "Île-de-France" avec
   une nuance d'accent/tiret différente d'un référentiel à l'autre, ou
   ajoute des mots). Non trouvé -> chaîne vide, jamais deviné au hasard. */
function matchRegionDept(addr){
  addr = addr || {};
  var stateStr = (addr.state||"").toLowerCase();
  var countyStr = (addr.county||addr.state_district||"").toLowerCase();
  var region = FR_REGIONS.filter(function(r){
    var n = r.name.toLowerCase();
    return stateStr && (stateStr.indexOf(n)!==-1 || n.indexOf(stateStr)!==-1);
  })[0] || null;
  var dept = null;
  var tryDept = function(r){
    return r.depts.filter(function(d){
      var n = d.toLowerCase();
      return countyStr && (countyStr.indexOf(n)!==-1 || n.indexOf(countyStr)!==-1);
    })[0];
  };
  if(region) dept = tryDept(region) || null;
  if(!dept && countyStr){
    FR_REGIONS.some(function(r){
      var d = tryDept(r);
      if(d){ dept = d; region = r; return true; }
      return false;
    });
  }
  var city = addr.city || addr.town || addr.village || addr.municipality || "";
  return {regionName: region ? region.name : "", deptName: dept || "", city: city};
}

/* Suggestions d'adresse pendant la saisie (Nominatim), avec pré-remplissage
   automatique de Région/Département/Ville au clic — l'hôte n'a plus besoin
   de les choisir à la main dans le cas courant (retour utilisateur : "pas
   pratique de tout remplir"). Ne réécrit jamais un champ déjà rempli par
   l'hôte lui-même (voir applySuggestion ci-dessous) : un choix manuel
   n'est jamais écrasé silencieusement par une suggestion d'adresse
   ultérieure sur un AUTRE champ, seule Région/Département suit toujours
   la dernière adresse choisie (ils vont ensemble, contrairement à Ville
   qui peut être volontairement plus précis que ce que Nominatim renvoie). */
function wireHfAddressAutocomplete(){
  var input = document.getElementById("hf-address");
  var box = document.getElementById("hf-address-suggestions");
  if(!input || !box) return;
  var debounceTimer = null;
  var lastQuery = "";

  function hide(){ box.hidden = true; box.innerHTML = ""; }

  function applySuggestion(result){
    input.value = result.display_name;
    hide();
    var match = matchRegionDept(result.address);
    if(match.regionName){
      document.getElementById("hf-region-name").value = match.regionName;
      document.getElementById("hf-dept-name").innerHTML = deptOptionsHtml(match.regionName, match.deptName);
    }
    var cityInput = document.getElementById("hf-city");
    if(match.city && cityInput && !cityInput.value.trim()) cityInput.value = match.city;
  }

  function renderSuggestions(results){
    if(!results.length){ hide(); return; }
    box.innerHTML = results.map(function(r, i){
      return '<button type="button" class="hf-address-suggestion" data-idx="'+i+'">'+esc(r.display_name)+'</button>';
    }).join("");
    box.hidden = false;
    Array.prototype.forEach.call(box.querySelectorAll(".hf-address-suggestion"), function(btn){
      btn.addEventListener("click", function(){ applySuggestion(results[Number(btn.getAttribute("data-idx"))]); });
    });
  }

  input.addEventListener("input", function(){
    var q = input.value.trim();
    if(debounceTimer) clearTimeout(debounceTimer);
    if(q.length < 5){ hide(); return; }
    debounceTimer = setTimeout(function(){
      lastQuery = q;
      searchAddressSuggestions(q).then(function(results){
        if(q !== lastQuery) return; // une saisie plus récente a déjà pris le dessus
        renderSuggestions(results);
      });
    }, 400);
  });
  // Laisse le temps au clic sur une suggestion de se déclencher avant de la masquer.
  input.addEventListener("blur", function(){ setTimeout(hide, 150); });
}

function submitHostForm(){
  var name = document.getElementById("hf-name").value.trim();
  var accomType = document.getElementById("hf-type").value;
  var hostName = document.getElementById("hf-hostname").value.trim();
  var hostBio = document.getElementById("hf-hostbio").value.trim();
  var regionName = document.getElementById("hf-region-name").value;
  var deptName = document.getElementById("hf-dept-name").value;
  var city = document.getElementById("hf-city").value.trim();
  var address = document.getElementById("hf-address").value.trim();
  var claim = document.getElementById("hf-claim").value.trim();
  var desc = document.getElementById("hf-desc").value.trim();
  var phone = document.getElementById("hf-phone").value.trim();
  var email = document.getElementById("hf-email").value.trim();
  var websiteUrl = document.getElementById("hf-website").value.trim();
  var googleUrl = document.getElementById("hf-google").value.trim();
  var amen = Array.prototype.map.call(document.querySelectorAll("#sheet-root .amenity-chip.active"), function(el){ return el.getAttribute("data-a"); });
  var errEl = document.getElementById("hf-err");
  errEl.textContent = "";
  if(!name || !accomType || !hostName || !address || !claim || !desc || !phone || !email){ errEl.textContent = "Merci de remplir tous les champs."; return; }
  if(!hfUnits.length){ errEl.textContent = "Ajoutez au moins une location."; return; }
  // Le nom par location n'existe (champ affiché) qu'à partir de la 2e —
  // voir renderHostUnits() — donc jamais exigé pour une seule location
  // solo, dont le champ reste vide par construction (pas d'input pour le
  // remplir) : l'exiger ici bloquerait purement et simplement l'envoi de
  // toute annonce à une seule location.
  var multiUnits = hfUnits.length>1;
  for(var i=0;i<hfUnits.length;i++){
    var u = hfUnits[i];
    if((multiUnits && !u.name.trim()) || !u.price || Number(u.price)<=0 || !u.maxPersons || Number(u.maxPersons)<=0){
      errEl.textContent = multiUnits ? "Chaque location a besoin d'un nom, d'un prix et d'une capacité." : "Renseignez un prix et une capacité.";
      return;
    }
  }
  if(!authState.uid || typeof firebase==="undefined"){ errEl.textContent = "Connexion requise — réessayez dans un instant."; return; }
  var editing = !!hostFormEditListing;
  var editId = editing ? hostFormEditListing.id : null;
  var btn = document.getElementById("sheet-apply");
  var originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Localisation de l'adresse…";
  geocodeAddress(address).then(function(coords){
    // Repli si Région/Département/Ville n'ont jamais été remplis (ni via
    // une suggestion cliquée pendant la saisie, ni à la main) : ce même
    // géocodage sert aussi à les déduire — jamais de champ déjà rempli
    // par l'hôte écrasé ici. l.region (libellé affiché aux voyageurs,
    // voir locationLineFor()) n'est plus saisi à la main : déduit de ces
    // mêmes valeurs, avec repli sur l'adresse brute si rien n'a matché.
    if(!regionName || !deptName || !city){
      var match = matchRegionDept(coords.address);
      if(!regionName) regionName = match.regionName;
      if(!deptName) deptName = match.deptName;
      if(!city) city = match.city;
    }
    var region = (city ? city+", " : "") + (deptName || regionName || address);
    return resolvePhotoEntries(hfSelectedFiles, authState.uid, "maison", "Envoi des photos de la maison…").then(function(house){
      var uploadUnit = function(i, doneUnits){
        if(i>=hfUnits.length) return Promise.resolve(doneUnits);
        var u = hfUnits[i];
        return resolvePhotoEntries(u.photos, authState.uid, "chambre-"+(i+1), "Envoi des photos de "+(u.name.trim()||name)+"…").then(function(unitPhotos){
          doneUnits.push({id:u.id, name:u.name.trim(), price:Number(u.price), maxPersons:Number(u.maxPersons), gallery:unitPhotos.urls, galleryThumb:unitPhotos.thumbs, linkedRoomId:u.linkedRoomId||""});
          return uploadUnit(i+1, doneUnits);
        });
      };
      return uploadUnit(0, []).then(function(units){
        btn.textContent = editing ? "Enregistrement…" : "Envoi de l'annonce…";
        var payload = {
          name:name, accomType:accomType, hostName:hostName, hostBio:hostBio, region:region, claim:claim, desc:desc, phone:phone, email:email, amen:amen,
          regionName:regionName, deptName:deptName, city:city,
          address:address, lat:coords.lat, lng:coords.lng,
          websiteUrl:websiteUrl, googleUrl:googleUrl,
          gallery:house.urls, galleryThumb:house.thumbs,
          units:units
        };
        if(editing){
          /* Ni status, ni ownerUid, ni createdAt dans ce payload : la règle
             Firestore exige que status ne bouge pas sur un update du
             propriétaire (voir README), et .update() ne touche que les
             champs listés — les autres restent tels quels. */
          return firebase.firestore().collection("listings").doc(editId).update(payload);
        }
        payload.ownerUid = authState.uid;
        payload.ownerEmail = authState.email;
        payload.status = "pending";
        payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        return firebase.firestore().collection("listings").add(payload);
      });
    });
  }).then(function(){
    var root = document.getElementById("sheet-root");
    root.innerHTML = '<div class="sheet-backdrop" id="sheet-backdrop"><div class="frame"><div class="sheet" style="position:relative;">'+
      '<button class="sheet-close" id="sheet-close">&times;</button><div class="sheet-handle"></div>'+
      (editing
        ? '<h3>Annonce modifiée</h3><p class="sheet-sub">Vos changements sont enregistrés.</p>'
        : '<h3>Annonce envoyée</h3><p class="sheet-sub">Merci ! On la vérifie et elle sera mise en ligne prochainement.</p>')+
      '<div class="sheet-apply"><button class="btn-apply" id="sheet-ok">OK</button></div>'+
    '</div></div></div>';
    document.getElementById("sheet-close").addEventListener("click", closeSheet);
    document.getElementById("sheet-ok").addEventListener("click", function(){
      closeSheet();
      hostFormEditListing = null;
      hostListingsCache = []; /* l'annonce créée/modifiée doit se refléter dans Mes annonces */
      // renderHostListings() recharge aussi le volet calendrier déplié s'il
      // y en a un (state.hostListingId), plus besoin d'un second appel
      // séparé depuis la fusion des deux anciens onglets.
      if(state.hostMode && state.hostTab==="listings") renderHostListings();
    });
    document.getElementById("sheet-backdrop").addEventListener("click", function(e){ if(e.target.id==="sheet-backdrop") closeSheet(); });
  }).catch(function(err){
    // Distingue l'échec de géocodage (adresse à corriger, message actionnable)
    // du reste (upload photo, écriture Firestore...) plutôt qu'un message
    // générique dans tous les cas — voir geocodeAddress() pour les deux
    // raisons de rejet possibles (HTTP en échec, ou aucun résultat trouvé).
    if(err && /^geocode-/.test(err.message||"")){
      errEl.textContent = "Adresse introuvable — vérifiez qu'elle est complète (numéro, rue, code postal, ville).";
    } else {
      errEl.textContent = "Erreur lors de l'envoi : "+(err.message||err.code||"réessayez.");
    }
    btn.disabled = false;
    btn.textContent = originalLabel;
  });
}
