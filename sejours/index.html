function uploadPhotoFiles(files, uid, pathPrefix, progressLabel){
  var btn = document.getElementById("sheet-apply");
  if(!files.length) return Promise.resolve([]);
  var urls = [];
  var uploadOne = function(i){
    if(i>=files.length) return Promise.resolve();
    btn.textContent = progressLabel+" ("+(i+1)+"/"+files.length+")";
    var file = files[i];
    var path = "listings/"+uid+"/"+pathPrefix+"-"+Date.now()+"-"+i+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    var ref = firebase.storage().ref().child(path);
    return ref.put(file).then(function(snap){ return snap.ref.getDownloadURL(); }).then(function(url){
      urls.push(url);
      return uploadOne(i+1);
    });
  };
  return uploadOne(0).then(function(){ return urls; });
}
/* Sépare les entrées déjà en ligne (juste réutilisées telles quelles, rien
   à envoyer) des nouveaux fichiers à uploader, puis recombine dans l'ordre
   d'origine — utilisé pour la maison et pour chaque chambre, en création
   comme en modification. */
function resolvePhotoEntries(entries, uid, pathPrefix, progressLabel){
  var newFiles = entries.filter(function(e){ return e.type==="new"; }).map(function(e){ return e.file; });
  return uploadPhotoFiles(newFiles, uid, pathPrefix, progressLabel).then(function(newUrls){
    var newUrlsQueue = newUrls.slice();
    return entries.map(function(e){ return e.type==="existing" ? e.url : newUrlsQueue.shift(); });
  });
}

/* Géocodage adresse -> lat/lng + détail (région/département/ville) via
   Nominatim (OpenStreetMap) : API publique et gratuite, pas de clé ni de
   coût contrairement à un service comme l'API Géocodage Google. Utilisé
   au dépôt/à la modification d'une annonce (un hôte à la fois, usage
   occasionnel) et pour les suggestions d'adresse pendant la saisie —
   jamais côté recherche voyageur, où la distance se recalcule localement
   depuis les coordonnées déjà stockées (voir listingDistanceKm()) : reste
   largement dans les limites d'usage raisonnable de l'API publique.
   addressdetails=1 renvoie state/county/city, exploités par
   matchRegionDept() pour pré-remplir Région/Département/Ville sans que
   l'hôte ait à les choisir à la main (voir wireHfAddressAutocomplete()). */
function geocodeAddress(address){
  var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&countrycodes=fr&q="+encodeURIComponent(address);
  return fetch(url, {headers:{"Accept":"application/json"}}).then(function(r){
    if(!r.ok) throw new Error("geocode-http-"+r.status);
    return r.json();
  }).then(function(results){
    if(!results || !results.length) throw new Error("geocode-not-found");
    return {lat:Number(results[0].lat), lng:Number(results[0].lon), address:results[0].address||{}};
  });
}
function searchAddressSuggestions(query){
  var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=fr&q="+encodeURIComponent(query);
  return fetch(url, {headers:{"Accept":"application/json"}}).then(function(r){
    if(!r.ok) throw new Error("suggest-http-"+r.status);
    return r.json();
  }).then(function(results){ return results || []; }).catch(function(){ return []; });
}
/* Fait correspondre les state/county renvoyés par Nominatim aux noms
   officiels de FR_REGIONS/deptsForRegion() — comparaison par inclusion
   plutôt qu'égalité stricte (Nominatim écrit parfois "Île-de-France" avec
   une nuance d'accent/tiret différente d'un référentiel à l'autre, ou
   ajoute des mots). Non trouvé -> chaîne vide, jamais deviné au hasard. */
function matchRegionDept(addr){
  addr = addr || {};
  var stateStr = (addr.state||"").toLowerCase();
  var countyStr = (addr.county||addr.state_district||"").toLowerCase();
  var region = FR_REGIONS.filter(function(r){
    var n = r.name.toLowerCase();
    return stateStr && (stateStr.indexOf(n)!==-1 || n.indexOf(stateStr)!==-1);
  })[0] || null;
  var dept = null;
  var tryDept = function(r){
    return r.depts.filter(function(d){
      var n = d.toLowerCase();
      return countyStr && (countyStr.indexOf(n)!==-1 || n.indexOf(countyStr)!==-1);
    })[0];
  };
  if(region) dept = tryDept(region) || null;
  if(!dept && countyStr){
    FR_REGIONS.some(function(r){
      var d = tryDept(r);
      if(d){ dept = d; region = r; return true; }
      return false;
    });
  }
  var city = addr.city || addr.town || addr.village || addr.municipality || "";
  return {regionName: region ? region.name : "", deptName: dept || "", city: city};
}

/* Suggestions d'adresse pendant la saisie (Nominatim), avec pré-remplissage
   automatique de Région/Département/Ville au clic — l'hôte n'a plus besoin
   de les choisir à la main dans le cas courant (retour utilisateur : "pas
   pratique de tout remplir"). Ne réécrit jamais un champ déjà rempli par
   l'hôte lui-même (voir applySuggestion ci-dessous) : un choix manuel
   n'est jamais écrasé silencieusement par une suggestion d'adresse
   ultérieure sur un AUTRE champ, seule Région/Département suit toujours
   la dernière adresse choisie (ils vont ensemble, contrairement à Ville
   qui peut être volontairement plus précis que ce que Nominatim renvoie). */
function wireHfAddressAutocomplete(){
  var input = document.getElementById("hf-address");
  var box = document.getElementById("hf-address-suggestions");
  if(!input || !box) return;
  var debounceTimer = null;
  var lastQuery = "";

  function hide(){ box.hidden = true; box.innerHTML = ""; }

  function applySuggestion(result){
    input.value = result.display_name;
    hide();
    var match = matchRegionDept(result.address);
    if(match.regionName){
      document.getElementById("hf-region-name").value = match.regionName;
      document.getElementById("hf-dept-name").innerHTML = deptOptionsHtml(match.regionName, match.deptName);
    }
    var cityInput = document.getElementById("hf-city");
    if(match.city && cityInput && !cityInput.value.trim()) cityInput.value = match.city;
  }

  function renderSuggestions(results){
    if(!results.length){ hide(); return; }
    box.innerHTML = results.map(function(r, i){
      return '<button type="button" class="hf-address-suggestion" data-idx="'+i+'">'+esc(r.display_name)+'</button>';
    }).join("");
    box.hidden = false;
    Array.prototype.forEach.call(box.querySelectorAll(".hf-address-suggestion"), function(btn){
      btn.addEventListener("click", function(){ applySuggestion(results[Number(btn.getAttribute("data-idx"))]); });
    });
  }

  input.addEventListener("input", function(){
    var q = input.value.trim();
    if(debounceTimer) clearTimeout(debounceTimer);
    if(q.length < 5){ hide(); return; }
    debounceTimer = setTimeout(function(){
      lastQuery = q;
      searchAddressSuggestions(q).then(function(results){
        if(q !== lastQuery) return; // une saisie plus récente a déjà pris le dessus
        renderSuggestions(results);
      });
    }, 400);
  });
  // Laisse le temps au clic sur une suggestion de se déclencher avant de la masquer.
  input.addEventListener("blur", function(){ setTimeout(hide, 150); });
}

function submitHostForm(){
  var name = document.getElementById("hf-name").value.trim();
  var accomType = document.getElementById("hf-type").value;
  var hostName = document.getElementById("hf-hostname").value.trim();
  var regionName = document.getElementById("hf-region-name").value;
  var deptName = document.getElementById("hf-dept-name").value;
  var city = document.getElementById("hf-city").value.trim();
  var address = document.getElementById("hf-address").value.trim();
  var claim = document.getElementById("hf-claim").value.trim();
  var desc = document.getElementById("hf-desc").value.trim();
  var phone = document.getElementById("hf-phone").value.trim();
  var email = document.getElementById("hf-email").value.trim();
  var websiteUrl = document.getElementById("hf-website").value.trim();
  var googleUrl = document.getElementById("hf-google").value.trim();
  var amen = Array.prototype.map.call(document.querySelectorAll("#sheet-root .amenity-chip.active"), function(el){ return el.getAttribute("data-a"); });
  var errEl = document.getElementById("hf-err");
  errEl.textContent = "";
  if(!name || !accomType || !hostName || !address || !claim || !desc || !phone || !email){ errEl.textContent = "Merci de remplir tous les champs."; return; }
  if(!hfUnits.length){ errEl.textContent = "Ajoutez au moins une chambre."; return; }
  for(var i=0;i<hfUnits.length;i++){
    var u = hfUnits[i];
    if(!u.name.trim() || !u.price || Number(u.price)<=0 || !u.maxPersons || Number(u.maxPersons)<=0){
      errEl.textContent = "Chaque chambre a besoin d'un nom, d'un prix et d'une capacité.";
      return;
    }
  }
  if(!authState.uid || typeof firebase==="undefined"){ errEl.textContent = "Connexion requise — réessayez dans un instant."; return; }
  var editing = !!hostFormEditListing;
  var editId = editing ? hostFormEditListing.id : null;
  var btn = document.getElementById("sheet-apply");
  var originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Localisation de l'adresse…";
  geocodeAddress(address).then(function(coords){
    // Repli si Région/Département/Ville n'ont jamais été remplis (ni via
    // une suggestion cliquée pendant la saisie, ni à la main) : ce même
    // géocodage sert aussi à les déduire — jamais de champ déjà rempli
    // par l'hôte écrasé ici. l.region (libellé affiché aux voyageurs,
    // voir locationLineFor()) n'est plus saisi à la main : déduit de ces
    // mêmes valeurs, avec repli sur l'adresse brute si rien n'a matché.
    if(!regionName || !deptName || !city){
      var match = matchRegionDept(coords.address);
      if(!regionName) regionName = match.regionName;
      if(!deptName) deptName = match.deptName;
      if(!city) city = match.city;
    }
    var region = (city ? city+", " : "") + (deptName || regionName || address);
    return resolvePhotoEntries(hfSelectedFiles, authState.uid, "maison", "Envoi des photos de la maison…").then(function(gallery){
      var uploadUnit = function(i, doneUnits){
        if(i>=hfUnits.length) return Promise.resolve(doneUnits);
        var u = hfUnits[i];
        return resolvePhotoEntries(u.photos, authState.uid, "chambre-"+(i+1), "Envoi des photos de "+u.name.trim()+"…").then(function(unitGallery){
          doneUnits.push({id:u.id, name:u.name.trim(), price:Number(u.price), maxPersons:Number(u.maxPersons), gallery:unitGallery, linkedRoomId:u.linkedRoomId||""});
          return uploadUnit(i+1, doneUnits);
        });
      };
      return uploadUnit(0, []).then(function(units){
        btn.textContent = editing ? "Enregistrement…" : "Envoi de l'annonce…";
        var payload = {
          name:name, accomType:accomType, hostName:hostName, region:region, claim:claim, desc:desc, phone:phone, email:email, amen:amen,
          regionName:regionName, deptName:deptName, city:city,
          address:address, lat:coords.lat, lng:coords.lng,
          websiteUrl:websiteUrl, googleUrl:googleUrl,
          gallery:gallery,
          units:units
        };
        if(editing){
          /* Ni status, ni ownerUid, ni createdAt dans ce payload : la règle
             Firestore exige que status ne bouge pas sur un update du
             propriétaire (voir README), et .update() ne touche que les
             champs listés — les autres restent tels quels. */
          return firebase.firestore().collection("listings").doc(editId).update(payload);
        }
        payload.ownerUid = authState.uid;
        payload.ownerEmail = authState.email;
        payload.status = "pending";
        payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        return firebase.firestore().collection("listings").add(payload);
      });
    });
  }).then(function(){
    var root = document.getElementById("sheet-root");
    root.innerHTML = '<div class="sheet-backdrop" id="sheet-backdrop"><div class="frame"><div class="sheet" style="position:relative;">'+
      '<button class="sheet-close" id="sheet-close">&times;</button><div class="sheet-handle"></div>'+
      (editing
        ? '<h3>Annonce modifiée</h3><p class="sheet-sub">Vos changements sont enregistrés.</p>'
        : '<h3>Annonce envoyée</h3><p class="sheet-sub">Merci ! On la vérifie et elle sera mise en ligne prochainement.</p>')+
      '<div class="sheet-apply"><button class="btn-apply" id="sheet-ok">OK</button></div>'+
    '</div></div></div>';
    document.getElementById("sheet-close").addEventListener("click", closeSheet);
    document.getElementById("sheet-ok").addEventListener("click", function(){
      closeSheet();
      hostFormEditListing = null;
      hostListingsCache = []; /* l'annonce créée/modifiée doit se refléter dans Mes annonces */
      if(state.hostMode && state.hostTab==="listings") renderHostListings();
      if(state.hostMode && state.hostTab==="calendar") renderHostCalendar();
    });
    document.getElementById("sheet-backdrop").addEventListener("click", function(e){ if(e.target.id==="sheet-backdrop") closeSheet(); });
  }).catch(function(err){
    // Distingue l'échec de géocodage (adresse à corriger, message actionnable)
    // du reste (upload photo, écriture Firestore...) plutôt qu'un message
    // générique dans tous les cas — voir geocodeAddress() pour les deux
    // raisons de rejet possibles (HTTP en échec, ou aucun résultat trouvé).
    if(err && /^geocode-/.test(err.message||"")){
      errEl.textContent = "Adresse introuvable — vérifiez qu'elle est complète (numéro, rue, code postal, ville).";
    } else {
      errEl.textContent = "Erreur lors de l'envoi : "+(err.message||err.code||"réessayez.");
    }
    btn.disabled = false;
    btn.textContent = originalLabel;
  });
}

var mapInstance = null;
var mapMarkerLayer = null;
var mapZone = null;
var mapZoneArmed = false;
var mapZoneCircleLayer = null;
/* Annonce sélectionnée sur la carte (punaise ou item de liste cliqué) :
   affichée juste sous la carte via renderMapSelectedCard(), plutôt que
   d'ouvrir la fiche détail en plein écran par-dessus la carte (comportement
   précédent, jugé déroutant — on perd la carte des yeux). Pas dans state
   (pas persisté), remise à zéro en quittant l'onglet Carte. */
var mapSelectedId = null;

/* Zone de recherche dessinée à la main sur la carte : un cercle (centre +
   rayon), pas un polygone libre — plus simple à poser et ajuster d'un
   doigt sur mobile qu'un tracé à main levée, pour un résultat tout aussi
   utile ici (chercher "autour de ce point"). */
function haversineKm(lat1, lng1, lat2, lng2){
  var R = 6371;
  var dLat = (lat2-lat1) * Math.PI/180, dLng = (lng2-lng1) * Math.PI/180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function mapZoneFilteredListings(){
  var list = filteredListings();
  var located = list.filter(function(l){ return l.lat && l.lng; });
  if(mapZone){
    located = located.filter(function(l){ return haversineKm(mapZone.lat, mapZone.lng, l.lat, l.lng) <= mapZone.radiusKm; });
  }
  return {all:list, located:located};
}

/* Même repli que coverHtml() pour la première photo disponible : la
   galerie de l'établissement, sinon celle de sa première chambre (annonce
   sans photo commune, seulement des photos par chambre). Aucune photo nulle
   part (annonce statique de démo, ou pas encore de photo envoyée) : null,
   la vignette retombe sur le dégradé de secours comme avant. */
function listingThumbUrl(l){
  if(l.gallery && l.gallery.length) return l.gallery[0];
  if(l.units){
    for(var i=0;i<l.units.length;i++){
      if(l.units[i].gallery && l.units[i].gallery.length) return l.units[i].gallery[0];
    }
  }
  return null;
}

/* Ré-affiche juste les punaises + le cercle de zone sans recréer la carte
   ni recadrer la vue — utilisé pendant le glissement du curseur de rayon,
   pour que la carte ne saute pas à chaque tick. */
function refreshMapMarkers(){
  var located = mapZoneFilteredListings().located;
  renderMapList(located);
  if(!mapInstance) return;
  if(mapMarkerLayer){ mapInstance.removeLayer(mapMarkerLayer); mapMarkerLayer = null; }
  var useCluster = !!window.L.markerClusterGroup;
  var clusterGroup = useCluster ? L.markerClusterGroup({
    maxClusterRadius:50,
    iconCreateFunction:function(cluster){
      return L.divIcon({
        className:"map-cluster-icon",
        html:'<div class="map-cluster"><span>'+cluster.getChildCount()+'</span></div>',
        iconSize:[38,38]
      });
    }
  }) : L.layerGroup();
  located.forEach(function(l){
    var icon = L.divIcon({
      className:"map-pin-icon",
      html:'<div class="map-pin'+(state.liked.indexOf(l.id)!==-1?' liked':'')+'"><div class="dot"><span>'+l.price+'€</span></div></div>',
      iconSize:[30,30], iconAnchor:[15,36]
    });
    var marker = L.marker([l.lat, l.lng], {icon:icon});
    marker.on("click", function(){ selectMapListing(l.id); });
    clusterGroup.addLayer(marker);
  });
  mapMarkerLayer = clusterGroup;
  mapInstance.addLayer(mapMarkerLayer);
  if(mapZoneCircleLayer) mapZoneCircleLayer.setRadius(mapZone.radiusKm*1000);
}

function renderMap(){
  var feed = document.getElementById("feed");
  var f = mapZoneFilteredListings();

  feed.innerHTML = '<div class="map-view">'+
    '<div class="map-canvas" id="map-canvas">'+
      '<button type="button" class="map-zone-btn'+(mapZoneArmed?' armed':'')+'" id="map-zone-btn">'+
        (mapZoneArmed ? "Touchez la carte…" : (mapZone ? "Déplacer la zone" : "Dessiner une zone"))+
      '</button>'+
    '</div>'+
    '<div class="map-selected" id="map-selected" hidden></div>'+
    (mapZone ? '<div class="map-zone-controls">'+
      '<span>Rayon : <b id="map-zone-radius-label">'+mapZone.radiusKm+' km</b></span>'+
      '<input type="range" id="map-zone-radius" min="1" max="30" value="'+mapZone.radiusKm+'">'+
      '<button type="button" id="map-zone-clear">Effacer</button>'+
    '</div>' : '')+
    '<div class="map-list" id="map-list"></div>'+
  '</div>';
  renderMapSelectedCard();

  document.getElementById("map-zone-btn").addEventListener("click", function(){
    mapZoneArmed = !mapZone || !mapZoneArmed;
    renderMap();
  });
  var clearBtn = document.getElementById("map-zone-clear");
  if(clearBtn) clearBtn.addEventListener("click", function(){
    mapZone = null; mapZoneArmed = false;
    renderMap();
  });
  var radiusInput = document.getElementById("map-zone-radius");
  if(radiusInput) radiusInput.addEventListener("input", function(){
    mapZone.radiusKm = Number(radiusInput.value);
    document.getElementById("map-zone-radius-label").textContent = mapZone.radiusKm+" km";
    refreshMapMarkers();
  });

  if(mapInstance){ mapInstance.remove(); mapInstance = null; mapMarkerLayer = null; mapZoneCircleLayer = null; }
  if(!window.L){ renderMapList(f.located); return; }
  if(!f.located.length && !mapZone){ renderMapList(f.located); return; }

  mapInstance = L.map("map-canvas", {attributionControl:true, zoomControl:true});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }).addTo(mapInstance);

  mapInstance.on("click", function(e){
    if(!mapZoneArmed) return;
    mapZone = {lat:e.latlng.lat, lng:e.latlng.lng, radiusKm:(mapZone && mapZone.radiusKm) || 5};
    mapZoneArmed = false;
    /* setTimeout : renderMap() détruit puis recrée mapInstance. Le faire
       de façon synchrone ici casse Leaflet, qui n'a pas fini de traiter
       cet événement "click" sur l'instance qu'on vient de supprimer. */
    setTimeout(renderMap, 0);
  });

  if(mapZone){
    /* Circle.getBounds() a besoin que la carte ait déjà une vue (centre +
       zoom) pour projeter son rayon en pixels — sans ça, Leaflet plante
       en interne. setView ici, avant fitBounds plus bas qui affine le
       cadrage sur le cercle réel. */
    mapInstance.setView([mapZone.lat, mapZone.lng], 12);
    mapZoneCircleLayer = L.circle([mapZone.lat, mapZone.lng], {
      radius:mapZone.radiusKm*1000, color:"#1D2820", weight:2, fillOpacity:.08
    }).addTo(mapInstance);
  }

  refreshMapMarkers();

  if(mapZone){
    mapInstance.fitBounds(mapZoneCircleLayer.getBounds(), {padding:[20,20]});
  } else if(f.located.length===1){
    mapInstance.setView([f.located[0].lat, f.located[0].lng], 12);
  } else if(f.located.length>1){
    mapInstance.fitBounds(L.featureGroup(f.located.map(function(l){ return L.marker([l.lat,l.lng]); })).getBounds(), {padding:[32,32]});
  }
}

/* ---------------- validation des annonces (compte admin uniquement) ---------------- */
function renderAdminQueue(){
  var feed = document.getElementById("feed");
  feed.innerHTML = '<div class="admin-queue">'+
    '<button type="button" class="admin-back" id="admin-back">&larr; Retour au profil</button>'+
    '<h2>Annonces à valider</h2>'+
    '<div id="admin-list"><p class="sheet-sub">Chargement…</p></div>'+
  '</div>';
  document.getElementById("admin-back").addEventListener("click", renderProfile);

  firebase.firestore().collection("listings").where("status","==","pending").orderBy("createdAt","desc").get().then(function(snap){
    var list = document.getElementById("admin-list");
    if(snap.empty){ list.innerHTML = '<p class="sheet-sub">Aucune annonce en attente pour le moment.</p>'; return; }
    list.innerHTML = snap.docs.map(function(doc){
      var l = doc.data();
      var coverUrl = listingCoverUrl(l);
      var cover = coverUrl
        ? '<img class="admin-thumb" src="'+coverUrl+'" alt="">'
        : '<div class="admin-thumb admin-thumb-empty"></div>';
      return '<div class="admin-card">'+cover+
        '<div class="admin-card-body">'+
          '<b>'+esc(l.name||"(sans nom)")+'</b>'+
          '<span>'+esc(l.region||"")+' · '+listingPriceLabel(l)+' · '+listingDistanceKm(l)+' km'+(l.units?' · '+l.units.length+' chambre'+(l.units.length>1?'s':''):'')+'</span>'+
          '<span class="admin-owner">Déposée par '+esc(l.hostName||"")+' — '+esc(l.ownerEmail||"")+'</span>'+
          '<div class="admin-actions">'+
            '<button type="button" class="btn-apply admin-approve" data-id="'+doc.id+'">Publier</button>'+
            '<button type="button" class="admin-reject" data-id="'+doc.id+'">Refuser</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll(".admin-approve"), function(btn){
      btn.addEventListener("click", function(){
        btn.disabled = true; btn.textContent = "Publication…";
        firebase.firestore().collection("listings").doc(btn.getAttribute("data-id")).update({
          status:"published", publishedAt:firebase.firestore.FieldValue.serverTimestamp()
        }).then(function(){
          fetchPublishedListings();
          renderAdminQueue();
        }).catch(function(err){ alert("Erreur : "+(err.message||err.code)); btn.disabled = false; btn.textContent = "Publier"; });
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll(".admin-reject"), function(btn){
      btn.addEventListener("click", function(){
        if(!confirm("Supprimer définitivement cette annonce ?")) return;
        btn.disabled = true;
        firebase.firestore().collection("listings").doc(btn.getAttribute("data-id")).delete()
          .then(renderAdminQueue)
          .catch(function(err){ alert("Erreur : "+(err.message||err.code)); btn.disabled = false; });
      });
    });
  }).catch(function(err){
    document.getElementById("admin-list").innerHTML = '<p class="sheet-sub">Erreur de chargement : '+esc(err.message||err.code||"inconnue")+'</p>';
  });
}

function renderTabContent(){
  if(state.tab==="map") renderMap();
  else if(state.tab==="likes" && state.likesView!=="favoris") renderContactLog();
  else renderFeed();
}
/* Comme renderTabContent(), mais pour un simple rafraîchissement d'état
   (like togglé...) qui ne doit pas reconstruire toute la vue : sur la
   carte, ça évite de détruire/recréer l'instance Leaflet (perte du
   zoom/pan) juste pour mettre à jour un cœur — seule la carte sélectionnée
   sous la carte est ré-affichée. */
function refreshCurrentView(){
  if(state.tab==="map") renderMapSelectedCard();
  else if(state.tab==="likes" && state.likesView!=="favoris") renderContactLog();
  else renderFeed();
}

function switchTab(tab){
  // Cliquer un onglet de la barre du bas pendant qu'une fiche détail est
  // ouverte doit ramener naturellement au fil (ou à l'onglet visé) plutôt
  // que de laisser la fiche ouverte par-dessus le nouvel onglet — nav.tabbar
  // reste cliquable même fiche ouverte (voir sa règle CSS) précisément
  // pour permettre ça sans repasser par la flèche retour.
  if(state.detailListingId!=null) closeDetail();
  if(state.tab==="map" && tab!=="map") mapSelectedId = null;
  // Quitter Mes séjours invalide le cache de contactLog (voir
  // loadContactLogEntries()) : une prochaine visite doit relire l'état
  // réel plutôt que de re-servir des nombres/demandes potentiellement
  // périmés (confirmées/déclinées depuis un autre appareil, par exemple).
  if(state.tab==="likes" && tab!=="likes") contactLogCache = null;
  state.tab = tab;
  /* Fil Explorer uniquement (retour utilisateur, "façon feed Instagram") :
     cartes pleine largeur, coins droits — voir #feed.feed-explore en CSS.
     Basculé ici plutôt que dans renderFeed() (qui gère aussi Favoris, à
     ne pas toucher) pour ne jamais laisser la classe traîner sur #feed
     quand on part vers Carte/Profil, qui réutilisent .card ailleurs
     (carte sélectionnée, grande vignette Mes séjours) sans devoir hériter
     de ce style. */
  document.getElementById("feed").classList.toggle("feed-explore", tab==="explore");
  /* Le hero (écran d'accueil plein écran) ne doit apparaître qu'une fois,
     au chargement initial — pas se répéter à chaque retour sur Explorer.
     Dès qu'on change d'onglet, il est masqué définitivement. La barre
     d'onglets, elle, n'a plus besoin d'être pilotée ici : elle est
     toujours à sa place (voir la hiérarchie de calques en CSS, plus bas). */
  if(!heroDismissed){
    heroDismissed = true;
    var heroEl = document.getElementById("hero");
    if(heroEl) heroEl.hidden = true;
  }
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(el){
    el.classList.toggle("active", el.getAttribute("data-tab")===tab);
  });
  if(tab==="explore" || tab==="likes" || tab==="map"){
    renderFilterBar();
    refreshLikesChrome();
  } else {
    document.getElementById("filter-bar").classList.add("chrome-collapsed");
    document.getElementById("result-line").classList.add("chrome-collapsed");
    renderProfile();
  }
}

    Array.prototype.forEach.call(nav.querySelectorAll(".tab"), function(el){
      el.classList.toggle("active", el.getAttribute("data-host-tab")===state.hostTab);
      el.addEventListener("click", function(){ switchHostTab(el.getAttribute("data-host-tab")); });
    });
  } else {

    Array.prototype.forEach.call(nav.querySelectorAll(".tab"), function(el){
      el.classList.toggle("active", el.getAttribute("data-tab")===state.tab);

/* ---------------- espace hôtes ---------------- */
/* Bascule déclenchée depuis Profil → Espace hôtes (connecté) : remplace la
   barre d'onglets et le contenu de #feed, masque le bandeau de filtres
   (qui n'a pas de sens ici) — sans toucher au reste de la mécanique
   voyageur (state.tab reste tel quel, on y revient via exitHostMode).
   Atterrit sur l'onglet Profil (retour utilisateur : atterrir sur "Mes
   annonces" surprenait, "on devrait rester sur la vue profil") — c'est
   aussi depuis ce Profil hôte qu'on ressort vers l'espace voyageur (voir
   HOST_TABS_HTML, plus de 3e onglet séparé pour ça). */
function enterHostMode(){
  if(!authState.uid){ authContext = "host"; openSheet("auth"); return; }
  /* Jusqu'ici, enterHostMode() n'était atteignable qu'après un clic sur
     l'onglet Profil, qui masque déjà le hero (voir switchTab). Depuis que
     "Devenir hôte" peut inscrire puis entrer directement en mode hôte sans
     jamais passer par un onglet voyageur, il faut le faire ici aussi —
     sinon le hero (z-index au-dessus de la barre d'onglets) reste affiché
     par-dessus la nouvelle barre d'onglets hôte, qui devient invisible et
     inaccessible tant qu'on n'a pas scrollé au moins une fois. */
  if(!heroDismissed){
    heroDismissed = true;
    var heroEl = document.getElementById("hero");
    if(heroEl) heroEl.hidden = true;
  }
  state.hostMode = true;
  state.hostTab = "profile";
  state.hostListingId = null;
  state.hostUnitId = null;
  hostListingsCache = [];
  hostAccountCache = undefined;
  document.getElementById("filter-bar").classList.add("chrome-collapsed");
  document.getElementById("result-line").classList.add("chrome-collapsed");
  persist();
  renderTabbar();
  renderHostTabContent();
}
function exitHostMode(){
  state.hostMode = false;
  persist();
  renderTabbar();
  switchTab("profile");
}
function switchHostTab(tab){
  state.hostTab = tab;
  persist();
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(el){
    el.classList.toggle("active", el.getAttribute("data-host-tab")===tab);
  });
  renderHostTabContent();
}
function renderHostTabContent(){
  if(state.hostTab==="calendar") renderHostCalendar();
  else if(state.hostTab==="profile") renderHostProfile();
  else renderHostListings();
}

      '</button>'+
      '<button type="button" class="switch-tile hotes" disabled>'+
        '<div class="switch-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></div>'+

/* Annonces du compte connecté (ownerUid == authState.uid), quel que soit
   leur statut (pending/published) — contrairement au fil public, un hôte
   doit voir ses propres annonces même avant validation. Mis en cache pour
   la durée de la session hôte (voir enterHostMode). */
function ensureHostListingsLoaded(cb){
  if(hostListingsCache && hostListingsCache._loaded){ cb(hostListingsCache); return; }
  if(!authState.uid || typeof firebase==="undefined"){ cb([]); return; }
  firebase.firestore().collection("listings").where("ownerUid","==",authState.uid).get().then(function(snap){
    var list = snap.docs.map(function(doc){ var d = doc.data(); d.id = doc.id; return d; });
    list._loaded = true;
    hostListingsCache = list;
    cb(list);
  }).catch(function(){ cb([]); });
}

/* Compte Fiftin app (outil de planning) du même utilisateur, s'il existe —
   même Firebase, même uid (voir commentaire plus haut sur FIFTIN_FIREBASE_CONFIG).
   Sa seule existence qualifie l'hôte de « compte gestion » (voir le grand
   commentaire au-dessus de fetchHostBookings) : lu uniquement, jamais
   modifié — aucune écriture vers accounts/{uid} n'existe dans ce fichier. */
function resolveHostAccount(cb){
  if(hostAccountCache !== undefined){ cb(hostAccountCache); return; }
  if(!authState.uid || typeof firebase==="undefined"){ hostAccountCache = null; cb(null); return; }
  firebase.firestore().collection("accounts").doc(authState.uid).get().then(function(doc){
    hostAccountCache = doc.exists ? doc.data() : null;
    cb(hostAccountCache);
  }).catch(function(){ hostAccountCache = null; cb(null); });
}
function hostGuestName(guestId){
  var guests = (hostAccountCache && hostAccountCache.guests) || [];
  var g = guests.filter(function(x){ return x.id===guestId; })[0];
  return g ? g.name : "Client";
}

/* ---------------- calendrier simplifié (année, mini-mois) ---------------- */
var CAL_MONTH_NAMES = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var CAL_DOW = ["L","M","M","J","V","S","D"];
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoDate(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function mondayIndex(jsDay){ return (jsDay+6)%7; }
function isoWeekNumber(y,m,d){
  var date = new Date(Date.UTC(y, m, d));
  var dayNum = (date.getUTCDay()+6)%7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  var firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  var diff = date - firstThursday;
  return 1 + Math.round(diff/(7*24*3600*1000));
}
/* Étale chaque réservation sur ses jours occupés (checkOut exclusif, comme
   dans Fiftin app — voir activeOn() de app/index.html) pour construire une
   table date -> réservation directement consultable par le rendu des
   mini-mois. Les réservations "no" (annulées, côté Fiftin app) ne comptent
   pas comme occupées. */
function occupiedDatesFromBookings(bookings){
  var map = {};
  bookings.forEach(function(b){
    if(b.status==="no") return;
    if(!b.checkIn || !b.checkOut) return;
    var d = new Date(b.checkIn+"T00:00:00");
    var end = new Date(b.checkOut+"T00:00:00");
    while(d < end){
      map[isoDate(d.getFullYear(), d.getMonth(), d.getDate())] = b;
      d.setDate(d.getDate()+1);
    }
  });
  return map;
}
function monthMiniHtml(year, monthIdx, occMap, todayStr){
  var nDays = daysInMonth(year, monthIdx);
  var firstDow = mondayIndex(new Date(year, monthIdx, 1).getDay());
  var head = '<div class="cal-mini-wn"></div>' + CAL_DOW.map(function(l){ return '<div class="cal-mini-dow">'+l+'</div>'; }).join("");
  var totalCells = firstDow + nDays;
  var rows = Math.ceil(totalCells/7);
  var body = "";
  var dayCounter = 1 - firstDow;
  for(var r=0;r<rows;r++){
    var wnDay = dayCounter<1 ? 1 : (dayCounter>nDays?nDays:dayCounter);
    body += '<div class="cal-mini-wn">'+isoWeekNumber(year,monthIdx,wnDay)+'</div>';
    for(var c=0;c<7;c++){
      if(dayCounter<1 || dayCounter>nDays){
        body += '<div class="cal-mini-day empty"></div>';
      } else {
        var ds = isoDate(year, monthIdx, dayCounter);
        var occ = occMap[ds];
        body += '<div class="cal-mini-day'+(occ?' occ':'')+(ds===todayStr?' today':'')+'" data-date="'+ds+'">'+dayCounter+'</div>';
      }
      dayCounter++;
    }
  }
  return '<div class="cal-mini"><div class="cal-mini-head">'+CAL_MONTH_NAMES[monthIdx]+'</div>'+
    '<div class="cal-mini-grid">'+head+body+'</div></div>';
}

/* Deux catégories d'hôtes, jamais un choix par annonce :
   - compte simple annonce (pas de document accounts/{uid}, donc pas de
     compte Fiftin app) : le calendrier de Séjours EST leur seul outil —
     lecture/écriture complète, stockée dans listings/{id}/bookings.
   - compte gestion (accounts/{uid} existe — 'essentiel' ou 'pro' sont les
     deux seuls plans côté Fiftin app, il n'y a pas de palier gratuit, donc
     "le document existe" suffit à qualifier ce statut) : Séjours affiche
     en LECTURE SEULE les réservations déjà présentes dans accounts/{uid},
     pour éviter un double-emploi visuel, mais n'y écrit jamais rien —
     ajouter/modifier une réservation se fait exclusivement depuis Fiftin
     app. Aucune écriture dans accounts/{uid} n'existe nulle part dans ce
     fichier : c'est une garantie structurelle, pas une précaution au cas
     par cas. */
/* Nettoie les liens vers une chambre Fiftin app qui n'existe plus (compte
   gestion, unit.linkedRoomId) — par ex. après suppression de cette chambre
   côté app/ (delRoom). Un lien qui pointe dans le vide n'empêche rien de
   fonctionner (fetchHostBookings retombe juste sur une liste vide), mais
   reste affiché comme "relié" dans le sélecteur sans plus rien signifier ;
   ceci le réinitialise proprement dès qu'on le détecte. N'écrit rien
   lui-même : renvoie juste {units, changed} à l'appelant, qui décide quand
   persister (voir renderHostCalendar et openSheet 'hostform'). */
function pruneStaleLinkedRoomIds(units, rooms){
  var roomIds = {};
  (rooms||[]).forEach(function(r){ roomIds[r.id] = true; });
  var changed = false;
  var cleaned = (units||[]).map(function(u){
    if(u.linkedRoomId && !roomIds[u.linkedRoomId]){
      changed = true;
      return Object.assign({}, u, {linkedRoomId:""});
    }
    return u;
  });
  return {units:cleaned, changed:changed};
}

function fetchHostBookings(listing, unit, isGestion, linkedRoomId, account, cb){
  if(isGestion){
    var all = (account && account.bookings) || [];
    cb(linkedRoomId ? all.filter(function(b){ return b.roomId===linkedRoomId; }) : []);
  } else {
    firebase.firestore().collection("listings").doc(listing.id).collection("bookings").where("unitId","==",unit.id).get().then(function(snap){
      cb(snap.docs.map(function(doc){ var d = doc.data(); d.id = doc.id; return d; }));
    }).catch(function(){ cb([]); });
  }
}

function renderHostCalendar(){
  var feed = document.getElementById("feed");
  feed.innerHTML = '<div class="host-view"><p class="sheet-sub" style="margin-top:0;">Chargement du calendrier…</p></div>';
  ensureHostListingsLoaded(function(listings){
    if(state.hostTab!=="calendar") return;
    if(!listings.length){ feed.innerHTML = hostEmptyHtml(); wireHostEmpty(); return; }
    if(!state.hostListingId || !listings.some(function(l){ return l.id===state.hostListingId; })){
      state.hostListingId = listings[0].id;
    }
    var listing = listings.filter(function(l){ return l.id===state.hostListingId; })[0];
    var units = listing.units || [];
    if(!units.length){
      feed.innerHTML = '<div class="host-view"><p class="sheet-sub" style="margin-top:0;">Cette annonce n\'a pas encore de chambre.</p>'+
        '<button type="button" class="btn-apply" id="cal-edit-listing">Modifier l\'annonce pour en ajouter une</button></div>';
      document.getElementById("cal-edit-listing").addEventListener("click", function(){
        hostFormEditListing = listing;
        openSheet("hostform");
      });
      return;
    }
    if(!state.hostUnitId || !units.some(function(u){ return u.id===state.hostUnitId; })){
      state.hostUnitId = units[0].id;
    }
    var unit = units.filter(function(u){ return u.id===state.hostUnitId; })[0];
    resolveHostAccount(function(account){
      var isGestion = !!account;
      var rooms = (account && account.settings && account.settings.rooms) || [];
      var pruned = pruneStaleLinkedRoomIds(units, rooms);
      var afterPrune = function(){
        var linkedRoomId = unit.linkedRoomId || "";
        fetchHostBookings(listing, unit, isGestion, linkedRoomId, account, function(bookings){
          if(state.hostTab!=="calendar") return;
          renderHostCalendarBody(listings, listing, unit, rooms, linkedRoomId, isGestion, bookings);
        });
      };
      if(pruned.changed){
        listing.units = pruned.units;
        unit = pruned.units.filter(function(u){ return u.id===unit.id; })[0];
        firebase.firestore().collection("listings").doc(listing.id).update({units:pruned.units}).then(afterPrune).catch(afterPrune);
      } else {
        afterPrune();
      }
    });
  });
}

/* Mise en page reprise de la vue "Location" de Fiftin app (grille de mois
   par 2 avec numéros de semaine — déjà le cas ici — + pagination "n/total"
   d'une chambre à l'autre + rangée Année/Aujourd'hui/action en haut) : même
   structure, mais identité visuelle et couleurs Séjours inchangées (sauge/
   crème, un seul vert sauge pour "occupé" — Séjours reste en lecture seule,
   pas un outil de gestion multi-sources comme app/). */
function scrollToCurrentMonthCal(){
  var now = new Date();
  var monthEls = document.querySelectorAll(".cal-mini");
  if(monthEls[now.getMonth()]) monthEls[now.getMonth()].scrollIntoView({block:"center", behavior:"smooth"});
}

function renderHostCalendarBody(listings, listing, unit, rooms, linkedRoomId, isGestion, bookings){
  var feed = document.getElementById("feed");
  var units = listing.units || [];
  var occ = occupiedDatesFromBookings(bookings);
  var year = state.hostCalYear;
  var now = new Date();
  var todayStr = isoDate(now.getFullYear(), now.getMonth(), now.getDate());
  var months = "";
  for(var m=0;m<12;m++) months += monthMiniHtml(year, m, occ, todayStr);

  var listingSwitchHtml = listings.length>1 ?
    '<select class="host-listing-select" id="host-listing-select">'+
      listings.map(function(l){ return '<option value="'+esc(l.id)+'"'+(l.id===listing.id?' selected':'')+'>'+esc(l.name||"(sans nom)")+'</option>'; }).join("")+
    '</select>' : '<b class="host-listing-name">'+esc(listing.name||"(sans nom)")+'</b>';

  var unitIndex = units.findIndex(function(u){ return u.id===unit.id; });
  var unitPagerHtml = units.length>1 ?
    '<div class="cal-unit-pager">'+
      '<span class="cal-unit-pager-count">'+(unitIndex+1)+' / '+units.length+'</span>'+
      '<div class="cal-unit-pager-row">'+
        '<button type="button" id="cal-unit-prev" aria-label="Chambre précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>'+
        '<b class="cal-unit-pager-name">'+esc(unit.name||"(sans nom)")+'</b>'+
        '<button type="button" id="cal-unit-next" aria-label="Chambre suivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>'+
      '</div>'+
    '</div>' :
    '<b class="cal-unit-pager-name" style="display:block;text-align:center;margin:0 0 18px;">'+esc(unit.name||"(sans nom)")+'</b>';

  var roomLinkHtml = (isGestion && rooms.length) ?
    '<div class="host-link-row"><label>Afficher les réservations de</label><select id="host-room-link">'+
      '<option value="">— Choisir une chambre Fiftin app —</option>'+
      rooms.map(function(r){ return '<option value="'+esc(r.id)+'"'+(r.id===linkedRoomId?' selected':'')+'>'+esc(r.name)+'</option>'; }).join("")+
    '</select></div>' : '';

  var actionPillHtml = isGestion
    ? '<a class="cal-add-pill" href="../app/" target="_blank" rel="noopener">Ajouter/modifier →</a>'
    : '<button type="button" class="cal-add-pill" id="cal-add-btn">+ Réservation</button>';

  feed.innerHTML = '<div class="host-view">'+
    '<div class="host-view-head">'+listingSwitchHtml+
      '<span class="host-status-badge '+(isGestion?'linked':'standalone')+'">'+(isGestion?"Géré depuis Fiftin app · lecture seule":"Calendrier simplifié")+'</span>'+
    '</div>'+
    '<div class="cal-top-row">'+
      '<div class="cal-year-nav">'+
        '<button type="button" id="cal-year-prev" aria-label="Année précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>'+
        '<b>'+year+'</b>'+
        '<button type="button" id="cal-year-next" aria-label="Année suivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>'+
      '</div>'+
      '<div class="cal-top-actions">'+
        '<button type="button" class="cal-today-btn" id="cal-today-btn">Aujourd\'hui</button>'+
        actionPillHtml+
      '</div>'+
    '</div>'+
    unitPagerHtml+
    roomLinkHtml+
    '<div class="cal-card"><div class="cal-year-grid">'+months+'</div></div>'+
  '</div>';

  if(listings.length>1){
    document.getElementById("host-listing-select").addEventListener("change", function(e){
      state.hostListingId = e.target.value;
      state.hostUnitId = null;
      renderHostCalendar();
    });
  }
  if(units.length>1){
    document.getElementById("cal-unit-prev").addEventListener("click", function(){
      var idx = units.findIndex(function(u){ return u.id===unit.id; });
      state.hostUnitId = units[(idx-1+units.length)%units.length].id;
      renderHostCalendar();
    });
    document.getElementById("cal-unit-next").addEventListener("click", function(){
      var idx = units.findIndex(function(u){ return u.id===unit.id; });
      state.hostUnitId = units[(idx+1)%units.length].id;
      renderHostCalendar();
    });
  }
  if(isGestion && rooms.length){
    document.getElementById("host-room-link").addEventListener("change", function(e){
      var newRoomId = e.target.value;
      var sel = e.target;
      sel.disabled = true;
      /* linkedRoomId (sur la chambre, dans le tableau units) ne sert qu'à
         choisir QUOI afficher en lecture seule — jamais un chemin
         d'écriture, voir commentaire plus haut. On réécrit tout le
         tableau units (Firestore ne permet pas de modifier un seul élément
         d'un array par index), jamais accounts/{uid}. */
      var newUnits = units.map(function(u){ return u.id===unit.id ? Object.assign({}, u, {linkedRoomId:newRoomId}) : u; });
      firebase.firestore().collection("listings").doc(listing.id).update({units:newUnits}).then(function(){
        listing.units = newUnits;
        renderHostCalendar();
      }).catch(function(err){ alert("Erreur : "+(err.message||err.code)); sel.disabled = false; });
    });
  }
  document.getElementById("cal-year-prev").addEventListener("click", function(){ state.hostCalYear--; renderHostCalendarBody(listings, listing, unit, rooms, linkedRoomId, isGestion, bookings); });
  document.getElementById("cal-year-next").addEventListener("click", function(){ state.hostCalYear++; renderHostCalendarBody(listings, listing, unit, rooms, linkedRoomId, isGestion, bookings); });
  document.getElementById("cal-today-btn").addEventListener("click", function(){
    var currentYear = (new Date()).getFullYear();
    if(state.hostCalYear!==currentYear){
      state.hostCalYear = currentYear;
      renderHostCalendarBody(listings, listing, unit, rooms, linkedRoomId, isGestion, bookings);
      setTimeout(scrollToCurrentMonthCal, 60);
    } else {
      scrollToCurrentMonthCal();
    }
  });
  var addBtn = document.getElementById("cal-add-btn");
  if(addBtn) addBtn.addEventListener("click", function(){
    hostBookingContext = {mode:"add", listing:listing, unit:unit, isGestion:false, date:null};
    openSheet("hostbooking");
  });
  Array.prototype.forEach.call(feed.querySelectorAll(".cal-mini-day[data-date]"), function(el){
    var ds = el.getAttribute("data-date");
    var occBooking = occ[ds];
    if(isGestion && !occBooking) return; /* rien à afficher, rien à ajouter depuis ici */
    el.addEventListener("click", function(){
      if(occBooking){
        hostBookingContext = {mode:"view", listing:listing, unit:unit, isGestion:isGestion, booking:occBooking};
      } else {
        hostBookingContext = {mode:"add", listing:listing, unit:unit, isGestion:false, date:ds};
      }
      openSheet("hostbooking");
    });
  });
}

function submitAddBooking(){
  var ctx = hostBookingContext;
  var name = document.getElementById("hb-name").value.trim();
  var checkIn = document.getElementById("hb-checkin").value;
  var checkOut = document.getElementById("hb-checkout").value;
  var errEl = document.getElementById("hb-err");
  errEl.textContent = "";
  if(!name){ errEl.textContent = "Nom du client requis."; return; }
  if(!checkIn || !checkOut){ errEl.textContent = "Renseignez les deux dates."; return; }
  if(checkIn >= checkOut){ errEl.textContent = "Le départ doit être après l'arrivée."; return; }
  if(typeof firebase==="undefined"){ errEl.textContent = "Connexion indisponible — réessayez dans un instant."; return; }
  var btn = document.getElementById("sheet-apply");
  btn.disabled = true;
  /* Toujours listings/{id}/bookings, jamais accounts/{uid} — voir le
     commentaire au-dessus de fetchHostBookings. */
  firebase.firestore().collection("listings").doc(ctx.listing.id).collection("bookings").add({
    unitId:ctx.unit.id, name:name, checkIn:checkIn, checkOut:checkOut, createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    closeSheet();
    renderHostCalendar();
  }).catch(function(err){ errEl.textContent = "Erreur : "+(err.message||err.code); btn.disabled = false; });
}
function submitDeleteBooking(){
  var ctx = hostBookingContext;
  if(ctx.isGestion) return; /* pas de bouton dans ce cas, filet de sécurité */
  if(!confirm("Supprimer cette réservation ?")) return;
  firebase.firestore().collection("listings").doc(ctx.listing.id).collection("bookings").doc(ctx.booking.id).delete()
    .then(function(){ closeSheet(); renderHostCalendar(); })
    .catch(function(err){ alert("Erreur : "+(err.message||err.code)); });
}

  document.querySelector(".filters").scrollIntoView({behavior:"smooth", block:"start"});
});


/* ---------------- init ---------------- */
/* Lien de partage (?listing=<id>, voir shareListing()) : ouvre directement
   la fiche détail de l'annonce visée si elle est déjà chargée. Appelée
   après CHAQUE source de données (listings.json, puis Firestore) plutôt
   qu'une seule fois, parce que l'annonce visée est presque toujours une
   annonce réelle (Firestore, qui répond après le fichier statique) —
   deepLinkHandled empêche de rouvrir la fiche une fois trouvée. */
var deepLinkHandled = false;
function maybeOpenDeepLink(){
  if(deepLinkHandled) return;
  var idParam = new URLSearchParams(location.search).get("listing");
  if(!idParam) { deepLinkHandled = true; return; }
  var id = Number(idParam);
  var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
  if(!l) return; // pas encore trouvée : on retentera à la prochaine source chargée
  deepLinkHandled = true;
  if(!heroDismissed){
    heroDismissed = true;
    var heroEl = document.getElementById("hero");
    if(heroEl) heroEl.hidden = true;
  }
  openDetail(id);
}

/* state.hostMode ici ne peut venir que de la restauration localStorage
   ci-dessus (jamais mis à true par défaut) — un rechargement pendant une
   session hôte doit rouvrir directement l'espace hôtes, hero compris
   (sinon il resterait affiché par-dessus la barre d'onglets hôte, voir
   le commentaire de enterHostMode()), pas revenir sur Explorer. */
if(state.hostMode){
  heroDismissed = true;
  var heroElBoot = document.getElementById("hero");
  if(heroElBoot) heroElBoot.hidden = true;
  document.getElementById("filter-bar").classList.add("chrome-collapsed");
  document.getElementById("result-line").classList.add("chrome-collapsed");
  renderTabbar();
  renderHostTabContent();
} else {
  renderTabbar();
  renderFilterBar();
  document.getElementById("feed").classList.toggle("feed-explore", state.tab==="explore"); // voir switchTab() : state.tab vaut "explore" par défaut ici, jamais passé par switchTab() au tout premier rendu
  renderFeed();
  renderResultLine();
}
updateHeroMenu();

fetch("listings.json").then(function(r){
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}).then(function(data){
  staticListings = data;
  rebuildListings();
  state.loading = false;
  renderFilterBar(); renderFeed(); renderResultLine();
  if(state.tab==="map") renderMap();
  maybeOpenDeepLink();
}).catch(function(err){
  state.loading = false;
  document.getElementById("feed").innerHTML = '<div class="empty-state"><p>Impossible de charger les hébergements pour le moment.<br>Vérifiez votre connexion et réessayez.</p></div>';
});

bootFirebaseAuth();
fetchPublishedListings();

})();
</script>
