function persist(){ try{ localStorage.setItem("fiftin_state", JSON.stringify({filters:state.filters, sort:state.sort, hostMode:state.hostMode, hostTab:state.hostTab, likesLayout:state.likesLayout})); }catch(e){} }

/* ---------------- Favoris en collections (retour utilisateur) ----------------
   "Les favoris devraient être construits avec un principe de collection,
   renommable et personnalisable" (inspiration : l'écran Collections de
   Photos iOS, adapté à notre style). Remplace l'ancien favori binaire
   (state.liked, un simple tableau d'ids en localStorage, jamais synchronisé
   entre appareils) par de vraies collections nommées, synchronisées par
   compte (collections/{uid}/items/{collectionId} — voir règles Firestore
   dans le README). Une annonce peut appartenir à PLUSIEURS collections à la
   fois (comme des tags, pas des dossiers exclusifs) : le cœur n'est plus un
   simple bouton à bascule, il ouvre un volet de choix (kind==="collPicker"
   plus bas) qui coche/décoche une à une les collections concernées.
   listingKey(l) : même convention que logContact() (l.docId||String(l.id))
   — l'identifiant stocké dans listingIds n'a besoin d'aucun document
   Firestore côté annonce (contrairement à listings/{id}/likes/{uid}
   ci-dessous, qui lui exige un docId réel) : une annonce statique de démo
   peut donc très bien rejoindre une collection. */
function listingKey(l){ return l.docId || String(l.id); }
function ensureCollectionsLoaded(cb){
  if(collectionsCache){ cb(collectionsCache); return; }
  if(!authState.uid || typeof firebase==="undefined"){ cb([]); return; }
  firebase.firestore().collection("collections").doc(authState.uid).collection("items").orderBy("createdAt","asc").get().then(function(snap){
    collectionsCache = snap.docs.map(function(doc){
      var d = doc.data(); d.id = doc.id; d.listingIds = d.listingIds || [];
      return d;
    });
    cb(collectionsCache);
  }).catch(function(){ collectionsCache = []; cb(collectionsCache); });
}
function collectionsContaining(key){
  return (collectionsCache||[]).filter(function(c){ return c.listingIds.indexOf(key)!==-1; });
}
function isListingSaved(l){ return collectionsContaining(listingKey(l)).length>0; }
/* Nombre de favoris à AFFICHER (bandeau Mes séjours) : annonces distinctes
   sauvegardées dans au moins une collection, ignorant les ids fantômes
   d'une annonce supprimée depuis (même esprit que l'ancien validLikedCount(),
   dont c'est le successeur direct) — jamais le nombre de COLLECTIONS. */
function savedListingsCount(){
  var ids = {};
  LISTINGS.forEach(function(l){ ids[listingKey(l)] = true; });
  var seen = {};
  (collectionsCache||[]).forEach(function(c){
    c.listingIds.forEach(function(k){ if(ids[k]) seen[k] = true; });
  });
  return Object.keys(seen).length;
}
/* Coche/décoche une annonce dans UNE collection (volet kind==="collPicker") —
   écrit tout de suite, comme les autres volets à cases indépendantes de ce
   fichier (kind==="roomlink"). wasSaved/isSaved (avant/après CE changement,
   toutes collections confondues) pilotent writeLikeState() : l'agrégat
   public listings/{id}/likes/{uid} (compteur "Les plus appréciés", voir plus
   bas) ne bouge qu'au moment où l'annonce entre dans sa PREMIÈRE collection
   ou sort de sa DERNIÈRE — jamais à chaque case cochée individuellement,
   sans quoi cocher 3 collections d'un coup l'incrémenterait 3 fois. */
function toggleListingInCollection(listing, collection, add){
  var key = listingKey(listing);
  var wasSaved = isListingSaved(listing);
  var newIds = add
    ? (collection.listingIds.indexOf(key)===-1 ? collection.listingIds.concat(key) : collection.listingIds)
    : collection.listingIds.filter(function(k){ return k!==key; });
  var ref = firebase.firestore().collection("collections").doc(authState.uid).collection("items").doc(collection.id);
  return ref.update({listingIds:newIds, updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){
    collection.listingIds = newIds;
    var isSaved = isListingSaved(listing);
    if(wasSaved!==isSaved) writeLikeState(listing, isSaved);
  });
}
/* Nouvelle collection, vide, nommée par l'hôte — .add() plutôt que
   .doc().set() : laisse Firestore générer l'id, sans rien à choisir
   soi-même. createdAt en repli côté client (new Date()) pour trier
   immédiatement dans la session en cours, avant que le serveur ne résolve
   son vrai FieldValue.serverTimestamp() (pas relisible tout de suite après
   un .add()) ; écrasé de toute façon au prochain vrai chargement
   (ensureCollectionsLoaded() repart à zéro). */
function createCollection(name, cb){
  var itemsRef = firebase.firestore().collection("collections").doc(authState.uid).collection("items");
  var serverNow = firebase.firestore.FieldValue.serverTimestamp();
  itemsRef.add({name:name, listingIds:[], createdAt:serverNow, updatedAt:serverNow}).then(function(ref){
    var col = {id:ref.id, name:name, listingIds:[], createdAt:new Date(), updatedAt:new Date()};
    collectionsCache.push(col);
    cb(col);
  }).catch(function(err){ cb(null, err); });
}
function renameCollection(collection, newName, cb){
  firebase.firestore().collection("collections").doc(authState.uid).collection("items").doc(collection.id)
    .update({name:newName, updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
    .then(function(){ collection.name = newName; cb(); })
    .catch(function(err){ cb(err); });
}
/* Supprimer une collection peut faire sortir une annonce de sa DERNIÈRE
   collection (si elle n'était que dans celle-ci) : même logique
   wasSaved/isSaved que toggleListingInCollection() ci-dessus, vérifiée pour
   chacune de ses annonces APRÈS le retrait de la collection du cache, pour
   ne jamais laisser le compteur public likeCount gonflé par une collection
   qui n'existe plus. */
function deleteCollection(collection, cb){
  firebase.firestore().collection("collections").doc(authState.uid).collection("items").doc(collection.id).delete().then(function(){
    var affectedKeys = collection.listingIds.slice();
    collectionsCache = collectionsCache.filter(function(c){ return c.id!==collection.id; });
    affectedKeys.forEach(function(key){
      if(collectionsContaining(key).length) return; // encore présente ailleurs, rien à décrémenter
      var l = LISTINGS.filter(function(x){ return listingKey(x)===key; })[0];
      if(l) writeLikeState(l, false);
    });
    cb();
  }).catch(function(err){ cb(err); });
}
/* Point d'entrée unique du cœur, partout dans l'app (carte du fil, fiche
   détail) : ouvre le volet de choix de collection(s) plutôt que de liker
   directement — voir kind==="collPicker". AJOUTER à une collection exige un
   compte (comme l'ancien like) : ouvre la connexion à la place si le
   visiteur n'est pas connecté. onChange(), optionnel, est rappelé après
   chaque case cochée/décochée dans le volet (pas seulement à sa fermeture)
   pour que l'appelant reste synchronisé en direct. */
function openCollectionPicker(l, onChange){
  if(!authState.uid){ authContext = "traveler"; openSheet("auth"); return; }
  collectionPickerContext = {listing:l, onChange:onChange||function(){}, creating:false};
  openSheet("collPicker");
}

/* Écrit l'état "favori" côté serveur : un document par (annonce, compte)
   dans listings/{id}/likes/{uid} — plutôt qu'un simple compteur qu'on
   incrémente à l'aveugle, ça permet à la règle Firestore de vérifier
   qu'un like ne peut être compté qu'une fois par personne (voir README) :
   likeCount ne peut monter que si CE document vient d'être créé, et
   descendre que s'il vient d'être supprimé — un doublon (même personne,
   deux appareils, ou double-clic) ne peut donc pas gonfler le compteur.
   set()/delete() + update() du compteur partent dans le MÊME batch,
   atomique : jamais l'un sans l'autre. Best-effort (même esprit que
   writeBackSejoursLink côté app/) : un échec réseau ne bloque jamais
   l'action locale, déjà faite avant cet appel. Appelée désormais par
   toggleListingInCollection()/deleteCollection() (première/dernière
   collection contenant l'annonce), plus par un simple clic sur un cœur —
   la règle Firestore elle-même (voir README) n'a pas changé, seul QUI
   déclenche l'écriture a changé. */
function writeLikeState(l, liked){
  if(!l.docId || typeof firebase==="undefined" || !firebase.apps || !firebase.apps.length) return;
  var db = firebase.firestore();
  var listingRef = db.collection("listings").doc(l.docId);
  var likeRef = listingRef.collection("likes").doc(authState.uid);
  var batch = db.batch();
  if(liked){
    batch.set(likeRef, {uid:authState.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    batch.update(listingRef, {likeCount: firebase.firestore.FieldValue.increment(1)});
  } else {
    batch.delete(likeRef);
    batch.update(listingRef, {likeCount: firebase.firestore.FieldValue.increment(-1)});
  }
  batch.commit().catch(function(err){ console.error("[like] échec de l'écriture", err); });
}

/* Historique personnel du voyageur (onglet Envies → Demandes) : garde
   trace du moment où IL a lui-même déclenché un contact (Mail/WhatsApp/
   SMS/Appeler), pour qu'il puisse le retrouver plus tard — pas une
   confirmation d'envoi (impossible à obtenir : sms:/tel:/mailto: font
   sortir de la page vers l'appli native, le site n'a plus aucune
   visibilité ensuite sur ce qui s'y passe), seulement l'intention, au
   moment du clic. Écrit UNIQUEMENT si connecté (contactLog/{uid}/entries,
   voir règles Firestore) : sans compte il n'y a de toute façon aucun
   moyen de retrouver cet historique plus tard, pas la peine de forcer une
   connexion juste pour cliquer un bouton de contact (friction inutile
   sur le geste principal du site). Best-effort, comme writeLikeState() :
   un échec réseau ne bloque jamais l'action réelle, déjà en cours
   (l'appel/SMS/mail part indépendamment de cette écriture).
   checkIn/checkOut : les dates du panneau de demande au moment du clic,
   UNIQUEMENT si le voyageur les a réellement choisies (champ modifié ou
   jour de calendrier cliqué — voir datesTouched dans wireQuickReq()) ;
   null sinon, même si le panneau affichait des dates par défaut
   (préremplies, jamais vides visuellement, voir quickReqHtml()) que
   personne n'a choisies. Permet de regrouper les demandes par séjour
   visé dans Mes séjours → Demandes (groupedDemandesHtml()/stayPeriodLabel()),
   sans faire semblant qu'un contact où les dates n'ont jamais été
   regardées vise un séjour précis.
   Invalide contactLogCache une fois l'écriture confirmée (retour
   utilisateur : le compteur Demandes de Mes séjours restait figé tant
   qu'on ne rechargeait pas la page entière) — la seule autre écriture sur
   cette collection, confirmContactLogEntry()/declineContactLogEntry(),
   l'invalidait déjà, mais logContact() peut tout aussi bien s'exécuter
   SANS avoir quitté l'onglet Mes séjours (panneau de demande ouvert
   depuis un favori déjà affiché) : switchTab() ne s'en charge alors pas,
   voir son commentaire. Re-rendu immédiat du bandeau si l'onglet Mes
   séjours est déjà affiché ; sinon la prochaine visite relira
   simplement l'état réel via loadContactLogEntries(). */
function logContact(l, channel, unitName, checkIn, checkOut){
  if(!authState.uid || typeof firebase==="undefined" || !firebase.apps || !firebase.apps.length) return;
  firebase.firestore().collection("contactLog").doc(authState.uid).collection("entries").add({
    listingId: l.docId || String(l.id),
    listingName: unitName ? (l.name+" – "+unitName) : l.name,
    channel: channel,
    checkIn: checkIn,
    checkOut: checkOut,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    contactLogCache = null;
    if(state.tab==="likes") refreshLikesChrome();
  }).catch(function(err){ console.error("[contactLog] échec de l'écriture", err); });
}

/* Taux de conversion demandes -> séjours d'une annonce, visible UNIQUEMENT
   par son propriétaire dans sa propre fiche détail (voir openDetail()) :
   une donnée business, pas un argument marketing à exposer aux voyageurs
   (afficher un pourcentage bas découragerait des réservations légitimes
   sur un échantillon souvent minuscule — décision volontaire, à
   reconsidérer si un jour l'hôte veut l'afficher publiquement). l.stats
   n'existe que si la Cloud Function syncListingContactStats a déjà tourné
   au moins une fois (voir functions/index.js) ; null tant qu'aucune
   demande n'a jamais été enregistrée pour cette annonce — pas de "0%"
   trompeur (0% de conversion et "personne n'a encore contacté" sont deux
   informations différentes). */
function conversionLabelFor(l){
  if(!l.stats || !l.stats.demandeCount) return null;
  var pct = Math.round((l.stats.confirmedCount||0) / l.stats.demandeCount * 100);
  return pct+"%";
}

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* Utilitaires partagés annonces à plusieurs chambres (units) — utilisés
   côté admin (file d'attente) et côté hôte ("Mes annonces"), là où on lit
   directement le document Firestore brut plutôt que l'objet normalisé de
   normalizeHostListing(). */
function listingCoverUrl(l){
  if(l.gallery && l.gallery[0]) return l.gallery[0];
  if(l.units) for(var i=0;i<l.units.length;i++){ if(l.units[i].gallery && l.units[i].gallery[0]) return l.units[i].gallery[0]; }
  return null;
}
function listingPriceLabel(l){
  if(l.units && l.units.length){
    var min = Math.min.apply(null, l.units.map(function(u){ return u.price; }));
    return (l.units.length>1 ? "à partir de " : "") + min + "€/nuit";
  }
  return (l.price!=null ? l.price : "?") + "€/nuit";
}

/* Prédicat de filtrage — fonctionne aussi bien sur une annonce COMPLÈTE
   (LISTINGS) que sur une entrée LÉGÈRE de l'index (listingIndexCache) :
   les deux portent les mêmes champs utiles au filtrage
   (region/regionName/deptName/city, lat/lng, price, amen), seules les
   photos/chambres manquent côté index, jamais lues ici. Utilisé par
   matchingIndexListings() ci-dessous — un seul endroit qui décide "cette
   annonce correspond aux filtres actifs", pour ne jamais risquer que la
   carte, le compteur et la pagination se désaccordent entre eux. */
function matchesAllFilters(l, f){
  if(!matchesLocation(l, f)) return false;
  if(f.distance!=null && listingDistanceKm(l) > f.distance) return false;
  if(l.price > f.price) return false;
  if(f.amen.length && !f.amen.every(function(a){ return l.amen.indexOf(a)!==-1; })) return false;
  return true;
}

function sortListings(list){
  if(state.sort==="distance_asc") return list.slice().sort(function(a,b){ return listingDistanceKm(a)-listingDistanceKm(b); });
  if(state.sort==="distance_desc") return list.slice().sort(function(a,b){ return listingDistanceKm(b)-listingDistanceKm(a); });
  if(state.sort==="likes_desc") return list.slice().sort(function(a,b){ return (b.likeCount||0)-(a.likeCount||0); });
  if(state.sort==="price_asc") return list.slice().sort(function(a,b){ return a.price-b.price; });
  if(state.sort==="price_desc") return list.slice().sort(function(a,b){ return b.price-a.price; });
  return list;
}

/* Liste COMPLÈTE et ordonnée des annonces correspondant aux filtres actifs,
   calculée sur listingIndexCache — donc toujours entière même quand
   LISTINGS, lui, ne contient encore que les annonces déjà chargées en
   détail (pagination du fil, voir PAGE_SIZE/renderFeed() plus bas). Deux
   usages : le compteur de résultats (renderResultLine(), doit compter
   TOUT ce qui correspond, pas seulement ce qui est déjà affiché) et la
   pagination elle-même (quelles annonces, dans quel ordre, charger en
   détail au fil du scroll).
   Le repère posé sur la carte (filters.zoneOrigin) n'a plus besoin de son
   propre filtre séparé ici : c'est juste une autre origine possible pour
   currentOrigin(), déjà pris en compte par matchesAllFilters() via
   filters.distance/listingDistanceKm() — voir le commentaire de
   filters.zoneOrigin plus haut. */
function matchingIndexListings(){
  var f = state.filters;
  // Filet de secours (voir fetchListingIndex()) : un index vide alors que
  // LISTINGS, lui, a du contenu (rescue fetchPublishedListings() déjà
  // exécuté) veut dire que l'index est cassé/pas déployé, pas que le
  // catalogue est vide — dans ce cas seulement, retomber sur LISTINGS
  // (pagination alors inactive) plutôt que d'afficher "Aucun hébergement"
  // à tort.
  var source = (listingIndexCache.length || !LISTINGS.length) ? listingIndexCache : LISTINGS;
  var list = source.filter(function(l){ return matchesAllFilters(l, f); });
  return sortListings(list);
}

/* ---------------- render: filter bar ---------------- */
var FILTER_ICONS = {
  loc:"<path d='M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z'/><circle cx='12' cy='10' r='2.5'/>",
  distance:"<circle cx='12' cy='12' r='8'/><circle cx='12' cy='12' r='3'/>",
  price:"<path d='M3 12l9-9h6a2 2 0 0 1 2 2v6l-9 9a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8z'/><circle cx='15.5' cy='8.5' r='1.3'/>",
  amen:"<path d='M9 11l3 3L22 4'/><path d='M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11'/>",
  sort:"<path d='M4 6h16M4 12h10M4 18h6'/>"
};

/* Libellé de la puce Lieu : le plus précis des trois niveaux renseignés
   (mot-clé libre > département > région), sinon "Lieu". Les trois peuvent
   être combinés (voir matchesLocation()) mais un seul s'affiche pour ne
   pas surcharger le bandeau. */
function locChipLabel(f){
  if(f.q) return esc(f.q);
  if(f.deptName) return esc(f.deptName);
  if(f.regionName) return esc(f.regionName);
  return "Lieu";
}
function renderFilterBar(){
  var f = state.filters;
  var activeAmenCount = f.amen.length;
  var bar = document.getElementById("filter-bar");
  var locActive = !!(f.q || f.regionName || f.deptName);
  var anyActive = locActive || f.distance!=null || f.price<300 || activeAmenCount>0 || state.sort!=="reco";
  // Réinitialiser en premier (retour utilisateur) : à gauche des filtres
  // plutôt qu'après, visible sans avoir à faire défiler la barre.
  bar.innerHTML = (anyActive ? '<button type="button" class="chip-reset-all" id="chip-reset-all">Réinitialiser</button>' : "") + [
    chipHtml("loc", locChipLabel(f), locActive),
    chipHtml("distance", f.distance!=null ? "Distance · "+f.distance+" km"+(f.zoneOrigin?" (repère)":"") : "Distance", f.distance!=null),
    chipHtml("price", "Prix · jusqu'à "+f.price+"€", f.price<300),
    chipHtml("amen", "Prestations"+(activeAmenCount? " <span class=n>"+activeAmenCount+"</span>":""), activeAmenCount>0),
    chipHtml("sort", "Trier", state.sort!=="reco")
  ].join("");

  Array.prototype.forEach.call(bar.querySelectorAll(".chip-tap"), function(el){
    el.addEventListener("click", function(){ openSheet(el.getAttribute("data-k")); });
  });
  Array.prototype.forEach.call(bar.querySelectorAll(".chip-x"), function(el){
    el.addEventListener("click", function(e){ e.stopPropagation(); clearFilter(el.getAttribute("data-clear")); });
  });
  var resetAllBtn = document.getElementById("chip-reset-all");
  if(resetAllBtn) resetAllBtn.addEventListener("click", function(){
    state.filters = {q:"", regionName:"", deptName:"", distance:null, zoneOrigin:null, price:300, amen:[]};
    state.sort = "reco";
    persist(); renderFilterBar(); renderTabContent(); renderResultLine();
  });
}
function chipHtml(k,label,active){
  return '<div class="chip'+(active?' active':'')+'">'+
    '<button type="button" class="chip-tap" data-k="'+k+'">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+FILTER_ICONS[k]+'</svg>'+
      '<span>'+label+'</span>'+
    '</button>'+
    (active ? '<button type="button" class="chip-x" data-clear="'+k+'" aria-label="Retirer ce filtre">&times;</button>' : "")+
  '</div>';
}
/* Retire un seul filtre depuis sa croix sur le bandeau, sans ouvrir le
   volet — le point qui manquait ("je ne sais même pas comment les
   supprimer"). */
function clearFilter(k){
  var f = state.filters;
  if(k==="loc"){ f.q = ""; f.regionName = ""; f.deptName = ""; }
  else if(k==="distance"){ f.distance = null; f.zoneOrigin = null; } // retire aussi le repère de la carte, sinon un cercle sans rayon resterait affiché sans filtre associé
  else if(k==="price") f.price = 300;
  else if(k==="amen") f.amen = [];
  else if(k==="sort") state.sort = "reco";
  persist(); renderFilterBar(); renderTabContent(); renderResultLine();
}

function renderResultLine(){
  // matchingIndexListings() (l'index complet), pas LISTINGS (ce qui est
  // déjà chargé en détail) : le compteur doit refléter TOUT ce qui
  // correspond aux filtres, y compris les annonces pas encore paginées.
  var n = matchingIndexListings().length;
  var label = n + (n>1? " hébergements trouvés" : " hébergement trouvé");
  document.getElementById("result-line").innerHTML = '<span class="result-pill">'+esc(label)+'</span>';
}

/* ---------------- render: feed ---------------- */
function coverHtml(l){
  var fallbackShots = (!l.gallery || !l.gallery.length) && l.units ?
    l.units.reduce(function(acc,u){ return acc.concat(u.gallery||[]); }, []) : null;
  var shots = l.gallery && l.gallery.length ? l.gallery.slice(0,3) : (fallbackShots && fallbackShots.length ? fallbackShots.slice(0,3) : null);
  var priceLabel = (l.units && l.units.length>1 ? "à partir de " : "") + l.price + "€ / nuit";
  var mediaHtml;
  if(shots){
    mediaHtml = '<div class="cover-carousel" data-cc="'+l.id+'">'+
      shots.map(function(src){ return '<img class="cc-slide" src="'+src+'" alt="'+esc(l.name)+'" loading="lazy">'; }).join("")+
    '</div>'+
    (shots.length>1 ? '<div class="cover-dots">'+shots.map(function(_,i){ return '<span class="'+(i===0?"on":"")+'"></span>'; }).join("")+'</div>' : '');
  } else {
    mediaHtml = '<div class="grad" style="background:'+GRADIENTS[l.grad]+'"></div>'+
      '<div class="motif" style="width:56%;height:56%;right:-6%;top:6%;"><svg viewBox="0 0 100 100">'+MOTIFS[l.motif]+'</svg></div>';
  }
  return '<div class="cover">'+
    mediaHtml+
    '<div class="grain"></div>'+
    '<div class="scrim"></div>'+
    '<div class="top-badges"><span class="pill-badge">'+listingDistanceKm(l)+' km</span><span class="pill-badge">'+priceLabel+'</span></div>'+
    '<button class="save-btn'+(isListingSaved(l)?' liked':'')+'" data-like="'+l.id+'" aria-label="Ajouter à une collection">'+
      '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 000-7.8z"/></svg></button>'+
    '<button class="share-btn" data-share="'+l.id+'" aria-label="Partager">'+SHARE_ICON_SVG+'</button>'+
    '<div class="cover-info">'+
      '<div class="region">'+esc(locationLineFor(l))+'</div>'+
      '<h2>'+esc(l.name)+'</h2>'+
      taglineHtml(l)+
      '<div class="cover-cta">'+
        '<button class="btn primary" data-quickreq="'+l.id+'">Contact et disponibilités</button>'+
        '<button class="btn ghost-dark" data-open="'+l.id+'">Voir plus</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

// Explorer uniquement désormais — Mes séjours (Favoris/Demandes/Séjours)
// a ses propres fonctions de rendu (renderFavorisView()/renderContactLog()),
// voir renderTabContent() plus bas.
// Toute autre raison de re-rendre le fil (filtre changé, tri, zone
// dessinée/effacée, changement d'onglet…) repart de la première page —
// seul loadMoreListings() ci-dessous avance sans réinitialiser.
function renderFeed(){
  visibleListingCount = PAGE_SIZE;
  renderFeedBody();
}
function loadMoreListings(){
  visibleListingCount += PAGE_SIZE;
  renderFeedBody();
}

/* feedRenderGen : un changement de filtre pendant qu'une page précédente
   est encore en train de charger ses fiches complètes (ensureListingDocsLoaded,
   voir plus haut) ne doit jamais laisser CET ancien appel écraser le
   rendu du nouveau, arrivé entre-temps — chaque appel vérifie qu'il est
   toujours le dernier avant d'appliquer son résultat. */
var feedRenderGen = 0;
function renderFeedBody(){
  var feed = document.getElementById("feed");
  if(state.loading){
    feed.innerHTML = '<div class="empty-state"><p>Chargement des hébergements…</p></div>';
    return;
  }
  var gen = ++feedRenderGen;
  // Liste COMPLÈTE et ordonnée (filtres + zone dessinée sur la carte, voir
  // matchingIndexListings()) ; on ne demande les fiches détaillées que
  // pour la page actuellement affichée (visibleListingCount).
  var fullList = matchingIndexListings();
  var pageEntries = fullList.slice(0, visibleListingCount);
  // Carte embarquée en tête du fil Explorer (retour utilisateur : "j'aimerais
  // que sur le mode visiteur explorer intègre directement la vue carte (...)
  // la carte serait en haut des annonces") — remplace l'ancien onglet
  // "Carte" séparé. Affichée même liste vide (zéro résultat filtré/zone),
  // pour ne jamais faire disparaître l'outil de recherche par zone.
  var mapBlockHtml = exploreMapBlockHtml();
  if(!pageEntries.length){
    feed.innerHTML = mapBlockHtml + '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'+
      '<p>Aucun hébergement '+(state.filters.zoneOrigin ? "dans cette zone" : "ne correspond à ces filtres")+'.<br>Essayez d\'élargir la distance ou le budget.</p></div>';
    wireExploreMap();
    return;
  }
  var docIds = pageEntries.map(function(ix){ return ix.docId; });
  ensureListingDocsLoaded(docIds, function(){
    if(gen!==feedRenderGen) return; // un rendu plus récent a déjà pris le dessus
    var list = docIds.map(function(id){ return LISTINGS.filter(function(l){ return listingKey(l)===id; })[0]; }).filter(Boolean);
    var hasMore = fullList.length > pageEntries.length;
    feed.innerHTML = mapBlockHtml + list.map(function(l){
      return '<article class="card" id="card-'+l.id+'">'+coverHtml(l)+
        '<div class="qr-panel" id="qr-'+l.id+'" hidden>'+quickReqHtml(l, "qr"+l.id)+'</div>'+
      '</article>';
    }).join("") + (hasMore ? '<button type="button" class="load-more-btn" id="feed-load-more">Charger plus d’hébergements</button>' : '');
    wireExploreMap();
    wireFeedEvents();
    if(hasMore){
      document.getElementById("feed-load-more").addEventListener("click", function(){
        this.disabled = true;
        this.textContent = "Chargement…";
        loadMoreListings();
      });
    }
  });
}

function wireFeedEvents(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-cc]"), function(cc){
    var dots = cc.parentElement.querySelector(".cover-dots");
    if(!dots) return;
    var dotEls = dots.children;
    cc.addEventListener("scroll", function(){
      var idx = Math.round(cc.scrollLeft / cc.clientWidth);
      Array.prototype.forEach.call(dotEls, function(d,i){ d.classList.toggle("on", i===idx); });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-like]"), function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var id = Number(el.getAttribute("data-like"));
      var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
      if(!l) return;
      /* Le cœur n'est plus un simple bouton à bascule (retour utilisateur,
         "le cœur ouvre un choix de collection(s) au clic") : il ouvre le
         volet de choix, jamais un re-rendu du fil complet à lui seul — ce
         qui évite au passage de reconstruire toutes les cartes/de détruire
         l'instance Leaflet d'Explorer pour un simple clic sur un cœur.
         Limite connue, acceptée, inchangée : la punaise correspondante sur
         la carte (.map-pin.liked) ne se met à jour qu'au prochain rendu
         complet, pas instantanément avec ce cœur. */
      openCollectionPicker(l, function(){
        el.classList.toggle("liked", isListingSaved(l));
        renderLikeBadge();
        if(state.tab==="likes" && state.likesView==="favoris") renderFavorisView();
      });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-share]"), function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var id = Number(el.getAttribute("data-share"));
      var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
      if(l) shareListing(l);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function(el){
    el.addEventListener("click", function(){ openDetail(Number(el.getAttribute("data-open"))); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-quickreq]"), function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-quickreq");
      var panel = document.getElementById("qr-"+id);
      panel.hidden = !panel.hidden;
      var qrl = LISTINGS.filter(function(x){ return x.id===Number(id); })[0];
      wireQuickReq(Number(id), "qr"+id, qrl ? soleUnitOf(qrl) : null);
    });
  });
}

/* ---------------- Mes séjours : sous-onglets Favoris / Demandes / Séjours ----------------
   Les trois regroupés ici parce que ce sont les seules listes propres au
   compte du voyageur (par opposition au fil, qui montre les annonces de
   tout le monde) : Favoris (collections, voir plus haut), Demandes en
   cours et Séjours confirmés (les deux derniers tirés de contactLog, voir
   logContact()). Rendu comme un bandeau à 3 segments en tête de #feed,
   dans renderFavorisView()/renderContactLog() plutôt que comme un élément
   fixe séparé. Chaque segment réutilise .stat-tile (voir CSS, "dans le
   style de la vue profil" — demande explicite) : Favoris est synchrone
   (savedListingsCount(), voir plus haut) SEULEMENT une fois les
   collections chargées (sinon "…", comme Demandes/Séjours en attendant
   loadContactLogEntries()) ; Demandes/Séjours viennent d'une lecture
   Firestore partagée (loadContactLogEntries()/contactLogCache) — patchés
   ensuite par loadLikesCounts() sans devoir attendre pour afficher le
   bandeau lui-même. */
function contactLogCounts(docs){
  var enCours = 0, confirmed = 0;
  docs.forEach(function(d){ if(d.data().status==="confirmed") confirmed++; else enCours++; });
  return {enCours:enCours, confirmed:confirmed};
}
function likesViewToggleHtml(){
  var loaded = !authState.uid || contactLogCache!=null;
  var counts = loaded && authState.uid ? contactLogCounts(contactLogCache) : {enCours:0, confirmed:0};
  var favLoaded = !authState.uid || collectionsCache!=null;
  return '<div class="profile-stats">'+
    '<button type="button" class="stat-tile'+(state.likesView==="favoris"?" active":"")+'" data-likes-view="favoris"><b>'+(favLoaded?savedListingsCount():"…")+'</b><span>Mes favoris</span></button>'+
    '<button type="button" class="stat-tile'+(state.likesView==="demandes"?" active":"")+'" data-likes-view="demandes"><b id="stat-count-demandes">'+(loaded?counts.enCours:"…")+'</b><span>Mes demandes</span></button>'+
    '<button type="button" class="stat-tile'+(state.likesView==="sejours"?" active":"")+'" data-likes-view="sejours"><b id="stat-count-sejours">'+(loaded?counts.confirmed:"…")+'</b><span>Mes séjours</span></button>'+
  '</div>';
}
function wireLikesToggle(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-likes-view]"), function(btn){
    btn.addEventListener("click", function(){
      // Toujours revenir à la grille des collections en (re)cliquant sur
      // Favoris — même geste "retour au sommet" qu'un onglet de nav
      // reclique sur lui-même ailleurs dans l'app.
      state.likesCollectionId = null;
      state.likesView = btn.getAttribute("data-likes-view");
      refreshLikesChrome();
    });
  });
  // Retour utilisateur : Demandes/Séjours restaient bloqués sur "…" à
  // l'ouverture de Mes séjours tant qu'on n'avait pas cliqué au moins une
  // fois sur l'un des deux (seul renderContactLog() appelait
  // loadLikesCounts(), jamais renderFavorisView(), pourtant sous-onglet par
  // défaut). wireLikesToggle() est le seul point commun à TOUS les rendus
  // du bandeau (Favoris vide/grille/détail de collection, Demandes,
  // Séjours) — centralisé ici plutôt que dupliqué dans chacun, pour que le
  // premier rendu, quel qu'il soit, déclenche toujours la lecture.
  // Idempotent (voir loadLikesCounts()), donc sans risque à ré-appeler à
  // chaque rendu du bandeau.
  loadLikesCounts();
}
/* Patch les deux compteurs de droite une fois la lecture Firestore
   revenue — ne fait rien si déjà en cache (déjà rendus avec les vrais
   nombres par likesViewToggleHtml()) ni si non connecté (0/0 déjà
   rendus, pas de lecture possible sans compte). En cas d'échec, laisse
   "…" plutôt que d'afficher un faux 0 — l'erreur est déjà journalisée
   par loadContactLogEntries(). */
function loadLikesCounts(){
  if(!authState.uid || contactLogCache) return;
  loadContactLogEntries(function(err, docs){
    if(err) return;
    var counts = contactLogCounts(docs);
    var elD = document.getElementById("stat-count-demandes");
    var elS = document.getElementById("stat-count-sejours");
    if(elD) elD.textContent = String(counts.enCours);
    if(elS) elS.textContent = String(counts.confirmed);
  });
}
/* Filtres Lieu/Distance/Prix/Prestations/Trier et compteur "X hébergements
   trouvés" masqués sur TOUTE la vue Mes séjours (Favoris compris — retour
   utilisateur), pas seulement Demandes/Séjours comme avant : un filtre
   resté actif depuis Explorer, invisible ici, pourrait sinon faire
   disparaître un favori sans aucun moyen de comprendre pourquoi
   (renderFavorisView(), voir plus haut, ignore de toute façon
   state.filters/state.sort sur cette vue, pour la même raison). Appelée
   à la fois par switchTab()
   (première entrée sur l'onglet) et par le clic sur le bandeau. */
function refreshLikesChrome(){
  var filterBar = document.getElementById("filter-bar");
  var resultLine = document.getElementById("result-line");
  var hideChrome = state.tab==="likes";
  filterBar.classList.toggle("chrome-collapsed", hideChrome);
  resultLine.classList.toggle("chrome-collapsed", hideChrome);
  renderTabContent();
  if(!hideChrome) renderResultLine();
}

/* ---------------- Favoris : grille de collections + détail d'une collection ----------------
   Remplace l'ancienne liste plate de favoris (retour utilisateur, voir le
   grand commentaire plus haut sur les collections). Deux écrans sur cette
   même entrée, pilotés par state.likesCollectionId : null = grille des
   collections (tuiles façon Collections Photos, adaptées à notre style —
   capture d'écran fournie en référence) ; un id = le détail d'UNE
   collection (ses annonces, dans le même format de carte que le fil
   Explorer — coeur, partage, contact — plus un en-tête renommer/
   supprimer). */
function renderFavorisView(){
  var feed = document.getElementById("feed");
  var toggle = likesViewToggleHtml();
  if(!authState.uid){
    feed.innerHTML = toggle + '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 000-7.8z"/></svg>'+
      '<p>Connectez-vous pour créer et retrouver vos collections.</p></div>';
    wireLikesToggle();
    return;
  }
  // Collection ouverte supprimée/introuvable (autre appareil, ou juste
  // supprimée à l'instant) : repli silencieux sur la grille plutôt qu'un
  // écran de détail cassé.
  if(state.likesCollectionId && collectionsCache && !collectionsCache.some(function(c){ return c.id===state.likesCollectionId; })){
    state.likesCollectionId = null;
  }
  // Les annonces d'une collection peuvent inclure des id au-delà de la
  // page actuellement chargée dans Explorer (pagination, voir README
  // « Performance ») — ensureListingDocsLoaded() va chercher celles qui
  // manquent avant de composer les tuiles/la fiche détail, pour qu'un
  // favori plus ancien n'y disparaisse jamais silencieusement.
  if(state.likesCollectionId && collectionsCache){
    var openCol = collectionsCache.filter(function(c){ return c.id===state.likesCollectionId; })[0];
    feed.innerHTML = toggle + '<div class="empty-state"><p>Chargement…</p></div>';
    wireLikesToggle();
    ensureListingDocsLoaded(openCol.listingIds, function(){
      if(state.tab!=="likes" || state.likesView!=="favoris" || state.likesCollectionId!==openCol.id) return;
      renderCollectionDetail(feed, toggle);
    });
    return;
  }
  feed.innerHTML = toggle + '<div class="empty-state"><p>Chargement…</p></div>';
  wireLikesToggle();
  ensureCollectionsLoaded(function(cols){
    if(state.tab!=="likes" || state.likesView!=="favoris") return; // a changé d'onglet pendant le chargement
    if(state.likesCollectionId){ renderFavorisView(); return; } // une collection a été ouverte entre-temps (chargement déclenché par le volet du cœur, par ex.)
    var coverIds = [];
    cols.forEach(function(c){ coverIds = coverIds.concat(c.listingIds.slice(0,3)); }); // 3 premières = tout ce que collectionTileHtml() affiche jamais
    ensureListingDocsLoaded(coverIds, function(){
      if(state.tab!=="likes" || state.likesView!=="favoris" || state.likesCollectionId) return;
      renderCollectionsGrid(feed, toggle, cols);
    });
  });
}
/* Bascule grille/liste (retour utilisateur : "j'aimerais aussi une vue
   liste et une vue carré comme actuellement") — n'a de sens que sur la
   grille des collections elle-même, jamais dans le détail d'une
   collection (déjà une liste de cartes .card, pas concerné). Choix
   persisté (voir state.likesLayout/persist()) : une préférence
   d'affichage, pas une position de navigation. */
function layoutToggleHtml(){
  return '<div class="layout-toggle">'+
    '<button type="button" class="layout-toggle-btn'+(state.likesLayout==="grid"?" active":"")+'" data-likes-layout="grid" aria-label="Vue grille"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>'+
    '<button type="button" class="layout-toggle-btn'+(state.likesLayout==="list"?" active":"")+'" data-likes-layout="list" aria-label="Vue liste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>'+
  '</div>';
}
function renderCollectionsGrid(feed, toggle, cols){
  var isList = state.likesLayout==="list";
  var addTile = isList ? collectionAddRowHtml() : collectionAddTileHtml();
  var body = !cols.length ? addTile
    : isList
      ? addTile + cols.map(collectionListRowHtml).join("")
      : '<div class="collections-grid">'+addTile+cols.map(collectionTileHtml).join("")+'</div>';
  feed.innerHTML = toggle + layoutToggleHtml() + body;
  wireLikesToggle();
  document.getElementById("coll-add-tile").addEventListener("click", function(){
    openSheet("collCreate");
  });
  Array.prototype.forEach.call(feed.querySelectorAll("[data-likes-layout]"), function(btn){
    btn.addEventListener("click", function(){
      state.likesLayout = btn.getAttribute("data-likes-layout");
      persist();
      renderCollectionsGrid(feed, toggle, cols);
    });
  });
  Array.prototype.forEach.call(feed.querySelectorAll("[data-open-coll]"), function(el){
    el.addEventListener("click", function(){
      state.likesCollectionId = el.getAttribute("data-open-coll");
      renderFavorisView();
    });
  });
  // Retour utilisateur : "il faudrait aussi pouvoir supprimer une
  // collection" — jusqu'ici possible seulement depuis SON détail
  // (#coll-detail-delete) ; exposée en plus directement sur la tuile/ligne,
  // sans avoir à l'ouvrir d'abord. stopPropagation : le bouton est niché
  // dans/à côté d'un déclencheur data-open-coll, un clic dessus ne doit
  // jamais aussi ouvrir la collection qu'on est en train de supprimer.
  Array.prototype.forEach.call(feed.querySelectorAll("[data-del-coll]"), function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var col = cols.filter(function(c){ return c.id===btn.getAttribute("data-del-coll"); })[0];
      if(!col) return;
      if(!confirm('Supprimer la collection "'+col.name+'" ? Les annonces elles-mêmes ne sont pas supprimées, seulement retirées de cette collection.')) return;
      deleteCollection(col, function(err){
        if(err){ alert("Erreur : "+(err.message||err.code)); return; }
        renderLikeBadge();
        renderFavorisView();
      });
    });
  });
}
/* Tuile d'une collection — mosaïque des photos de ses 1 à 3 premières
   annonces (comme Collections Photos, qui compose la tuile à partir des
   vraies photos de l'album plutôt qu'une couverture choisie à la main :
   "personnalisable" se joue ici sur le NOM, voir renameCollection(), pas
   sur un choix de couverture séparé — pas de champ dédié à alourdir la
   création pour un gain marginal, la mosaïque parle déjà d'elle-même).
   .collection-tile-open (plutôt que .collection-tile lui-même) porte le
   clic "ouvrir" : .collection-tile-delete est un second bouton, FRÈRE et
   non enfant du premier (deux <button> imbriqués seraient invalides en
   HTML) — voir CSS, .collection-tile reste le conteneur positionné. */
function collectionTileHtml(c){
  var covers = c.listingIds.map(function(key){ return LISTINGS.filter(function(l){ return listingKey(l)===key; })[0]; }).filter(Boolean).slice(0,3);
  var n = covers.length;
  var photosHtml = !n
    ? '<div class="collection-tile-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></div>'
    : '<div class="collection-tile-photos n'+n+'">'+covers.map(function(l){
        var thumb = listingThumbUrl(l);
        return thumb ? '<img src="'+thumb+'" alt="" loading="lazy">' : '<div class="collection-tile-empty" style="background:'+GRADIENTS[l.grad]+'"></div>';
      }).join("")+'</div>';
  var count = c.listingIds.length;
  return '<div class="collection-tile">'+
    '<button type="button" class="collection-tile-open" data-open-coll="'+esc(c.id)+'">'+
      photosHtml+
      '<div class="collection-tile-scrim"></div>'+
      '<div class="collection-tile-info"><b>'+esc(c.name)+'</b><span>'+count+' hébergement'+(count>1?'s':'')+'</span></div>'+
    '</button>'+
    '<button type="button" class="collection-tile-delete" data-del-coll="'+esc(c.id)+'" aria-label="Supprimer la collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>'+
  '</div>';
}
/* Tuile grisée "Ajouter une collection", toujours en première position
   (grille comme liste) — retour utilisateur, pour créer une collection
   directement d'ici sans devoir passer par le cœur d'une annonce. Ouvre
   kind==="collCreate", un mini-formulaire nom-seul autonome (pas
   kind==="collPicker" : ce volet-là suppose toujours une annonce à y
   ajouter dans la foulée, collectionPickerContext.listing, qu'on n'a pas
   ici). */
function collectionAddTileHtml(){
  return '<button type="button" class="collection-tile collection-tile-add" id="coll-add-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg><span>Ajouter une collection</span></button>';
}
function collectionAddRowHtml(){
  return '<button type="button" class="map-list-item coll-list-add" id="coll-add-tile"><span class="coll-list-add-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></span><b>Ajouter une collection</b></button>';
}
/* Vue liste (retour utilisateur : "on aurait les mêmes vignettes que
   section demande et section séjours") — réutilise EXACTEMENT
   .map-list-item/.log-body/.log-actions/.log-action.decline (voir
   contactLogRowHtml() plus bas pour Demandes/Séjours), pas une variante :
   même vignette 68×68, même agencement nom/sous-ligne, même bouton
   d'action à droite. Couverture = première annonce de la collection
   (déjà chargée pour la mosaïque de la vue grille, voir renderFavorisView()). */
function collectionListRowHtml(c){
  var cover = c.listingIds.map(function(key){ return LISTINGS.filter(function(l){ return listingKey(l)===key; })[0]; }).filter(Boolean)[0];
  var thumb = cover ? listingThumbUrl(cover) : null;
  var swHtml = thumb ? '<img class="sw" src="'+thumb+'" alt="" loading="lazy">'
    : '<div class="sw" style="background:'+(cover ? GRADIENTS[cover.grad] : "var(--cream-deep)")+'"></div>';
  var count = c.listingIds.length;
  return '<div class="map-list-item coll-list-row">'+
    '<div class="log-body" data-open-coll="'+esc(c.id)+'">'+
      swHtml+
      '<div><b>'+esc(c.name)+'</b><span>'+count+' hébergement'+(count>1?'s':'')+'</span></div>'+
    '</div>'+
    '<div class="log-actions">'+
      '<button type="button" class="log-action decline" data-del-coll="'+esc(c.id)+'" aria-label="Supprimer la collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>'+
    '</div>'+
  '</div>';
}
function renderCollectionDetail(feed, toggle){
  var col = collectionsCache.filter(function(c){ return c.id===state.likesCollectionId; })[0];
  var listings = col.listingIds.map(function(key){ return LISTINGS.filter(function(l){ return listingKey(l)===key; })[0]; }).filter(Boolean);
  var head = '<div class="collection-detail-head">'+
    '<button type="button" class="collection-detail-back" id="coll-detail-back" aria-label="Retour aux collections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>'+
    '<span class="collection-detail-title">'+esc(col.name)+'</span>'+
    '<div class="collection-detail-actions">'+
      '<button type="button" id="coll-detail-rename" aria-label="Renommer la collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>'+
      '<button type="button" id="coll-detail-delete" aria-label="Supprimer la collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>'+
    '</div>'+
  '</div>';
  var body = !listings.length
    ? '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 000-7.8z"/></svg><p>Cette collection est vide pour l\'instant.<br>Touchez le cœur sur un hébergement pour l\'y ajouter.</p></div>'
    : listings.map(function(l){
        return '<article class="card" id="card-'+l.id+'">'+coverHtml(l)+
          '<div class="qr-panel" id="qr-'+l.id+'" hidden>'+quickReqHtml(l, "qr"+l.id)+'</div>'+
        '</article>';
      }).join("");
  feed.innerHTML = toggle + head + body;
  wireLikesToggle();
  if(listings.length) wireFeedEvents();
  document.getElementById("coll-detail-back").addEventListener("click", function(){
    state.likesCollectionId = null;
    renderFavorisView();
  });
  document.getElementById("coll-detail-rename").addEventListener("click", function(){
    collectionRenameContext = col;
    openSheet("collRename");
  });
  document.getElementById("coll-detail-delete").addEventListener("click", function(){
    if(!confirm('Supprimer la collection "'+col.name+'" ? Les annonces elles-mêmes ne sont pas supprimées, seulement retirées de cette collection.')) return;
    deleteCollection(col, function(err){
      if(err){ alert("Erreur : "+(err.message||err.code)); return; }
      state.likesCollectionId = null;
      renderFavorisView();
      renderLikeBadge();
    });
  });
}

/* Plus qu'un libellé texte : la vignette photo de l'annonce a remplacé
   l'icône colorée par canal dans contactLogRowHtml() (voir CSS .sw) —
   les pictogrammes SVG par canal, devenus inutiles ici, restaient
   définis ailleurs dans le fichier (panneau de demande rapide, .send-btn). */
var CONTACT_CHANNEL_META = {
  mail: {label:"Mail"}, wa: {label:"WhatsApp"}, sms: {label:"SMS"}, call: {label:"Appeler"}
};
function fmtContactDate(ts){
  if(!ts) return "";
  var d = typeof ts.toDate==="function" ? ts.toDate() : new Date(ts);
  if(isNaN(d.getTime())) return "";
  var mois = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  var hh = ("0"+d.getHours()).slice(-2), mm = ("0"+d.getMinutes()).slice(-2);
  return d.getDate()+" "+mois[d.getMonth()]+" "+d.getFullYear()+" · "+hh+":"+mm;
}
/* Un séjour demandé (checkIn/checkOut, capturés au clic — voir logContact())
   regroupé sous un même intitulé, même si plusieurs annonces différentes
   ont été contactées pour ces mêmes dates — voir groupedDemandesHtml().
   fmtDate() (déjà utilisé pour le message pré-rempli) inclut le mois,
   donc un intervalle à cheval sur deux mois reste lisible. */
function stayPeriodLabel(checkIn, checkOut){
  if(!checkIn || !checkOut) return "Dates non précisées";
  var year = new Date(checkOut+"T00:00:00").getFullYear();
  return "Séjour du "+fmtDate(checkIn)+" au "+fmtDate(checkOut)+" "+year;
}
/* Réutilise EXACTEMENT le principe visuel de .map-list-item (vignette photo
   + nom + région/prix — historiquement celui de la liste de punaises du feu
   onglet "Carte", fusionné depuis dans Explorer, mais la classe reste
   utilisée ici) — seule différence demandée : une 3e ligne (moyen de
   contact + date/heure du clic). .map-list-item span est en display:block
   (voir CSS) pour que ces deux sous-lignes s'empilent au lieu de se suivre
   côte à côte.
   Le clic "dérouler l'annonce" (.log-body) n'ouvre plus directement la
   fiche détail : il affiche la grande vignette juste au-dessus de la liste
   (selectDemandeListing()) — depuis cette grande vignette, "Voir plus" mène
   à la fiche détail complète. Reste inerte (pas de data-open-log) si
   l'annonce visée n'est plus chargée
   dans LISTINGS (supprimée, ou pas encore chargée). Une fois confirmée
   (entry.status==="confirmed", voir confirmContactLogEntry()), les deux
   boutons d'action disparaissent : il n'y a plus rien à décider ici. */
function contactLogRowHtml(entryId, entry){
  var meta = CONTACT_CHANNEL_META[entry.channel] || CONTACT_CHANNEL_META.mail;
  var numericId = entry.listingId ? idFromString(entry.listingId) : null;
  var l = numericId!=null ? LISTINGS.filter(function(x){ return x.id===numericId; })[0] : null;
  var confirmed = entry.status === "confirmed";
  var thumb = l ? listingThumbUrl(l) : null;
  var swHtml = thumb ? '<img class="sw" src="'+thumb+'" alt="" loading="lazy">'
    : '<div class="sw" style="background:'+(l ? GRADIENTS[l.grad] : "var(--cream-deep)")+'"></div>';
  var subLine = l ? (l.region+' · '+listingPriceLabel(l)) : "";
  return '<div class="map-list-item demande-row">'+
    '<div class="log-body"'+(l?' data-open-log="'+numericId+'"':'')+'>'+
      swHtml+
      '<div><b>'+esc(entry.listingName||"Annonce")+'</b>'+
        (subLine ? '<span>'+esc(subLine)+'</span>' : '')+
        '<span>'+meta.label+' · '+fmtContactDate(entry.createdAt)+(confirmed?' · Séjour confirmé':'')+'</span>'+
      '</div>'+
    '</div>'+
    (confirmed ? '' :
      '<div class="log-actions">'+
        '<button type="button" class="log-action confirm" data-log-confirm="'+esc(entryId)+'" aria-label="Confirmer le séjour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7"/></svg></button>'+
        '<button type="button" class="log-action decline" data-log-decline="'+esc(entryId)+'" aria-label="Supprimer cette demande"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
      '</div>'
    )+
  '</div>';
}
/* Groupe les demandes en cours par séjour visé (mêmes checkIn/checkOut —
   voir stayPeriodLabel()), dans l'ordre où elles apparaissent (docs déjà
   triés par createdAt décroissant, donc les groupes les plus récemment
   actifs remontent naturellement en premier). Ne reçoit plus que des
   demandes en cours : les confirmées vivent désormais dans leur propre
   sous-onglet Séjours (voir renderContactLog()), plus la peine de les
   séparer ici — pas de "En cours"/"Séjours confirmés" en tête non plus,
   redondant avec l'onglet où l'on se trouve déjà. */
function groupedDemandesHtml(pendingDocs){
  var order = [], byKey = {};
  pendingDocs.forEach(function(d){
    var e = d.data();
    var key = (e.checkIn||"?")+"_"+(e.checkOut||"?");
    if(!byKey[key]){ byKey[key] = {checkIn:e.checkIn, checkOut:e.checkOut, docs:[]}; order.push(byKey[key]); }
    byKey[key].docs.push(d);
  });
  return order.map(function(g, i){
    return '<div class="log-period-label"'+(i===0?' style="margin-top:0;"':'')+'>'+esc(stayPeriodLabel(g.checkIn, g.checkOut))+'</div>'+
      '<div class="map-list">'+g.docs.map(function(d){ return contactLogRowHtml(d.id, d.data()); }).join("")+'</div>';
  }).join("");
}
/* Grande vignette d'une demande (même mécanisme, historiquement, que le feu
   selectMapListing() de l'ex-onglet Carte — délibérément dupliqué plutôt
   que factorisé à l'époque : deux variables d'état séparées, sans rapport
   l'une avec l'autre). "Voir plus" sur cette grande carte (déjà câblé par
   wireFeedEvents(), voir data-open) mène à la fiche détail complète. */
var demandeSelectedId = null;
function selectDemandeListing(id){
  demandeSelectedId = id;
  // Une demande peut référencer une annonce au-delà de la page Explorer
  // actuellement chargée (pagination) — resolveListingById() va la
  // chercher si besoin plutôt que de la traiter comme supprimée (voir
  // renderDemandeSelectedCard() ci-dessous). Synchrone si déjà en cache.
  resolveListingById(id, function(){ renderDemandeSelectedCard(); });
  var container = document.getElementById("demandes-selected");
  if(container) container.scrollIntoView({behavior:"smooth", block:"nearest"});
}
function renderDemandeSelectedCard(){
  var container = document.getElementById("demandes-selected");
  if(!container) return;
  var l = demandeSelectedId!=null ? LISTINGS.filter(function(x){ return x.id===demandeSelectedId; })[0] : null;
  if(!l){
    demandeSelectedId = null;
    container.hidden = true; container.innerHTML = "";
    return;
  }
  container.hidden = false;
  container.innerHTML = '<article class="card" id="card-'+l.id+'">'+coverHtml(l)+
    '<div class="qr-panel" id="qr-'+l.id+'" hidden>'+quickReqHtml(l, "qr"+l.id)+'</div>'+
  '</article>';
  wireFeedEvents();
}
function wireContactLogRows(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-open-log]"), function(el){
    el.addEventListener("click", function(){ selectDemandeListing(Number(el.getAttribute("data-open-log"))); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-log-confirm]"), function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var entryId = el.getAttribute("data-log-confirm");
      openConfirmSheet("Ce séjour a bien eu lieu, ou aura lieu ?", "Oui, confirmer", "Non, revenir en arrière", function(){ confirmContactLogEntry(entryId); });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-log-decline]"), function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var entryId = el.getAttribute("data-log-decline");
      openConfirmSheet("Cette demande n'a pas donné suite. Supprimer ?", "Oui, supprimer", "Non, garder l'annonce", function(){ declineContactLogEntry(entryId); });
    });
  });
}
/* Bascule une demande en "confirmée" : ajoute une unité au compteur
   Séjours du bandeau Mes séjours (voir loadLikesCounts()) et déclenche,
   côté serveur, l'incrément du compteur de conversion de l'annonce
   (Cloud Functions,
   syncListingContactStats — voir functions/index.js), affiché à l'hôte
   dans sa propre fiche détail. Règle Firestore : une transition à sens
   unique, pending -> confirmed uniquement (voir README), donc pas besoin
   de vérifier ici l'état courant, la règle refuse toute seconde écriture. */
function confirmContactLogEntry(entryId){
  if(!authState.uid) return;
  firebase.firestore().collection("contactLog").doc(authState.uid).collection("entries").doc(entryId)
    .update({status:"confirmed", confirmedAt: firebase.firestore.FieldValue.serverTimestamp()})
    .then(function(){ contactLogCache = null; renderContactLog(); })
    .catch(function(err){ console.error("[contactLog] échec de la confirmation", err); });
}
function declineContactLogEntry(entryId){
  if(!authState.uid) return;
  firebase.firestore().collection("contactLog").doc(authState.uid).collection("entries").doc(entryId)
    .delete()
    .then(function(){ contactLogCache = null; renderContactLog(); })
    .catch(function(err){ console.error("[contactLog] échec de la suppression", err); });
}
/* Lecture Firestore partagée entre les 3 segments de Mes séjours (le
   bandeau Favoris/Demandes/Séjours a besoin des 3 nombres à la fois, quel
   que soit celui affiché) et le corps de Demandes/Séjours lui-même — une
   seule lecture par visite de l'onglet plutôt qu'une par sous-onglet ou
   par re-rendu du bandeau. cb(err, docs). Mise en cache dans
   contactLogCache (docs Firestore bruts, pas encore filtrés/groupés) ;
   invalidée en quittant l'onglet (switchTab()) et après toute écriture
   (confirmContactLogEntry()/declineContactLogEntry()) pour ne jamais
   servir un état périmé. */
var contactLogCache = null;
function loadContactLogEntries(cb){
  if(contactLogCache){ cb(null, contactLogCache); return; }
  if(!authState.uid){ contactLogCache = []; cb(null, contactLogCache); return; }
  loadFirebaseSDK(function(){
    if(!firebase.apps.length) firebase.initializeApp(FIFTIN_FIREBASE_CONFIG);
    firebase.firestore().collection("contactLog").doc(authState.uid).collection("entries")
      .orderBy("createdAt", "desc").limit(100).get().then(function(snap){
        contactLogCache = snap.docs;
        cb(null, contactLogCache);
      }).catch(function(err){
        console.error("[contactLog] échec de la lecture", err);
        cb(err, null);
      });
  });
}
/* Corps de Demandes (state.likesView==="demandes", en cours uniquement,
   groupées par séjour visé — groupedDemandesHtml()) et de Séjours
   (state.likesView==="sejours", confirmés uniquement, liste simple) :
   même source (loadContactLogEntries()), filtrée côté client selon le
   sous-onglet actif plutôt que deux lectures Firestore séparées. */
function renderContactLog(){
  var feed = document.getElementById("feed");
  var toggle = likesViewToggleHtml();
  var wantConfirmed = state.likesView==="sejours";
  demandeSelectedId = null; // la grande vignette d'un précédent affichage ne doit pas survivre à un re-rendu (confirmation/déclin, changement d'onglet)
  if(!authState.uid){
    feed.innerHTML = toggle + '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'+
      '<p>Connectez-vous pour retrouver ici '+(wantConfirmed?"vos séjours":"l'historique de vos demandes")+'.</p></div>';
    wireLikesToggle();
    return;
  }
  feed.innerHTML = toggle + '<div class="empty-state"><p>Chargement…</p></div>';
  wireLikesToggle();
  loadContactLogEntries(function(err, docs){
    if(state.tab!=="likes" || (state.likesView!=="demandes" && state.likesView!=="sejours")) return; // a changé d'onglet pendant le chargement
    if(err){
      feed.innerHTML = toggle + '<div class="empty-state"><p>Impossible de charger '+(wantConfirmed?"vos séjours":"vos demandes")+' pour le moment.</p></div>';
      wireLikesToggle();
      return;
    }
    var filtered = docs.filter(function(d){ return (d.data().status==="confirmed")===wantConfirmed; });
    var body;
    if(!filtered.length){
      body = wantConfirmed
        ? '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'+
          '<p>Aucun séjour confirmé pour l\'instant.<br>Confirmez une demande depuis l\'onglet Demandes une fois le séjour effectué (ou prévu).</p></div>'
        : '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'+
          '<p>Aucune demande en cours pour l\'instant.<br>Elle apparaîtra ici dès que vous contacterez un hébergement.</p></div>';
    } else if(wantConfirmed){
      body = '<div class="map-selected" id="demandes-selected" hidden></div><div class="map-list">'+filtered.map(function(d){ return contactLogRowHtml(d.id, d.data()); }).join("")+'</div>';
    } else {
      body = '<div class="map-selected" id="demandes-selected" hidden></div>'+groupedDemandesHtml(filtered);
    }
    feed.innerHTML = toggle + body;
    wireLikesToggle();
    wireContactLogRows();
  });
}

/* ---------------- calendrier de disponibilité ----------------
   Deux modes, sur le même balisage (.cal/.cal-cell/.cal-legend) :
   - Démo (ci-dessous) : dates lues depuis l.avail/unit.avail (chaînes
     statiques), année fixe DEMO_YEAR — sert de premier rendu (toujours
     "pas de données" pour une vraie annonce, avail est toujours vide)
     et de repli tant qu'aucune donnée réelle n'a été publiée pour la
     chambre concernée.
   - Réelle (plus bas, realCalendarGridHtml/isDateOccupied) : bascule
     asynchrone, câblée dans wireQuickReq(), sur listings/{id}/
     publicAvail/{unitId} — une projection PUBLIQUE ne contenant que des
     plages occupées (checkIn/checkOut), republiée côté serveur par les
     Cloud Functions (functions/index.js) à partir des vraies réservations
     privées (accounts/{uid} ou listings/{id}/bookings), toutes deux
     illisibles publiquement — voir README. Vraie année/mois qui avance
     dans le temps, contrairement au mode démo qui boucle sur DEMO_YEAR. */
var MONTH_ABBR = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var MONTH_LONG = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var DEMO_YEAR = 2026;

function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoDate(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
/* Une seule chambre sur une annonce : celle à laquelle rattacher un
   calendrier réel côté fil/fiche sans onglets (où il n'y a aujourd'hui
   aucune notion de "la" chambre affichée) — sans ambiguïté puisqu'il n'y
   en a qu'une. Plusieurs chambres : aucune (voir hasTabs/activeUnit dans
   openDetail, chaque onglet a la sienne, pas de calendrier sur la vue
   d'ensemble). */
function soleUnitOf(l){
  return (l.units && l.units.length===1) ? l.units[0] : null;
}

function parseAvailStr(str){
  var m = str.match(/^(\d+)(?:\s+([a-zéû.]+))?-(\d+)\s+([a-zéû.]+)$/i);
  if(!m) return null;
  var startMonth = MONTH_ABBR.indexOf(m[2] || m[4]);
  var endMonth = MONTH_ABBR.indexOf(m[4]);
  if(startMonth===-1 || endMonth===-1) return null;
  return {start:new Date(DEMO_YEAR,startMonth,Number(m[1])), end:new Date(DEMO_YEAR,endMonth,Number(m[3]))};
}
function getAvailRanges(l){
  return (l.avail||[]).map(parseAvailStr).filter(Boolean);
}
function isDateAvailable(l, date){
  return getAvailRanges(l).some(function(r){ return date>=r.start && date<=r.end; });
}
function defaultMonthFor(l){
  var ranges = getAvailRanges(l);
  if(!ranges.length) return new Date().getMonth();
  return ranges.reduce(function(min,r){ return r.start.getMonth()<min ? r.start.getMonth() : min; }, 11);
}
function calendarGridHtml(l, monthIndex){
  var first = new Date(DEMO_YEAR, monthIndex, 1);
  var startWeekday = (first.getDay()+6)%7;
  var daysInMonth = new Date(DEMO_YEAR, monthIndex+1, 0).getDate();
  var cells = "";
  for(var i=0;i<startWeekday;i++) cells += '<span class="cal-cell empty"></span>';
  for(var d=1; d<=daysInMonth; d++){
    var avail = isDateAvailable(l, new Date(DEMO_YEAR, monthIndex, d));
    cells += '<button type="button" class="cal-cell'+(avail?' avail':'')+'" data-date="'+isoDate(DEMO_YEAR,monthIndex,d)+'"'+(avail?' data-day="'+d+'"':' disabled')+'>'+d+'</button>';
  }
  return cells;
}
/* Pas de données de disponibilité (annonce dont l'hôte n'a pas renseigné
   de créneaux, ou plusieurs chambres au niveau du fil où il n'y a pas de
   planning unique à montrer) : le calendrier ne doit pas laisser croire
   que tout est indisponible (même grisé que d'habitude) — il passe dans
   un style neutre très clair, façon "pas de données", et le message
   d'aide invite à préciser les dates soi-même. Les champs Arrivée/Départ
   juste en dessous restent inchangés dans tous les cas : c'est par eux
   que le voyageur indique ses dates pour sa demande.*/
function calendarHtml(l, monthIndex, uid){
  var noData = getAvailRanges(l).length===0;
  return '<div class="cal'+(noData?' cal-nodata':'')+'" data-cal-listing="'+uid+'" data-cal-month="'+monthIndex+'">'+
    '<div class="cal-head">'+
      '<button type="button" class="cal-nav" data-cal-nav="-1" aria-label="Mois précédent">&#8249;</button>'+
      '<span class="cal-title">'+MONTH_LONG[monthIndex]+' '+DEMO_YEAR+'</span>'+
      '<button type="button" class="cal-nav" data-cal-nav="1" aria-label="Mois suivant">&#8250;</button>'+
    '</div>'+
    '<div class="cal-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>'+
    '<div class="cal-grid">'+calendarGridHtml(l, monthIndex)+'</div>'+
    (noData
      ? '<div class="cal-legend cal-legend-nodata">Disponibilités non communiquées — précisez vos dates dans le message ci-dessous</div>'
      : '<div class="cal-legend"><span class="cal-dot avail"></span>Disponible<span class="cal-dot"></span>Indisponible</div>')+
  '</div>';
}

/* Une date est occupée si elle tombe dans [checkIn, checkOut[ d'une des
   plages publiées — même convention que app/ (activeOn() : la nuit du
   check-in compte, le jour du check-out est déjà libre). Comparaison en
   chaînes ISO (YYYY-MM-DD des deux côtés), valide sans parser de Date. */
function isDateOccupied(ranges, dateStr){
  return (ranges||[]).some(function(r){ return dateStr>=r.checkIn && dateStr<r.checkOut; });
}
function realCalendarGridHtml(year, monthIndex, ranges){
  var first = new Date(year, monthIndex, 1);
  var startWeekday = (first.getDay()+6)%7;
  var daysInMonth = new Date(year, monthIndex+1, 0).getDate();
  var todayStr = new Date().toISOString().slice(0,10);
  var cells = "";
  for(var i=0;i<startWeekday;i++) cells += '<span class="cal-cell empty"></span>';
  for(var d=1; d<=daysInMonth; d++){
    var dateStr = isoDate(year, monthIndex, d);
    var avail = dateStr>=todayStr && !isDateOccupied(ranges, dateStr);
    cells += '<button type="button" class="cal-cell'+(avail?' avail':'')+'" data-date="'+dateStr+'"'+(avail?'':' disabled')+'>'+d+'</button>';
  }
  return cells;
}

/* ---------------- quick request ---------------- */
function todayISO(off){ var d=new Date(); d.setDate(d.getDate()+off); return d.toISOString().slice(0,10); }

function quickReqHtml(l, uid, calSource){
  var qid = uid;
  calSource = calSource || l;
  return calendarHtml(calSource, defaultMonthFor(calSource), qid)+
  '<div class="qr-row">'+
    '<div class="qr-field"><label>Arrivée</label><input type="date" id="'+qid+'-in" value="'+todayISO(14)+'"></div>'+
    '<div class="qr-field"><label>Départ</label><input type="date" id="'+qid+'-out" value="'+todayISO(21)+'"></div>'+
  '</div>'+
  '<div class="qr-row">'+
    '<div class="qr-field"><label>Voyageurs</label>'+
      '<div class="stepper"><button data-step="-1" data-target="'+qid+'-g">−</button><span id="'+qid+'-g">2</span><button data-step="1" data-target="'+qid+'-g">+</button></div>'+
    '</div>'+
  '</div>'+
  '<div class="msg-preview" id="'+qid+'-preview"></div>'+
  '<div class="send-row">'+
    /* Mail en premier : seulement si l'hôte a renseigné une adresse de
       contact (hf-email, obligatoire au dépôt depuis son ajout — voir
       submitHostForm() — mais absente sur toute annonce plus ancienne
       créée avant ce champ, dégradation propre : pas de bouton plutôt
       qu'un mailto: vide). */
    (l.host.email ? '<a class="btn send-btn mail" data-send="mail" data-id="'+qid+'"><span class="send-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span><span>Mail</span></a>' : '')+
