function renderFeed(){
  var list = filteredListings();
  var feed = document.getElementById("feed");
  if(state.loading){
    feed.innerHTML = '<div class="empty-state"><p>Chargement des hébergements…</p></div>';
    return;
  }
  var toggle = state.tab==="likes" ? likesViewToggleHtml() : "";
  if(!list.length){
    if(state.tab==="likes"){
      feed.innerHTML = toggle + '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 000-7.8z"/></svg>'+
        '<p>Aucun favori enregistré pour l\'instant.<br>Touchez le cœur sur un hébergement pour le garder de côté.</p></div>';
    } else {
      feed.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'+
        '<p>Aucun hébergement ne correspond à ces filtres.<br>Essayez d\'élargir la distance ou le budget.</p></div>';
    }
    if(state.tab==="likes"){ wireLikesToggle(); loadLikesCounts(); }
    return;
  }
  feed.innerHTML = toggle + list.map(function(l){
    return '<article class="card" id="card-'+l.id+'">'+coverHtml(l)+
      '<div class="qr-panel" id="qr-'+l.id+'" hidden>'+quickReqHtml(l, "qr"+l.id)+'</div>'+
    '</article>';
  }).join("");
  if(state.tab==="likes"){ wireLikesToggle(); loadLikesCounts(); }
  wireFeedEvents();
}

function wireFeedEvents(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-cc]"), function(cc){
    var dots = cc.parentElement.querySelector(".cover-dots");
    if(!dots) return;
    var dotEls = dots.children;
    cc.addEventListener("scroll", function(){
      var idx = Math.round(cc.scrollLeft / cc.clientWidth);
      Array.prototype.forEach.call(dotEls, function(d,i){ d.classList.toggle("on", i===idx); });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-like]"), function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var id = Number(el.getAttribute("data-like"));
      var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
      if(!l) return;
      toggleLike(l);
      // state.tab==="map" : la carte sélectionnée sous la carte réutilise
      // ce même markup (voir renderMapSelectedCard) — un renderFeed() ici
      // écraserait la vue carte par le fil normal. refreshCurrentView()
      // choisit le bon rafraîchissement selon l'onglet actif.
      refreshCurrentView(); renderLikeBadge();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-share]"), function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var id = Number(el.getAttribute("data-share"));
      var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
      if(l) shareListing(l);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function(el){
    el.addEventListener("click", function(){ openDetail(Number(el.getAttribute("data-open"))); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-quickreq]"), function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-quickreq");
      var panel = document.getElementById("qr-"+id);
      panel.hidden = !panel.hidden;
      var qrl = LISTINGS.filter(function(x){ return x.id===Number(id); })[0];
      wireQuickReq(Number(id), "qr"+id, qrl ? soleUnitOf(qrl) : null);
    });
  });
}

/* ---------------- Mes séjours : sous-onglets Favoris / Demandes / Séjours ----------------
   Les trois regroupés ici parce que ce sont les seules listes propres au
   compte du voyageur (par opposition au fil, qui montre les annonces de
   tout le monde) : Favoris (state.liked), Demandes en cours et Séjours
   confirmés (les deux derniers tirés de contactLog, voir logContact()).
   Rendu comme un bandeau à 3 segments en tête de #feed, dans
   renderFeed()/renderContactLog() plutôt que comme un élément fixe séparé.
   Chaque segment réutilise .stat-tile (voir CSS, "dans le style de la vue
   profil" — demande explicite) : Favoris est synchrone (state.liked.length,
   déjà en mémoire) ; Demandes/Séjours viennent d'une lecture Firestore
   partagée (loadContactLogEntries()/contactLogCache) — "…" tant qu'elle
   n'a pas répondu, patché ensuite par loadLikesCounts() sans devoir
   attendre pour afficher Favoris. */
function contactLogCounts(docs){
  var enCours = 0, confirmed = 0;
  docs.forEach(function(d){ if(d.data().status==="confirmed") confirmed++; else enCours++; });
  return {enCours:enCours, confirmed:confirmed};
}
function likesViewToggleHtml(){
  var loaded = !authState.uid || contactLogCache!=null;
  var counts = loaded && authState.uid ? contactLogCounts(contactLogCache) : {enCours:0, confirmed:0};
  return '<div class="profile-stats">'+
    '<button type="button" class="stat-tile'+(state.likesView==="favoris"?" active":"")+'" data-likes-view="favoris"><b>'+state.liked.length+'</b><span>Favoris</span></button>'+
    '<button type="button" class="stat-tile'+(state.likesView==="demandes"?" active":"")+'" data-likes-view="demandes"><b id="stat-count-demandes">'+(loaded?counts.enCours:"…")+'</b><span>Demandes</span></button>'+
    '<button type="button" class="stat-tile'+(state.likesView==="sejours"?" active":"")+'" data-likes-view="sejours"><b id="stat-count-sejours">'+(loaded?counts.confirmed:"…")+'</b><span>Séjours</span></button>'+
  '</div>';
}
function wireLikesToggle(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-likes-view]"), function(btn){
    btn.addEventListener("click", function(){
      state.likesView = btn.getAttribute("data-likes-view");
      refreshLikesChrome();
    });
  });
}
/* Patch les deux compteurs de droite une fois la lecture Firestore
   revenue — ne fait rien si déjà en cache (déjà rendus avec les vrais
   nombres par likesViewToggleHtml()) ni si non connecté (0/0 déjà
   rendus, pas de lecture possible sans compte). En cas d'échec, laisse
   "…" plutôt que d'afficher un faux 0 — l'erreur est déjà journalisée
   par loadContactLogEntries(). */
function loadLikesCounts(){
  if(!authState.uid || contactLogCache) return;
  loadContactLogEntries(function(err, docs){
    if(err) return;
    var counts = contactLogCounts(docs);
    var elD = document.getElementById("stat-count-demandes");
    var elS = document.getElementById("stat-count-sejours");
    if(elD) elD.textContent = String(counts.enCours);
    if(elS) elS.textContent = String(counts.confirmed);
  });
}
/* Filtres Lieu/Distance/Prix/Prestations/Trier et compteur "X hébergements
   trouvés" masqués sur TOUTE la vue Mes séjours (Favoris compris — retour
   utilisateur), pas seulement Demandes/Séjours comme avant : un filtre
   resté actif depuis Explorer, invisible ici, pourrait sinon faire
   disparaître un favori sans aucun moyen de comprendre pourquoi (voir
   filteredListings(), qui ignore désormais state.filters/state.sort sur
   cette vue pour la même raison). Appelée à la fois par switchTab()
   (première entrée sur l'onglet) et par le clic sur le bandeau. */
function refreshLikesChrome(){
  var filterBar = document.getElementById("filter-bar");
  var resultLine = document.getElementById("result-line");
  var hideChrome = state.tab==="likes";
  filterBar.classList.toggle("chrome-collapsed", hideChrome);
  resultLine.classList.toggle("chrome-collapsed", hideChrome);
  renderTabContent();
  if(!hideChrome) renderResultLine();
}

/* Plus qu'un libellé texte : la vignette photo de l'annonce a remplacé
   l'icône colorée par canal dans contactLogRowHtml() (voir CSS .sw) —
   les pictogrammes SVG par canal, devenus inutiles ici, restaient
   définis ailleurs dans le fichier (panneau de demande rapide, .send-btn). */
var CONTACT_CHANNEL_META = {
  mail: {label:"Mail"}, wa: {label:"WhatsApp"}, sms: {label:"SMS"}, call: {label:"Appeler"}
};
function fmtContactDate(ts){
  if(!ts) return "";
  var d = typeof ts.toDate==="function" ? ts.toDate() : new Date(ts);
  if(isNaN(d.getTime())) return "";
  var mois = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  var hh = ("0"+d.getHours()).slice(-2), mm = ("0"+d.getMinutes()).slice(-2);
  return d.getDate()+" "+mois[d.getMonth()]+" "+d.getFullYear()+" · "+hh+":"+mm;
}
/* Un séjour demandé (checkIn/checkOut, capturés au clic — voir logContact())
   regroupé sous un même intitulé, même si plusieurs annonces différentes
   ont été contactées pour ces mêmes dates — voir groupedDemandesHtml().
   fmtDate() (déjà utilisé pour le message pré-rempli) inclut le mois,
   donc un intervalle à cheval sur deux mois reste lisible. */
function stayPeriodLabel(checkIn, checkOut){
  if(!checkIn || !checkOut) return "Dates non précisées";
  var year = new Date(checkOut+"T00:00:00").getFullYear();
  return "Séjour du "+fmtDate(checkIn)+" au "+fmtDate(checkOut)+" "+year;
}
/* Réutilise EXACTEMENT le principe visuel de .map-list-item de la carte
   (vignette photo + nom + région/prix, voir renderMapList()) — seule
   différence demandée : une 3e ligne (moyen de contact + date/heure du
   clic). .map-list-item span est en display:block (voir CSS) pour que ces
   deux sous-lignes s'empilent au lieu de se suivre côte à côte.
   Le clic "dérouler l'annonce" (.log-body) n'ouvre plus directement la
   fiche détail : il affiche la grande vignette juste au-dessus de la
   liste (selectDemandeListing(), même mécanisme que le clic sur un item
   de liste dans l'onglet Carte, voir selectMapListing()) — depuis cette
   grande vignette, "Voir plus" mène à la fiche détail complète. Reste
   inerte (pas de data-open-log) si l'annonce visée n'est plus chargée
   dans LISTINGS (supprimée, ou pas encore chargée). Une fois confirmée
   (entry.status==="confirmed", voir confirmContactLogEntry()), les deux
   boutons d'action disparaissent : il n'y a plus rien à décider ici. */
function contactLogRowHtml(entryId, entry){
  var meta = CONTACT_CHANNEL_META[entry.channel] || CONTACT_CHANNEL_META.mail;
  var numericId = entry.listingId ? idFromString(entry.listingId) : null;
  var l = numericId!=null ? LISTINGS.filter(function(x){ return x.id===numericId; })[0] : null;
  var confirmed = entry.status === "confirmed";
  var thumb = l ? listingThumbUrl(l) : null;
  var swHtml = thumb ? '<img class="sw" src="'+thumb+'" alt="" loading="lazy">'
    : '<div class="sw" style="background:'+(l ? GRADIENTS[l.grad] : "var(--cream-deep)")+'"></div>';
  var subLine = l ? (l.region+' · '+listingPriceLabel(l)) : "";
  return '<div class="map-list-item demande-row">'+
    '<div class="log-body"'+(l?' data-open-log="'+numericId+'"':'')+'>'+
      swHtml+
      '<div><b>'+esc(entry.listingName||"Annonce")+'</b>'+
        (subLine ? '<span>'+esc(subLine)+'</span>' : '')+
        '<span>'+meta.label+' · '+fmtContactDate(entry.createdAt)+(confirmed?' · Séjour confirmé':'')+'</span>'+
      '</div>'+
    '</div>'+
    (confirmed ? '' :
      '<div class="log-actions">'+
        '<button type="button" class="log-action confirm" data-log-confirm="'+esc(entryId)+'" aria-label="Confirmer le séjour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7"/></svg></button>'+
        '<button type="button" class="log-action decline" data-log-decline="'+esc(entryId)+'" aria-label="Supprimer cette demande"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
      '</div>'
    )+
  '</div>';
}
/* Groupe les demandes en cours par séjour visé (mêmes checkIn/checkOut —
   voir stayPeriodLabel()), dans l'ordre où elles apparaissent (docs déjà
   triés par createdAt décroissant, donc les groupes les plus récemment
   actifs remontent naturellement en premier). Ne reçoit plus que des
   demandes en cours : les confirmées vivent désormais dans leur propre
   sous-onglet Séjours (voir renderContactLog()), plus la peine de les
   séparer ici — pas de "En cours"/"Séjours confirmés" en tête non plus,
   redondant avec l'onglet où l'on se trouve déjà. */
function groupedDemandesHtml(pendingDocs){
  var order = [], byKey = {};
  pendingDocs.forEach(function(d){
    var e = d.data();
    var key = (e.checkIn||"?")+"_"+(e.checkOut||"?");
    if(!byKey[key]){ byKey[key] = {checkIn:e.checkIn, checkOut:e.checkOut, docs:[]}; order.push(byKey[key]); }
    byKey[key].docs.push(d);
  });
  return order.map(function(g, i){
    return '<div class="log-period-label"'+(i===0?' style="margin-top:0;"':'')+'>'+esc(stayPeriodLabel(g.checkIn, g.checkOut))+'</div>'+
      '<div class="map-list">'+g.docs.map(function(d){ return contactLogRowHtml(d.id, d.data()); }).join("")+'</div>';
  }).join("");
}
/* Grande vignette d'une demande (même mécanisme que selectMapListing() sur
   la carte, délibérément dupliqué plutôt que factorisé : les deux gardent
   leur propre variable d'état — mapSelectedId / demandeSelectedId — sans
   rapport l'une avec l'autre, deux onglets différents). "Voir plus" sur
   cette grande carte (déjà câblé par wireFeedEvents(), voir data-open)
   mène à la fiche détail complète. */
var demandeSelectedId = null;
function selectDemandeListing(id){
  demandeSelectedId = id;
  renderDemandeSelectedCard();
  var container = document.getElementById("demandes-selected");
  if(container) container.scrollIntoView({behavior:"smooth", block:"nearest"});
}
function renderDemandeSelectedCard(){
  var container = document.getElementById("demandes-selected");
  if(!container) return;
  var l = demandeSelectedId!=null ? LISTINGS.filter(function(x){ return x.id===demandeSelectedId; })[0] : null;
  if(!l){
    demandeSelectedId = null;
    container.hidden = true; container.innerHTML = "";
    return;
  }
  container.hidden = false;
  container.innerHTML = '<article class="card" id="card-'+l.id+'">'+coverHtml(l)+
    '<div class="qr-panel" id="qr-'+l.id+'" hidden>'+quickReqHtml(l, "qr"+l.id)+'</div>'+
  '</article>';
  wireFeedEvents();
}
function wireContactLogRows(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-open-log]"), function(el){
    el.addEventListener("click", function(){ selectDemandeListing(Number(el.getAttribute("data-open-log"))); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-log-confirm]"), function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var entryId = el.getAttribute("data-log-confirm");
      openConfirmSheet("Ce séjour a bien eu lieu, ou aura lieu ?", "Oui, confirmer", "Non, revenir en arrière", function(){ confirmContactLogEntry(entryId); });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-log-decline]"), function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var entryId = el.getAttribute("data-log-decline");
      openConfirmSheet("Cette demande n'a pas donné suite. Supprimer ?", "Oui, supprimer", "Non, garder l'annonce", function(){ declineContactLogEntry(entryId); });
    });
  });
}
/* Bascule une demande en "confirmée" : ajoute une unité au compteur
   Séjours du bandeau Mes séjours (voir loadLikesCounts()) et déclenche,
   côté serveur, l'incrément du compteur de conversion de l'annonce
   (Cloud Functions,
   syncListingContactStats — voir functions/index.js), affiché à l'hôte
   dans sa propre fiche détail. Règle Firestore : une transition à sens
   unique, pending -> confirmed uniquement (voir README), donc pas besoin
   de vérifier ici l'état courant, la règle refuse toute seconde écriture. */
function confirmContactLogEntry(entryId){
  if(!authState.uid) return;
  firebase.firestore().collection("contactLog").doc(authState.uid).collection("entries").doc(entryId)
    .update({status:"confirmed", confirmedAt: firebase.firestore.FieldValue.serverTimestamp()})
    .then(function(){ contactLogCache = null; renderContactLog(); })
    .catch(function(err){ console.error("[contactLog] échec de la confirmation", err); });
}
function declineContactLogEntry(entryId){
  if(!authState.uid) return;
  firebase.firestore().collection("contactLog").doc(authState.uid).collection("entries").doc(entryId)
    .delete()
    .then(function(){ contactLogCache = null; renderContactLog(); })
    .catch(function(err){ console.error("[contactLog] échec de la suppression", err); });
}
/* Lecture Firestore partagée entre les 3 segments de Mes séjours (le
   bandeau Favoris/Demandes/Séjours a besoin des 3 nombres à la fois, quel
   que soit celui affiché) et le corps de Demandes/Séjours lui-même — une
   seule lecture par visite de l'onglet plutôt qu'une par sous-onglet ou
   par re-rendu du bandeau. cb(err, docs). Mise en cache dans
   contactLogCache (docs Firestore bruts, pas encore filtrés/groupés) ;
   invalidée en quittant l'onglet (switchTab()) et après toute écriture
   (confirmContactLogEntry()/declineContactLogEntry()) pour ne jamais
   servir un état périmé. */
var contactLogCache = null;
function loadContactLogEntries(cb){
  if(contactLogCache){ cb(null, contactLogCache); return; }
  if(!authState.uid){ contactLogCache = []; cb(null, contactLogCache); return; }
  loadFirebaseSDK(function(){
    if(!firebase.apps.length) firebase.initializeApp(FIFTIN_FIREBASE_CONFIG);
    firebase.firestore().collection("contactLog").doc(authState.uid).collection("entries")
      .orderBy("createdAt", "desc").limit(100).get().then(function(snap){
        contactLogCache = snap.docs;
        cb(null, contactLogCache);
      }).catch(function(err){
        console.error("[contactLog] échec de la lecture", err);
        cb(err, null);
      });
  });
}
/* Corps de Demandes (state.likesView==="demandes", en cours uniquement,
   groupées par séjour visé — groupedDemandesHtml()) et de Séjours
   (state.likesView==="sejours", confirmés uniquement, liste simple) :
   même source (loadContactLogEntries()), filtrée côté client selon le
   sous-onglet actif plutôt que deux lectures Firestore séparées. */
function renderContactLog(){
  var feed = document.getElementById("feed");
  var toggle = likesViewToggleHtml();
  var wantConfirmed = state.likesView==="sejours";
  demandeSelectedId = null; // la grande vignette d'un précédent affichage ne doit pas survivre à un re-rendu (confirmation/déclin, changement d'onglet)
  if(!authState.uid){
    feed.innerHTML = toggle + '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'+
      '<p>Connectez-vous pour retrouver ici '+(wantConfirmed?"vos séjours":"l'historique de vos demandes")+'.</p></div>';
    wireLikesToggle();
    return;
  }
  feed.innerHTML = toggle + '<div class="empty-state"><p>Chargement…</p></div>';
  wireLikesToggle();
  loadContactLogEntries(function(err, docs){
    if(state.tab!=="likes" || (state.likesView!=="demandes" && state.likesView!=="sejours")) return; // a changé d'onglet pendant le chargement
    if(err){
      feed.innerHTML = toggle + '<div class="empty-state"><p>Impossible de charger '+(wantConfirmed?"vos séjours":"vos demandes")+' pour le moment.</p></div>';
      wireLikesToggle();
      return;
    }
    var filtered = docs.filter(function(d){ return (d.data().status==="confirmed")===wantConfirmed; });
    var body;
    if(!filtered.length){
      body = wantConfirmed
        ? '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'+
          '<p>Aucun séjour confirmé pour l\'instant.<br>Confirmez une demande depuis l\'onglet Demandes une fois le séjour effectué (ou prévu).</p></div>'
        : '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'+
          '<p>Aucune demande en cours pour l\'instant.<br>Elle apparaîtra ici dès que vous contacterez un hébergement.</p></div>';
    } else if(wantConfirmed){
      body = '<div class="map-selected" id="demandes-selected" hidden></div><div class="map-list">'+filtered.map(function(d){ return contactLogRowHtml(d.id, d.data()); }).join("")+'</div>';
    } else {
      body = '<div class="map-selected" id="demandes-selected" hidden></div>'+groupedDemandesHtml(filtered);
    }
    feed.innerHTML = toggle + body;
    wireLikesToggle();
    wireContactLogRows();
  });
  loadLikesCounts();
}

/* ---------------- calendrier de disponibilité ----------------
   Deux modes, sur le même balisage (.cal/.cal-cell/.cal-legend) :
   - Démo (ci-dessous) : dates lues depuis l.avail/unit.avail (chaînes
     statiques), année fixe DEMO_YEAR — sert de premier rendu (toujours
     "pas de données" pour une vraie annonce, avail est toujours vide)
     et de repli tant qu'aucune donnée réelle n'a été publiée pour la
     chambre concernée.
   - Réelle (plus bas, realCalendarGridHtml/isDateOccupied) : bascule
     asynchrone, câblée dans wireQuickReq(), sur listings/{id}/
     publicAvail/{unitId} — une projection PUBLIQUE ne contenant que des
     plages occupées (checkIn/checkOut), republiée côté serveur par les
     Cloud Functions (functions/index.js) à partir des vraies réservations
     privées (accounts/{uid} ou listings/{id}/bookings), toutes deux
     illisibles publiquement — voir README. Vraie année/mois qui avance
     dans le temps, contrairement au mode démo qui boucle sur DEMO_YEAR. */
var MONTH_ABBR = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var MONTH_LONG = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var DEMO_YEAR = 2026;

function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoDate(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
/* Une seule chambre sur une annonce : celle à laquelle rattacher un
   calendrier réel côté fil/fiche sans onglets (où il n'y a aujourd'hui
   aucune notion de "la" chambre affichée) — sans ambiguïté puisqu'il n'y
   en a qu'une. Plusieurs chambres : aucune (voir hasTabs/activeUnit dans
   openDetail, chaque onglet a la sienne, pas de calendrier sur la vue
   d'ensemble). */
function soleUnitOf(l){
  return (l.units && l.units.length===1) ? l.units[0] : null;
}

function parseAvailStr(str){
  var m = str.match(/^(\d+)(?:\s+([a-zéû.]+))?-(\d+)\s+([a-zéû.]+)$/i);
  if(!m) return null;
  var startMonth = MONTH_ABBR.indexOf(m[2] || m[4]);
  var endMonth = MONTH_ABBR.indexOf(m[4]);
  if(startMonth===-1 || endMonth===-1) return null;
  return {start:new Date(DEMO_YEAR,startMonth,Number(m[1])), end:new Date(DEMO_YEAR,endMonth,Number(m[3]))};
}
function getAvailRanges(l){
  return (l.avail||[]).map(parseAvailStr).filter(Boolean);
}
function isDateAvailable(l, date){
  return getAvailRanges(l).some(function(r){ return date>=r.start && date<=r.end; });
}
function defaultMonthFor(l){
  var ranges = getAvailRanges(l);
  if(!ranges.length) return new Date().getMonth();
  return ranges.reduce(function(min,r){ return r.start.getMonth()<min ? r.start.getMonth() : min; }, 11);
}
function calendarGridHtml(l, monthIndex){
  var first = new Date(DEMO_YEAR, monthIndex, 1);
  var startWeekday = (first.getDay()+6)%7;
  var daysInMonth = new Date(DEMO_YEAR, monthIndex+1, 0).getDate();
  var cells = "";
  for(var i=0;i<startWeekday;i++) cells += '<span class="cal-cell empty"></span>';
  for(var d=1; d<=daysInMonth; d++){
    var avail = isDateAvailable(l, new Date(DEMO_YEAR, monthIndex, d));
    cells += '<button type="button" class="cal-cell'+(avail?' avail':'')+'" data-date="'+isoDate(DEMO_YEAR,monthIndex,d)+'"'+(avail?' data-day="'+d+'"':' disabled')+'>'+d+'</button>';
  }
  return cells;
}
/* Pas de données de disponibilité (annonce dont l'hôte n'a pas renseigné
   de créneaux, ou plusieurs chambres au niveau du fil où il n'y a pas de
   planning unique à montrer) : le calendrier ne doit pas laisser croire
   que tout est indisponible (même grisé que d'habitude) — il passe dans
   un style neutre très clair, façon "pas de données", et le message
   d'aide invite à préciser les dates soi-même. Les champs Arrivée/Départ
   juste en dessous restent inchangés dans tous les cas : c'est par eux
   que le voyageur indique ses dates pour sa demande.*/
function calendarHtml(l, monthIndex, uid){
  var noData = getAvailRanges(l).length===0;
  return '<div class="cal'+(noData?' cal-nodata':'')+'" data-cal-listing="'+uid+'" data-cal-month="'+monthIndex+'">'+
    '<div class="cal-head">'+
      '<button type="button" class="cal-nav" data-cal-nav="-1" aria-label="Mois précédent">&#8249;</button>'+
      '<span class="cal-title">'+MONTH_LONG[monthIndex]+' '+DEMO_YEAR+'</span>'+
      '<button type="button" class="cal-nav" data-cal-nav="1" aria-label="Mois suivant">&#8250;</button>'+
    '</div>'+
    '<div class="cal-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>'+
    '<div class="cal-grid">'+calendarGridHtml(l, monthIndex)+'</div>'+
    (noData
      ? '<div class="cal-legend cal-legend-nodata">Disponibilités non communiquées — précisez vos dates dans le message ci-dessous</div>'
      : '<div class="cal-legend"><span class="cal-dot avail"></span>Disponible<span class="cal-dot"></span>Indisponible</div>')+
  '</div>';
}

/* Une date est occupée si elle tombe dans [checkIn, checkOut[ d'une des
   plages publiées — même convention que app/ (activeOn() : la nuit du
   check-in compte, le jour du check-out est déjà libre). Comparaison en
   chaînes ISO (YYYY-MM-DD des deux côtés), valide sans parser de Date. */
function isDateOccupied(ranges, dateStr){
  return (ranges||[]).some(function(r){ return dateStr>=r.checkIn && dateStr<r.checkOut; });
}
function realCalendarGridHtml(year, monthIndex, ranges){
  var first = new Date(year, monthIndex, 1);
  var startWeekday = (first.getDay()+6)%7;
  var daysInMonth = new Date(year, monthIndex+1, 0).getDate();
  var todayStr = new Date().toISOString().slice(0,10);
  var cells = "";
  for(var i=0;i<startWeekday;i++) cells += '<span class="cal-cell empty"></span>';
  for(var d=1; d<=daysInMonth; d++){
    var dateStr = isoDate(year, monthIndex, d);
    var avail = dateStr>=todayStr && !isDateOccupied(ranges, dateStr);
    cells += '<button type="button" class="cal-cell'+(avail?' avail':'')+'" data-date="'+dateStr+'"'+(avail?'':' disabled')+'>'+d+'</button>';
  }
  return cells;
}

/* ---------------- quick request ---------------- */

    (l.host.email ? '<a class="btn send-btn mail" data-send="mail" data-id="'+qid+'"><span class="send-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span><span>Mail</span></a>' : '')+

    '<a class="btn send-btn call" data-send="call" data-id="'+qid+'"><span class="send-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h3l2 5-2.5 1.5a11 11 0 005 5L15 12l5 2v3a2 2 0 01-2 2A16 16 0 016 5a2 2 0 012-2z"/></svg></span><span>Appeler</span></a>'+

function buildMessage(l, din, dout, guests, unitName){
  var label = unitName ? (l.name+" – "+unitName) : l.name;
  return "Bonjour "+l.host.name+", je suis intéressé·e par \""+label+"\" ("+l.region+") du "+fmtDate(din)+" au "+fmtDate(dout)+" pour "+guests+" voyageur"+(guests>1?"s":"")+". Ce logement est-il disponible sur ces dates ? Merci ! — via Fiftin";
}
/* wa.me exige un numéro en format international complet, chiffres purs
   (aucun espace/point/tiret/parenthèse, pas de "+") — contrairement à
   tel:/sms:, que l'appli Téléphone/Messages du système sait lire même mal
   formatés (espaces compris), donc jamais retouchés ici. hf-phone est un
   simple champ texte (placeholder "+33…"), rien n'empêche l'hôte de taper
   des espaces ("+33 6 12 34 56 78") ou le format local à 10 chiffres
   ("06 12 34 56 78") — les deux cassaient silencieusement le lien
   WhatsApp (retour utilisateur : "les liens ne fonctionnent pas"). Ne
   traite que le cas français (0X -> 33X) : seul pays couvert par l'appli
   aujourd'hui (FR_REGIONS, DEFAULT_ORIGIN). */
function waPhoneDigits(phone){
  var digits = String(phone||"").replace(/[^\d+]/g, "");
  if(digits.charAt(0)==="+") digits = digits.slice(1);
  else if(digits.charAt(0)==="0") digits = "33"+digits.slice(1);
  /* "+33 (0)6 12 34 56 78" (le "0" de liaison, écrit entre parenthèses pour
     rappeler comment composer depuis la France) ne laisse ici que les
     chiffres : 330612345678 — un "0" ne peut jamais légitimement suivre
     l'indicatif 33 dans un vrai numéro français (un numéro français
     commence toujours par 1-9 après le 0 initial), donc "330" en tête ne
     peut être que cet artefact à retirer. */
  if(digits.slice(0,3)==="330") digits = "33"+digits.slice(3);
  return digits;
}
function fmtDate(iso){
  var d = new Date(iso+"T00:00:00");
  var mois = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  return d.getDate()+" "+mois[d.getMonth()];
}

function wireQuickReq(id, uid, unit){
  var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
  var calSource = unit ? {avail: unit.avail||[]} : l;
  var qid = uid;
  var $in = document.getElementById(qid+"-in"), $out = document.getElementById(qid+"-out"), $g = document.getElementById(qid+"-g");
  var $prev = document.getElementById(qid+"-preview");
  var $mailBtn = document.querySelector('[data-send="mail"][data-id="'+qid+'"]');
  var $waBtn = document.querySelector('[data-send="wa"][data-id="'+qid+'"]');
  var $smsBtn = document.querySelector('[data-send="sms"][data-id="'+qid+'"]');
  var $callBtn = document.querySelector('[data-send="call"][data-id="'+qid+'"]');

  function update(){
    var guests = Number($g.textContent);
    var msg = buildMessage(l, $in.value, $out.value, guests, unit && unit.name);
    $prev.textContent = msg;
    var phone = waPhoneDigits(l.host.phone);
    /* $mailBtn absent si l.host.email n'existe pas (voir quickReqHtml()) :
       pas de bouton rendu, rien à câbler. */
    if($mailBtn) $mailBtn.href = "mailto:"+l.host.email+"?subject="+encodeURIComponent("Demande de séjour — "+l.name)+"&body="+encodeURIComponent(msg);
    $waBtn.href = "https://wa.me/"+phone+"?text="+encodeURIComponent(msg);
    $smsBtn.href = "sms:"+l.host.phone+(/iPhone|iPad|iPod/.test(navigator.userAgent)? "&":"?") +"body="+encodeURIComponent(msg);
    $callBtn.href = "tel:"+l.host.phone;
  }
  /* wireFeedEvents() rappelle wireQuickReq() à CHAQUE ouverture/fermeture
     du panneau (voir [data-quickreq] plus haut), pas seulement à son
     premier rendu — sans cette garde, les écouteurs ci-dessous (boutons
     d'envoi, dates, stepper, calendrier) s'empilaient à chaque
     réouverture : un panneau rouvert 3 fois écrivait alors 3 fois dans
     contactLog pour un seul clic sur WhatsApp. Latent depuis toujours
     (update() réécrit juste les mêmes liens, inoffensif), rendu réel par
     logContact(). $prev.dataset.wired marque un panneau déjà câblé —
     update() continue de tourner à chaque appel (gratuit, garde le
     message/les liens à jour), seuls les addEventListener ne le sont
     qu'une fois par panneau (réinitialisé automatiquement si le panneau
     est re-rendu ailleurs, ex. selectMapListing()/selectDemandeListing()
     : c'est alors un nouveau nœud DOM, sans le flag). */
  if($prev.dataset.wired){ update(); return; }
  $prev.dataset.wired = "1";
  /* Historique perso du voyageur (voir logContact()) : câblé sur le clic
     réel des boutons d'envoi, pas sur update() — un seul enregistrement
     par contact effectivement initié, pas à chaque frappe dans le
     formulaire (qui appelle update() en continu). */
  var unitName = unit && unit.name;
  /* datesTouched : distingue une date réellement choisie (champ modifié,
     ou jour du calendrier cliqué — voir wireCalDays() plus bas) d'une
     date simplement pré-remplie par défaut (todayISO(14)/todayISO(21),
     voir quickReqHtml()) que le voyageur n'a jamais regardée. Sans cette
     distinction, TOUT contact — même "j'appelle sans avoir touché aux
     dates" — se classait dans Demandes sous un intitulé de séjour
     précis mais fictif ("Séjour du 10 au 17 oct."), qui n'a jamais
     reflété une intention réelle. Non touché -> checkIn/checkOut null,
     et la ligne retombe sur "Dates non précisées" (déjà géré par
     stayPeriodLabel(), jusqu'ici du code mort puisque les champs étaient
     toujours renseignés). */
  var datesTouched = false;
  if($mailBtn) $mailBtn.addEventListener("click", function(){ logContact(l, "mail", unitName, datesTouched?$in.value:null, datesTouched?$out.value:null); });
  $waBtn.addEventListener("click", function(){ logContact(l, "wa", unitName, datesTouched?$in.value:null, datesTouched?$out.value:null); });
  $smsBtn.addEventListener("click", function(){ logContact(l, "sms", unitName, datesTouched?$in.value:null, datesTouched?$out.value:null); });
  $callBtn.addEventListener("click", function(){ logContact(l, "call", unitName, datesTouched?$in.value:null, datesTouched?$out.value:null); });
  $in.addEventListener("change", function(){ datesTouched = true; update(); });
  $out.addEventListener("change", function(){ datesTouched = true; update(); });
  Array.prototype.forEach.call(document.querySelectorAll('.stepper button[data-target="'+qid+'-g"]'), function(btn){
    btn.addEventListener("click", function(){
      var v = Number($g.textContent) + Number(btn.getAttribute("data-step"));
      if(v<1) v=1; if(v>12) v=12;
      $g.textContent = v; update();
    });
  });

  var $cal = document.querySelector('[data-cal-listing="'+qid+'"]');
  /* data-date (ISO complet) plutôt que reconstruire depuis data-day+mois :
     commun aux deux modes (démo comme réel, voir calendarGridHtml/
     realCalendarGridHtml), donc pas besoin de savoir dans lequel on est. */
  function wireCalDays(){
    Array.prototype.forEach.call($cal.querySelectorAll(".cal-cell.avail"), function(cell){
      cell.addEventListener("click", function(){
        var start = new Date(cell.getAttribute("data-date")+"T00:00:00");
        var end = new Date(start.getTime()); end.setDate(end.getDate()+7);
        $in.value = start.toISOString().slice(0,10);
        $out.value = end.toISOString().slice(0,10);
        Array.prototype.forEach.call($cal.querySelectorAll(".cal-cell.selected"), function(c){ c.classList.remove("selected"); });
        cell.classList.add("selected");
        datesTouched = true;
        update();
      });
    });
  }
  function renderCal(monthIndex){
    $cal.setAttribute("data-cal-month", monthIndex);
    $cal.querySelector(".cal-title").textContent = MONTH_LONG[monthIndex]+" "+DEMO_YEAR;
    $cal.querySelector(".cal-grid").innerHTML = calendarGridHtml(calSource, monthIndex);
    wireCalDays();
  }
  if($cal){
    Array.prototype.forEach.call($cal.querySelectorAll("[data-cal-nav]"), function(btn){
      btn.addEventListener("click", function(){
        var cur = Number($cal.getAttribute("data-cal-month"));
        var next = cur + Number(btn.getAttribute("data-cal-nav"));
        if(next<0) next = 11; if(next>11) next = 0;
        renderCal(next);
      });
    });
    wireCalDays();

    /* Bascule vers le mode réel dès qu'une projection publique existe pour
       CETTE chambre (listings/{id}/publicAvail/{unitId}, voir plus haut et
       functions/index.js) — lecture publique, aucune connexion requise.
       Si le document n'existe pas encore (jamais synchronisé), on reste
       simplement en mode démo/"pas de données" tel quel : dégradation
       propre, rien ne casse pour les annonces pas encore concernées. */
    if(unit && unit.id && l.docId && typeof firebase!=="undefined" && firebase.apps && firebase.apps.length){
      firebase.firestore().collection("listings").doc(l.docId).collection("publicAvail").doc(unit.id).get().then(function(doc){
        if(!doc.exists) return;
        var ranges = doc.data().ranges || [];
        var today = new Date();
        var realYear = today.getFullYear(), realMonth = today.getMonth();

        function renderRealMonth(y, m){
          $cal.classList.remove("cal-nodata");
          $cal.setAttribute("data-cal-year", y);
          $cal.setAttribute("data-cal-month", m);
          $cal.querySelector(".cal-title").textContent = MONTH_LONG[m]+" "+y;
          $cal.querySelector(".cal-grid").innerHTML = realCalendarGridHtml(y, m, ranges);
          $cal.querySelector(".cal-legend").outerHTML =
            '<div class="cal-legend"><span class="cal-dot avail"></span>Disponible<span class="cal-dot"></span>Indisponible</div>';
          wireCalDays();
        }
        // Remplace la navigation démo (bouclée sur DEMO_YEAR) par une
        // navigation temporelle réelle — cloner/remplacer les boutons
        // détache proprement les anciens écouteurs (mode démo) pour ne
        // pas les cumuler avec les nouveaux.
        Array.prototype.forEach.call($cal.querySelectorAll("[data-cal-nav]"), function(btn){
          btn.parentNode.replaceChild(btn.cloneNode(true), btn);
        });
        Array.prototype.forEach.call($cal.querySelectorAll("[data-cal-nav]"), function(btn){
          btn.addEventListener("click", function(){
            var y = Number($cal.getAttribute("data-cal-year")), m = Number($cal.getAttribute("data-cal-month"));
            m += Number(btn.getAttribute("data-cal-nav"));
            if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
            renderRealMonth(y, m);
          });
        });
        renderRealMonth(realYear, realMonth);
      }).catch(function(){ /* silencieux : reste en mode démo/"pas de données" */ });
    }
  }
  update();
}

function unitCardHtml(u, selectable){

  var tag = selectable ? 'button type="button" data-select-unit="'+esc(u.id)+'"' : 'div';
  var closeTag = selectable ? 'button' : 'div';

    '<div class="unit-thumb">'+img+'</div>'+

}

/* ---------------- detail sheet ---------------- */
/* Annonce à plusieurs chambres (hasTabs) : sous-onglets au niveau du titre
   ("Vue d'ensemble" + une par chambre) — 1 clic pour voir les photos, les
   infos et le calendrier propres à une chambre, ou pour revenir à la vue
   d'ensemble. state.detailTab retient l'onglet actif tant qu'on reste sur
   la même annonce (state.detailListingId) ; ouvrir une AUTRE annonce
   retombe sur "Vue d'ensemble". Comportement strictement inchangé pour une
   annonce sans plusieurs chambres (0 ou 1) : même code qu'avant. */
function openDetail(id){
  var l = LISTINGS.filter(function(x){ return x.id===id; })[0];
  var root = document.getElementById("detail-root");
  var hasTabs = !!(l.units && l.units.length > 1);

  if(state.detailListingId !== id){ state.detailListingId = id; state.detailTab = "overview"; }
  var activeUnit = null;
  if(hasTabs && state.detailTab!=="overview"){
    activeUnit = l.units.filter(function(u){ return u.id===state.detailTab; })[0] || null;
    if(!activeUnit) state.detailTab = "overview"; // chambre retirée entre-temps -> retombe sur la vue d'ensemble
  }

  var gallery;
  if(!hasTabs){
    gallery = l.gallery || [];
  } else if(activeUnit){
    gallery = (activeUnit.gallery && activeUnit.gallery.length) ? activeUnit.gallery : (l.gallery || []);
  } else {
    gallery = (l.gallery || []).slice(); // vue d'ensemble : toutes les photos, maison puis chaque chambre
    l.units.forEach(function(u){ gallery = gallery.concat(u.gallery || []); });
  }
  var galleryAlt = activeUnit ? activeUnit.name : l.name;
  var total = Math.max(l.photos, gallery.length);
  var slides = "";
  for(var i=0;i<total;i++){
    if(gallery[i]){
      slides += '<div class="slide"><img src="'+gallery[i]+'" alt="'+esc(galleryAlt)+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"></div>';
      continue;
    }
    slides += '<div class="slide"><div class="grad" style="position:absolute;inset:0;background:'+GRADIENTS[l.grad]+';filter:hue-rotate('+(i*6)+'deg) brightness('+(0.85+i*0.05)+')"></div>'+
      '<div class="grain" style="position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\'><filter id=\'n\'><feTurbulence type=\'fractalNoise\' baseFrequency=\'0.85\' numOctaves=\'2\'/></filter><rect width=\'100%25\' height=\'100%25\' filter=\'url(%23n)\'/></svg>&quot;)"></div></div>';
  }
  var dots = "";
  for(var j=0;j<total;j++) dots += '<span class="'+(j===0?"on":"")+'"></span>';

  var tabsHtml = !hasTabs ? "" : '<div class="detail-tabs">'+
      '<button type="button" class="detail-tab'+(!activeUnit?' active':'')+'" data-detail-tab="overview">Vue d\'ensemble</button>'+
      l.units.map(function(u){ return '<button type="button" class="detail-tab'+(activeUnit&&activeUnit.id===u.id?' active':'')+'" data-detail-tab="'+esc(u.id)+'">'+esc(u.name)+'</button>'; }).join("")+
    '</div>';

  var metaRowHtml, bodyExtraHtml;
  if(!activeUnit){
    // vue d'ensemble (ou annonce sans plusieurs chambres) : comportement identique à avant, sauf que
    // le planning ne s'affiche jamais ici quand il y a plusieurs chambres (voir plus bas) — chaque
    // chambre a le sien, propre à elle, un établissement entier n'a pas UN planning unique.
    var convLabel = (authState.uid && l.ownerUid && l.ownerUid===authState.uid) ? conversionLabelFor(l) : null;
    metaRowHtml = '<div class="detail-card"><div class="meta-row"><div class="meta-item"><b>'+(hasTabs ? "dès "+l.price : l.price)+'€</b><span>par nuit</span></div><div class="meta-item"><b>'+listingDistanceKm(l)+' km</b><span>de vous</span></div>'+
      (convLabel ? '<div class="meta-item"><b>'+convLabel+'</b><span>demandes &rarr; séjours</span></div>' : '')+
    '</div></div>';
    bodyExtraHtml =
      '<div class="detail-card">'+
      ((l.websiteUrl || l.googleUrl) ? '<div class="ext-links">'+
        (l.websiteUrl ? '<a class="google-link" href="'+l.websiteUrl+'" target="_blank" rel="noopener">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 5.7 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.7-4-9s1.5-6.5 4-9z"/></svg>'+
          '<span>Voir le site</span>'+

    toggleLike(l);
    renderLikeBadge(); openDetail(id);
  });
  root.querySelector("[data-share]").addEventListener("click", function(){ shareListing(l); });
  if(hasTabs){
    // Changer d'onglet ou choisir une chambre depuis la vue d'ensemble tient en 1 clic — la position
    // de scroll est reprise telle quelle pour un changement d'onglet (pas besoin de rescroller à
    // chaque fois), remise en haut seulement en entrant fraîchement dans une chambre depuis sa carte.
    Array.prototype.forEach.call(root.querySelectorAll("[data-detail-tab]"), function(btn){
      btn.addEventListener("click", function(){
        var panel = document.getElementById("detail-panel");
        var scrollY = panel ? panel.scrollTop : 0;
        state.detailTab = btn.getAttribute("data-detail-tab");
        openDetail(id);
        var newPanel = document.getElementById("detail-panel");
        if(newPanel) newPanel.scrollTop = scrollY;
      });
    });

  document.body.style.overflow = "hidden";
  document.body.classList.add("detail-open");
}
function closeDetail(){
  document.getElementById("detail-root").innerHTML = "";
  document.body.style.overflow = "";
  document.body.classList.remove("detail-open");
  state.detailListingId = null; state.detailTab = "overview";
}

function formulaCardHtml(value,name,price,desc){
  return '<button type="button" class="formula-card'+(chosenHostPlan===value?' active':'')+'" data-plan="'+value+'">'+
    '<div class="formula-card-head"><b>'+name+'</b><span>'+price+'</span></div>'+
    '<p>'+desc+'</p>'+
  '</button>';
}
/* Même carte, mais un <div>, jamais un <button> : affichage en LECTURE
   SEULE de la formule courante dans le profil hôte (renderHostProfile())
   — contrairement au sélecteur à l'inscription, ce fichier n'écrit
   jamais dans un accounts/{uid} déjà existant (voir resolveHostAccount()),
   donc pas question de la rendre cliquable ici sans un vrai mécanisme de
   changement de formule à construire côté serveur. */
function formulaCardReadOnlyHtml(f, active){
  return '<div class="formula-card'+(active?' active':'')+'">'+
    '<div class="formula-card-head"><b>'+f.name+'</b><span>'+f.price+'</span></div>'+
    '<p>'+f.desc+'</p>'+
  '</div>';
}

      Array.prototype.forEach.call(e.target.files, function(file){
        if(hfSelectedFiles.length+accepted.length>=6){ errEl.textContent = "6 photos maximum."; return; }
        if(!/^image\//.test(file.type)){ errEl.textContent = "Seules les images sont acceptées."; return; }
        accepted.push(file);
      });
      e.target.value = "";
      if(!accepted.length) return;
      cropAndCompressFiles(accepted).then(function(files){
        files.forEach(function(file){
          if(file.size > 8*1024*1024){ errEl.textContent = "Photo trop lourde (8 Mo maximum) : "+file.name; return; }
          hfSelectedFiles.push({type:"new", file:file});
        });
        renderHostPhotoGrid();
      });
    });
    renderHostPhotoGrid();
    document.getElementById("hf-add-unit").addEventListener("click", function(){
      hfUnits.push({id:newHfUnitId(), name:"", price:"", maxPersons:2, photos:[], linkedRoomId:""});
      renderHostUnits();
    });
    /* Gîte = logement indépendant loué en bloc, jamais plusieurs chambres à
       gérer séparément — la notion "+ Ajouter une chambre" n'a pas de sens
       pour ce type (retour utilisateur). Une seule carte tarif/capacité,
       créée automatiquement, sans bouton pour en ajouter d'autres ni pour
       la retirer. Chambre/Chambre+table gardent le comportement multi-
       chambres inchangé. */
    document.getElementById("hf-type").addEventListener("change", updateUnitsFraming);
    hfAvailableRooms = [];
    updateUnitsFraming();
    resolveHostAccount(function(account){
      hfAvailableRooms = (account && account.settings && account.settings.rooms) || [];
      // Un lien saisi avant que la chambre app correspondante soit supprimée
      // ne doit pas être ré-enregistré tel quel à l'insu de l'hôte (voir
      // pruneStaleLinkedRoomIds) — nettoyé ici avant tout re-rendu/envoi.
      var pruned = pruneStaleLinkedRoomIds(hfUnits, hfAvailableRooms);
      if(pruned.changed) hfUnits = pruned.units;
      if((hfAvailableRooms.length || pruned.changed) && document.getElementById("hf-units")) renderHostUnits();
    });
    return;
  } else if(kind==="hostbooking"){
    if(hostBookingContext.mode==="view"){
      document.getElementById("sheet-apply").addEventListener("click", closeSheet);
      var hbDeleteBtn = document.getElementById("hb-delete");
      if(hbDeleteBtn) hbDeleteBtn.addEventListener("click", submitDeleteBooking);
    } else {
      document.getElementById("sheet-apply").addEventListener("click", submitAddBooking);
    }
    return;
  }

  document.getElementById("sheet-apply").addEventListener("click", function(){ closeSheet(); persist(); renderFilterBar(); renderTabContent(); renderResultLine(); });

  if(kind==="loc"){
    document.getElementById("btn-use-geo").addEventListener("click", function(){
      var geoBtn = this, errP = document.getElementById("geo-err");
      errP.textContent = "";
      if(!navigator.geolocation){ errP.textContent = "La géolocalisation n'est pas disponible sur cet appareil/navigateur."; return; }
      geoBtn.disabled = true;
      geoBtn.textContent = "Localisation en cours…";
      navigator.geolocation.getCurrentPosition(function(pos){
        state.geoOrigin = {lat:pos.coords.latitude, lng:pos.coords.longitude};
        openSheet("loc"); // reconstruit le volet (bouton "activé") + les distances affichées derrière
        renderTabContent(); renderResultLine();
      }, function(err){
        errP.textContent = err.code===1
          ? "Position refusée — autorisez la géolocalisation dans les réglages de votre navigateur pour l'utiliser."
          : "Impossible d'obtenir votre position pour l'instant.";
        geoBtn.disabled = false;
        geoBtn.textContent = "📍 Utiliser ma position";
      }, {timeout:10000});
    });
    var clearGeoBtn = document.getElementById("btn-clear-geo");
    if(clearGeoBtn) clearGeoBtn.addEventListener("click", function(){
      state.geoOrigin = null;
      openSheet("loc");
      renderTabContent(); renderResultLine();
    });
    document.getElementById("s-loc").addEventListener("input", function(e){ f.q = e.target.value; });
    // Région et département pilotent chacun leur propre champ structuré
    // (f.regionName/f.deptName), indépendant du mot-clé libre (f.q) —
    // avant, une seule variable (f.q) servait aux deux, ce qui empêchait
    // de combiner "Occitanie" ET "Wissous" par exemple. Choisir une région
    // réinitialise le département (plus valide dans la nouvelle région) et
    // rouvre le volet pour reconstruire la liste de départements.
    Array.prototype.forEach.call(root.querySelectorAll("[data-region]"), function(rc){
      rc.addEventListener("click", function(){
        var region = rc.getAttribute("data-region");
        f.regionName = (f.regionName===region) ? "" : region;
        f.deptName = "";
        openSheet("loc");
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-dept]"), function(dc){
      dc.addEventListener("click", function(){
        f.deptName = dc.getAttribute("data-dept");
        Array.prototype.forEach.call(root.querySelectorAll("[data-dept]"), function(other){
          other.classList.toggle("active", other===dc);
        });
      });
    });
  } else if(kind==="distance"){
    var $r = document.getElementById("s-distance");
    $r.addEventListener("input", function(){ f.distance = Number($r.value); root.querySelector(".range-value span:last-child").textContent = f.distance+" km"; });
  } else if(kind==="price"){
    var $p = document.getElementById("s-price");
    $p.addEventListener("input", function(){ f.price = Number($p.value); root.querySelector(".range-value span:last-child").textContent = f.price+" € / nuit"; });
  } else if(kind==="amen"){
    Array.prototype.forEach.call(root.querySelectorAll(".amenity-chip"), function(el){
      el.addEventListener("click", function(){
        var a = el.getAttribute("data-a");
        var idx = f.amen.indexOf(a);
        if(idx===-1) f.amen.push(a); else f.amen.splice(idx,1);
        el.classList.toggle("active");
      });
    });
  } else if(kind==="sort"){
    Array.prototype.forEach.call(root.querySelectorAll("[data-sort]"), function(el){
      el.addEventListener("click", function(){ state.sort = el.getAttribute("data-sort"); closeSheet(); persist(); renderFilterBar(); renderTabContent(); });
    });
  }
}
function closeSheet(){ document.getElementById("sheet-root").innerHTML = ""; }

/* Confirmation à deux vrais boutons "Oui"/"Non" — volontairement séparée
   du dispatch par "kind" d'openSheet() ci-dessus (spécifique aux volets
   filtres/formulaires, pas adapté à un message + un callback arbitraire).
   Remplace window.confirm() pour les actions Envies → Demandes : un
   confirm() natif n'affiche que "OK"/"Annuler" (aucune API pour
   relabelliser ces boutons), ce qui ne correspondait pas au texte "Oui/
   Non" affiché — undéfini pour l'utilisateur ce que "Annuler" voulait
   dire face à une question formulée en oui/non. */
function openConfirmSheet(title, yesLabel, noLabel, onYes){

  root.innerHTML = '<div class="sheet-backdrop" id="sheet-backdrop"><div class="frame"><div class="sheet" style="position:relative;">'+
    '<button class="sheet-close" id="sheet-close">&times;</button><div class="sheet-handle"></div>'+
    '<h3>'+esc(title)+'</h3>'+
    '<div class="sheet-apply">'+
      '<button type="button" class="btn-apply" id="sheet-confirm-yes">'+esc(yesLabel)+'</button>'+
      '<button type="button" class="link-btn" id="sheet-confirm-no" style="width:100%; text-align:center; margin:12px 0 0;">'+esc(noLabel)+'</button>'+
    '</div>'+
  '</div></div></div>';
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  document.getElementById("sheet-backdrop").addEventListener("click", function(e){ if(e.target.id==="sheet-backdrop") closeSheet(); });
  document.getElementById("sheet-confirm-no").addEventListener("click", closeSheet);
  document.getElementById("sheet-confirm-yes").addEventListener("click", function(){ closeSheet(); onYes(); });
}

/* Écrit accounts/{uid} pour la toute première fois, juste après la
   création du compte Firebase Auth dans ce même appel (Espace hôtes →
   créer un compte + choisir une formule de gestion) : uid tout neuf que
   Firebase Auth vient de générer, document garanti inexistant avant cet
   instant — un .set() ici ne peut écraser aucune donnée réelle,
   contrairement à une écriture sur un compte déjà utilisé (voir les
   commentaires plus haut sur le calendrier simplifié / compte gestion).
   Formule purement déclarative pour l'instant, comme S.settings.plan
   dans app/ (aucun paiement branché) — juste positionnée dès
   l'inscription pour ne pas avoir à la ressaisir dans app/. */
function bootstrapHostAccount(uid, plan){
  return firebase.firestore().collection("accounts").doc(uid).set({
    settings: {plan: plan},
    bookings: [], guests: [],
    createdVia: "sejours-signup",
    updated: new Date().toISOString()
  });
}
function submitAuthSheet(){
  var email = document.getElementById("auth-email").value.trim();
  var password = document.getElementById("auth-password").value;
  var errEl = document.getElementById("auth-err");
  errEl.style.color = "var(--danger)";
  errEl.textContent = "";
  if(!email || !password){ errEl.textContent = "Renseignez e-mail et mot de passe."; return; }
  if(typeof firebase==="undefined"){ errEl.textContent = "Connexion indisponible pour le moment — réessayez dans un instant."; return; }
  var btn = document.getElementById("sheet-apply");
  btn.disabled = true;
  var afterAuth = function(){
    closeSheet();
    if(authContext==="host") enterHostMode(); else renderProfile();
  };
  if(authMode==="signup"){
    var pw2 = document.getElementById("auth-password2").value;
    if(password!==pw2){ errEl.textContent = "Les deux mots de passe ne correspondent pas."; btn.disabled = false; return; }
    var planToBootstrap = (authContext==="host" && (chosenHostPlan==="essentiel" || chosenHostPlan==="pro")) ? chosenHostPlan : null;
    firebase.auth().createUserWithEmailAndPassword(email, password)
      .then(function(cred){
        if(!planToBootstrap) return;
        return bootstrapHostAccount(cred.user.uid, planToBootstrap);
      })
      .then(afterAuth)
      .catch(function(err){ errEl.textContent = authErrorMessage(err); btn.disabled = false; });
  } else {
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(afterAuth)
      .catch(function(err){ errEl.textContent = authErrorMessage(err); btn.disabled = false; });
  }
}
function submitForgotPassword(){
  var email = document.getElementById("auth-email").value.trim();
  var errEl = document.getElementById("auth-err");
  if(!email){ errEl.style.color = "var(--danger)"; errEl.textContent = "Entrez d'abord votre e-mail ci-dessus."; return; }
  firebase.auth().sendPasswordResetEmail(email)
    .then(function(){ errEl.style.color = "var(--sauge-deep)"; errEl.textContent = "E-mail envoyé — vérifiez votre boîte de réception."; })
    .catch(function(err){ errEl.style.color = "var(--danger)"; errEl.textContent = authErrorMessage(err); });
}

function findHfUnit(unitId){ return hfUnits.filter(function(u){ return u.id===unitId; })[0]; }
/* Tarif actuel d'une chambre Fiftin app pour une capacité donnée — dernière
   entrée de tariffHistory (triée par date de départ), même logique que
   addRoomTariff() côté app/. Sert à préremplir le prix/nuit d'une chambre
   Séjours quand on la relie à cette chambre app (voir .hf-unit-room ci-dessous). */
function roomCurrentPrice(room, pax){
  var hist = room && room.tariffHistory;
  if(!hist || !hist.length) return null;
  var last = hist.slice().sort(function(a,b){ return a.from<b.from?-1:a.from>b.from?1:0; }).pop();
  if(!last || !last.prices) return null;
  return last.prices[pax] != null ? last.prices[pax] : null;
}

/* Une carte par chambre du formulaire de dépôt, reconstruite entièrement
   à chaque ajout/retrait de chambre ; les champs texte mettent à jour
   hfUnits directement sur "input" (pas de re-rendu de toute la liste à
   chaque frappe, sinon le focus/curseur saute). Seule la grille de
   photos d'une chambre se re-rend isolément (renderHostUnitPhotoGrid). */
/* Bascule le libellé/bouton de la section chambres selon le type
   d'hébergement, et garantit une carte tarif/capacité pour un gîte (pas de
   bouton "+ Ajouter" dans ce mode, donc rien à cliquer pour en avoir une). */
function updateUnitsFraming(){

    });

  Array.prototype.forEach.call(wrap.querySelectorAll(".hf-unit-photos-input"), function(el){
    el.addEventListener("change", function(e){
      var unitId = el.getAttribute("data-unit-id");
      var unit = findHfUnit(unitId);
      var errEl = document.getElementById("hf-err");
      errEl.textContent = "";
      var accepted = [];
      Array.prototype.forEach.call(e.target.files, function(file){
        if(unit.photos.length+accepted.length>=6){ errEl.textContent = "6 photos maximum par chambre."; return; }
        if(!/^image\//.test(file.type)){ errEl.textContent = "Seules les images sont acceptées."; return; }
        accepted.push(file);
      });
      e.target.value = "";
      if(!accepted.length) return;
      cropAndCompressFiles(accepted).then(function(files){
        files.forEach(function(file){
          if(file.size > 8*1024*1024){ errEl.textContent = "Photo trop lourde (8 Mo maximum) : "+file.name; return; }
          unit.photos.push({type:"new", file:file});
        });
        renderHostUnitPhotoGrid(unitId);
      });

  });

/* Redimensionne et recompresse une photo côté client avant envoi — les
   photos de smartphone pèsent souvent 3 à 8 Mo pour une résolution bien
   supérieure à ce qu'un écran affiche jamais dans cette galerie. Réduit le
   poids des pages (chargement du fil, des fiches détail) et le coût de
   stockage/bande passante Firebase, sans perte visible à l'écran : la plus
   grande dimension est plafonnée à 1920px (au-delà, inutile même en rétina
   pour cet usage) et recompressée en JPEG qualité 0.85. En cas d'échec
   (format non décodable par <img>, navigateur sans support canvas…), on
   renvoie le fichier original tel quel plutôt que de bloquer l'envoi. */
var PHOTO_MAX_DIM = 1920;
var PHOTO_JPEG_QUALITY = 0.85;
function compressImageFile(file){
  return new Promise(function(resolve){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h){ resolve(file); return; }
      var scale = Math.min(1, PHOTO_MAX_DIM / Math.max(w, h));
      var tw = Math.max(1, Math.round(w*scale)), th = Math.max(1, Math.round(h*scale));
      var canvas = document.createElement("canvas");
      canvas.width = tw; canvas.height = th;
      var ctx = canvas.getContext("2d");
      if(!ctx){ resolve(file); return; }
      ctx.drawImage(img, 0, 0, tw, th);
      canvas.toBlob(function(blob){
        if(!blob || blob.size >= file.size){ resolve(file); return; } // garde l'original si la compression n'a pas aidé
        var name = file.name.replace(/\.[^.\/]+$/, "")+".jpg";
        resolve(new File([blob], name, {type:"image/jpeg"}));
      }, "image/jpeg", PHOTO_JPEG_QUALITY);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

/* Recadrage carré manuel avant envoi : le cadrage automatique (object-fit:
   cover, centré) ne convient pas à toutes les photos selon l'endroit où
   elles s'affichent (carte du fil en 4/5, fiche détail ~5/4 — deux ratios
   différents pour la même image) — plutôt que produire deux recadrages
   distincts par photo, on laisse l'hôte choisir un seul carré qui fait le
   compromis entre les deux. Le carré démarre centré (même cadrage que le
   comportement automatique d'avant, pour ne rien changer par défaut), et
   l'hôte peut glisser/zoomer avant de valider. "Garder telle quelle" saute
   le recadrage et retombe sur compressImageFile() (ratio d'origine
   conservé). cropAndCompressFiles() est désormais l'unique point d'entrée
   utilisé par les deux sélecteurs de photos (maison et chambre) pour
   transformer les File bruts choisis en entrées prêtes pour
   hfSelectedFiles/unit.photos — traite les fichiers un par un (queue),
   jamais en parallèle, pour ne montrer qu'un cadrage à la fois. */
var CROP_OUTPUT_SIZE = 1600;
var CROP_ZOOM_MAX_MULT = 3;
var CROP_PREVIEW_SQUARE = 90; // px — échelle de référence des deux aperçus (carte 4/5, fiche 5/4), proportionnelle au cadre principal

function cropAndCompressFiles(files){
  var results = [];
  var runNext = function(i){
    if(i>=files.length) return Promise.resolve(results);
    return cropOneFile(files[i], i, files.length).then(function(file){
      results.push(file);
      return runNext(i+1);
    });
  };
  return runNext(0);
}

function cropOneFile(file, index, total){
  return new Promise(function(resolve){
    var overlay = document.getElementById("crop-overlay");
    var imgEl = document.getElementById("crop-img");
    var viewport = document.getElementById("crop-viewport");
    var zoomInput = document.getElementById("crop-zoom");
    var okBtn = document.getElementById("crop-ok");
    var skipBtn = document.getElementById("crop-skip");
    var previewImg45 = document.getElementById("crop-preview-45");
    var previewImg54 = document.getElementById("crop-preview-54");
    document.getElementById("crop-progress").textContent = total>1 ? ((index+1)+"/"+total) : "";

    var url = URL.createObjectURL(file);
    var st = null; // {naturalW,naturalH,baseScale,scale,offsetX,offsetY,vpSize}
    var dragging = false, dragStartX=0, dragStartY=0, startOffX=0, startOffY=0;

    var cleanup = function(){
      overlay.style.display = "none";
      URL.revokeObjectURL(url);
      viewport.removeEventListener("pointerdown", onPointerDown);
      viewport.removeEventListener("pointermove", onPointerMove);
      viewport.removeEventListener("pointerup", onPointerUp);
      viewport.removeEventListener("pointercancel", onPointerUp);
      zoomInput.oninput = null;
      okBtn.onclick = null;
      skipBtn.onclick = null;
    };
    var fallback = function(){ cleanup(); compressImageFile(file).then(resolve); };

    var clamp = function(){
      var minX = st.vpSize - st.naturalW*st.scale, minY = st.vpSize - st.naturalH*st.scale;
      st.offsetX = Math.min(0, Math.max(minX, st.offsetX));
      st.offsetY = Math.min(0, Math.max(minY, st.offsetY));
    };
    var applyTransform = function(){
      imgEl.style.width = (st.naturalW*st.scale)+"px";
      imgEl.style.height = (st.naturalH*st.scale)+"px";
      imgEl.style.transform = "translate("+st.offsetX+"px,"+st.offsetY+"px)";
      updatePreviews();
    };
    // Aperçus 4/5 (carte) et 5/4 (fiche) : object-fit:cover appliqué à une
    // image carrée ne rogne qu'un seul axe (centré) — la carte 4/5 ne coupe
    // que les côtés (elle garde toute la hauteur du carré), la fiche 5/4 ne
    // coupe que haut/bas (elle garde toute la largeur) — d'où le facteur 0.8
    // (4/5) appliqué à l'axe qui est effectivement rogné. Même transform que
    // le cadre principal, juste mise à l'échelle de CROP_PREVIEW_SQUARE et
    // recentrée pour ce petit rectangle — pas de fichier généré, uniquement
    // un aperçu visuel de ce que produirait l'affichage réel.
    var updatePreviews = function(){
      var sf = CROP_PREVIEW_SQUARE / st.vpSize;
      var w = st.naturalW*st.scale*sf, h = st.naturalH*st.scale*sf;
      var ox = st.offsetX*sf, oy = st.offsetY*sf;
      // shift retranche les 2×9px coupés de chaque côté par la fenêtre plus
      // étroite (72 au lieu de 90) : décaler l'image de -shift (pas +shift,
      // sens inversé par erreur ci-avant — un carré centré se retrouvait
      // décalé de 2×9px dans le MAUVAIS sens sur les deux aperçus, rendant
      // le centrage simultané impossible alors que l'export réel, lui,
      // recadre correctement au centre via object-fit:cover).
      var shift = CROP_PREVIEW_SQUARE*0.1; // (SQUARE - SQUARE*0.8)/2
      previewImg45.style.width = w+"px"; previewImg45.style.height = h+"px";
      previewImg45.style.transform = "translate("+(ox-shift)+"px,"+oy+"px)";
      previewImg54.style.width = w+"px"; previewImg54.style.height = h+"px";
      previewImg54.style.transform = "translate("+ox+"px,"+(oy-shift)+"px)";
    };

    var onPointerDown = function(e){
      dragging = true;
      viewport.classList.add("dragging");
      dragStartX = e.clientX; dragStartY = e.clientY;
      startOffX = st.offsetX; startOffY = st.offsetY;
      viewport.setPointerCapture(e.pointerId);
    };
    var onPointerMove = function(e){
      if(!dragging) return;
      st.offsetX = startOffX + (e.clientX-dragStartX);
      st.offsetY = startOffY + (e.clientY-dragStartY);
      clamp();
      applyTransform();
    };
    var onPointerUp = function(){ dragging = false; viewport.classList.remove("dragging"); };
    viewport.addEventListener("pointerdown", onPointerDown);
    viewport.addEventListener("pointermove", onPointerMove);
    viewport.addEventListener("pointerup", onPointerUp);
    viewport.addEventListener("pointercancel", onPointerUp);

    zoomInput.value = 0;
    zoomInput.oninput = function(){
      var t = Number(zoomInput.value)/100;
      var newScale = st.baseScale * (1 + t*(CROP_ZOOM_MAX_MULT-1));
      // garde le même point image au centre du cadre pendant le zoom, plutôt que de recentrer au hasard
      var cx = st.vpSize/2, cy = st.vpSize/2;
      var imgCx = (cx - st.offsetX)/st.scale, imgCy = (cy - st.offsetY)/st.scale;
      st.scale = newScale;
      st.offsetX = cx - imgCx*st.scale;
      st.offsetY = cy - imgCy*st.scale;
      clamp();
      applyTransform();
    };

    okBtn.onclick = function(){
      var canvas = document.createElement("canvas");
      var srcSize = st.vpSize / st.scale;
      var srcX = -st.offsetX / st.scale, srcY = -st.offsetY / st.scale;
      var outSize = Math.max(1, Math.round(Math.min(CROP_OUTPUT_SIZE, srcSize)));
      canvas.width = outSize; canvas.height = outSize;
      var ctx = canvas.getContext("2d");
      if(!ctx){ fallback(); return; }
      ctx.drawImage(imgEl, srcX, srcY, srcSize, srcSize, 0, 0, outSize, outSize);
      canvas.toBlob(function(blob){
        cleanup();
        if(!blob){ resolve(file); return; }
        var name = file.name.replace(/\.[^.\/]+$/, "")+".jpg";
        resolve(new File([blob], name, {type:"image/jpeg"}));
      }, "image/jpeg", PHOTO_JPEG_QUALITY);
    };
    skipBtn.onclick = fallback;

    imgEl.onload = function(){
      var vpSize = viewport.clientWidth;
      var nw = imgEl.naturalWidth, nh = imgEl.naturalHeight;
      if(!nw || !nh || !vpSize){ fallback(); return; }
      var baseScale = vpSize / Math.min(nw, nh);
      st = {naturalW:nw, naturalH:nh, baseScale:baseScale, scale:baseScale, vpSize:vpSize,
        offsetX:(vpSize-nw*baseScale)/2, offsetY:(vpSize-nh*baseScale)/2};
      applyTransform();
    };
    imgEl.onerror = function(){ fallback(); };
    overlay.style.display = "flex"; // avant de charger l'image : le viewport doit avoir sa vraie taille (clientWidth) au moment du onload
    imgEl.src = url;
    previewImg45.src = url;
    previewImg54.src = url;
  });
}
