<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- Lien de disponibilités d'une structure (fiftin.fr/dispo/?t=…), demande
     de César : page que l'hôte partage à ses habitués depuis Fiftin Planning
     (Réglages → Structures juridiques, formule Avancé). Nuit par nuit sur
     6 mois : Probablement disponible / Peut-être disponible / Complet
     (formulation prudente voulue par César : à confirmer avec l'hôte) — jamais de nom, de nombre de
     chambres ni de prix (calcul côté serveur, fonction availShare de
     functions/index.js). Toucher une nuit ouvre WhatsApp vers l'hôte avec
     un message prérempli. Page autonome, aucune donnée gardée. -->
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Disponibilités</title>
<meta name="theme-color" content="#354B38">
<link rel="icon" type="image/png" href="assets/logo-fiftin-mark-glass.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#EFEEEA; --cream-light:#F7F6F4; --ink:#2E2B22;
  --sauge:#354B38; --sauge-deep:#1D2820; --sauge-light:#8B9D86; --sauge-mid:#4E6F53; --sauge-bg:#E5E9E4;
  --lavender:#7B94E8; --yellow:#DEEB82; --yellow-light:#EFF5C1; --yellow-deep:#C7D65E;
  --muted:#6F6C62; --line:rgba(46,43,34,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
@property --iris-angle{syntax:'<angle>';initial-value:0deg;inherits:false;}
@keyframes irisSpin{to{--iris-angle:360deg;}}

.dp-head{background:var(--sauge);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 26px;border-radius:0 0 28px 28px;}
.dp-top{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto;}
.dp-logo{position:relative;flex:none;width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(145deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.2) 26%, rgba(255,255,255,.04) 48%, rgba(16,22,18,.1) 68%, rgba(16,22,18,.26) 100%), rgba(29,40,32,.14);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.6), inset 1px 0 2px rgba(255,255,255,.3), inset 0 -3px 5px rgba(8,13,10,.38), inset -2px 0 4px rgba(8,13,10,.24), 0 3px 9px rgba(29,40,32,.22);}
.dp-logo::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:conic-gradient(from var(--iris-angle,0deg), rgba(255,255,255,0) 0deg, var(--lavender) 55deg, rgba(255,255,255,.9) 95deg, var(--yellow) 150deg, rgba(255,255,255,0) 190deg, rgba(255,255,255,0) 270deg, var(--sauge-light) 320deg, rgba(255,255,255,0) 360deg);
  mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);mask-composite:exclude;
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);-webkit-mask-composite:xor;
  opacity:.9;animation:irisSpin 9s linear infinite;pointer-events:none;}
.dp-logo::after{content:"";position:absolute;left:-10%;top:-8%;width:120%;height:42%;background:linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.55) 32%, rgba(255,255,255,0) 100%);border-radius:50%;filter:blur(1.5px);transform:rotate(-6deg);pointer-events:none;}
.dp-logo img{position:relative;z-index:1;width:28px;height:22px;display:block;}
.dp-kicker{font-size:12.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--yellow-light);}
.dp-title{max-width:560px;margin:18px auto 0;}
.dp-title h1{margin:0;font-size:clamp(26px,7vw,34px);font-weight:600;line-height:1.15;}
.dp-title p{margin:8px 0 0;font-size:14.5px;line-height:1.45;color:rgba(255,255,255,.78);}

.dp-main{max-width:560px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom,0px));}
.dp-legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 2px 8px;}
.dp-hint{font-size:13px;line-height:1.45;color:var(--muted);margin:6px 4px 16px;}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9;}
.st-F{background:var(--sauge-bg);color:var(--sauge);}
.st-F::before{background:#5E8A63;}
.st-M{background:var(--yellow-light);color:var(--sauge-deep);}
.st-M::before{background:var(--yellow-deep);}
.st-X{background:#E4E2DC;color:#8E8B82;}
.st-X::before{opacity:.5;}

.dp-month{background:#fff;border-radius:24px;margin:0 0 14px;overflow:hidden;box-shadow:0 1px 2px rgba(46,43,34,.05);}
.dp-month h2{margin:0;padding:14px 18px 10px;font-size:17px;font-weight:600;color:var(--sauge);text-transform:capitalize;display:flex;justify-content:space-between;align-items:baseline;}
.dp-month h2 small{font-size:12.5px;font-weight:500;color:var(--muted);text-transform:none;}
.dp-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 18px;border:none;border-top:1px solid var(--line);background:none;text-align:left;color:inherit;font-size:15px;}
.dp-row.we{background:var(--cream-light);}
.dp-row[data-tap]{cursor:pointer;}
.dp-row[data-tap]:active{background:var(--sauge-bg);}
.dp-d{flex:1;min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.dp-dow{width:32px;flex:none;font-size:13px;color:var(--muted);text-transform:capitalize;}
.dp-num{font-weight:600;}
.dp-today{color:var(--sauge-mid);}
.dp-row .wa{flex:none;width:18px;height:18px;color:var(--sauge-light);}
.dp-row:not([data-tap]) .wa{visibility:hidden;}
.dp-row.X .dp-num,.dp-row.X .dp-dow{color:#A8A59C;}

.dp-cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg, rgba(239,238,234,0) 0%, var(--cream) 34%);}
.dp-cta a{display:flex;align-items:center;justify-content:center;gap:10px;max-width:528px;margin:0 auto;border-radius:999px;padding:15px 24px;background:var(--yellow);color:var(--sauge-deep);font-weight:600;font-size:16px;text-decoration:none;box-shadow:0 6px 18px rgba(29,40,32,.18);}
.dp-cta svg{width:20px;height:20px;}
.dp-foot{text-align:center;font-size:12px;color:var(--muted);margin:18px 0 0;}
.dp-foot a{color:inherit;}
.dp-msg{background:#fff;border-radius:24px;padding:28px 22px;text-align:center;font-size:15px;line-height:1.5;color:var(--muted);}
.dp-msg b{display:block;color:var(--sauge);font-size:18px;margin-bottom:6px;}
@media (prefers-reduced-motion:reduce){.dp-logo::before{animation:none;}}
</style>
</head>
<body>
<header class="dp-head">
  <div class="dp-top">
    <a class="dp-logo" href="./" aria-label="Fiftin"><img src="assets/logo-fiftin-mark-glass.png" width="102" height="80" alt=""></a>
    <span class="dp-kicker">Disponibilités</span>
  </div>
  <div class="dp-title">
    <h1 id="dpName">&nbsp;</h1>
    <p>Les 6 prochains mois, mis à jour en direct. Chaque ligne est une nuit : arrivée ce jour-là, départ le lendemain.</p>
  </div>
</header>
<main class="dp-main" id="dpMain">
  <div class="dp-msg" id="dpLoading">Chargement des disponibilités…</div>
</main>
<div class="dp-cta" id="dpCta" hidden></div>

<script>
(function(){
  var API = "https://us-central1-fiftin-e30c2.cloudfunctions.net/availShare";
  var WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.4-.3z"/></svg>';
  var LABEL = {F:"Probablement disponible", M:"Peut-être disponible", X:"Complet"};
  var DOW = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
  var DOW_FULL = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  var MON3 = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  var MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var main = document.getElementById("dpMain");
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function dateAt(from, i){ var d = new Date(from+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+i); return d; }
  function longDate(d){ return DOW_FULL[d.getUTCDay()]+" "+d.getUTCDate()+" "+MONTHS[d.getUTCMonth()]; }
  function waUrl(phone, text){ return "https://wa.me/"+phone+"?text="+encodeURIComponent(text); }
  function fail(title, text){
    main.innerHTML = '<div class="dp-msg"><b>'+title+'</b>'+text+'</div>';
    document.getElementById("dpName").textContent = "Disponibilités";
  }
  var t = new URLSearchParams(location.search).get("t") || "";
  if(!/^[a-f0-9]{48}$/.test(t)){ fail("Lien incomplet", "Vérifiez que le lien a bien été copié en entier, ou demandez-le de nouveau à votre hôte."); return; }
  fetch(API+"?t="+t, {cache:"no-store"}).then(function(r){
    if(r.status === 404) return r.json().catch(function(){ return {}; }).then(function(j){ throw {gone:true, j:j}; });
    if(!r.ok) throw {};
    return r.json();
  }).then(render).catch(function(e){
    if(e && e.gone) fail("Ce lien n'est plus actif", "Demandez un nouveau lien à votre hôte.");
    else fail("Disponibilités indisponibles pour l'instant", "Vérifiez votre connexion et réessayez dans un moment.");
  });

  function render(data){
    var name = data.name || "Disponibilités";
    document.title = "Disponibilités · " + name;
    document.getElementById("dpName").textContent = name;
    var phone = data.phone || "";
    var days = String(data.days || "");
    var html = '<div class="dp-legend"><span class="st st-F">'+LABEL.F+'</span><span class="st st-M">'+LABEL.M+'</span><span class="st st-X">'+LABEL.X+'</span></div>'+
      '<p class="dp-hint">Disponibilités indicatives, à confirmer avec nous avant de réserver. « Peut-être » : une réservation y attend encore confirmation.'+(phone?' Touchez une nuit pour nous écrire sur WhatsApp.':'')+'</p>';
    var curMonth = -1, block = "", free = 0;
    function closeMonth(){ if(curMonth<0) return; html += block.replace("{free}", free ? free+" nuit"+(free>1?"s":"")+" probablement libre"+(free>1?"s":"") : "complet"); }
    for(var i=0;i<days.length;i++){
      var d = dateAt(data.from, i), s = days.charAt(i);
      if(d.getUTCMonth() !== curMonth){
        closeMonth();
        curMonth = d.getUTCMonth(); free = 0;
        block = '<section class="dp-month"><h2>'+MONTHS[curMonth]+" "+d.getUTCFullYear()+'<small>{free}</small></h2>';
      }
      if(s === "F") free++;
      var dow = d.getUTCDay(), we = dow === 5 || dow === 6;
      var msg = s === "F" ? "Bonjour, auriez-vous de la place la nuit du "+longDate(d)+" ? Merci !"
              : s === "M" ? "Bonjour, la nuit du "+longDate(d)+" est indiquée « peut-être disponible » : reste-t-il de la place ? Merci !" : "";
      var tap = phone && msg ? ' data-tap="'+esc(waUrl(phone, msg))+'"' : "";
      block += '<button type="button" class="dp-row '+s+(we?" we":"")+'"'+tap+(tap?"":" disabled")+' aria-label="'+esc(longDate(d)+" : "+(LABEL[s]||""))+'">'+
        '<span class="dp-d"><span class="dp-dow">'+DOW[dow]+'</span><span class="dp-num'+(i===0?' dp-today':'')+'">'+(i===0?'Ce soir':d.getUTCDate()+' '+MON3[d.getUTCMonth()])+'</span></span>'+
        '<span class="st st-'+s+'">'+(LABEL[s]||"")+'</span>'+WA_ICON.replace('<svg','<svg class="wa"')+'</button>';
      var next = dateAt(data.from, i+1);
      if(next.getUTCMonth() !== curMonth || i === days.length-1) block += '</section>';
    }
    closeMonth();
    html += '<p class="dp-foot">Disponibilités publiées depuis <a href="planning/">Fiftin Planning</a></p>';
    main.innerHTML = html;
    main.addEventListener("click", function(e){
      var b = e.target.closest("[data-tap]"); if(!b) return;
      window.open(b.getAttribute("data-tap"), "_blank", "noopener");
    });
    if(phone){
      var cta = document.getElementById("dpCta");
      cta.innerHTML = '<a href="'+esc(waUrl(phone, "Bonjour, je regarde vos disponibilités et j'aurais une question."))+'" target="_blank" rel="noopener">'+WA_ICON+'Nous écrire sur WhatsApp</a>';
      cta.hidden = false;
    }
  }
})();
</script>
</body>
</html>
